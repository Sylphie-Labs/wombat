# wombat operating parameters — the SINGLE versioned source-of-truth (TK-13, EP-9).
#
# This file holds the GLOBAL, STATIC production operating constants the de-risk spikes
# (TK-22/26/48/73) recommend but no other ticket persists. It is loaded once at startup
# by `wombat.params.load_operating_params` into a frozen `OperatingParams` (see params.py).
#
# RULES OF THE ROAD
#   * Human-edited only. This is NOT written by the nightly RatingTuner (TK-49 writes the
#     ADAPTIVE per-event-class RatingParams into the cog-worx user scope — a separate path).
#   * Change a value -> BUMP `version`. The change is then auditable in git history.
#   * Every field below is REQUIRED. A missing or mistyped field fails LOUD at load time
#     (pydantic validation, extra="forbid") — there is no silent default in code.
#
# PROVENANCE LEGEND
#   LOCKED      — empirically derived, a retired risk backs it; do not change casually.
#   PROVISIONAL — fixture-confirmed only, pending Jim's confirmatory label pass; safe to revise.
#   CHOSEN-HERE — audit-gap value with no spike; a sensible default fixed here, revisable.

# Bump this whenever any value below changes (AC5 — auditability).
version: 6

# --- Gate trigger thresholds (TK-26 spike, RISK-1/2 NOT retired) -----------------------
# PROVISIONAL: fixture-confirmed on the TK-22 day fixture only. A later relabel pass may
# revise these; they were never "locked". The gate (TK-27/28) reads them from here.
urgency_threshold: 0.75      # immediate-voice fires when item urgency > this (strict, TK-171)
load_flush_threshold: 1.0    # the load-triggered consolidated flush fires once/day at >= this
per_class_daily_ceiling: 3   # max immediate-voice surfacings per sender class per day

# --- Pending-set / flush mechanics -----------------------------------------------------
# flush_min_age_seconds: CHOSEN-HERE — the TK-27 flush-arm min-age guard (audit gap). An
#   item must be at least this old before the load-flush may sweep it, so a just-arrived
#   item is never flushed in the same instant it lands. 300s = 5 minutes.
flush_min_age_seconds: 300.0
# decay_ttl_seconds: CHOSEN-HERE — the gate pipeline decays (drops) a pending item older
#   than this. 86400s = 24h, so an un-surfaced item ages out by the next morning brief.
decay_ttl_seconds: 86400.0
# max_pending: CHOSEN-HERE — the MAX_PENDING cap on the pending-set size (back-pressure).
max_pending: 100

# --- Spend ledger (TK-9) ---------------------------------------------------------------
# Two layers: mouth_daily_token_ceiling is the wombat-owned OUTER cap (the durable
# DailySpendLedger, cumulative prompt+completion tokens, survives restarts); the two
# mouth_max_* values are cog-worx's per-drive-segment BudgetPolicy INNER backstop
# (in-memory, resets per drive; CF-3.0-B cumulative-per-run stays deferred in cog-worx).
# All three CHOSEN-HERE — provisional operating budgets; revise from real usage.
mouth_daily_token_ceiling: 100000
mouth_max_usd_per_drive: 0.50
mouth_max_calls_per_drive: 3

# --- Morning brief (TK-97) -------------------------------------------------------------
# morning_brief_time: CHOSEN-HERE — TK-97 FORBIDS runtime configurability but never stated
#   the value; TK-13 fixes the single value here. 07:00 local. Changing it is a human edit
#   to THIS file (a version bump), never a runtime knob (TK-97 non_goal upheld).
morning_brief_time: "07:00:00"

# --- Nightly dream (TK-52) --------------------------------------------------------------
# nightly_dream_time: CHOSEN-HERE — TK-52 FORBIDS runtime configurability beyond this single
#   constant (mirrors morning_brief_time above). 02:00 local — well off the morning-brief
#   window, a quiet off-path hour. Changing it is a human edit to THIS file (a version bump),
#   never a runtime knob.
nightly_dream_time: "02:00:00"

# --- RatingTuner bounded-update block (TK-48 spike, RISK-4 RETIRED) ---------------------
# LOCKED. These FIVE values are ONE coherent block and MUST move together. The TK-48
# ablation proved the floor/ceiling clamps ALONE do NOT bound the daily surfacing RATE —
# the clamp band must be chosen JOINTLY with the surfacing sensitivity. At this band+gain
# the worst-case clamped surfacing rate lands EXACTLY at surfacing_ceiling_per_day. So
# changing the band WITHOUT re-deriving the ceiling breaks the bound. The tuner (TK-49)
# clamps its nightly updates against floor/ceiling and delta_bound; it does not own them.
rating_tuner:
  clamp_floor: 0.35              # per-param floor (applies to urgency AND load)
  clamp_ceiling: 0.65           # per-param ceiling (applies to urgency AND load)
  delta_bound: 0.05             # max per-night change to any one parameter
  gain: 0.20                    # tuner learning gain
  surfacing_ceiling_per_day: 12.0  # hard daily surfacing ceiling the band is chosen to respect

# --- Presence hold (TK-11) --------------------------------------------------------------
# CHOSEN-HERE, ported from the TK-4 spike's proven values. The production presence_hold
# predicate (wombat/gate/presence_hold.py) and the presence provider
# (wombat/sources/presence.py) receive these as INJECTED args — no inline literal lives in
# either module.
# presence_staleness_ceiling_seconds: a snapshot older than this (relative to the gate's
#   `now`) can no longer be trusted and forces a HOLD. 300s = 5 minutes.
presence_staleness_ceiling_seconds: 300.0
# presence_confidence_floor: a snapshot's confidence must be at least this to permit a
#   surface; anything below forces a HOLD.
presence_confidence_floor: 0.5
# presence_idle_threshold_seconds: idle time below this classifies ACTIVE; at or above,
#   IDLE (or AWAY once idle exceeds the descriptive-only AWAY_THRESHOLD_S in
#   sources/presence.py). 60s, matching the TK-4 hypothesis.
presence_idle_threshold_seconds: 60.0

# --- Sweeper cadence (TK-53) ------------------------------------------------------------
# CHOSEN-HERE — the standing runtime's durable-timer poll loop (cogworx.runtime.sweeper.Sweeper).
# sweeper_interval_seconds: how often the sweeper polls the journal for due timers.
sweeper_interval_seconds: 5.0
# sweeper_lease_ttl_seconds: how long a claimed-but-not-fired timer's lease is held before a
#   later poll reclaims it (crash safety — see Sweeper's own docstring for the at-least-once-
#   fire/exactly-once-advance guarantee this backs).
sweeper_lease_ttl_seconds: 60.0

# --- Dream substrate budget (TK-54, per-night cadence fixed by TK-180/CR2-3) ------------
# CHOSEN-HERE — the DEC-23 bounded off-path-inference posture: the dream-only model (TK-47's
# CoherenceReconciler/ClaimExtractor sweepers) gets a modest, structural per-night BudgetGuard
# ceiling (wombat.pathways.dream_substrate.build_dream_substrate mints a FRESH guard each wombat
# night), never an unbounded guard. Off-path and low-frequency (nightly cadence), so these
# ceilings are deliberately small.
# dream_budget_max_usd: the per-night USD ceiling; a call at/over this raises
#   BudgetExceededError BEFORE any network call (S11 pre-call, structural).
dream_budget_max_usd: 0.10
# dream_budget_max_calls: the per-night call-count ceiling.
dream_budget_max_calls: 20
