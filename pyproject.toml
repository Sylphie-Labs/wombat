[project]
name = "wombat"
version = "0.1.0"
description = "wombat — a personal assistant agent built on the cog-worx cognitive-architecture framework."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Jim Tisdale" }]
keywords = ["agent", "assistant", "cog-worx", "cognitive-architecture", "llm"]
dependencies = [
    # openai is a hard RUNTIME dep of serve(): bootstrap.build_engine wires a
    # DeepSeek OpenAICompatModel that Engine._build_context imports eagerly at
    # boot, before ComposeStage's degrade try/except can catch it (TK-17/Q-72).
    # Ride cog-worx's own [providers] constraint transitively — no parallel pin.
    "cog-worx[providers]",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "google-auth-oauthlib>=1.2",
    "keyring>=25.0",
    # DEC-40/TK-228: the ONLY honest route to a DST-correct host-local default timezone on
    # Windows (stdlib cannot portably resolve the host's IANA name there) — pure-python, zero
    # egress, returns a real zoneinfo.ZoneInfo (config.resolve_wombat_zone's unset-tz fallback).
    "tzlocal>=5",
]

[project.optional-dependencies]
# Model providers ride behind cog-worx's S4 `Model` seam — never a hard dep of the app.
providers = ["anthropic>=0.40.0", "openai>=1.55.0"]
# Local voice I/O rides behind wombat's own sink/source seams (TK-164, Q-96) — never a hard dep;
# the concrete adapters lazy-import these, so a checkout without this extra still boots clean.
# faster-whisper (TK-162, Q-97) rides the SAME extra alongside pyttsx3 — local ASR, offline.
voice = ["pyttsx3>=2.90", "faster-whisper>=1.0"]
# Cloud voice providers (TK-189, EP-31, DEC-28 structural opt-in) — thin httpx REST only, no
# vendor SDKs (Q-100). Separate from `voice` (local/offline) since cloud providers are an
# explicit opt-in, never installed by default.
voice-cloud = ["httpx>=0.27"]
# The Electron renderer's CONFIG backend (TK-197, EP-32, DEC-31/32) — a standalone loopback-only
# process (`python -m wombat.settings_app`) that imports NOTHING from the wombat runtime. Kept
# out of the base dependency set for the same reason as `voice`/`voice-cloud`: a checkout that
# never runs the settings app still boots clean without it.
settings-app = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
wombat = "wombat:main"

# --- Local development: import cog-worx straight from the sibling checkout ---
# Editable directory source so changes in ../cog_worx/cog-worx are picked up live.
# Swap for a version/git pin when cog-worx is published.
[tool.uv.sources]
cog-worx = { path = "../cog_worx/cog-worx", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.15.16,<0.16",
    "mypy>=1.13.0,<2",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "types-PyYAML>=6.0",
    # TK-197 (EP-32): mypy strict covers files=[src, tests], so wombat.settings_app's deps must
    # resolve in the dev env even though they're an optional extra for end users; FastAPI's
    # TestClient rides httpx (tests/settings_app/test_api.py).
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# google_auth_oauthlib ships no py.typed marker (google-auth itself does) — TK-71.
module = ["google_auth_oauthlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyttsx3 ships no py.typed marker/stubs, and is an OPTIONAL extra not installed by default
# (TK-164, Q-96) — mypy must not fail to resolve it inside Pyttsx3Adapter's lazy import.
module = ["pyttsx3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# faster-whisper ships no py.typed marker/stubs, and is an OPTIONAL extra not installed by
# default (TK-162, Q-97) — mypy must not fail to resolve it inside FasterWhisperTranscriber's
# lazy import.
module = ["faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
