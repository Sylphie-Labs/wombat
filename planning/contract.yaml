      resolution: "RESOLVED by architect 2026-07-03 (within authority - dep narrowing + HOW rulings inside the locked read-only/no-LLM frame and v1 scope; no locked item changed). ALL SEAMS VERIFIED AS-BUILT. (1) Q-56 OVER-PULL CLOSED - depends_on EP-15/EP-17 narrowed to TK-72 + TK-75 + TK-76 (all done, the only seams gather consumes); TK-77/TK-80 and the transitive EP-13 dream cluster no longer falsely block the brief. Remaining Q-56 over-pulls rule at their own briefings: TK-96 -> EP-17/EP-30, TK-101 -> EP-30, TK-77 -> EP-13. (2) READ SEAM RULED - gather does NOT read via the SourceRegistry (enqueue-only, ASMP-2; polling through it would double-enqueue into the drain queue) and cannot ride poll() (its never-raise []-degrade conflates unavailable with zero-events, making AC2's flag dishonest). Instead EXTRACT the raising fetch out of each poller as a small public read method - CalendarPoller.fetch_window(*, lookahead_hours=None->ctor default) -> list[CalendarEvent], GmailPoller.fetch_recent(*, lookback_hours=None->ctor default) -> list[GmailMessageItem] - each performs the GET+parse and RAISES on failure; poll() becomes a thin wrapper (try fetch -> map to SourceEvent; except -> the existing WARNING + []) with its catch set and observable behavior BYTE-EQUIVALENT (existing TK-72/TK-75 poll tests stay green untouched, the regression net). The stage constructor-injects two zero-arg sync callables fetch_calendar/fetch_gmail (composition binds the bound methods later at TK-96/97; unit tests inject fakes) plus triage_rules loaded ONCE via load_triage_rules at composition time (triage.py's own documented plan for TK-98). files_in_scope 2->5 (+artifacts.py, both pollers); estimate S->M. (3) BRIEFPAYLOAD SHAPE (domain/brief_payload.py, frozen dataclasses + JSON-native to_payload/from_payload per the CalendarEvent/GmailMessageItem/TriageResult idiom) - GmailBriefItem{message_id, subject, sender, received_at (ISO, aware), urgency_score, priority_band (value str), matched_rules} built from GmailMessageItem METADATA + triage_message(item, rules); it NEVER carries the guarded body field (brief_payload.py/brief_gather_stage.py are NOT on the Q-65 body-key-guard allowlist, so metadata-only is STRUCTURAL for the whole brief pipeline; TK-77 body-deep stays deferred). BriefPayload{generated_at (ctx.clock, ISO UTC), calendar_events tuple of CalendarEvent, gmail_items tuple of GmailBriefItem, calendar_unavailable bool, gmail_unavailable bool}. NO conflict-candidates field - the intent/non_goal tension resolves as DATA-vs-LOGIC: the calendar_events slice IS the raw candidate set; detection runs downstream (TK-96's pathway names a DetectConflicts step; TK-99 deps TK-74) over the payload's events via the frozen detect_conflicts kernel + the conflict_to_payload stamping helper. (4) STAGE SHAPE - name brief_gather, transitions=('brief_force_flush',) (the TK-6->TK-7 declare-ahead precedent; TK-99's stage MUST take that name); returns Transition(to='brief_force_flush', output=Artifact(kind=BRIEF_PAYLOAD='wombat.brief_payload' - constant added to stages/artifacts.py per the Q-47 kinds-defined-once convention, data=payload.to_payload(), produced_by='brief_gather', provenance=Provenance(source='system', confidence=1.0, recorded_at=ctx.clock()))). AC3 as-built-CONFIRMED: Stage = async run(ctx StageContext) -> StageResult; the ENGINE journals the returned Artifact (compose.py/gate_stage.py precedent); the stage never touches ctx.journal. (5) AC2 DEGRADE - per-source BROAD try/except (except Exception - token expiry surfaces as a google-auth RefreshError, NOT a requests.RequestException) around each fetch call -> WARNING log naming the source + empty tuple + <source>_unavailable=True; gmail triage runs INSIDE the gmail guarded block (any gmail-slice failure -> gmail_unavailable); both sources down -> the stage still returns a flagged BriefPayload, NEVER raises; no dedup/mutation logic (frozen items carried verbatim - AC1's no-duplicates is proven by distinct fixtures, not code). (6) WINDOW CONVENTION - calendar = 48h lookahead bound at composition (the poller's AC-fixed default; genuinely covers the intent's today+tomorrow, and AC1's next-24h fixture sits inside it), gmail = 24h lookback (overnight, the as-built GmailPoller default); the pollers own ALL window math (clock injected, DST proven at TK-72) - the stage computes no time arithmetic, it only stamps generated_at from ctx.clock(). Tests: tests/domain/test_brief_payload.py round-trip + tests/stages/test_brief_gather_stage.py (N+M exact, per-source degrade x2, both-down, no-journal-touch) on the Q-47 stage_context_fake; poller fetch-raise tests added beside the untouched poll tests. mypy strict + ruff. TK-98 is BUILD-READY.",
      links: ["TK-98","TK-99","TK-96","TK-72","TK-75","TK-76","TK-74","TK-77","TK-80","TK-101","Q-56","Q-65","Q-66","Q-47","Q-49","CON-1","ASMP-2"] }
