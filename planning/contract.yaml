      - src/wombat/stages/dispatch_approved.py
      - tests/safety/test_approval_gate.py
  - id: TK-150
    kind: ticket
    parent: EP-28
    title: Local-residency assertion — no user data persisted off-host (ASMP-1 boundary)
    intent: As the privacy posture of wombat (structural), all user data MUST be persisted only to the local Postgres/Neo4j store; no storage write may target a remote endpoint. The one accepted egress exception (ASMP-1) is the DeepSeek phrasing call — user content may leave the host for phrasing — but phrasing payloads must not be persisted remotely. This harness asserts the storage boundary is structurally enforced (NG-7/CON-7/ASMP-1).
    status: todo
    priority: P1
    estimate: S
    engineering_level: production
    complexity_budget: "One pytest fixture intercepting all DB writes + HTTP calls; one integration test per data class (user model, journal, action trail, email metadata, calendar events). No new persistence code — asserts existing write paths comply. RESIDENCY DEFINITION (Q-25/E): the guard checks SAME-HOST residency, NOT literally the string 'localhost'. The check is an explicit allowlist of same-host resolutions — loopback (127.0.0.0/8, ::1), the literal 'localhost', a unix-domain socket path, a configured Docker-bridge/service host that resolves to a same-host container network, and any interface address that belongs to THIS host — with the rule expressed as 'the resolved peer is on this host'. A LAN/0.0.0.0-bound address that resolves to a DIFFERENT host fails. This avoids both the false-positive (a same-host non-localhost peer wrongly blocked) and false-negative (a remote host wrongly allowed) the naive 'must equal localhost' check would produce."
    acceptance_criteria:
      - given: the full wombat integration runs against fixture inputs (email metadata, calendar event, user-model observation, trail row)
        when: all persistence paths execute
        then: "no write call targets an off-host endpoint (the interceptor asserts every sqlalchemy/psycopg/neo4j write resolves to a SAME-HOST peer per the residency allowlist — loopback, the literal localhost, a unix socket, or a same-host container/bridge address — NOT merely the literal string 'localhost'; any peer that resolves to a different host raises AssertionError). A table-driven test covers loopback, unix-socket, Docker-bridge-to-self (PASS) and a LAN address on another host (FAIL), so the guard neither false-positives on same-host non-localhost peers nor false-negatives on remote hosts (Q-25)."
      - given: a Compose Stage calls the DeepSeek API (ASMP-1 phrasing call)
        when: the HTTP call is intercepted
        then: the call is allowed (the one accepted egress exception); but the response content is NOT written to any remote endpoint — only to the local journal/trail. Test asserts exactly one outbound call to the DeepSeek base_url and zero writes to any other remote host.
      - given: the wombat config is mutated to point the Postgres URL at a host that resolves OFF this host (adversarial config test)
        when: wombat starts
        then: a startup assertion (LocalResidencyGuard.check(), using the same-host residency rule, Q-25) raises RemoteStorageConfigError and wombat refuses to start; the error names the offending config key. A companion case asserts a same-host non-localhost peer (e.g. a Docker-bridge service name resolving to this host) is ACCEPTED — the guard is host-residency, not a localhost string match.
      - given: the Gmail OAuth tokens are stored post-auth
        when: the OAuth token write completes
        then: tokens are written to the local credential store only; no token material is sent to a remote endpoint (interceptor asserts zero outbound HTTP calls containing the token string).
    non_goals:
      - No enforcement of TLS/encryption in transit for the phrasing call — ASMP-1 is a data-residency exception, not a transport-security ticket.
      - No audit of DeepSeek's server-side data retention — ASMP-1 accepts the phrasing call as a v1 tradeoff.
      - No enforcement of local-residency for the wombat/memory dev-tooling pipeline (DEC-11) — out of product scope.
    depends_on:
      - EP-1
      - EP-15
      - EP-17
    files_in_scope:
      - src/wombat/safety/local_residency.py
      - src/wombat/config.py
      - tests/safety/test_local_residency.py
  - id: TK-151
    kind: ticket
