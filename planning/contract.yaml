  - { id: DEF-1, type: deferral, status: deferred, scope: EP-7, date_raised: "2026-06-21", date_updated: "2026-06-21", title: "Defer scoring-thesis calibration (TK-22 RISK-1 + TK-26 RISK-2) against Jim's own surface/hold judgment to a real session with non-degenerate inbox content",
      description: "TK-22's urgency()/cognitive_load() and TK-26's trigger thresholds agree with the vision-derived PROXY rubric on a real-data fixture with no systematic error — the ARCHITECTURE is de-risked. The remaining exit clause (agreement with Jim's own confirmatory labels) CANNOT be meaningfully run now: the real inbox window held zero VIP/known-human mail, so a label pass would calibrate against a degenerate sample. The operating constants (urgency_threshold 0.75, load_flush_threshold 1.0, per_class_ceiling 3) are already recorded PROVISIONAL in TK-13 (Q-40), so a future relabel revises a versioned YAML value, NOT code.",
