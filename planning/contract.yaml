      - given: an artifact with action=hold, OR any artifact delivered with voice_enabled=false
        when: SpeakSink.run() is called
        then: the TTS adapter's speak() is NOT called; the stage returns Transition silently; no audio is emitted (text path is unaffected — voice is additive only).
      - given: voice (TTS) is disabled or unavailable (lesion / missing lib)
        when: SpeakSink.run() is called with a speak-event artifact
        then: the stage returns Degraded (S8) with a reason; no exception escapes; the text output path is unaffected (voice is never required for capability).
      - given: the full wombat engine with voice disabled
        when: the gate surfaces any item
        then: text output is delivered normally; no capability is blocked by the absence of a TTS library.
    non_goals:
      - SpeakSink does not decide WHAT to say or WHETHER to speak — the gate (EP-9) does; this stage only renders pre-decided text.
      - No continuous/ambient speech output.
      - No cloud TTS (local only — CST-2, TECH-11).
      - No model calls inside SpeakSink.
    depends_on:
