abulary, not a decision vocabulary - no ISS-4 collision). BriefDecisionItem{item_id, bucket, urgency, load, render} where render = the family's CANONICAL wire form ONLY (event.to_payload() / conflict_to_payload() / gmail item.to_payload()); scoring keys (is_timed/seconds_to_event/sender_class) are NEVER copied into render - the Q-50 user-facing-only boundary: the GateItem scoring payload and the mouth-facing render payload are SEPARATE constructions. BriefDecisionArtifact{item_kind = ItemKind.BRIEF stamped (wire form 'brief'), generated_at carried from BriefPayload, recap/conflicts/prep tuples of BriefDecisionItem, calendar_unavailable/gmail_unavailable carried through so TK-100's template can render honest degrade lines}. BUCKETS RULED: recap = selected GMAIL items (the overnight inbox recap), conflict = selected derived CALENDAR_CONFLICT items, prep = selected CALENDAR EVENTS (today/tomorrow - what to prepare for); assembly maps selected item_ids back through a pre-built id->(bucket, render) dict constructed BEFORE the select_items call. (5) STAGE SHAPE - name='brief_force_flush' (matching TK-98's frozen transition target exactly); transitions=('brief_compose',) - the declare-ahead precedent FREEZES TK-100's stage name as brief_compose; run(ctx) = await ctx.last_output('brief_gather') (None -> RuntimeError, the compose.py idiom), BriefPayload.from_payload(art.data) (the wire helper, never hand-parsed), derive conflicts, adapt, select, assemble, return Transition(to='brief_compose', output=Artifact(kind=BRIEF_DECISION='wombat.brief_decision' - constant added to stages/artifacts.py per Q-47, produced_by='brief_force_flush', provenance=Provenance(source='system', confidence=1.0, recorded_at=ctx.clock()), data=artifact.to_payload())); ctx surface = last_output + clock ONLY, never ctx.journal; no StageToolPolicy construction anywhere (the DEC-26 binding constraint); no model call (CON-1). (6) AUDIT-CRITICAL PROOF DEMANDED - tests/stages/test_brief_force_flush_stage.py MUST include the AC1 structural test composing a REAL Gate over an InMemoryPendingJournal-backed PendingSet pre-loaded with 2 unrelated items, binding gate.select_items into the stage, then asserting AFTER run() that (a) pending_set.list() returns the SAME ScoredItems, (b) cumulative_load() equals the pre-call value exactly, (c) the pending journal received ZERO new records (no PendingSetAdd/Remove/Clear appended - the strongest form), and (d) a spy ceiling that raises on allow/record was never called; plus AC3 (empty pending + one worthy event -> artifact contains it, threshold/params injected), the AC2 CON-1 structural round-trip (compose-side from_payload(to_payload) == the sealed contents, no additions/removals), a no-journal-touch spy (the TK-98 pattern), a filtered-out-item test (an unworthy item appears in NO bucket), and a degrade-flags-carried test. Unit tests inject a fake select_items; the AC1 test uses the real Gate with a fake user model - everything in-memory pure, NO pg/DSN gating needed. TK-99 amended: complexity_budget Q-75 riders, estimate S->M (conflict-fold + three-family adaptation + new domain type), files_in_scope 2->3 (+stages/artifacts.py). TK-99 is BUILD-READY.",
