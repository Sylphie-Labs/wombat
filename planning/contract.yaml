  - { id: Q-36, type: open_question, status: resolved, scope: EP-2, date_raised: "2026-06-21", date_updated: "2026-06-21", title: "COHERENCE (TK-2 planning): TK-2's WombatQueue hard-requires Postgres while TK-14 advertises a zero-infra cold boot",
