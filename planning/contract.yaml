  - id: TK-2
    kind: ticket
    parent: EP-2
    title: WombatQueue — durable bounded queue with idempotent enqueue/drain
    intent: As the drain pathway, I enqueue and drain QueueItems backed by a Postgres table so that queue state survives restart, items are idempotent, and the queue is bounded (backpressure on overflow).
    status: done
    priority: P1
    estimate: M
    engineering_level: mvp
    complexity_budget: "One wombat domain table + QueueItem dataclass + WombatQueue class; no journal writes from inside the queue (journal stays cog-worx run authority). CANONICAL WOMBAT PG CONVENTIONS ESTABLISHED HERE (Q-46 — TK-29/TK-152 and all future DB tickets inherit): (1) TEST CONVENTION: DB-state tests are REAL-Postgres tests gated on the WOMBAT_TEST_PG_DSN env var (pytest.skip with a loud reason when absent, so a fresh clone/CI never fails and never fakes); a DB ticket is DONE only after the independent verifier RUNS the gated suite against a real/throwaway Postgres (docker run postgres:16 one-liner documented in the test module docstring; Docker confirmed available on the dev machine) — the done-bar demands a RUNNABLE check, not a CI-resident one (TK-23 real-fixture precedent). NO testcontainers dependency (unrequested infra); NO psycopg fake / SQL double (a Python re-implementation of ON CONFLICT proves nothing and can drift). Each test truncates/uses its own rows so a shared local pg is safe. (2) DEPENDENCY: psycopg v3 with binary extra (psycopg[binary]) added to pyproject dependencies (files_in_scope includes pyproject.toml + uv.lock for this). (3) MIGRATIONS: numbered IDEMPOTENT .sql files under src/wombat/migrations/ (CREATE TABLE IF NOT EXISTS / CREATE UNIQUE INDEX IF NOT EXISTS); NO migration framework (NG-3 austerity) — the owning module ships ensure_schema(conn) which executes its own packaged .sql via importlib.resources; tests and the composition root call ensure_schema; cross-file ordering is a non-problem while each module owns one independent table. (4) INJECTION SHAPE: WombatQueue(dsn, *, max_size) — DSN is an injected constructor arg (Q-41/TK-29 pattern, no module DSN literal, sourcing is the composition root's concern); the queue OWNS one lazy psycopg connection (opens on first use, close()-able; no pooling, single-host DEC-6); max_size is a required injected int (tests pass literals; the OperatingParams field queue_max_size is a PRE-AUTHORIZED one-field TK-13 addition when the drain pathway wires the queue — same pattern as the Q-41 user_id ruling). (5) LEASE/RESTART MECHANISM (AC3): epoch-based reclaim — WombatQueue generates a per-instance epoch (uuid) at construction; drain leases rows with leased_by=epoch; drain never re-returns rows leased by its OWN epoch (no double-surfacing within a run) but RECLAIMS rows leased by a DIFFERENT epoch (orphaned by a dead process — sound because v1 is single-host single-process, DEC-6, so no other live process can hold a lease); restart = new instance = new epoch = redelivery; ack(item_id) deletes the leased row exactly once (second ack is a no-op). No lease timeouts, no clocks, no cross-process locks. COLD-BOOT COHERENCE: per Q-36 the queue REQUIRES real Postgres — cold_boot_bundle covers only the cog-worx substrate seams; there is NO in-memory queue variant and NO no-op mode; a whole-system v1 run needs local same-host pg (TK-150)."
    acceptance_criteria:
      - given: a QueueItem with a stable idempotency_key is enqueued twice
        when: both enqueue calls complete
        then: Only one row exists for that key; the second enqueue is a no-op returning ALREADY_QUEUED (verified by DB count).
      - given: the queue is at configured capacity
        when: another enqueue is attempted
        then: enqueue raises QueueFullError and no row is added.
      - given: the process is killed mid-drain
        when: the process restarts and drain resumes
        then: the item is returned again (at-least-once) and completion acknowledgment removes it exactly once (no double-surfacing).
      - given: an empty queue
        when: drain is called
        then: drain returns immediately with an empty list.
    non_goals:
      - Does not own the journal or write cog-worx run records.
      - Does not implement priority ordering beyond FIFO.
      - Does not implement cross-process locking (single-host v1, DEC-6).
    depends_on:
