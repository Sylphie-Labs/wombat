    engineering_level: production
    estimate: S
    complexity_budget: "BINDING-LOCATION FIX (Q-32) — cog-worx binds tier policy PER-STAGE via getattr(stage,'tool_policy',None); there is NO composition-root stage->policy registry, so this ticket OWNS the external-admitting StageToolPolicy(allowed_tiers={read,write,external}) + a binding helper in src/wombat/safety/tier_policy.py that sets that policy on each named dispatch stage's tool_policy attribute (the attachment happens where the stage is constructed — TK-78/131/133/135 — via this helper, NOT a bootstrap.py registry the seam doesn't support). FAIL-CLOSED FIX (Q-32) — there is NO separate cog-worx 'external-tier flag'; fail-closed is STRUCTURAL, a stage that does not carry 'external' in its allowed_tiers is refused with TierViolation automatically, and external admission is OFF unless this helper is explicitly applied to a stage (no global switch, no runtime self-grant). LEGACY-NOTE perDEC-20/DEC-22: a Stage-scoped allowed_tiers={read,write,external} attached to exactly the named dispatch stages; no global default change (engine default stays {read,write}). Asserts the negative case: a non-dispatch Stage invoking an external Capability is refused. No new cog-worx machinery — wombat configures the existing tier policy. The planning authorization is GRANTED (DEC-22); the 'build-time enablement' is realized structurally (see the FAIL-CLOSED FIX above — external admission is OFF unless the binding helper is applied to a stage; no separate flag artifact, no runtime self-grant)."
    acceptance_criteria:
