    complexity_budget: Implement via cog-worx Wait+Sweeper (TECH-12) with a persisted daily-run ledger that uses the shared DailyLedger primitive (TK-152) for its "today" boundary (DEC-21/Q-15 — same wombat-day as spend TK-9 and ceiling TK-27). The Sweeper catches missed fires after sleep-resume; "today" is the canonical civil-local wombat-day so a sleep across midnight fires once, not zero or twice. The brief pathway (TK-96) is the payload. Q-80 rulings bind — mechanism is a Wait-SELF-PARKING scheduler stage (pathway wombat.brief_schedule, stage brief_timer with transitions ('brief_timer','brief_timer_terminal') — the self-edge plus a declared-but-never-taken edge to a never-reached BriefTimerTerminalStage stub that exists ONLY to satisfy StageGraph's reachable-terminal construction invariant, the TK-53 _WaitForeverStage/_TerminalStage precedent per the Q-80 v1.02 amendment; the TK-5 idle idiom; cog-worx has NO standalone cron timer — Timer records are run-bound and armed only by a committed Wait, so the existing TK-53 Sweeper re-drives the parked scheduler run); fence-READ gates each due entry (DailyLedger row brief:run via a thin BriefRunLedger over the SAME composed DailyLedger), MARK only after the fired brief run returns COMPLETED; the brief run_id is wombat-day-keyed (wombat-brief-<date>) so the TK-101 file-marker closes the crash-after-Deliver double window; the scheduler is registered conditionally alongside wombat.brief (blank WOMBAT_BRIEF_PATH loud-skips both) and boot-driven from serve() (boot entry = the crash-miss catch; the Sweeper claim of the overdue Wait = the sleep-miss catch).
