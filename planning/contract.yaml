      - given: the canonical presence_hold(snapshot) predicate used by both TK-6 and the production gate TK-27
        when: it is called with snapshot states unknown, stale (older than the staleness ceiling), or confidence below the floor
        then: it returns hold (conservative) in every such case — a property test sweeps the staleness/confidence space and asserts no fresh-enough, confident, active snapshot is the ONLY path that permits surfacing; the test MUST fail if any stale/unknown/low-confidence input permits a surface.
      - given: a PresenceSnapshot whose timestamp predates a multi-hour gap (host slept) and is now older than the staleness ceiling
        when: presence_hold is evaluated on wake
        then: it returns hold until a fresh snapshot arrives — the production gate never surfaces against a pre-sleep stale snapshot (the conservative-on-stale guarantee survives the sleep boundary that TK-28 resets the ledger across).
      - given: the production PresenceSource (hardened from TK-4)
        when: the OS idle API is unavailable or errors
        then: it yields state=unknown, confidence=0.0 without raising, and presence_hold(that) returns hold — the degrade path is production-tested, not prototype-only.
      - given: the gate's silence guarantee
        when: a reviewer traces which code TK-27's hold-on-stale-presence relies on
        then: it resolves to this hardened presence_hold predicate (engineering_level production), NOT TK-4's prototype spike — closing the prototype-under-a-production-gate gap (Q-17).
    non_goals:
      - No multi-signal fusion — single OS idle signal remains the source (DEC-6 / TK-4 non_goal upheld).
      - No sleep/wake event DETECTION — staleness subsumes it (a pre-sleep snapshot is simply stale); ledger sleep-boundary handling is TK-28.
      - Does not change the scoring functions — presence is a gate-level hold, not a scoring input (Q-12/DEC-13).
      - No new presence sensors or OS integrations beyond TK-4's idle signal.
    depends_on:
