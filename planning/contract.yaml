nded: depends_on EP-5 -> TK-8 + TK-9; files_in_scope 2 -> 4 (stages/brief_compose_stage.py, compose/brief_template.py, stages/artifacts.py, bootstrap.py); estimate S -> M; complexity_budget Q-77 riders. TK-100 is BUILD-READY.",
