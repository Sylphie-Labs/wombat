      links: ["TK-9","TK-53","TK-1","TK-8","Q-68","Q-61","Q-44","DEC-18","CST-3"] }

  - { id: Q-70, type: open_question, status: resolved, scope: EP-8, date_raised: "2026-07-03", date_updated: "2026-07-03", title: "TK-29 build briefing (light, as predicted): migration numbering after the Q-68 002 release, the as-built TK-25 Protocol named verbatim, the Q-45/ASMP-2 fidelity obligation translated for pg, and the schema/identity/queue-relation rulings",
