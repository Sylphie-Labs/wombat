  - { id: Q-67, type: open_question, status: resolved, scope: EP-15, date_raised: "2026-07-03", date_updated: "2026-07-03", title: "TK-16 scope amendment: gmail source registration was about to become a second Q-61 unowned wire — TK-75 landed injection-only (correctly) and TK-16 as authored explicitly excluded gmail wiring",
