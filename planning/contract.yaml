    engineering_level: mvp
    complexity_budget: "One class, one public method; a DETERMINISTIC POINT-READ of the per-event-class rating-parameter node from the cog-worx user scope. SEAM (Q-34, seam-miss fix): NOT RecallStack — RecallStack is a ranked RRF recall/fusion engine (recall(query)->FusedResult) and a fuzzy ranked recall would violate the gate-deterministic frame (NG-4). Use the cog-worx ScopedKG user-model view (knowledge.scoped_kg.user_model) or EntityKG.claims_about(entity=<EventClass value>, scope='user:<user_id>') — a precise key lookup. The class takes an INJECTED EntityKG (or ScopedKG read view) plus user_id as an INJECTED CONSTRUCTOR ARG (Q-41 — the as-built TK-13 OperatingParams has NO user_id field; sourcing it is the composition root's concern, landing later as a one-field wombat_params.yaml/OperatingParams addition under TK-13's ownership; tests pass a literal), forming scope 'user:<user_id>' at construction; v1 is single-user. ASYNC (Q-41): ratings_for is ASYNC DEF — the injected claims_about seam is async AND the real caller (cog-worx Stage.run) is async; a sync asyncio.run facade would RuntimeError inside the running Stage loop and be silently swallowed to defaults-forever. The sync gate ScoreFns receive already-awaited RatingParams from the async caller (TK-23/TK-27 composition). EVENT-CLASS RESOLUTION (Q-41): GateItem carries no EventClass — this ticket owns resolve_event_class(item), reading the documented payload key 'event_class' (an EventClass value string; the REQUIRED path for CALENDAR_CONFLICT) with the total ItemKind fallback map BRIEF->MORNING_BRIEF / REFLECTION->REFLECTION / DRAFT->DRAFT_REPLY / GENERIC->GENERIC when the key is absent (invalid value -> fallback + warning); TK-21's canonical model is NOT amended (payload is its designed extension point) and ItemKind stays composition-routing-only (ISS-4). WIRE SHAPE (Q-41): cog-worx Claim.payload is a plain str and TK-44 is unbuilt, so this ticket defines the PROVISIONAL wire contract, homed in the shared vocabulary module — RATING_CLAIM_PREDICATE + to_claim_payload/params_from_claim_payload in rating/params.py, payload = JSON of {version, urgency_base, urgency_gain, load_base, load_gain}, entity = the EventClass value, newest active claim wins; TK-44/TK-49 MUST write through these helpers. No tuner logic, no write paths, no S7 write-token mint (pure read). CANONICAL TYPE HOME (v0.23 layout reconciliation): the returned RatingParams type is imported from src/wombat/rating/params.py (TK-41's as-built home), NOT user_model/rating_params.py."
    acceptance_criteria:
      - given: "the injected user scope has a rating-parameter claim for CALENDAR_CONFLICT (entity='calendar_conflict', predicate=RATING_CLAIM_PREDICATE, payload written with the shared to_claim_payload helper)"
        when: "await UserModel.ratings_for(item) is called with a GateItem whose payload['event_class'] is 'calendar_conflict'"
        then: "the method point-reads that node (ScopedKG/EntityKG.claims_about, scope='user:<user_id>') and returns a RatingParams object with the stored personalized values — a deterministic key lookup, not a ranked recall."
      - given: "no user-scope rating-parameter node exists for the resolved event class, OR the GateItem carries no 'event_class' payload key"
        when: "await UserModel.ratings_for(item) is called"
        then: "a RatingParams object with documented defaults for the resolved class is returned (graceful fallback, no exception); an item without the payload key resolves through the ItemKind fallback map (e.g. ItemKind.BRIEF -> EventClass.MORNING_BRIEF)."
      - given: "the injected EntityKG/ScopedKG read raises (store unreachable), OR a stored claim payload is malformed or unknown-version"
