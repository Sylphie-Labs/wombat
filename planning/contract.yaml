    title: BriefDeliverStage — deliver rendered brief as text and/or terse voice
    intent: As the user waking up, given a rendered BriefText, when DeliverStage runs, then the brief is written to a readable text sink and, if voice is enabled, spoken tersely via EP-30 — so the brief is actually received, without any second brief produced from this invocation.
    status: done
    priority: P1
    estimate: M
    engineering_level: mvp
    complexity_budget: 'One Stage: write BriefText to a configured text sink (append-only file + stdout echo); if voice_enabled, call the injected speak-sink. Delivery is recorded as the stage''s own journaled terminal Done artifact (CON-4) so crash-resume does not re-deliver. No model call. Text-only is the degrade path when the speak-sink is absent. Q-78 RIDERS: (1) EP-30 dep NARROWED to an injected speak seam - ctor voice_enabled bool + speak Callable[[str], None] | None (default None); True + wired -> speak(BriefText.text) exactly once, verbatim, no words added (AC2); True + None -> warning log + text-only, never raises (AC3); False -> no speak, no warning; a RAISING speak -> broad except -> warning, text delivery stands (voice is additive); TK-164 later binds its real TTS adapter into THIS seam at composition - voice delivery stays v1 (DEC-7), nothing deferred. (2) AC4 MECHANISM = run_id-keyed FILE-MARKER idempotency, verified against the as-built engine: cog-worx replays only COMMITTED steps - in the write-then-crash window resume RE-ENTERS run() (the engine explicitly does not protect side effects), ctx.last_output(''brief_deliver'') is None there, and StageContext exposes run_id but NOT step_index (the AC4 parenthetical corrected on the record). The appended header embeds run=<ctx.run_id>; run() FIRST scans the sink file for that key; found -> skip append + echo + speak entirely, log info, return the same terminal Done with replay=true (replay re-journals the completion, never re-writes) - run_id-only keying is sound because the linear brief pathway visits brief_deliver exactly once per run (Done-terminal, no cycles); a different run_id (tomorrow) appends normally. The stage NEVER touches ctx.journal (the TK-98/99/100 convention HOLDS): AC1''s ''recorded in the journal before the stage returns'' is discharged by the returned Done(Artifact) committed by the engine''s S6 commit-before-advance - a direct in-run journal write would not close the crash window and would break the convention for nothing. (3) ctor sink_path Path + tz ZoneInfo (TK-99/TK-100 precedent; composition passes the canonical DEC-21 zone); header line ''=== wombat morning brief | <local ts> | run=<run_id> ==='' with local ts = ctx.clock().astimezone(tz) formatted %Y-%m-%d %H:%M %Z (never bare UTC, Q-15) + BriefText verbatim + trailing blank line, utf-8 plain append (mvp - no fsync/lock, ASMP-2 single-process); ORDER scan -> file append -> stdout echo (print of the same header+text - a delivery sink, not logging) -> speak -> Done; a sink WRITE failure RAISES LOUD (no degrade target below ''the brief was received''; nothing committed, marker absent -> resume retries the append - self-healing); on a replay-skip voice_spoken=false + replay=true. CONFIG: WombatConfig gains OPTIONAL env fields wombat_brief_path str|None (WOMBAT_BRIEF_PATH) + wombat_voice_enabled bool default False (WOMBAT_VOICE_ENABLED), NOT in REQUIRED_ENV (TK-71/Q-57 precedent; OperatingParams REJECTED - host path/capability is deployment config, not a versioned tunable); NEW bootstrap.build_brief_deliver_stage(*, config, tz=UTC, speak=None) mirroring build_brief_compose_stage - missing/blank wombat_brief_path -> ConfigurationError at construction (TK-8 AC3 precedent); TK-96/TK-97 MUST assemble via the factory, never hand-rolled (the Q-69 lesson). (4) name=''brief_deliver'' (TK-100''s frozen target); transitions=() TERMINAL (the drain ComposeStage precedent - this stage ENDS the brief pathway); returns Done(Artifact(kind=BRIEF_DELIVERED=''wombat.brief_delivered'', produced_by=''brief_deliver'', Provenance(system, 1.0, ctx.clock()), data={''delivered_at'' ISO-8601 tz-local aware string, ''voice_spoken'' bool, ''replay'' bool})) via new brief_delivered_to/from_artifact_data helpers in stages/artifacts.py (Q-47); INPUT = await ctx.last_output(''brief_compose'') (None -> RuntimeError) unpacked via brief_text_from_artifact_data, never hand-parsed; ctx surface = last_output + clock + run_id attr ONLY, never ctx.journal; NO model call (CON-2 - the mouth already spoke at TK-100, no second brief structurally); no StageToolPolicy (DEC-26). Estimate S->M.'
    acceptance_criteria:
      - given: A rendered BriefText and the text sink configured to an output file
        when: BriefDeliverStage.run() is called
        then: the BriefText is appended to the output file with a timestamp header in the canonical wombat timezone (DEC-21 — matching the wombat-day the brief belongs to, not a bare UTC header that disagrees with the local morning fire time; Q-15), and the delivery event is recorded in the journal before the stage returns.
      - given: voice_enabled=True and the EP-30 speak-event is available
        when: BriefDeliverStage.run() is called
        then: the brief is spoken once via EP-30 with no words added — the spoken content matches BriefText exactly.
      - given: voice_enabled=True but EP-30 is unavailable
        when: BriefDeliverStage.run() is called
        then: text delivery succeeds; voice delivery is skipped with a warning log — the stage does not raise.
      - given: the deliver stage crashes after writing the file but before journaling completion
        when: cog-worx resumes and replays the stage WITHIN the same run
        then: "the file is not appended twice because intra-run replay idempotency is the cog-worx JOURNAL's exactly-once stage replay (positional run_id/step_index, reachable via StageContext) — NOT the TK-97 daily-run ledger (audit fix: the daily-run ledger gates whether the brief PATHWAY fires once per wombat-day, and is marked only AFTER Deliver completes, so it does not cover the in-run crash window). The append is made idempotent by keying on the run/step so replay re-journals the same completion rather than re-writing."
    non_goals:
