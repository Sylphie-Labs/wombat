  - id: TK-50
    kind: ticket
    parent: EP-12
    title: Outcome-signal INFERENCE engine — off-path nightly deterministic LOAD_BEARING / REGRETTED / IGNORED from local state (RISK-7 mitigation)
    intent: As the nightly consolidation pass, I produce a per-item outcome signal by DETERMINISTIC INFERENCE over already-observable local state so the RatingTuner (EP-14) trains on a genuine gradient rather than a near-constant IGNORED-on-timeout stream — because wombat is read-only on calendar and never auto-sends Gmail (RISK-7, ISS-6). This is the OFF-PATH inference half; the INTERACTIVE human-feedback half (with its input channel) is TK-51 (atomicity split, Q-21). This engine also CONSUMES the queued feedback signals TK-51 captured and FOLDS them with its inferences into the final per-item OutcomeSignal.
    status: todo
    priority: P1
    estimate: M
    engineering_level: mvp
    complexity_budget: "One OutcomeInferenceEngine, no LLM, run off-path nightly (S1) inside the dream pathway (EP-13): deterministic inference rules over already-observable local state — a flagged calendar conflict that later disappears from the read-only calendar snapshot -> LOAD_BEARING; a drafted reply whose Gmail draft the user later deleted unsent -> REGRETTED; a surfaced item with no feedback (TK-51) and no inferable downstream change before its TTL -> IGNORED. It also reads any explicit feedback signals TK-51 captured and lets an explicit feedback signal OVERRIDE a weaker inference. Emits OutcomeSignal(item_ref, outcome, source=feedback|inferred) keyed on the canonical identity (TK-12) that TK-45 writes as the OUTCOME_* claim. No new egress; no calendar/Gmail writes (read-only preserved). The interactive affordance + input channel is NOT here (TK-51)."
    acceptance_criteria:
      - given: a previously surfaced calendar-conflict item whose conflicting event no longer appears in the latest read-only calendar snapshot
        when: the deterministic inference pass runs (off-path, nightly)
        then: it emits OutcomeSignal(outcome=LOAD_BEARING, source=inferred) with provenance naming the inference rule; no calendar write occurs (read-only preserved).
      - given: a surfaced item with no feedback (TK-51) and no inferable downstream change before its TTL expires
        when: the inference pass runs
        then: it emits OutcomeSignal(outcome=IGNORED, source=inferred) — the default, but now ONE outcome among three rather than the only reachable outcome.
      - given: an explicit feedback signal captured by TK-51 for an item AND a weaker contradicting inference
        when: the engine folds the two
        then: the explicit feedback (source=feedback) wins and is emitted as the item's OutcomeSignal — proving the interactive half (TK-51) and the inference half compose into one signal per item.
      - given: a representative fixture of >=20 resolved items across the three outcomes (some with queued TK-51 feedback, some inference-only)
        when: the engine runs over the fixture
        then: the emitted signal distribution contains at least one LOAD_BEARING and at least one REGRETTED (a non-degenerate gradient), proving the RatingTuner (TK-49) has real signal to train on, not a constant stream.
    non_goals:
      - No LLM inference of outcomes — deterministic rules only (CON-1/NG-4).
      - No motive inference about WHY the user acted (CON-6/NG-1) — only whether the surfacing was load-bearing.
      - No calendar or Gmail writes — inference reads only already-observed local state (read-only posture, DEC-5/v1 scope).
      - Does NOT implement the interactive feedback affordance or its input channel — that is TK-51 (Q-21 split); this engine only CONSUMES the signals TK-51 captured.
      - Does not write the claim itself — that is TK-45 (this engine produces the signal TK-45 records).
      - No dashboard or analytics over outcomes (NG-3).
    depends_on:
