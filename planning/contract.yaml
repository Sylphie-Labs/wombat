TK-13 pattern). (5) ENTRYPOINT: python -m wombat (__main__.py -> runtime.serve()) IN scope. (6) SHUTDOWN minimal: CancelledError/KeyboardInterrupt -> stop registry + best-effort close; no signal machinery; terminate-before-restart documented as the ASMP-2 operator obligation. (7) TESTS: tick()-driven with injected clock (never unbounded run_forever); DSN-gated assembly assertions + ONE full-cycle integration + unit shutdown test; Q-46 verifier-runs-docker-pg done-bar. TK-53 budget/ACs/non_goals/files_in_scope amended; two new ACs added.",
