  - { id: Q-32, type: open_question, status: resolved, scope: EP-28, date_raised: "2026-06-21", date_updated: "2026-06-21", title: "CRITICAL/seam-miss cluster (c): taint exception + tag naming wrong vs cog-worx; dispatch/taint seams misnamed or mis-located (TK-148/146/149/151/75/131/136)",
