  - { id: Q-40, type: open_question, status: resolved, scope: EP-9, date_raised: "2026-06-21", date_updated: "2026-06-21", title: "Persist the TK-48 RISK-4 empirical finding: floor/ceiling clamps alone do NOT bound the surfacing rate — the band must be chosen jointly with surfacing sensitivity; which ticket owns the operating constants and the joint-coherence invariant?",
      description: "The TK-48 spike (RISK-4 retired) proved via ablation that floor/ceiling clamps alone do not bound the surfacing RATE; the band, gain, delta_bound and hard ceiling are a coherent set chosen so the worst-case clamped rate equals the ceiling. Recommended constants: clamp band [0.35,0.65], delta_bound 0.05, gain 0.20, hard ceiling 12.0/day. If these are not persisted as a JOINT block, a later edit to the band without re-deriving the ceiling silently breaks the bound. Which ticket owns them, and how is the joint-coherence guarantee carried into the tuner?",
      resolution: "RESOLVED by architect 2026-06-21 (within authority — realizes Q-19/TK-13's param-store remit; no locked-decision/scope change). TK-13 OperatingParams store OWNS the five constants as ONE coherent block (band [0.35,0.65], delta_bound 0.05, gain 0.20, surfacing_ceiling_per_day 12.0) with a comment recording the joint-coherence reason; new TK-13 AC asserts all five present, typed, and equal to the TK-48 defaults. TK-49 RatingTuner CLAMPS against them by reading the whole block from TK-13 (never inlining); new TK-49 AC asserts no inline band/delta_bound/gain literal and that a night's delta is clamped to +/- delta_bound before the band clamp. These TK-48 constants are LOCKED (RISK-4 retired). The TK-26 trigger thresholds (urgency_threshold 0.75, load_flush_threshold 1.0, per_class_ceiling 3) are recorded as PROVISIONAL in TK-13 (fixture-confirmed only, pending Jim's RISK-1/2 confirmatory label pass) — seeded as defaults but marked provisional in the versioned YAML so a relabel can revise them without implying they were ever locked.",
      links: ["TK-48","TK-13","TK-49","TK-26","TK-22","Q-19"] }
  - { id: Q-41, type: open_question, status: resolved, scope: EP-10, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-42 constructibility cluster (build briefing): no ItemKind->EventClass bridge, phantom TK-13 user_id, sync gate vs async claims_about, no agreed claim-payload wire shape",
      description: "The TK-42 build briefing verified four gaps against the as-built tree. (1) BLOCKER: TK-42 AC1 keys the point-read on an EventClass, but GateItem carries only ItemKind {BRIEF,REFLECTION,DRAFT,GENERIC} (TK-21 — the canonical and only-allowed item-kind vocabulary) and NO ticket defines an ItemKind->EventClass mapping; CALENDAR_CONFLICT has no ItemKind counterpart at all, and BRIEF/DRAFT do not line up 1:1 with MORNING_BRIEF/DRAFT_REPLY. (2) TK-42 said 'one configured user_id from TK-13' but the as-built OperatingParams has no user_id field (and WombatConfig only holds DeepSeek env). (3) cog-worx EntityKG.claims_about is async def and Stage.run is async, while the gate pipeline + ScoreFn are sync. (4) cog-worx Claim.payload is a plain str and TK-44 (the write side) is unbuilt, so no on-wire shape exists for the rating-params claim TK-42 must parse.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — seam/how rulings; no locked decision, constitution item, or v1 scope touched; TK-21's canonical model NOT amended). (1) EVENT-CLASS RESOLUTION: rejected a bare ItemKind->EventClass mapping table as LOSSY — no ItemKind maps to CALENDAR_CONFLICT, so the flagship rated class of the v1 wedge would silently degrade to GENERIC and gut the personalized-gate thesis; rejected changing the ratings_for(item) signature (pushes derivation onto every caller). RULED: the event class travels IN GateItem.payload under the documented key 'event_class' (an EventClass value string) — payload is TK-21's designed extension point ('opaque fields the scoring callables read'), so ItemKind stays composition-routing-only (ISS-4 intact). TK-42 owns resolve_event_class(item)... payload key when present/valid, else the TOTAL fallback map BRIEF->MORNING_BRIEF, REFLECTION->REFLECTION, DRAFT->DRAFT_REPLY, GENERIC->GENERIC (invalid value -> fallback + warning). PRODUCER OBLIGATION: whichever ticket enqueues calendar-conflict items stamps payload['event_class']='calendar_conflict' — homed just-in-time at that ticket's frontier briefing per Q-35 (the Conflict record itself is TK-74's). (2) USER_ID: UserModel takes user_id as an INJECTED constructor arg and forms scope 'user:<user_id>' itself (matches cogworx knowledge/scopes.py convention); tests pass a literal; sourcing is a composition-root concern — when first wired, user_id lands as a one-field wombat_params.yaml/OperatingParams addition under TK-13's ownership (pre-authorized here; TK-13 stays done, nothing consumes the field yet). (3) ASYNC: ratings_for is ASYNC DEF. The briefing's sync facade with asyncio.run inside is REJECTED — Stage.run is async, so asyncio.run would raise RuntimeError inside the running Stage loop and AC3's broad except would swallow it, silently pinning production to defaults forever (an invisible defeat of the personalized gate, the DEC-13 thesis). The sync gate ScoreFns are unaffected... the async caller (TK-23/TK-27 composition) awaits/prefetches RatingParams per event class and binds them into the pure sync scoring functions; TK-23 AC1 reworded. (4) WIRE SHAPE: TK-42 defines the PROVISIONAL claim wire contract, homed in the shared vocabulary module rating/params.py (TK-41's home — the one module gate/read-seam/tuner already speak, so read/write cannot drift)... RATING_CLAIM_PREDICATE constant + to_claim_payload/params_from_claim_payload helpers; payload = JSON of {version, urgency_base, urgency_gain, load_base, load_gain}; entity = the EventClass value; newest active claim wins; malformed/unknown-version payload -> defaults + warning (never raise). TK-44 and TK-49 MUST write through these helpers (TK-44 budget annotated). TK-42 budget/ACs/files_in_scope amended (+rating/params.py, +tests).",
      links: ["TK-42","TK-21","TK-41","TK-13","TK-44","TK-49","TK-23","TK-74","TK-27","Q-34","Q-35"] }
  - { id: Q-42, type: open_question, status: resolved, scope: EP-7, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-23 composition ambiguity (build briefing): spike ScoringParams (7 heuristic fields) vs production RatingParams (4 base/gain fields) — exact scoring composition, fate of ScoringParams, the AC1 'solely' purity reading, and where AC3's ratings_for-fallback obligation lives",
      description: "The as-built TK-22 spike gate/scoring.py defines its own ScoringParams with SEVEN heuristic fields (w_time 0.55, w_sender 0.45, time_horizon_s 14400, w_density 0.6, w_depth 0.4, density_saturation 6, depth_saturation 8), while the production RatingParams (TK-41) carries only FOUR personalization fields (urgency_base/urgency_gain/load_base/load_gain + version) — the shapes do not line up. Four rulings needed before TK-23 code is written: (1) how exactly do base/gain compose with the item's raw signal, and is AC2's STRICT monotonicity preserved under the [0,1] clamp, incl. gain=0? (2) does AC1's 'drawn solely from the item's fields and the RatingParams' forbid fixed heuristic module constants? (3) is ScoringParams deleted or retained as the home for the non-personalized constants (this changes the public signature)? (4) AC3 as written tests a ratings_for-raises path that no longer exists — the as-built ratings_for (TK-42) never raises, and per Q-41 the sync scoring functions never call it.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — a HOW/seam ruling on an mvp ticket; no locked decision, constitution item, or v1 scope touched; no dep/graph change). (1) COMPOSITION: the spike's internal signal computation is KEPT with its 7 constants FROZEN as module-level heuristic constants (the hardened heuristic's SHAPE); personalization enters ONLY through RatingParams as an affine map — urgency = clamp01(urgency_base + urgency_gain * raw_urgency) with raw_urgency = 0.55*time_term + 0.45*sender_term, and cognitive_load = clamp01(load_base + load_gain * raw_load) with raw_load = 0.6*density_term + 0.4*depth_term; both raw signals lie in [0,1] by construction (weights sum to 1). This matches the RatingParams field docstrings (base = baseline contribution, gain = signal multiplier) AND the proven TK-48 tuner-sim model (the tuner moves the BASES additively inside the TK-13 clamp band — plain affine is what the RISK-4 stability proof modeled). MONOTONICITY: a >4h item has zero time pressure, so its raw urgency is at most W_SENDER=0.45; strict AC2 monotonicity therefore holds after clamping whenever gain > 0 and base + 0.45*gain < 1.0 — satisfied by every documented per-class default and the ENTIRE TK-13 tuner band (worst case 0.65 + 0.45*0.65 = 0.9425 < 1.0), so strictness is a provable bound, not a coincidence. gain=0 is type-legal but degenerate (the class flattens to its base — fully muted); AC2 is specified over gain>0 params and the saturation caveat is documented in the module. (2) AC1 'solely' CONFIRMED as a PURITY clause, not a no-named-constants clause: pure deterministic function of (item payload, params) — no I/O, no clock read (seconds_to_event arrives precomputed in the payload), no randomness, no presence, no mutable module state; the frozen constants are part of the function's DEFINITION (the deterministic transform of the item's own fields the spike already proved). The heuristic constants STAY in gate/scoring.py and are NOT moved into TK-13 OperatingParams — they are the scoring function's shape, not operating thresholds; moving them would create a second tuning surface (TK-23 budget forbids tuning logic) and re-scope a done production ticket with no consumer need; the TK-13 AC4 guard scans scoring.py only for TK-13-OWNED constants, which scoring.py must not define, so there is no conflict. (3) ScoringParams is DELETED — the public signature becomes urgency(item, params)/cognitive_load(item, params) with params typed RatingParams; retaining a second params type would recreate exactly the private-vocabulary drift TK-41 exists to prevent. The TK-22 spike tests are PORTED IN PLACE using the identity RatingParams(urgency_base=0.0, urgency_gain=1.0, load_base=0.0, load_gain=1.0), under which the hardened functions reproduce the spike's raw scores EXACTLY — the port doubles as a behavioral-equivalence proof and the fixture-agreement thresholds pass unchanged (RISK-1 evidence chain and DEF-1 calibration posture undisturbed). (4) AC3's ratings_for-failure obligation LIVES ON TK-42 (built + verified: store failure/malformed claim -> defaults + warning, never raises; and per Q-41 the sync scoring functions never call ratings_for). TK-23 AC3 is REWORDED to the scoring-layer residual: payload TOTALITY — a MISSING payload key defaults silently (sparse items are legitimate), a present-but-INVALID value defaults + emits a warning (the warning is the hardening; the spike defaulted silently), never raises. TK-23 budget/AC1-AC4/files_in_scope amended (+tests/gate/test_scoring_spike.py for the in-place port).",
      links: ["TK-23","TK-22","TK-41","TK-42","TK-13","TK-48","TK-49","TK-27","Q-41","DEF-1"] }
  - { id: Q-43, type: open_question, status: resolved, scope: EP-7, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "Q-42 follow-up: deleting ScoringParams breaks live consumers outside TK-23's files_in_scope — the TK-26 spike trigger_sim.py (+3 baseline tests) and the committed TK-22 fixture builder both import/construct it; migrate, shim, or accept regression?",
      description: "Q-42 ruled ScoringParams DELETED from gate/scoring.py with RatingParams the sole params type. Code-confirmed live consumers outside TK-23's then-declared files_in_scope: (1) src/wombat/gate/trigger_sim.py (TK-26 frozen spike) imports ScoringParams and its score_day(items, params) calls urgency()/cognitive_load(); (2) tests/gate/test_trigger_sim.py constructs ScoringParams() in 3 tests that are part of the 105-green baseline; (3) tests/gate/fixtures/_build_scoring_fixture.py — the COMMITTED de-identified fixture builder that test_scoring_spike.py regenerates the gitignored real-data fixture from, i.e. load-bearing for TK-23's OWN AC4 CI path (missed by the builder's report, found by architect grep). Deleting the type without porting these ImportErrors trigger_sim + the fixture-regeneration path and regresses 3 green tests. Candidates: (a) expand TK-23 files_in_scope and migrate all consumers; (b) keep a ScoringParams shim until TK-27; (c) accept the regression, deferred to TK-27.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — files_in_scope normalization + a mechanical port; no locked decision/constitution/v1-scope/dep-graph change). RULED option (a), extended to ALL THREE consumers: TK-23 performs a MECHANICAL IDENTITY-PARAMS PORT of every remaining ScoringParams consumer — trigger_sim.py's score_day takes params, type RatingParams; test_trigger_sim.py and _build_scoring_fixture.py replace ScoringParams() with the identity RatingParams(urgency_base=0.0, urgency_gain=1.0, load_base=0.0, load_gain=1.0). Under identity params the hardened functions reproduce the spike raw scores EXACTLY (Q-42), so every ported call site is score-identical bitwise: the TK-26 recorded finding (thresholds 0.75/1.0/3 -> 0 voice + 1 flush/day on the real fixture) and the fixture builder's emitted labels remain the true record — the spike freeze's SUBSTANCE (the evidence) is untouched, only the params plumbing changes. SPIKE-FREEZE PRINCIPLE REFINED (coherent with DEC-24/DEC-25): the freeze forbids re-deriving/extending spike logic and forbids retrofitting spikes to consume production stores they predate (DEC-25 refused the tuner_sim OperatingParams retrofit — no compile break existed there); it does NOT mean leaving the tree broken when a frozen spike imports from a file Q-39 ruled to be hardened IN PLACE (gate/scoring.py is TK-23's production home, not a frozen artifact) — a mechanical type-port with proven score-identity is permitted maintenance, not a retrofit. REJECTED (b) shim/alias: a second params type in a production module recreates exactly the private-vocabulary drift Q-42/TK-41 exist to kill, leaves a dead weights-dataclass in a file the TK-13 AC4 guard scans, and creates a deletion chore parked on TK-27. REJECTED (c) accepted regression: red tests parked on the green baseline violates the runnable-check done-bar and would mask real TK-23 regressions in the same files. TK-23 files_in_scope += trigger_sim.py, test_trigger_sim.py, fixtures/_build_scoring_fixture.py. TK-27 note: when it hardens the trigger path it inherits call sites already speaking RatingParams — no migration debt.",
