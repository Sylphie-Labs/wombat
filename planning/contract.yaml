re-driven stage) is a NAMED CARRY-FORWARD to TK-149's briefing; TK-146 keys on it verbatim and proves idempotency on caller-supplied ids. TRANSITIONS (monotonic, terminal-absorbing): pending->dispatched (sets dispatched_at ONCE, COALESCE first-write-wins) and pending->cancelled (sets cancelled_at ONCE) are the ONLY legal transitions; DISPATCHED/CANCELLED/BLOCKED are absorbing; re-applying the SAME terminal transition = idempotent no-op returning ALREADY_APPLIED (timestamps NOT overwritten); any OTHER transition (regress, cross-terminal, anything from BLOCKED) raises TrailTransitionError LOUDLY. WRITER = single-statement SQL only (insert = INSERT .. ON CONFLICT (action_id) DO NOTHING returning INSERTED|ALREADY_PRESENT; transition = ONE guarded UPDATE with the status predicate in the WHERE clause + COALESCE timestamps; no Python read-modify-write) so a cog-worx Wait/Sweeper re-drive that re-invokes any call site cannot double-apply or regress. REFUSALS: record_refusal(...) inserts a TERMINAL row status=BLOCKED at insert time (action_type=BLOCKED_BY_TAINT) — never transitions; refusals are NOT rendered-as-cancelled (CON-4 audit honesty: structurally refused is distinct from human-rejected); TK-147's rendering of BLOCKED rows is a named carry-forward to TK-147's briefing. TIMESTAMPS caller-supplied aware-UTC (stages pass ctx.clock(); the writer never reads a clock). TK-147 SEAM: TK-146 is WRITE-ONLY — no query surface; schema.py exports the typed contract (TrailRow frozen dataclass + the two enums + table/column-name constants) that TK-147's reader builds against instead of raw string literals. DSN injected (Q-46); nothing here is a tunable — no OperatingParams/TK-13-guard contact. NEW tests/trail/ dir gets __init__.py per the TK-15 packaging convention."
