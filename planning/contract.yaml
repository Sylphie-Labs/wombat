  - { id: Q-17, type: open_question, status: resolved, scope: EP-3, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "MEDIUM (C): presence is prototype-grade (TK-4) but the production gate (TK-27/28) leans on the presence hold as a structural guarantee",
      description: "TK-4 (presence) is engineering_level prototype and is the only presence ticket; TK-6 and the hardened gate treat the conservative-on-stale presence hold as load-bearing. No hardening ticket exists — the production gate's silence guarantee depends on prototype code.",
      resolution: "RESOLVED by architect (within authority — realizes RISK-3/CON-3; no DEC changed). Added TK-11 (Harden the presence hold, P1, production, EP-3): promotes TK-4's prototype to a production conservative-on-stale predicate presence_hold(snapshot) used by TK-6/TK-27, with property tests over the staleness/confidence boundary (unknown/stale/low-confidence => hold), and a pre-sleep-stale snapshot reads stale and holds. Single OS idle signal retained (DEC-6 upheld) — the hardening is the staleness/confidence CONTRACT + test rigor, not new sensors. Wired TK-27 depends_on TK-11. depends_on TK-4/TK-6.",
      links: ["TK-11","TK-4","TK-6","TK-27","RISK-3"] }
  - { id: Q-18, type: open_question, status: resolved, scope: EP-2, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "MEDIUM (D): cross-source item identity is undefined — outcome labels cannot cleanly bind to Gmail/calendar/task items",
      description: "TK-2 keys on idempotency_key, TK-72 dedups by event_id, TK-75 by message_id, outcome claims (TK-44/45/50) key on event_id. No unified identity, so outcome labels can't cleanly bind to Gmail items (message_id) or task items. The adaptive loop's signal binding is ambiguous.",
      resolution: "RESOLVED by architect (within authority — a convention + derivation ticket; no DEC changed). Added TK-12 (Canonical item identity, P1, production, EP-2): one idempotency_key = f(source_id, source_natural_id) derivation + an ItemRef carried on every QueueItem and propagated onto gate pending-set entries and the OUTCOME_* claim subject. Sources keep their natural ids (event_id/message_id); the ONE mapping unifies dedup (TK-2/72/75), gate identity (TK-21) and outcome binding (TK-45/50). source_id is part of the key so a calendar event and a Gmail message can't collide. Not entity-resolution. Wired TK-45 depends_on TK-12; TK-50 depends_on TK-12. depends_on TK-2.",
