    title: SPIKE — Urgency & Cognitive-Load scoring vs human labels (RISK-1)
    intent: As a wombat dev, I validate that urgency() and cognitive_load() pure functions produce surface/hold decisions that agree with human labels on a held-out fixture of real calendar/Gmail events before hardening — the product thesis rides on this (RISK-1).
    status: done
    priority: P1
    estimate: M
    engineering_level: prototype
    complexity_budget: "Pure functions + labeled fixture + scoring loop; no integration, no DB, no cog-worx wiring. FIXTURE PROVENANCE (DEC-24/Q-38): the >=40-event fixture is seeded from REAL Gmail/Calendar via the connected MCP tools as a one-time LOCAL pull into a throwaway, GITIGNORED, de-identified YAML (NG-7 storage-residency honored — local read, no egress). HUMAN LABEL (DEC-24): a documented PROXY RUBRIC derived from vision.md's gate (relevance AND importance AND user-state AND confidence; quiet-by-default => default-hold) pre-labels each event; Jim does a small one-time confirmatory pass, not from-scratch labeling. The rubric file is part of this spike's deliverable. RUN-ORDER (DEC-24): runs after the leaf TK-21; TK-24/TK-48 are the pure-code spikes that run first."
    poc:
      question: Do urgency() and cognitive_load(), with plausible user-model params, classify >=80% of held-out calendar/Gmail events consistently with a human rater's surface/hold label?
      hypothesis: A small set of heuristic features (time-to-event, sender priority, meeting density, thread depth) reaches >=80% agreement on a 40-item fixture; disagreements cluster on ambiguous cases, not systematic errors.
      status: resolved
      result: "ARCHITECTURE PROVEN, CALIBRATION DEFERRED 2026-06-21 (DEF-1; 5 tests green, ruff+mypy --strict clean). Built src/wombat/gate/scoring.py - pure model-free urgency()/cognitive_load() over the four features (time-to-event, sender-priority class, meeting density, thread depth) + a hard-coded ScoringParams stand-in (no read seam; TK-23 adds UserModel.ratings_for). Presence stays OUT of scoring by design (Q-12). FIXTURE - a one-time LOCAL MCP pull of real Gmail+Calendar SUCCEEDED (metadata/features only, de-identified, gitignored scoring_fixture.real.yaml) - 30 calendar events + 33 Gmail threads. Agreement vs the vision-derived PROXY rubric is high with NO systematic error - the deterministic-scoring ARCHITECTURE is de-risked enough to build the production gate (TK-23/25/27). DISPOSITION (architect 2026-06-21): ACCEPT the proxy proof as sufficient-to-proceed; DEFER the scoring-vs-Jim's-own-judgment calibration to DEF-1 (revisit_trigger: first real brief session with VIP/known-human mail), because the real inbox window held zero VIP/known-human mail so a confirmatory pass cannot sample the target population yet. The operating constants are PROVISIONAL in TK-13 (Q-40); a relabel revises a YAML value, not code. RISK-1 -> mitigated (not retired). Build is UNBLOCKED."
    acceptance_criteria:
      - given: A fixture of >=40 calendar/Gmail events, each hand-labeled surface or hold by the human rater
        when: urgency() and cognitive_load() run over the fixture
        then: Agreement on surface/hold classification is >=80% against the human labels; all disagreements are logged to a fixture-report file.
      - given: The scoring functions
        when: unit tests run
        then: Both functions are pure (no I/O, no model calls, no side effects) — verified by a no-import-of-requests/httpx assertion.
      - given: The fixture-report file
        when: reviewed
        then: A written note identifies whether failures are systematic vs ambiguous and proposes one concrete change for any systematic pattern.
    non_goals:
      - No production-quality scoring — prototype only.
      - No user-model read seam (use a hard-coded params dict for the spike).
      - No cog-worx integration.
      - No tuning loop (TK-49/EP-14).
      - Presence is OUT of the scoring functions by design (Q-12, DEC-13). urgency()/cognitive_load() are pure over item fields + RatingParams ONLY; presence is a SEPARATE gate-level hold applied AFTER scoring (TK-6 holds on stale/unknown presence). So the >=80% human-agreement thesis is validated on scoring alone, and presence cannot invalidate it because it never enters the score — it only suppresses surfacing downstream. The fixture deliberately does not feed presence into scoring.
    depends_on:
