  - id: TK-7
    kind: ticket
    parent: EP-4
    title: ReviewOrSpeak Stage — branch on canonical GateAction; surfaced items go to the Compose dispatch router
    intent: As the drain pathway, I receive a GateDecision and either hand a surfaced item to the Compose dispatch router (TK-10, which picks the right composer by item_kind) or journal a Hold, so the pathway completes a full observable drain cycle end-to-end (DEC-14) and is correctly wired once the production gate (TK-27) replaces the stub (ISS-4/ISS-5).
    status: done
    priority: P1
    estimate: S
    engineering_level: mvp
    complexity_budget: "One ReviewOrSpeakStage branching on the canonical GateAction enum (TK-21/ISS-4), per the Q-52 rulings. (1) AC2 JOURNAL RECONCILIATION: the stage NEVER writes the journal (Q-47) — on hold it returns terminal Done(output=Artifact(kind='wombat.hold_report', produced_by='review_or_speak', data={'holds': [{item_id, item_kind, reason, urgency, load}...]})); the ENGINE journals every StageResult BEFORE advancing (verified S6 semantics), so the hold reason IS durably journaled without a direct write — that satisfies AC2. Stub reason string derives from the scored entry (e.g. 'urgency=0.10 load=0.20 below surface bar'); scores MAY appear here (the journal is the internal audit record — this is NOT the mouth wire; CON-1 is enforced downstream at TK-10's compose_request boundary). hold_report_to/from_artifact_data helpers in stages/artifacts.py (JSON-native + dumps regression, Q-49). (2) TWO EXITS, ONE RESULT: a 1-item batch (the Q-51 composition rule batch_size=1) is EITHER one hold -> Done(wombat.hold_report) OR one surface -> ack + Transition(to='compose_dispatch', output=wombat.surfaced_item built via TK-10's surfaced_item_to_artifact_data). The MIXED batch (holds + surface in one result) is STRUCTURALLY UNREACHABLE at batch_size=1 — this is now load-bearing, since one StageResult carries one artifact; DEFENSIVE if a >1 batch ever arrives: ack every entry, forward the FIRST surfaced via the normal Transition, and emit LOUD logger warnings naming every non-forwarded item_id (holds and surplus surfaced alike — logged, never silent, never lease-stranded); bounded mvp defect mode superseded at TK-27 (PendingSet custody + consolidated flush). (3) ACK: BOTH branches ack inside run() BEFORE returning (decide -> ack -> return); forward=disposed is safe because Q-50 compose NEVER fails; the ack-before-engine-journal crash window is ACCEPTED at stub custody because both failure modes degrade toward SILENCE (a crash-straddled hold loses only its journal reason; a crash-straddled surfaced item is a missed surface, never a double-surface — post-ack redelivery is impossible, and ack is idempotent so pre-ack redelivery re-decides safely); revisited at TK-27 durable custody. (4) QUEUE INJECTION (ASMP-2): ReviewOrSpeakStage(*, queue: WombatQueue) — the SAME single instance as DrainQueueStage, passed by the composition root; ctx surface = last_output('gate') + clock only. (5) E2E HARNESS (tests/integration/test_drain_pathway_e2e.py — the demo skeleton the real harness extends): a REAL cog-worx Engine over cold_boot_bundle (InMemoryJournal) + build_drain_pathway(drain_queue, gate, review_or_speak, compose_dispatch, compose) + ONE real WombatQueue on docker pg, WOMBAT_TEST_PG_DSN-gated (Q-46; the verifier RUNS it); REAL ComposeStage with a deterministic FakeModel registered via the ModelRegistry factory (no network) + a degrade variant where the fake model raises -> degraded=True template (proving the keyless demo path); assertions: queue empty (acked), the InMemoryJournal contains the run's StageResults incl. wombat.composed_output (hold variant: wombat.hold_report), router Transitioned once, and a second drive on the empty queue parks Wait (the idle loop). This Stage does NOT pick a composer or call the mouth — kind-routing is TK-10's job (ISS-5). SANCTIONED CROSS-TICKET RIDER (Q-53, v0.51): TK-7's real-Engine e2e caught a REAL defect in done TK-5 — DrainQueueStage.transitions=('gate',) omits the Wait-to-self edge, so the runtime declared-route guard raises StageGraphError on the idle path (empty queue -> Wait(to='drain_queue')); FIX folded into THIS build: transitions=('gate','drain_queue') + the pinned test assertion update in tests/unit/test_drain_queue_stage.py + flip the idle e2e xfail(strict) to a real pass; src/wombat/stages/drain_queue.py + its test are in this ticket's scope for that fix only. CONVENTION (Q-53, spine-wide): a stage's transitions tuple MUST declare EVERY StageResult destination it can return — including Wait-to-self re-park edges; and any stage with a Wait/self-park branch needs at least one real-Engine/StageGraph route check, because stage-level fakes never exercise the graph guard (TK-11/TK-27 inherit)."
    acceptance_criteria:
      - given: GateDecision(action=GateAction.surface_immediate OR surface_flush) arrives (canonical enum, ISS-4)
        when: the Stage runs
        then: the ComposeDispatchRouter (TK-10) is invoked with the decision artifact (verified by a stub router mock); ReviewOrSpeak itself contains NO branch on item_kind and NO direct reference to any concrete composer (ISS-5 — routing is delegated to TK-10).
      - given: GateDecision(action=GateAction.hold) arrives
        when: the Stage runs
        then: the item is acknowledged in WombatQueue (removed) and the hold reason is written to the cog-worx journal.
      - given: an end-to-end drain pathway run with one surface-destined generic item
        when: the pathway completes one cycle
        then: the queue is empty, the ComposeDispatchRouter stub was called once, and the journal has an entry for the run.
    non_goals:
      - Does not implement voice/TTS output — EP-30.
      - Does not implement the morning brief — FEAT-7.
      - Does not implement AwaitHuman review flow — FEAT-11/DEC-19.
      - Does not pick which composer runs — that is the dispatch router (TK-10/ISS-5).
    depends_on:
