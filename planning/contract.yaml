  - id: TK-150
    kind: ticket
    parent: EP-28
    title: Local-residency assertion — no user data persisted off-host (ASMP-1 boundary)
    intent: As the privacy posture of wombat (structural), all user data MUST be persisted only to the local Postgres/Neo4j store; no storage write may target a remote endpoint. The one accepted egress exception (ASMP-1) is the DeepSeek phrasing call — user content may leave the host for phrasing — but phrasing payloads must not be persisted remotely. This harness asserts the storage boundary is structurally enforced (NG-7/CON-7/ASMP-1).
    status: todo
    priority: P1
    estimate: S
    engineering_level: production
    complexity_budget: "One pytest fixture intercepting all DB writes + HTTP calls; one integration test per data class (user model, journal, action trail, email metadata, calendar events). No new persistence code — asserts existing write paths comply. RESIDENCY DEFINITION (Q-25/E): the guard checks SAME-HOST residency, NOT literally the string 'localhost'. The check is an explicit allowlist of same-host resolutions — loopback (127.0.0.0/8, ::1), the literal 'localhost', a unix-domain socket path, a configured Docker-bridge/service host that resolves to a same-host container network, and any interface address that belongs to THIS host — with the rule expressed as 'the resolved peer is on this host'. A LAN/0.0.0.0-bound address that resolves to a DIFFERENT host fails. This avoids both the false-positive (a same-host non-localhost peer wrongly blocked) and false-negative (a remote host wrongly allowed) the naive 'must equal localhost' check would produce."
    acceptance_criteria:
      - given: the full wombat integration runs against fixture inputs (email metadata, calendar event, user-model observation, trail row)
        when: all persistence paths execute
        then: "no write call targets an off-host endpoint (the interceptor asserts every sqlalchemy/psycopg/neo4j write resolves to a SAME-HOST peer per the residency allowlist — loopback, the literal localhost, a unix socket, or a same-host container/bridge address — NOT merely the literal string 'localhost'; any peer that resolves to a different host raises AssertionError). A table-driven test covers loopback, unix-socket, Docker-bridge-to-self (PASS) and a LAN address on another host (FAIL), so the guard neither false-positives on same-host non-localhost peers nor false-negatives on remote hosts (Q-25)."
      - given: a Compose Stage calls the DeepSeek API (ASMP-1 phrasing call)
        when: the HTTP call is intercepted
        then: the call is allowed (the one accepted egress exception); but the response content is NOT written to any remote endpoint — only to the local journal/trail. Test asserts exactly one outbound call to the DeepSeek base_url and zero writes to any other remote host.
      - given: the wombat config is mutated to point the Postgres URL at a host that resolves OFF this host (adversarial config test)
        when: wombat starts
        then: a startup assertion (LocalResidencyGuard.check(), using the same-host residency rule, Q-25) raises RemoteStorageConfigError and wombat refuses to start; the error names the offending config key. A companion case asserts a same-host non-localhost peer (e.g. a Docker-bridge service name resolving to this host) is ACCEPTED — the guard is host-residency, not a localhost string match.
      - given: the Gmail OAuth tokens are stored post-auth
        when: the OAuth token write completes
        then: tokens are written to the local credential store only; no token material is sent to a remote endpoint (interceptor asserts zero outbound HTTP calls containing the token string).
    non_goals:
      - No enforcement of TLS/encryption in transit for the phrasing call — ASMP-1 is a data-residency exception, not a transport-security ticket.
      - No audit of DeepSeek's server-side data retention — ASMP-1 accepts the phrasing call as a v1 tradeoff.
      - No enforcement of local-residency for the wombat/memory dev-tooling pipeline (DEC-11) — out of product scope.
    depends_on:
      - EP-1
      - EP-15
      - EP-17
    files_in_scope:
      - src/wombat/safety/local_residency.py
      - src/wombat/config.py
      - tests/safety/test_local_residency.py
  - id: TK-151
    kind: ticket
    parent: EP-28
    title: External-tier admission policy — bind allowed_tiers={read,write,external} to the approved AwaitHuman dispatch stages only
    intent: As wombat's safety wiring, I bind a Stage policy that admits the cog-worx external capability tier to ONLY the three approved-and-reviewed dispatch stages (Gmail draft-create TK-78, browser form-submit TK-135, browser navigate/read TK-131/133) so those stages can actually dispatch their external Capability instead of being refused with TierViolation — while every other Stage keeps the default {read,write} and external stays opt-in (DEC-20, DEC-22, Q-10). The planning authorization for this admission is GRANTED (DEC-22); the ONLY remaining gate is the BUILD-TIME operational enablement of the cog-worx external-tier flag in runtime/deploy config, which this ticket performs/wires as part of bring-up. The admission is bounded to stages that already sit behind AwaitHuman + the taint boundary (DEC-19), so widening the tier does not widen unattended reach.
    status: todo
    priority: P1
    engineering_level: production
    estimate: S
    complexity_budget: "BINDING-LOCATION FIX (Q-32) — cog-worx binds tier policy PER-STAGE via getattr(stage,'tool_policy',None); there is NO composition-root stage->policy registry, so this ticket OWNS the external-admitting StageToolPolicy(allowed_tiers={read,write,external}) + a binding helper in src/wombat/safety/tier_policy.py that sets that policy on each named dispatch stage's tool_policy attribute (the attachment happens where the stage is constructed — TK-78/131/133/135 — via this helper, NOT a bootstrap.py registry the seam doesn't support). FAIL-CLOSED FIX (Q-32) — there is NO separate cog-worx 'external-tier flag'; fail-closed is STRUCTURAL, a stage that does not carry 'external' in its allowed_tiers is refused with TierViolation automatically, and external admission is OFF unless this helper is explicitly applied to a stage (no global switch, no runtime self-grant). LEGACY-NOTE perDEC-20/DEC-22: a Stage-scoped allowed_tiers={read,write,external} attached to exactly the named dispatch stages; no global default change (engine default stays {read,write}). Asserts the negative case: a non-dispatch Stage invoking an external Capability is refused. No new cog-worx machinery — wombat configures the existing tier policy. The planning authorization is GRANTED (DEC-22); the 'build-time enablement' is realized structurally (see the FAIL-CLOSED FIX above — external admission is OFF unless the binding helper is applied to a stage; no separate flag artifact, no runtime self-grant)."
    acceptance_criteria:
      - given: the binding helper attaches the external-admitting StageToolPolicy to a dispatch stage carrying a registered external gmail.drafts.create Capability (a stub stage in this ticket's test; the real DraftComposer is TK-78, which CONSUMES this helper — so TK-151 is not a hard dep of TK-78, avoiding the inversion)
        when: that stage invokes gmail.drafts.create (external tier) in a fresh untainted drive
        then: the call is admitted (no TierViolation) and proceeds to the AwaitHuman gate (DEC-19) — the external Capability is reachable exactly where it must be.
      - given: any Stage NOT in the approved dispatch set (e.g. a gather or gate stage)
        when: it attempts to invoke an external-tier Capability
        then: cog-worx refuses with TierViolation — external admission is Stage-scoped, never global (Q-10 negative test; the engine default remains {read,write}).
      - given: the external-admitting binding helper has NOT been applied to a dispatch stage (the structural fail-closed default — no stage carries 'external' in allowed_tiers, Q-32)
        when: that dispatch stage attempts the external call
        then: the call is refused with TierViolation (fail-closed is STRUCTURAL — an unbound stage simply lacks 'external' in allowed_tiers, no separate flag artifact, Q-32) — proving the wiring never silently self-grants the tier. The planning authorization is already granted(DEC-22) — applying the binding helper to the named stage IS the bring-up step this ticket performs (no phantom flag).
      - given: a tainted ingest drive (TK-75) that has read an untrusted email body
        when: it attempts an external-tier call even though the policy names the stage
        then: the taint latch still drops the external Capability (DEC-19/ISS-3) — admission policy does not override the taint boundary; both gates must pass.
    non_goals:
