      resolution: "RESOLVED by architect 2026-07-03 (within authority - dep narrowing + HOW rulings inside the locked DEC-6/DEC-7/DEC-16/DEC-21 frame and v1 scope; no locked item changed; the DEC-6/DEC-7 escalation boundary was CHECKED and NOT HIT - see ruling 1). SEAMS VERIFIED AS-BUILT (cogworx runtime/engine.py _drive + module doc, loop/stage.py StageContext Protocol, stages/brief_compose_stage.py, stages/compose.py terminal precedent, stages/artifacts.py, config.py, params.py, bootstrap.py factories). (1) EP-30 OVER-PULL NARROWED - the last Q-56 parked-to-frontier item on the built path. EP-30 is entirely UNBUILT (TK-164/TK-165 todo, no sinks/ package exists) and dragging the epic would block the v1 wedge payoff behind a P2 TTS build. depends_on EP-30 DROPPED; deps = TK-100 only. The dependency narrows to an INJECTED SPEAK-SINK SEAM: ctor voice_enabled bool + speak Callable[[str], None] | None (default None). voice_enabled=True + speak wired -> speak(BriefText.text) EXACTLY ONCE, verbatim, no words added (AC2, tested with a capturing fake); True + speak None -> warning log + text-only, never raises (AC3 - the ticket's own first-class degrade); False -> no speak, no warning; a RAISING speak -> broad except -> warning, text delivery stands (text is the durable delivery; voice is additive, mirroring TK-164's own Degraded posture). ESCALATION BOUNDARY CHECKED: this does NOT defer voice delivery out of v1 - EP-30/TK-164 remains in plan and, when built, composition binds its TTS-adapter-backed callable into THIS seam via the ruling-3 factory; DEC-7 (voice in v1) and the DEC-6 wedge stand untouched. Q-56 is now FULLY discharged on the built path (remaining parked over-pulls TK-77->EP-13 and TK-96->EP-17/EP-30 still rule at their own frontiers). (2) AC4 IDEMPOTENCY MECHANISM - verified against the as-built engine: _drive reads journal.read_step(run_id, seq); a COMMITTED step replays its result WITHOUT re-entering run() (S6), but in AC4's exact crash window (file appended, commit_step never reached) the step is UNCOMMITTED and resume RE-ENTERS run() - the engine's own module doc states the side effect is NOT protected. ctx.last_output('brief_deliver') is None in that window (nothing committed), so the engine-short-circuit reading of AC4 is FALSE as-built and the read-own-completion reading is UNBUILDABLE for this window. THE RULED MECHANISM: run_id-keyed FILE-MARKER idempotency. The appended header line embeds the delivery key run=<ctx.run_id>; run() FIRST scans the sink file (if it exists) for that key; FOUND -> skip file append + stdout echo + speak entirely, log info (crash-replay detected), return the same terminal Done with replay=true - replay re-journals the completion rather than re-writing, AC4's exact sentence. SEAM CORRECTION on the record (Q-39 honesty precedent): StageContext exposes run_id but NOT step_index - AC4's parenthetical is half-wrong as-built; run_id-only keying is SOUND because the linear brief pathway visits brief_deliver in exactly one Done-terminal position per run (no cycles - a second run() entry for the same run_id IS the crash-replay case), while a different run_id (tomorrow's brief) appends normally; tested both ways. CONVENTION RECONCILED: the stage NEVER touches ctx.journal - the TK-98/99/100 convention HOLDS with NO sanctioned exception; AC1's 'recorded in the journal before the stage returns' is discharged by the returned Done(Artifact) committed by the engine's commit-before-advance (S6) immediately on return - a direct in-run journal write would NOT close the crash window any better (a crash can still fall between that write and the commit) and would break the convention for nothing. (3) SINK + CONFIG - ctor sink_path Path + tz ZoneInfo (TK-99/TK-100 injected-zone precedent; composition passes the canonical DEC-21 zone). Append format: ONE header line '=== wombat morning brief | <local ts> | run=<run_id> ===' with local ts = ctx.clock().astimezone(tz) formatted %Y-%m-%d %H:%M %Z (the DEC-21/Q-15 fix, never bare UTC) + BriefText verbatim + trailing blank line; utf-8 plain append (mvp - no fsync/lock; ASMP-2 single-process). ORDER: idempotency scan -> file append -> stdout echo (print of the same header+text - a delivery sink, not logging) -> speak -> Done. A sink WRITE failure RAISES LOUD - unlike the mouth there is no degrade target below 'the brief was received'; nothing commits, resume re-runs, marker absent -> the append retries (self-healing). CONFIG OWNERSHIP RULED: WombatConfig gains two OPTIONAL env fields (TK-71/Q-57 optional-env precedent, NOT in REQUIRED_ENV; OperatingParams REJECTED - a host filesystem path and a host capability toggle are deployment config, not versioned tunables): wombat_brief_path str|None (WOMBAT_BRIEF_PATH) and wombat_voice_enabled bool default False (WOMBAT_VOICE_ENABLED). NEW bootstrap.build_brief_deliver_stage(*, config, tz=UTC, speak=None) mirroring build_brief_compose_stage (the Q-69/Q-77 structural-wiring lesson): missing/blank wombat_brief_path -> ConfigurationError at construction (TK-8 AC3 precedent); voice_enabled = config.wombat_voice_enabled; TK-96/TK-97 MUST assemble via this factory, never hand-rolled. (4) STAGE SHAPE - name='brief_deliver' (TK-100's frozen transition target); transitions=() TERMINAL (the drain ComposeStage precedent - this stage ENDS the brief pathway); returns Done(output=Artifact(kind=BRIEF_DELIVERED='wombat.brief_delivered', produced_by='brief_deliver', Provenance(source='system', confidence=1.0, recorded_at=ctx.clock()), data=brief_delivered_to_artifact_data(...))); wire data = {'delivered_at' ISO-8601 tz-local aware string, 'voice_spoken' bool, 'replay' bool} (on a replay-skip voice_spoken=false + replay=true - honest about THIS invocation); helpers brief_delivered_to/from_artifact_data added to stages/artifacts.py (Q-47 kinds-defined-once). INPUT: await ctx.last_output('brief_compose') (None -> RuntimeError, the compose.py idiom), unpacked via brief_text_from_artifact_data - never hand-parsed. ctx surface = last_output + clock + run_id attr ONLY; never ctx.journal; NO model call (CON-2 - the mouth already spoke at TK-100; the no-second-brief intent is structural: this stage renders nothing); no StageToolPolicy (DEC-26). (5) TESTS - tests/stages/test_brief_deliver_stage.py on the Q-47 stage_context_fake, tmp_path sinks, all in-memory, no DSN gating: AC1 append + header carries an INJECTED non-UTC zone (e.g. America/New_York; assert the rendered zone/offset, catching a bare-UTC regression) + the returned Done carries the delivery record; AC2 capturing fake speak called exactly once with EXACTLY BriefText.text; AC3 True/None -> file written + warning + no raise, False -> no speak no warning, raising speak -> no raise + delivery stands; AC4 run() called TWICE on the same ctx (same run_id - the engine re-entry simulation) -> file contains exactly ONE entry and the second Done carries replay=true, plus a different-run_id control appending a second entry; sink-write-failure raises; stdout echo via capsys; no-journal-touch spy (the TK-98 pattern); factory tests (blank/missing WOMBAT_BRIEF_PATH -> ConfigurationError; wired fields land on the stage). TK-101 amended: depends_on [EP-30, TK-100] -> [TK-100]; files_in_scope 1 -> 4 (+stages/artifacts.py, +config.py, +bootstrap.py); estimate S -> M (idempotency mechanism + factory + config + wire helpers + the AC battery, the TK-100 precedent); complexity_budget Q-78 riders. TK-101 is BUILD-READY.",
