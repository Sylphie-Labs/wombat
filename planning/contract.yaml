        then: all non-voice functionality operates normally; no import error, no missing-component error, no degraded mode triggered by missing ASR.
      - given: the ASR listener is registered
        when: SourceRegistry.list_sources() is called
        then: '''asr'' appears alongside any other registered source ids; no conditional logic distinguishes it.'
    non_goals:
