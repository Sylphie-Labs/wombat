  - { id: Q-34, type: open_question, status: resolved, scope: EP-10, date_raised: "2026-06-21", date_updated: "2026-06-21", title: "seam-miss cluster (e): RecallStack is a ranked-recall engine, not a deterministic point-read — TK-42/112/44/45/49 need a different seam",
      description: "Audit seam-misses: TK-42 names RecallStack/S5 for a deterministic point-read (RecallStack is ranked RRF recall->FusedResult; a fuzzy recall violates NG-4); real seam is ScopedKG (knowledge.scoped_kg.user_model) / EntityKG.claims_about(scope=user:<id>). TK-42/TK-44 never named the EntityKG/ScopeRegistry/ScopeWriteToken injection. TK-112 AC2 misused ratings_for() to read a WindowSummary. TK-45 AC6 put a 7-day outcome query on the labeler (the tuner's read) + needed a supersede write surface. TK-49 clamp bounds came from a spike that persists nothing.",
