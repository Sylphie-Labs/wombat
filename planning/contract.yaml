      links: ["TK-42","TK-44","TK-45","TK-49","TK-112","TK-13"] }
  - { id: Q-35, type: open_question, status: resolved, scope: project, date_raised: "2026-06-21", date_updated: "2026-06-21", title: "BACKLOG HOME: the 68 HIGH + 82 MEDIUM frontier-audit findings are triaged JUST-IN-TIME at the build frontier, not resolved up-front",
