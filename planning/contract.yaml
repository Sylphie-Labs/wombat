      - src/wombat/compose/templates.py
      - src/wombat/stages/artifacts.py
      - tests/support/stage_context_fake.py
      - tests/unit/test_compose_stage.py
  - id: TK-9
    kind: ticket
    parent: EP-5
    title: Two-layer mouth budget — per-drive BudgetGuard + wombat-owned durable daily-spend ledger
    intent: As wombat, I bound mouth spend on TWO layers — cog-worx's per-drive-segment BudgetGuard (free, structural, S11) AND a wombat-owned durable daily-spend ledger (Postgres, load-on-start) that enforces a per-day cumulative token/cost ceiling across drives and restarts — so daily spend is capped and exhaustion degrades to the terse template rather than erroring (DEC-18, CST-3).
    status: done
    priority: P1
    estimate: M
    engineering_level: mvp
    complexity_budget: "Two layers. (1) Wire a cog-worx BudgetPolicy into TK-1's root so each ComposeStage drive gets a per-segment BudgetGuard (cog-worx owns this; per-DRIVE-SEGMENT, in-memory, resets per segment — cumulative-per-run is CF-3.0-B/deferred, so it CANNOT enforce a daily cap). (2) A small wombat-owned DailySpendLedger; ComposeStage reads today's running total before calling the model and records spend after. No changes to cog-worx BudgetPolicy internals. Q-68 BUILD RULINGS (2026-07-03; ALL SEAMS VERIFIED against the installed cogworx — cost/budget.py, model/guarded.py, model/registry.py, runtime/engine.py): (a) VERIFIED — BudgetPolicy(max_usd_per_drive, max_calls_per_drive).new_guard() minted PER DRIVE by the engine (engine.py:143-144 assemble(profile, guard=guard)); GuardedModel wraps complete() with guard.start_call() pre-call (raises BudgetExceededError — the REAL name; as-built compose.py already catches it) and guard.record(response.usage) post-success; CF-3.0-B deferred claim CONFIRMED verbatim; the Q-50 zero-compose-change promise for layer 1 HOLDS — layer 1 is pure config (bootstrap BudgetPolicy() currently unbounded -> pass real ceilings). (b) TOKEN SOURCE OF TRUTH: ModelResponse.usage: Usage{prompt_tokens, completion_tokens, cost_usd, latency_ms}; daily spend = prompt+completion tokens. (c) NO NEW TABLE, NO MIGRATION 002 — the 002 reservation is RELEASED: DailySpendLedger is a THIN WRAPPER (cost/daily_spend_ledger.py) over the as-built TK-152 shared DailyLedger (whose docstring names TK-9 spend as a designed consumer), ledger_name 'spend:tokens', value = cumulative tokens (BIGINT fits; the original date/tokens_spent/cost_usd own-table wording is SUPERSEDED — the daily cap is TOKEN-denominated per the ACs; per-call USD ceilings remain layer 1's); load-on-start/restart/day-boundary semantics are TK-152-proven by construction. (d) COMPOSE INTERACTION: ComposeStage gains an injected spend_ledger + daily_token_ceiling; PRE-CALL check — at/over cei