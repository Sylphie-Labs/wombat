    acceptance_criteria:
      - given: "A GateItem and a RatingParams previously awaited from UserModel.ratings_for(item) by the async caller (Q-41 — ratings_for is async; the sync gate ScoreFns receive already-awaited params)"
        when: "urgency(item, params) or cognitive_load(item, params) is called"
        then: "Returns a float in [0.0,1.0] computed per the Q-42 composition (clamp01(base + gain * raw_signal)) as a PURE DETERMINISTIC function of the item's payload fields and the RatingParams — no I/O, no model call, no randomness, no presence signal, no clock read (seconds_to_event arrives precomputed in the payload; the function never calls time.time()), no mutable module state. The FROZEN module-level heuristic constants (term weights, horizon, saturations, sender-priority table) are part of the function's DEFINITION, not a third input — 'solely' is a purity clause, not a no-named-constants clause (Q-42)."
      - given: "Two GateItems identical except time-to-event (one <30 min, one >4 h), scored with the same RatingParams where urgency_gain > 0 and urgency_base + W_SENDER*urgency_gain < 1.0 (every documented per-class default and the entire TK-13 tuner clamp band satisfy this — a >4h item has zero time pressure so its raw signal is at most W_SENDER=0.45 and never saturates the clamp; worst band case 0.65 + 0.45*0.65 = 0.9425)"
        when: "urgency() runs on both"
        then: "The near-term item scores strictly higher. gain=0 is type-legal but degenerate (the class score flattens to its base — a fully muted class); the strict-monotonicity guarantee is documented in the module as holding whenever gain > 0 and the far item is below the 1.0 clamp (Q-42)."
      - given: "A GateItem whose payload is missing any or all expected scoring keys (is_timed, seconds_to_event, sender_class, meeting_density, thread_depth), or carries a present-but-invalid value (e.g. an unknown sender_class string or a non-numeric density)"
