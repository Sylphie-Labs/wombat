    title: SPIKE — Simulate N nights of outcomes; prove RatingTuner bounded stability (RISK-4)
    intent: As a developer, run a prototype simulation of N consecutive nightly tuning passes over a synthetic outcome corpus and prove that bounded deltas + floor/ceiling constraints keep surfacings/day inside the hard ceiling and prevent oscillation/drift, before any production tuner is written (RISK-4).
    status: done
    priority: P1
    estimate: L
    engineering_level: prototype
    complexity_budget: Standalone simulation script (no cog-worx I/O); synthetic outcome generator; naive proportional tuner stub; assertion harness for stability proofs. Produces a numeric report. Pure de-risk.
    poc:
      question: Are RatingTuner parameter updates provably bounded, and do floor/ceiling clamps prevent loud/mute drift over N nights of synthetic outcomes (including all-IGNORED and all-LOAD_BEARING pathological runs)?
      hypothesis: A proportional tuner with per-night delta bound + floor/ceiling clamps keeps surfacings/day inside the ceiling and converges (parameter variance < threshold after N/2 nights); removing the clamps breaks at least one stability assertion.
      status: resolved
      result: "PROVEN 2026-06-21 (20 tests green, ruff+mypy --strict clean; run python -m wombat.rating.tuner_sim). Over N=30 synthetic nights incl. all-IGNORED and all-LOAD_BEARING pathological runs, a proportional tuner (delta=gain*net_outcome) with per-night delta-bound 0.05 + floor/ceiling clamps holds all four stability assertions - bounded delta/night, no clamp breach, surfacings/day never above the hard ceiling 12.0, and back-half (post N/2) parameter variance < 1e-3 (converged). Ablation - removing both clamps on the all-LOAD_BEARING run breaks ALL FOUR assertions, so the clamps are load-bearing. KEY FINDING for TK-13/TK-49 - floor/ceiling clamps alone do NOT bound the surfacing RATE; the band must be chosen jointly with surfacing sensitivity. Recommended operating constants - urgency/load band [0.35,0.65], delta_bound 0.05, gain 0.20 (worst-case clamped rate lands exactly at the 12.0/day ceiling). RISK-4 retired."
    acceptance_criteria:
      - given: the spike simulation runs with N=30 nights of synthetic outcomes (incl. all-IGNORED and all-LOAD_BEARING runs)
        when: all stability assertions execute
        then: max delta per night <= the configured bound; no param crosses floor/ceiling; surfacings/day never exceeds the hard ceiling; parameter variance < threshold after N/2 nights; a numeric stability report is printed.
      - given: the floor/ceiling clamps are removed from the simulation
        when: the same N=30 run executes
        then: at least one stability assertion fails — proving the clamps are load-bearing (ablation test).
    non_goals:
      - No Neo4j or Postgres I/O in the spike.
      - No production tuner logic — prototype only.
      - No integration with DreamPathway yet.
    depends_on:
      - TK-41
    files_in_scope:
