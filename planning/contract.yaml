    intent: 'As the safety posture of wombat (structural), every outbound side-effectful action (Gmail draft creation, browser form submit, speak) MUST go through the two-step dispatch pattern: journal proposed action -> AwaitHuman approval -> dispatch_approved executes. No side effect may be dispatched without a prior explicit human approval token (CON-5/DEC-19/NG-5).'
