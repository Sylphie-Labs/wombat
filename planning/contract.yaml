  - id: TK-162
    kind: ticket
    parent: EP-29
    title: ASR listener Stage registered as an InputSource
    intent: As a user, I can speak a command and have it enter the queue as a QueueItem indistinguishable in processing from any other source's item — voice is additive, full capability exists without it (DEC-7, CON-3, FEAT-12).
    status: todo
    priority: P2
    estimate: M
    engineering_level: mvp
    complexity_budget: One Stage wrapping a local ASR library (choice is an open question). It listens on a push channel, maps each utterance to a QueueItem via the InputSource contract, and enqueues it like a calendar/Gmail source. No bespoke pipeline; registration wired in the composition root.
    acceptance_criteria:
