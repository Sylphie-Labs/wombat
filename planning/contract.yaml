ocabulary module — RATING_CLAIM_PREDICATE + to_claim_payload/params_from_claim_payload in rating/params.py, payload = JSON of {version, urgency_base, urgency_gain, load_base, load_gain}, entity = the EventClass value, newest active claim wins; TK-44/TK-49 MUST write through these helpers. No tuner logic, no write paths, no S7 write-token mint (pure read). CANONICAL TYPE HOME (v0.23 layout reconciliation): the returned RatingParams type is imported from src/wombat/rating/params.py (TK-41's as-built home), NOT user_model/rating_params.py."
    acceptance_criteria:
