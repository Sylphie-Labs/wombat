  - id: TK-24
    kind: ticket
    parent: EP-8
    title: SPIKE — Durable pending set exactly-once across restart (RISK-5)
    intent: As a wombat dev, I prove the durable pending set survives a mid-drain kill and resumes without double-counting or losing items, using the cog-worx journal as write-ahead authority (RISK-5, S6), before committing to the persistence design.
    status: done
    priority: P1
    estimate: M
    engineering_level: prototype
    complexity_budget: 'One integration scenario: enqueue -> partial drain -> kill -> restart -> assert counts. No production schema migration, no full pipeline wiring.'
    poc:
      question: Does a pending-set backed by the cog-worx journal achieve exactly-once add/remove semantics across a simulated mid-drain crash?
      hypothesis: Writing PendingSetAdd/PendingSetRemove claims to the journal before mutating in-memory state, then replaying on startup, gives exactly-once semantics with no additional locking.
      status: resolved
      result: "PROVEN 2026-06-21 (10 tests green, ruff+mypy clean). Built src/wombat/gate/pending_set.py as a write-ahead journal stub — deliberately NOT the cog-worx Journal (audit seam-miss TK-24: the real Journal is a positional step/run WAL with no PendingSetAdd/Remove), per this spike's non_goal. AC1 kill-after-2-surfaced leaves exactly 3; AC2 ten seeded random-kill runs all satisfy rebuilt_pending + surfaced == 5 with no loss and no duplication; AC3 rebuild_from_journal matches the pre-kill checkpoint. CONCLUSION: write-ahead (durable record BEFORE the in-memory mutation) plus idempotent set-replay yields exactly-once with NO locking — hypothesis holds. CARRY-FORWARD to TK-25: the production pending set must preserve write-ahead ordering and journal the bulk clear() the flush arm relies on."
    acceptance_criteria:
      - given: 5 items enqueued; drain begins and 2 items are surfaced (journal entries written)
        when: the process is killed after the 2nd journal write and restarted
        then: On resume, exactly 3 items remain in the pending set (the 2 surfaced do not re-appear).
      - given: The same scenario run 10 times with the kill injected at random points
        when: each run completes after restart
        then: In all 10 runs the final pending_set count + surfaced count == 5 (no loss, no duplication).
      - given: A replay of the journal on fresh startup
        when: pending_set.rebuild_from_journal() is called
        then: The result count is identical to the pre-kill checkpoint; no model call is made.
    non_goals:
      - No production Postgres schema — use an in-process journal stub emulating write-ahead.
      - No full gate pipeline wiring.
      - No surfacing-ledger integration (TK-25 hardens this).
    depends_on:
      - TK-21
    files_in_scope:
      - src/wombat/gate/pending_set.py
      - tests/gate/test_pending_set_spike.py
  - id: TK-25
    kind: ticket
    parent: EP-8
    title: Harden durable pending set + cumulative load aggregator
    intent: As a wombat dev, I need the production durable bounded pending set (journal-backed) with a cumulative cognitive-load aggregator so the gate can fire a consolidated flush when backlog burden crosses the Load threshold independent of any single item (DEC-13, RISK-5).
    status: done
    priority: P1
    estimate: M
    engineering_level: production
    complexity_budget: "Production pending set + aggregator, hardened IN PLACE from the TK-24 spike (Q-39 pattern); bounded capacity cap; plus the DURABLE JOURNALED clear/drain-all (audit gap — the flush arm TK-27 needs to clear the set after a surface_flush, and that clear MUST be journaled to stay exactly-once across a kill, RISK-5). PERSISTENCE SEAM (Q-44): cog-worx Journal cannot host PendingSet ops (the TK-24 seam-miss) and this is wombat-DOMAIN gate state, NOT a cog-worx Engine seam — it does NOT join SubstrateBundle. TK-25 defines a wombat-owned PendingJournal Protocol in pending_set.py — append(record) + replay() returning ordered records; records are frozen dataclasses PendingSetAdd (carrying the FULL ScoredItem fields so rebuild restores cumulative_load exactly), PendingSetRemove(item_id), and ONE atomic PendingSetClear — plus an InMemoryPendingJournal double. The REAL Postgres adapter is SPLIT to TK-29 (depends_on TK-2 for wombat's own pg conventions) so TK-25 stays CI-verifiable with zero infra while the semantics are proven substrate-independently through the Protocol. PendingSet(journal, max_pending) is constructor-injected: max_pending is TK-13 OperatingParams.max_pending (field ALREADY exists) supplied at composition time — no module literal, tests pass ints, no TK-13 guard conflict. clear() appends the single PendingSetClear record write-ahead THEN wipes memory (one commit point = exactly-once bulk drain: a kill lands strictly before-append = nothing cleared, or after-append = fully cleared) and returns the drained tuple of ScoredItems for the TK-27 flush arm. CAPACITY EVICTION: add() at capacity evicts the lowest-urgency item (journaled as PendingSetRemove, write-ahead) and RETURNS a CapacityEviction frozen dataclass — defined in pending_set.py, mirroring how Gate.decay() RETURNS DecayEvents; TK-21's canonical models.py is NOT touched. MODULE SPLIT: aggregator.py = PURE stateless math over an iterable of ScoredItems (cumulative_load exact float sum; lowest-urgency selection used by eviction); pending_set.py = the durable stateful set (add/remove/clear/list/rebuild_from_journal + write-ahead journaling) whose cumulative_load() method delegates to the aggregator over its snapshot. KILL TESTS (AC2/AC4) run in CI against the in-memory double exactly per the TK-24 mechanism: the journal object survives, the PendingSet instance is discarded (a wrapper that raises after N appends injects mid-operation kills); the 10 TK-24 kill scenarios are PORTED into tests/gate/test_pending_set.py against the production impl (AC4's own text) and the superseded tests/gate/test_pending_set_spike.py is DELETED — its runnable proof is subsumed by the strictly-stronger production port (Q-43 freeze principle; the spike's finding stays recorded on TK-24). No trigger arm wiring (TK-27)."
    acceptance_criteria:
      - given: 10 items added, each load_score=0.15 (total=1.5, above flush_threshold=1.0)
        when: pending_set.cumulative_load() is called
        then: Returns 1.5 (exact float sum); no model call occurs.
      - given: a populated pending set after a surface_flush
        when: pending_set.clear() (the journaled bulk drain-all) is called and the process is killed mid-clear then restarted
        then: "the set rebuilds from the journal to EMPTY (the clear is durable/exactly-once — no items resurrect and no double-clear), proving the flush-arm clear TK-27 relies on is journaled, not an in-memory wipe."
      - given: The pending set at capacity (MAX_PENDING)
        when: another item is enqueued
        then: "The lowest-urgency item is evicted and a CapacityEviction event is emitted; set size stays <= MAX_PENDING — INCLUDING across a kill injected at ANY point inside the evicting add() (Q-45): the eviction journals PendingSetRemove(evicted) write-ahead BEFORE PendingSetAdd(new), so a kill between the two appends rebuilds to at most max_pending-1 items (evicted gone, uncommitted new item absent — the interrupted add never returned, and the at-least-once queue redelivers it), never max_pending+1. A regression test injects the kill between the two appends and asserts rebuild size <= max_pending with cumulative_load consistent with replay; a second scenario kills after both appends and asserts the new item present, the evicted absent, size == max_pending."
      - given: A mid-drain kill-and-restart (per TK-24)
        when: the production pending set rebuilds from the journal
        then: cumulative_load() is exactly consistent with pre-kill state; all 10 TK-24 kill scenarios pass against the production implementation.
      - given: pending_set.list() is called on an empty set
        when: the call runs
        then: Returns an empty list; cumulative_load() returns 0.0.
    non_goals:
      - No UI or human-readable view of the pending set.
      - No gate pipeline wiring (TK-21).
      - No surfacing-ledger/ceiling accounting (TK-27).
    depends_on:
      - TK-24
      - TK-21
    files_in_scope:
      - src/wombat/gate/pending_set.py
      - src/wombat/gate/aggregator.py
      - tests/gate/test_aggregator.py
      - tests/gate/test_pending_set.py
      - tests/gate/test_pending_set_spike.py
  - id: TK-29
    kind: ticket
