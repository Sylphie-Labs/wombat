  - { id: Q-72, type: open_question, status: resolved, scope: EP-1, date_raised: "2026-07-03", date_updated: "2026-07-03", title: "TK-53 verifier finding (non-blocking, needed an owner): openai — cog-worx's optional [providers] extra — is undeclared in wombat's pyproject, so a clean uv-sync checkout cannot run the DSN-gated boot test and a clean install cannot boot serve()",
