  - id: TK-10
    kind: ticket
    parent: EP-4
    title: ComposeDispatchRouter — route a surfaced GateDecision to the composer for its item_kind
    intent: As the drain pathway, I receive a surfaced GateDecision and dispatch it to the correct composer by the artifact's item_kind (brief -> BriefComposeStage, reflection -> ReflectionComposeStage, draft -> DraftComposer, generic -> the default ComposeStage) so every gate-cleared item kind has a defined route to the mouth and no composer is orphaned (ISS-5). The router only selects; it never decides whether to surface (the gate already did, CON-2) and never phrases (the composer does).
    status: done
    priority: P1
    estimate: S
    engineering_level: mvp
    complexity_budget: "One ComposeDispatchRouter Stage that reads GateDecision.item_kind (the canonical closed Enum from TK-21/ISS-4) and dispatches to the registered composer for that kind via a small kind->composer map. No new composer logic; no mouth call in the router itself; unknown kind -> the generic ComposeStage (TK-8) with a warning. PAYLOAD-BOUNDARY OBLIGATION (Q-50 rider, adjudicated v0.47): TK-10 OWNS constructing compose_request.payload — it must contain ONLY user-facing fields and must NEVER carry scores, GateAction, ScoredItem fields, or queue internals (ComposeStage renders payload VERBATIM, so this wire construction IS the structural never-expose-the-model guarantee, CON-1/AC1-of-TK-8); the router consumes the gate_decisions entries via the shared artifacts.py helpers and emits compose_request via compose_request_to_artifact_data; a test asserts the emitted payload contains no internal keys (urgency/load/action/idempotency/leased fields) even when the gate entry carries them. SANCTIONED RIDER (v0.47): fold the 1-line AC3 whitespace hardening into this build — ComposeStage.__init__ key check becomes .strip()-based so a whitespace-only DEEPSEEK_API_KEY also raises ConfigurationError at construction (a whitespace key would otherwise silently degrade the mouth to templates FOREVER — the exact failure mode AC3 exists to prevent); compose.py + its test are in this ticket's scope for that one line only. DISPATCH MODEL + INPUT WIRE (Q-51): the router is a cog-worx Stage that returns Transition(to=<composer STAGE NAME by item_kind>, output=compose_request) — the ENGINE drives the composer ('invoked exactly once' is tested as Transition.to == the stub composer stage's name; the router NEVER calls a composer inside run()); transitions=(compose, reflection_compose, draft_compose) with unknown/unregistered kind -> 'compose' + warning. INPUT = the NEW single-item wire 'wombat.surfaced_item' (produced_by 'review_or_speak'; data = ONE gate-decisions entry {action, scored_item, queue_item}) read via ctx.last_output('review_or_speak') — NOT the raw wombat.gate_decisions batch and NOT last_output('gate'); the surfaced_item_to/from_artifact_data helpers are ADDED to stages/artifacts.py in THIS build (JSON-native + dumps regression per Q-49) and TK-7 later PRODUCES the wire through them (the same pre-definition pattern as compose_request). Batch single-ization is TK-7's job under the Q-51 mvp composition rule (drain batch_size=1)."
    acceptance_criteria:
      - given: a surfaced GateDecision with item_kind=generic
        when: ComposeDispatchRouter.run() is called
        then: the default ComposeStage (TK-8) is invoked exactly once with the decision artifact (verified by composer stubs); no other composer is called.
      - given: a surfaced GateDecision with item_kind=reflection (from EP-22/TK-113)
        when: the router runs
        then: ReflectionComposeStage (TK-114) is the composer invoked — proving the FEAT-8 single-reflection path reaches the user (ISS-5 closes the orphan).
      - given: a surfaced GateDecision with item_kind=draft
        when: the router runs
        then: the Gmail DraftComposer path (TK-79) is the composer invoked.
      - given: a GateDecision whose item_kind is not in the registered map
        when: the router runs
        then: it falls back to the generic ComposeStage and logs a warning; it does NOT raise and does NOT silently drop the item.
    non_goals:
      - Does not phrase or call the mouth — composers do that.
      - Does not decide surface vs hold — the gate decided (CON-1/CON-2).
      - Does not implement any composer — only the routing map.
      - The morning brief (TK-100) is invoked by the brief pathway directly, not the drain router; the router covers drain-pathway surfaced items (reflection/draft/generic) — brief is registered for completeness so the kind enum is exhaustive.
    depends_on:
      - TK-6
      - TK-8
    files_in_scope:
      - src/wombat/stages/compose_dispatch_router.py
      - tests/unit/test_compose_dispatch_router.py
  - id: TK-8
    kind: ticket
    parent: EP-5
    title: Mouth wiring — DeepSeek via S4 + ComposeStage + terse-template degrade
    intent: As wombat, I register a DeepSeek OpenAICompatModel profile and implement ComposeStage so pre-decided surface items are phrased by the model — and when the model is unavailable a terse deterministic template is used (DEC-18, S8).
    status: done
    priority: P1
    estimate: M
    engineering_level: mvp
    complexity_budget: "ComposeStage + TemplateComposer, per the Q-50 rulings. (1) MODEL ACQUISITION: run() calls ctx.model.complete(messages=...) — the ENGINE assembles the per-drive model from TK-1's registered DeepSeek OpenAICompat ModelSpec (engine-wide model_profile='deepseek', wired by TK-1/bootstrap; no separate 'mouth' profile in v1 — one model); ComposeStage NEVER calls build_model itself and NO client is constructed at stage import. AC3 lives at construction: ComposeStage(*, config: WombatConfig, template_composer, timeout_seconds=2.0) VALIDATES config.deepseek_api_key is non-empty at __init__ and raises ConfigurationError otherwise (belt-and-braces against a blank env value; load_config() already fails loud on ABSENT vars — the stage check makes the mouth's dependency explicit at construction per AC3). ctx surface: ctx.model + ctx.last_output('compose_dispatch') + ctx.clock (provenance only); StageContextFake gains a configurable fake model. (2) INPUT WIRE (defined NOW so TK-10 produces it later with zero rework): kind 'wombat.compose_request', produced_by 'compose_dispatch', data = {'item_id', 'item_kind' (ItemKind.value), 'payload' (the user-facing dict)} — ONE item per compose invocation (the router dispatches per surfaced item); NO scores, NO GateAction, NO queue internals on this wire (the model may only ever see user-facing content); helpers compose_request_to/from_artifact_data in stages/artifacts.py; TK-8 tests fabricate requests via the helper. (3) PROMPT: messages = [ChatMessage(role='system', content=<fixed terse steward instruction>), ChatMessage(role='user', content=<rendered from the item's payload fields + item_kind only>)]; AC1 test asserts the captured prompt contains payload text and NOT scores/GateAction/internal keys. TemplateComposer (compose/templates.py) renders the deterministic terse fallback from the SAME payload fields — pure, no model, no I/O. (4) DEGRADE (AC2): text = await asyncio.wait_for(ctx.model.complete(...), timeout=timeout_seconds); TimeoutError, provider/connection/5xx errors, BudgetExceeded (degrade NOT raise — budget POLICY is TK-9's; the mouth must never break the drain loop), and empty/None/whitespace response text ALL degrade to the template with degraded=True; run() never raises (CancelledError passes through); timeout_seconds default 2.0 is AC-FIXED (not a TK-13 tunable). (5) OUTPUT: terminal Done(output=Artifact(kind='wombat.composed_output', produced_by='compose', data={'text', 'item_id', 'item_kind', 'degraded'})) — compose ends the mvp drive; the future deliver/voice stage (EP-30) flips Done->Transition(to='deliver') as a one-line change; helpers composed_output_to/from_artifact_data in stages/artifacts.py; both new wires JSON-native with json.dumps round-trip regressions (Q-49). No prompt iteration, no streaming, no BudgetGuard enforcement (TK-9)."
    acceptance_criteria:
      - given: a GateDecision(action=surface) with a test payload and DEEPSEEK_API_KEY set
        when: ComposeStage runs
        then: a non-empty phrased string is returned and the model was called once with a prompt containing the item payload but NOT raw gate internals (verified on the captured prompt with a mocked HTTP call).
      - given: the DeepSeek API returns 503 / times out
        when: ComposeStage runs
        then: ComposeStage returns a terse template-rendered string (not an exception) within 2 seconds.
      - given: DEEPSEEK_API_KEY is missing
        when: ComposeStage is instantiated
        then: a ConfigurationError is raised at construction time, not first call.
    non_goals:
      - Does not implement brief/Gmail draft phrasing templates — FEAT-6/FEAT-7.
      - Does not enforce BudgetGuard (that is TK-9); simply calls the model via S4.
      - Does not stream output.
      - Does not expose the model to undecided inputs or raw queue items.
    depends_on:
      - TK-1
      - TK-6
    files_in_scope:
