  - { id: Q-39, type: open_question, status: resolved, scope: project, date_raised: "2026-06-21", date_updated: "2026-06-21", title: "Spike file-layout drift: as-built spike code (rating//calendar//presence/) diverges from each ticket's files_in_scope, and the production leaf TK-41 (RatingParams) was planned at user_model/ but built at rating/ — pick the canonical home",
