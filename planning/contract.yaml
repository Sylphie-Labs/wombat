  - { id: Q-37, type: open_question, status: resolved, scope: FEAT-2, date_raised: "2026-06-21", date_updated: "2026-06-21", title: "Spike-vs-scaffold ordering tension: throwaway spikes are meant to run early/cheap yet each sits behind its subsystem scaffold in depends_on",
