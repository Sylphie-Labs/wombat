  - id: TK-1
    kind: ticket
    parent: EP-1
    title: wombat composition root — assemble cog-worx Engine with wombat config
    intent: As the wombat process, I construct one cog-worx Engine by WIRING wombat's ModelRegistry, BudgetPolicy, Registry, RecallStack, personality profile, and rules together with an INJECTED SubstrateBundle (the journal, graph_store, latent stores + an empty PathwayRegistry — the four required Engine seams, constructed by TK-14, not here) so that every downstream Stage and pathway has a single, authoritative assembly point. TK-1 owns the assembly/wiring only; it does not construct or connect any store (Q-29).
    status: done
    priority: P1
    estimate: M
    engineering_level: mvp
    complexity_budget: One Python module (src/wombat/bootstrap.py) that calls the cog-worx Engine constructor via documented seams only, passing the four REQUIRED Engine kwargs (journal, graph_store, latent, pathways) from an injected SubstrateBundle (constructed by TK-14) plus wombat's optional seams (ModelRegistry, BudgetPolicy, RecallStack, Registry, personality, rules). No store construction, no DB connection, no loop code, no Stage logic — pure assembly (Q-29).
    acceptance_criteria:
      - given: wombat is launched cold and a SubstrateBundle (cold-boot in-memory stores from TK-14) plus wombat's optional seams are supplied to the composition root
        when: the composition root runs
        then: A cog-worx Engine instance is returned wired with ALL FOUR required substrate seams — journal, graph_store, latent, and a (possibly empty) PathwayRegistry — AND wombat's ModelRegistry (DeepSeek profile stub), a BudgetPolicy, a RecallStack, and personality/rules; each of the ten is asserted non-None / present on the Engine in a unit test (the four required seams make AC-construction possible per Q-29, the six optional seams realize wombat's config).
      - given: DEEPSEEK_API_KEY or DEEPSEEK_BASE_URL is missing from env
        when: the composition root runs
        then: A clear ConfigurationError is raised naming the missing variable; the process does not start silently broken.
      - given: the composition root is called twice in the same process
        when: the second call executes
        then: Either the same singleton is returned or a second call raises an explicit error — no silent duplicate Engine.
    non_goals:
      - Does not wire the WombatQueue or SourceRegistry — that is TK-3/TK-5.
      - Does not register any input source or pathway.
      - Does not call the model or touch the journal.
      - Does not CONSTRUCT or CONNECT the substrate stores (journal/graph_store/latent) — it receives them as an injected SubstrateBundle from TK-14; it opens no DB connection and never decides between in-memory doubles and real adapters (Q-29).
    depends_on:
      - TK-14
    files_in_scope:
      - src/wombat/bootstrap.py
      - src/wombat/config.py
      - tests/unit/test_bootstrap.py
  - id: TASK-6
    kind: task
    parent: TK-1
    status: todo
    title: src/wombat/config.py — WombatConfig via pydantic-settings (BaseSettings) reading DEEPSEEK_API_KEY and DEEPSEEK_BASE_URL from env. Raise a ConfigurationError naming the FIRST missing variable so the process fails loud, not silently broken (AC2). pydantic_settings is already a resolved dep.
  - id: TASK-7
    kind: task
    parent: TK-1
    status: todo
    title: src/wombat/bootstrap.py — assemble wombat's six optional Engine seams — ModelRegistry with a "deepseek" profile registered via register_spec(ModelSpec) (descriptor only; NO build_model / NO client call — the Engine builds the model per-drive, so composition stays model-silent per the non_goal), BudgetPolicy(), Registry(), RecallStack(channels=...), PersonalityProfile(...), RuleSet(...). All via documented cog-worx seams (DEC-12, never fork).
  - id: TASK-8
    kind: task
    parent: TK-1
    status: todo
    title: Wire the cog-worx Engine(...) call — pass the FOUR required seams from the injected SubstrateBundle (journal, graph_store, latent, pathways) PLUS the six optional seams from TASK-7, with model_profile="deepseek". This is the single authoritative assembly point; no loop/Stage code.
  - id: TASK-9
    kind: task
    parent: TK-1
    status: todo
    title: Single-Engine guard (AC3) — a process-level singleton so a second composition call returns the same Engine OR raises an explicit error; never a silent duplicate Engine.
  - id: TASK-10
    kind: task
    parent: TK-1
    status: todo
    title: tests/unit/test_bootstrap.py — AC1 given TK-14's cold-boot bundle + valid config, the Engine is returned with all TEN seams present/non-None (assert the four substrate + six optional; note the Engine stores these as private attrs — assert via those or a thin accessor); AC2 missing DEEPSEEK_API_KEY or DEEPSEEK_BASE_URL raises ConfigurationError naming the var; AC3 second call returns the same singleton or raises. Runs with no DB (cold bundle).
  - id: TK-14
    kind: ticket
    parent: EP-1
    title: SubstrateBundle factory — construct the cog-worx Engine's required journal/graph_store/latent stores (cold-boot in-memory + real-adapter swap)
    intent: As the wombat bootstrap, I construct the FOUR substrate seams the cog-worx Engine requires (journal, graph_store, latent + an empty PathwayRegistry) and hand them to the composition root (TK-1) as one SubstrateBundle, so TK-1 stays pure wiring and the constructibility gap (Q-29) is closed. A cold-boot factory returns cog-worx's shipped in-memory doubles (zero infra) for v1; a real-adapter factory (timescale_journal/neo4j_graph/pg_latent) is selectable by config for the durable path, its DSN/URI sourced from TK-13 and its on-host residency asserted by TK-150.
    status: done
    priority: P1
    estimate: M
    engineering_level: mvp
    complexity_budget: "One module (src/wombat/substrate.py) defining a SubstrateBundle dataclass (journal, graph_store, latent, pathways=PathwayRegistry()) and TWO factories that satisfy the cog-worx Journal/GraphStore/LatentStore Protocols via DOCUMENTED seams only: (1) a cold-boot factory returning cogworx.testing.doubles InMemoryJournal/InMemoryGraphStore/InMemoryLatentStore (the v1 default — no DB), and (2) a real-adapter factory constructing cogworx.adapters timescale_journal/neo4j_graph/pg_latent from a SubstrateSettings DSN/URI. Mode is chosen by config (default cold-boot). No cog-worx fork; no Engine assembly (that is TK-1); the real path does not BYPASS TK-150's residency check (it passes its config through it). pathways is an empty PathwayRegistry — sources/pathways register later (TK-3/TK-5)."
    acceptance_criteria:
      - given: wombat is launched cold with no substrate config (the v1 default)
        when: the cold-boot SubstrateBundle factory runs
        then: a SubstrateBundle is returned whose journal/graph_store/latent are cog-worx's InMemoryJournal/InMemoryGraphStore/InMemoryLatentStore and whose pathways is an empty PathwayRegistry — each conforms to the cog-worx Protocol (a test constructs an Engine from the bundle with no database running) — proving cold boot needs zero infra (Q-29).
      - given: substrate config selects the real-adapter mode with a DSN/URI from the parameter store (TK-13)
        when: the real-adapter factory runs
        then: it constructs the cog-worx timescale_journal/neo4j_graph/pg_latent adapters from that config, and the resolved endpoint is passed through TK-150's same-host residency check before any connection is opened (a test asserts an off-host DSN is refused at this boundary, an on-host one is accepted) — the durable path reuses the SAME SubstrateBundle seam TK-1 consumes.
      - given: either factory's output
        when: it is handed to TK-1's composition root
        then: TK-1 wires it into the Engine unchanged (the bundle is the only substrate input TK-1 takes) — a test asserts the same bundle shape satisfies both the cold-boot and real-adapter paths so the store choice is invisible to TK-1.
