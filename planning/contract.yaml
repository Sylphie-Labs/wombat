  - { id: Q-62, type: open_question, status: resolved, scope: EP-16, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-74 build briefing (the Q-60 carry-forward): the real-events -> day-minutes projection bridge, CalendarEventItem AC wording vs the Q-60 CalendarEvent type, all-day conflict semantics, CALENDAR_CONFLICT stamping ownership, working-hours home, and the conflict-logic module home",
      description: "TK-72 emits absolute-instant CalendarEvents; the frozen TK-73 spike proved the overlap/earliest-gap math in day-scoped minutes (slots.py detect_conflicts/project_busy/free_intervals/propose_alternatives over CalendarEventItem). Open: bridge shape (project-and-reuse vs lift-onto-datetimes), day chunking/tz for events crossing midnight or spanning days, whether all_day events conflict with anything, whether EventClass.CALENDAR_CONFLICT exists yet and who stamps it, where working hours live, and whether pure conflict logic belongs in integrations/gcal/ as declared.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — HOW/model/layout rulings + AC rewording; no locked decision/constitution/v1-scope/graph change; deps TK-72/TK-73 both done). (1) PROJECT-AND-REUSE: TK-74 is a projection ADAPTER over the frozen spike kernel — slots.py stays the single proven overlap/gap implementation, imported not re-derived (a second datetime overlap implementation = ISS-4 competing-definition drift; Q-43 freeze upheld, spike files byte-untouched). (2) PROJECTION: injected DEC-21 civil-local tz argument (pure); per-civil-local-day chunking over whatever window the caller passes (TK-98/99 choose the window); midnight-crossing events split into clamped per-day segments, multi-day events contribute full-day intermediate segments, zero-length midnight segments dropped; Conflict outputs reference ORIGINAL CalendarEvent.event_ids + civil-local day. (3) ALL-DAY EXCLUDED from conflict candidacy and free/busy — neither conflicts nor blocks slots (holiday != meeting; busy-0..1440 would flood the brief with junk conflicts, the exact RISK-6 trust erosion); recap content via TK-98; revisit trigger = the DEF-2 rating pass demanding transparency-aware handling. (4) EventClass.CALENDAR_CONFLICT EXISTS as-built (verified in rating/params.py — no TK-41 vocabulary change, no new dep): TK-74 ships a pure conflict_to_payload wire helper stamping event_class=calendar_conflict (Q-41) co-located with the conflict code, so TK-98/99 stamp through ONE helper; TK-74 enqueues nothing and touches neither registry nor gate. (5) WORKING HOURS injected (spike WorkingHours type; tests pass 09:00-18:00 explicitly; TK-13 field pre-authorized at brief wiring — no hidden default). (6) HOME NORMALIZED per the Q-39 domain-home precedent: calendar/conflict.py + calendar/alternatives.py + tests/calendar/test_conflict.py (pure domain math, not a Google adapter) — files_in_scope amended; spike Conflict/AlternativeSlot types reusable by import, never modified. ACs reworded onto CalendarEvent, with a new negative case: a midnight-crossing pair that only appears to overlap in naive UTC minutes must not false-positive, and all_day never appears in any Conflict.",
      links: ["TK-74","TK-72","TK-73","TK-98","TK-99","TK-13","Q-39","Q-41","Q-43","Q-60","DEF-2","DEC-21"] }

  - { id: Q-63, type: open_question, status: resolved, scope: EP-27, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-146 build briefing: exact trail schema + migration number, action_id identity seam (item_identity or not), the idempotent/monotonic status-transition table under Sweeper re-drive, refusal-row status, and the TK-147 read seam",
      description: "Gmail-branch head; production pg ticket. Open before build: exact columns/PK/ordering column; next migration number (as-built = 001 queue + 003 daily ledger; 002 reserved by TK-9 declared scope); whether action_id derives through TK-12 item_identity like queue keys; precise legal transitions + how the writer stays idempotent and regress-proof when the cog-worx Wait/Sweeper re-runs a stage from entry; what status a blocked_by_taint refusal row carries (the budget gave it an action_type but no status); and what TK-146 must expose so TK-147 reader is not coupled to raw table strings.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — schema/semantics HOW under the locked DEC-19/CON-4 frame; no decision/constitution/v1-scope/graph change). (1) SCHEMA: action_trail_projection(action_id TEXT PK, seq BIGSERIAL UNIQUE for ordered incremental reads — TK-29 bigserial precedent, TK-147 AC4 dedup/no-re-emit needs a stable cursor, action_type TEXT, human_summary TEXT, target TEXT, proposed_at TIMESTAMPTZ, status TEXT, dispatched_at/cancelled_at TIMESTAMPTZ NULL); NO pg enums — writer-side str-Enums ActionType {DRAFT_EMAIL, FORM_SUBMIT, LOGIN_HANDOFF, BLOCKED_BY_TAINT} + TrailStatus {PENDING, DISPATCHED, CANCELLED, BLOCKED} in schema.py (later dispatch tickets add members deliberately — the EventClass closed-vocabulary pattern). Migration 004_action_trail.sql + ensure_schema(conn) (Q-46, two as-built precedents). (2) IDENTITY SEAM FLAGGED AND RULED: action_id does NOT derive through TK-12 — an action is a proposed side effect, not a source item (item_identity keys source items for dedup/outcome binding); action_id is an opaque caller-supplied stable string, PK-unique; the DERIVATION rule (stable across re-drive so ON CONFLICT absorbs it, likely run/step- or ReplyIntent-derived) is a NAMED CARRY-FORWARD to TK-149 briefing (the two-step call-site owner); TK-146 proves idempotency on caller-supplied ids. (3) TRANSITIONS — monotonic, terminal-absorbing: PENDING->DISPATCHED and PENDING->CANCELLED only; same-terminal re-apply = idempotent ALREADY_APPLIED no-op with first-write-wins timestamps (COALESCE, never overwritten); everything else (regress, cross-terminal, anything from BLOCKED) raises TrailTransitionError loudly. Writer = SINGLE-STATEMENT SQL only (insert ON CONFLICT DO NOTHING -> INSERTED|ALREADY_PRESENT; transition = one guarded UPDATE with the status predicate in WHERE; no Python read-modify-write) so Sweeper re-drives of any call site cannot double-apply or regress — the same crash/replay posture as TK-25/TK-2. (4) REFUSALS: record_refusal inserts TERMINAL status=BLOCKED at insert (never transitions); NOT rendered-as-cancelled — CON-4 audit honesty distinguishes structurally-refused from human-rejected; TK-147 BLOCKED-row rendering is a named carry-forward to TK-147 briefing. (5) TK-147 SEAM: TK-146 is WRITE-ONLY, no query surface (single responsibility; TK-147 owns reader.py); schema.py exports the typed contract (TrailRow dataclass + enums + table/column constants) TK-147 builds against. (6) Timestamps caller-supplied aware-UTC (stages pass ctx.clock; writer clock-free); DSN injected; zero OperatingParams/TK-13-guard contact; tests/trail/ gets __init__.py per TK-15. files_in_scope += migration + tests/trail/__init__.py.",
      links: ["TK-146","TK-147","TK-148","TK-149","TK-9","TK-12","TK-29","TK-15","Q-46","CON-4","DEC-19"] }

  - { id: Q-64, type: open_question, status: resolved, scope: EP-28, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-148 build briefing: verify the four Q-32-era cog-worx taint-seam claims against the INSTALLED framework, reconcile poller-fetches-body vs read-via-capability, rule the TK-75-unbuilt test shape, and wire the refusal call site onto the as-built TK-146 record_refusal (incl. the refusal action_id derivation)",
      description: "The gmail-branch safety keystone: a wrong seam here = a broken safety guarantee, and TK-148 budget rested on audit-recorded claims never checked against the installed package. Also open: TK-75 poller fetches body_text as transport and enqueues it, but the ticket structures the body READ as a gate-dispatched capability — where does the latch actually fire; how is the ticket tested with no poller built; what stable action_id does a refusal row carry (TK-146 left derivation to call-site owners).",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — seam verification + HOW rulings; no locked decision/constitution/v1-scope/graph change; NOTHING requires Jim — all four seams confirmed, no product/safety decision arose). (1) ALL FOUR SEAMS CONFIRMED-AS-WRITTEN against the sibling-checkout cogworx (capability/policy.py, registry.py, base.py, router.py): Registry.register(cap, *, tags=()) + Capability.tier Literal[read,write,external]; literal tags untrusted-source AND trusted-output both exist exactly; TaintState.update(name, registry) — latch iff (external AND no trusted-output) OR untrusted-source, irreversible per drive, invoked by router dispatch_one BEFORE cap.invoke in the gate pipeline (nuance vs budget prose: the latch call site is dispatch_one, i.e. the gate PIPELINE, with TaintState held by ToolGate — substance as recorded); ToolGate._effective_tiers() is the SINGLE tier computation feeding both exposed_specs and check_dispatch (cannot diverge, SC-6); TierViolation raised by check_dispatch (distinct from CapabilityUnavailable and ApprovalRequired); per-stage stage.tool_policy read by the engine via bind_tool_policy; persist_taint durable hook exists for the False->True transition. CF-3.2-B honesty carried onto the record: untagged read-tier reads DO NOT taint — the tagging obligation is wombats, which is precisely what AC4 enforces. (2) BODY-TRANSPORT RECONCILIATION ruled: the pollers fetch is TRANSPORT (not a drive, holds no tools — TK-75s own AC); the drive-boundary crossing is read_email_body (tier=read, tags=(untrusted-source,)) over an INJECTED body_provider (production = enqueued payload/body store; tests = fixtures incl. injection payloads); the latch marks the PROCESSING drive — exactly what the trifecta break protects; drive-side body access not through the capability IS the AC4 violation. (3) TEST SHAPE with TK-75 unbuilt: REAL cogworx classes in-memory (Registry/ToolGate/TaintState/dispatch_one — framework, not mocks; no DSN or Engine needed for the latch tests); representative GmailMessageItem-shaped payloads; the FROZEN CONTRACT TK-75 must satisfy is recorded (message_id + provider-reachable body; all drive-side body access via the capability). (4) REFUSAL CALL SITE: catch TierViolation at the wombat invocation seam in safety/taint.py -> TK-146 record_refusal with action_id = refusal:<subject item idempotency_key>:<refused capability name> (stable across Sweeper re-drive AND queue redelivery — ON CONFLICT absorbs; traceable to the exact item), target=capability name, ctx.clock() timestamp; writer injected (recording fake in units + ONE DSN-gated integration proving the real BLOCKED row). (5) Q-11 both-directions AC4 stands verbatim (both literal tags verified); TK-153 web-split boundary held (machinery + email call site only); zero OperatingParams contact; tests/safety/__init__.py per TK-15. files_in_scope += tests/safety/__init__.py.",
      links: ["TK-148","TK-146","TK-75","TK-153","TK-149","TK-12","TK-15","Q-11","Q-32","Q-63","DEC-19","NG-5"] }

  - { id: Q-65, type: open_question, status: resolved, scope: EP-17, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-75 build briefing: dual-scope vs readonly-only gmail credential (gmail.compose can SEND), poller/capability separation under DEC-26, the Q-57 pattern extension (shared client vs new env vars, keyring account, live gate), and the TK-148 frozen-contract body-handling boundary",
      description: "GmailPoller briefing. Open: (a) the budget said the credential mints gmail.readonly + gmail.compose now (compose for TK-78 later) — but Google gmail.compose permits SENDING messages and drafts, so a send-capable token would exist on-host months before the review-before-send machinery; (b) how the poller stays tool-free (AC2 never-holds-drafts.create) in DEC-26 terms; (c) whether gmail reuses the TK-71 Google client env vars; (d) THE CRUX — does body_text ride in the queue payload (then any stage could read it around the tagged capability) or in a separate body store (new persistence), and how does the TK-148 read_email_body-only rule stay enforceable rather than conventional.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — ticket re-scope STRENGTHENING the locked CON-5/DEC-19 posture + HOW rulings; no locked item changed; deps unchanged, all done). (1) READONLY-ONLY NOW — supersedes the budget dual-scope parenthetical: GMAIL_SCOPES = gmail.readonly exactly; a send-capable token (gmail.compose CAN send) must not exist on-host before TK-78/79/149/151 exist; TK-78 bring-up mints compose via a second consent pass and owns widening the scope guard (TK-151-flag pattern — fail-closed until deliberately enabled); assert_gmail_readonly_scopes raises ScopeViolationError on ANY extra scope. Cost = one extra Jim consent click at TK-78; benefit = the only live token is write-incapable. (2) POLLER IS TRANSPORT: injected AuthorizedSession, registers NO Capability, holds no tools, not a drive — DEC-26 untouched; AC test = fake session exposing .get only + no Registry.register in poller code. (3) REUSE google_oauth_client_id/secret (one Google Cloud app; scopes are per-token) — NO new env vars; separate keyring account gmail-oauth-token under service wombat; GmailAuth mirrors the as-built CalendarAuth incl. consent CLI (Jim bring-up: consent + enable the Gmail API on the Cloud app); live smoke gated WOMBAT_TEST_GMAIL_LIVE=1. (4) BODY BOUNDARY RULED — body_text rides IN the payload under ONE key (zero new persistence, NG-3; survives restarts with the queue row; the Q-64 enqueued-payload reading), and the read_email_body-only rule becomes ENFORCEABLE via a DEC-25/26-pattern GUARD TEST shipped by TK-75: AST/grep scan asserting the body_text key is referenced ONLY by the sanctioned allowlist — CORRECTED 2026-07-03 to the as-built FOUR files (Q-39 precedent; the builder flagged rather than silently deviating): gmail poller.py + models.py (producers), stages/ingest_email_body.py (the real code-level consumer — the TK-148 artifact wire re-keys the body_provider return there; outside TK-75 scope so unnamed in the original wording), safety