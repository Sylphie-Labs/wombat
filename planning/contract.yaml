  - { id: Q-19, type: open_question, status: resolved, scope: EP-9, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "MEDIUM (F): the production operating parameters the spikes recommend are owned/persisted by no ticket",
      description: "urgency_threshold, load_flush_threshold, decay_ttl_seconds, MAX_PENDING, the per-class daily ceiling, the daily token ceiling, and 'morning time' (TK-97 forbids configurability but never states the value) are referenced everywhere but no ticket persists the chosen production values. Spikes (TK-22/26/48/73) recommend values; nothing stores them. Distinct from the tuned RatingParams (TK-49).",
