  - { id: Q-40, type: open_question, status: resolved, scope: EP-9, date_raised: "2026-06-21", date_updated: "2026-06-21", title: "Persist the TK-48 RISK-4 empirical finding: floor/ceiling clamps alone do NOT bound the surfacing rate — the band must be chosen jointly with surfacing sensitivity; which ticket owns the operating constants and the joint-coherence invariant?",
      description: "The TK-48 spike (RISK-4 retired) proved via ablation that floor/ceiling clamps alone do not bound the surfacing RATE; the band, gain, delta_bound and hard ceiling are a coherent set chosen so the worst-case clamped rate equals the ceiling. Recommended constants: clamp band [0.35,0.65], delta_bound 0.05, gain 0.20, hard ceiling 12.0/day. If these are not persisted as a JOINT block, a later edit to the band without re-deriving the ceiling silently breaks the bound. Which ticket owns them, and how is the joint-coherence guarantee carried into the tuner?",
      resolution: "RESOLVED by architect 2026-06-21 (within authority — realizes Q-19/TK-13's param-store remit; no locked-decision/scope change). TK-13 OperatingParams store OWNS the five constants as ONE coherent block (band [0.35,0.65], delta_bound 0.05, gain 0.20, surfacing_ceiling_per_day 12.0) with a comment recording the joint-coherence reason; new TK-13 AC asserts all five present, typed, and equal to the TK-48 defaults. TK-49 RatingTuner CLAMPS against them by reading the whole block from TK-13 (never inlining); new TK-49 AC asserts no inline band/delta_bound/gain literal and that a night's delta is clamped to +/- delta_bound before the band clamp. These TK-48 constants are LOCKED (RISK-4 retired). The TK-26 trigger thresholds (urgency_threshold 0.75, load_flush_threshold 1.0, per_class_ceiling 3) are recorded as PROVISIONAL in TK-13 (fixture-confirmed only, pending Jim's RISK-1/2 confirmatory label pass) — seeded as defaults but marked provisional in the versioned YAML so a relabel can revise them without implying they were ever locked.",
      links: ["TK-48","TK-13","TK-49","TK-26","TK-22","Q-19"] }
  - { id: Q-41, type: open_question, status: resolved, scope: EP-10, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-42 constructibility cluster (build briefing): no ItemKind->EventClass bridge, phantom TK-13 user_id, sync gate vs async claims_about, no agreed claim-payload wire shape",
      description: "The TK-42 build briefing verified four gaps against the as-built tree. (1) BLOCKER: TK-42 AC1 keys the point-read on an EventClass, but GateItem carries only ItemKind {BRIEF,REFLECTION,DRAFT,GENERIC} (TK-21 — the canonical and only-allowed item-kind vocabulary) and NO ticket defines an ItemKind->EventClass mapping; CALENDAR_CONFLICT has no ItemKind counterpart at all, and BRIEF/DRAFT do not line up 1:1 with MORNING_BRIEF/DRAFT_REPLY. (2) TK-42 said 'one configured user_id from TK-13' but the as-built OperatingParams has no user_id field (and WombatConfig only holds DeepSeek env). (3) cog-worx EntityKG.claims_about is async def and Stage.run is async, while the gate pipeline + ScoreFn are sync. (4) cog-worx Claim.payload is a plain str and TK-44 (the write side) is unbuilt, so no on-wire shape exists for the rating-params claim TK-42 must parse.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — seam/how rulings; no locked decision, constitution item, or v1 scope touched; TK-21's canonical model NOT amended). (1) EVENT-CLASS RESOLUTION: rejected a bare ItemKind->EventClass mapping table as LOSSY — no ItemKind maps to CALENDAR_CONFLICT, so the flagship rated class of the v1 wedge would silently degrade to GENERIC and gut the personalized-gate thesis; rejected changing the ratings_for(item) signature (pushes derivation onto every caller). RULED: the event class travels IN GateItem.payload under the documented key 'event_class' (an EventClass value string) — payload is TK-21's designed extension point ('opaque fields the scoring callables read'), so ItemKind stays composition-routing-only (ISS-4 intact). TK-42 owns resolve_event_class(item)... payload key when present/valid, else the TOTAL fallback map BRIEF->MORNING_BRIEF, REFLECTION->REFLECTION, DRAFT->DRAFT_REPLY, GENERIC->GENERIC (invalid value -> fallback + warning). PRODUCER OBLIGATION: whichever ticket enqueues calendar-conflict items stamps payload['event_class']='calendar_conflict' — homed just-in-time at that ticket's frontier briefing per Q-35 (the Conflict record itself is TK-74's). (2) USER_ID: UserModel takes user_id as an INJECTED constructor arg and forms scope 'user:<user_id>' itself (matches cogworx knowledge/scopes.py convention); tests pass a literal; sourcing is a composition-root concern — when first wired, user_id lands as a one-field wombat_params.yaml/OperatingParams addition under TK-13's ownership (pre-authorized here; TK-13 stays done, nothing consumes the field yet). (3) ASYNC: ratings_for is ASYNC DEF. The briefing's sync facade with asyncio.run inside is REJECTED — Stage.run is async, so asyncio.run would raise RuntimeError inside the running Stage loop and AC3's broad except would swallow it, silently pinning production to defaults forever (an invisible defeat of the personalized gate, the DEC-13 thesis). The sync gate ScoreFns are unaffected... the async caller (TK-23/TK-27 composition) awaits/prefetches RatingParams per event class and binds them into the pure sync scoring functions; TK-23 AC1 reworded. (4) WIRE SHAPE: TK-42 defines the PROVISIONAL claim wire contract, homed in the shared vocabulary module rating/params.py (TK-41's home — the one module gate/read-seam/tuner already speak, so read/write cannot drift)... RATING_CLAIM_PREDICATE constant + to_claim_payload/params_from_claim_payload helpers; payload = JSON of {version, urgency_base, urgency_gain, load_base, load_gain}; entity = the EventClass value; newest active claim wins; malformed/unknown-version payload -> defaults + warning (never raise). TK-44 and TK-49 MUST write through these helpers (TK-44 budget annotated). TK-42 budget/ACs/files_in_scope amended (+rating/params.py, +tests).",
      links: ["TK-42","TK-21","TK-41","TK-13","TK-44","TK-49","TK-23","TK-74","TK-27","Q-34","Q-35"] }
  - { id: Q-42, type: open_question, status: resolved, scope: EP-7, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-23 composition ambiguity (build briefing): spike ScoringParams (7 heuristic fields) vs production RatingParams (4 base/gain fields) — exact scoring composition, fate of ScoringParams, the AC1 'solely' purity reading, and where AC3's ratings_for-fallback obligation lives",
      description: "The as-built TK-22 spike gate/scoring.py defines its own ScoringParams with SEVEN heuristic fields (w_time 0.55, w_sender 0.45, time_horizon_s 14400, w_density 0.6, w_depth 0.4, density_saturation 6, depth_saturation 8), while the production RatingParams (TK-41) carries only FOUR personalization fields (urgency_base/urgency_gain/load_base/load_gain + version) — the shapes do not line up. Four rulings needed before TK-23 code is written: (1) how exactly do base/gain compose with the item's raw signal, and is AC2's STRICT monotonicity preserved under the [0,1] clamp, incl. gain=0? (2) does AC1's 'drawn solely from the item's fields and the RatingParams' forbid fixed heuristic module constants? (3) is ScoringParams deleted or retained as the home for the non-personalized constants (this changes the public signature)? (4) AC3 as written tests a ratings_for-raises path that no longer exists — the as-built ratings_for (TK-42) never raises, and per Q-41 the sync scoring functions never call it.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — a HOW/seam ruling on an mvp ticket; no locked decision, constitution item, or v1 scope touched; no dep/graph change). (1) COMPOSITION: the spike's internal signal computation is KEPT with its 7 constants FROZEN as module-level heuristic constants (the hardened heuristic's SHAPE); personalization enters ONLY through RatingParams as an affine map — urgency = clamp01(urgency_base + urgency_gain * raw_urgency) with raw_urgency = 0.55*time_term + 0.45*sender_term, and cognitive_load = clamp01(load_base + load_gain * raw_load) with raw_load = 0.6*density_term + 0.4*depth_term; both raw signals lie in [0,1] by construction (weights sum to 1). This matches the RatingParams field docstrings (base = baseline contribution, gain = signal multiplier) AND the proven TK-48 tuner-sim model (the tuner moves the BASES additively inside the TK-13 clamp band — plain affine is what the RISK-4 stability proof modeled). MONOTONICITY: a >4h item has zero time pressure, so its raw urgency is at most W_SENDER=0.45; strict AC2 monotonicity therefore holds after clamping whenever gain > 0 and base + 0.45*gain < 1.0 — satisfied by every documented per-class default and the ENTIRE TK-13 tuner band (worst case 0.65 + 0.45*0.65 = 0.9425 < 1.0), so strictness is a provable bound, not a coincidence. gain=0 is type-legal but degenerate (the class flattens to its base — fully muted); AC2 is specified over gain>0 params and the saturation caveat is documented in the module. (2) AC1 'solely' CONFIRMED as a PURITY clause, not a no-named-constants clause: pure deterministic function of (item payload, params) — no I/O, no clock read (seconds_to_event arrives precomputed in the payload), no randomness, no presence, no mutable module state; the frozen constants are part of the function's DEFINITION (the deterministic transform of the item's own fields the spike already proved). The heuristic constants STAY in gate/scoring.py and are NOT moved into TK-13 OperatingParams — they are the scoring function's shape, not operating thresholds; moving them would create a second tuning surface (TK-23 budget forbids tuning logic) and re-scope a done production ticket with no consumer need; the TK-13 AC4 guard scans scoring.py only for TK-13-OWNED constants, which scoring.py must not define, so there is no conflict. (3) ScoringParams is DELETED — the public signature becomes urgency(item, params)/cognitive_load(item, params) with params typed RatingParams; retaining a second params type would recreate exactly the private-vocabulary drift TK-41 exists to prevent. The TK-22 spike tests are PORTED IN PLACE using the identity RatingParams(urgency_base=0.0, urgency_gain=1.0, load_base=0.0, load_gain=1.0), under which the hardened functions reproduce the spike's raw scores EXACTLY — the port doubles as a behavioral-equivalence proof and the fixture-agreement thresholds pass unchanged (RISK-1 evidence chain and DEF-1 calibration posture undisturbed). (4) AC3's ratings_for-failure obligation LIVES ON TK-42 (built + verified: store failure/malformed claim -> defaults + warning, never raises; and per Q-41 the sync scoring functions never call ratings_for). TK-23 AC3 is REWORDED to the scoring-layer residual: payload TOTALITY — a MISSING payload key defaults silently (sparse items are legitimate), a present-but-INVALID value defaults + emits a warning (the warning is the hardening; the spike defaulted silently), never raises. TK-23 budget/AC1-AC4/files_in_scope amended (+tests/gate/test_scoring_spike.py for the in-place port).",
      links: ["TK-23","TK-22","TK-41","TK-42","TK-13","TK-48","TK-49","TK-27","Q-41","DEF-1"] }
  - { id: Q-43, type: open_question, status: resolved, scope: EP-7, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "Q-42 follow-up: deleting ScoringParams breaks live consumers outside TK-23's files_in_scope — the TK-26 spike trigger_sim.py (+3 baseline tests) and the committed TK-22 fixture builder both import/construct it; migrate, shim, or accept regression?",
      description: "Q-42 ruled ScoringParams DELETED from gate/scoring.py with RatingParams the sole params type. Code-confirmed live consumers outside TK-23's then-declared files_in_scope: (1) src/wombat/gate/trigger_sim.py (TK-26 frozen spike) imports ScoringParams and its score_day(items, params) calls urgency()/cognitive_load(); (2) tests/gate/test_trigger_sim.py constructs ScoringParams() in 3 tests that are part of the 105-green baseline; (3) tests/gate/fixtures/_build_scoring_fixture.py — the COMMITTED de-identified fixture builder that test_scoring_spike.py regenerates the gitignored real-data fixture from, i.e. load-bearing for TK-23's OWN AC4 CI path (missed by the builder's report, found by architect grep). Deleting the type without porting these ImportErrors trigger_sim + the fixture-regeneration path and regresses 3 green tests. Candidates: (a) expand TK-23 files_in_scope and migrate all consumers; (b) keep a ScoringParams shim until TK-27; (c) accept the regression, deferred to TK-27.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — files_in_scope normalization + a mechanical port; no locked decision/constitution/v1-scope/dep-graph change). RULED option (a), extended to ALL THREE consumers: TK-23 performs a MECHANICAL IDENTITY-PARAMS PORT of every remaining ScoringParams consumer — trigger_sim.py's score_day takes params, type RatingParams; test_trigger_sim.py and _build_scoring_fixture.py replace ScoringParams() with the identity RatingParams(urgency_base=0.0, urgency_gain=1.0, load_base=0.0, load_gain=1.0). Under identity params the hardened functions reproduce the spike raw scores EXACTLY (Q-42), so every ported call site is score-identical bitwise: the TK-26 recorded finding (thresholds 0.75/1.0/3 -> 0 voice + 1 flush/day on the real fixture) and the fixture builder's emitted labels remain the true record — the spike freeze's SUBSTANCE (the evidence) is untouched, only the params plumbing changes. SPIKE-FREEZE PRINCIPLE REFINED (coherent with DEC-24/DEC-25): the freeze forbids re-deriving/extending spike logic and forbids retrofitting spikes to consume production stores they predate (DEC-25 refused the tuner_sim OperatingParams retrofit — no compile break existed there); it does NOT mean leaving the tree broken when a frozen spike imports from a file Q-39 ruled to be hardened IN PLACE (gate/scoring.py is TK-23's production home, not a frozen artifact) — a mechanical type-port with proven score-identity is permitted maintenance, not a retrofit. REJECTED (b) shim/alias: a second params type in a production module recreates exactly the private-vocabulary drift Q-42/TK-41 exist to kill, leaves a dead weights-dataclass in a file the TK-13 AC4 guard scans, and creates a deletion chore parked on TK-27. REJECTED (c) accepted regression: red tests parked on the green baseline violates the runnable-check done-bar and would mask real TK-23 regressions in the same files. TK-23 files_in_scope += trigger_sim.py, test_trigger_sim.py, fixtures/_build_scoring_fixture.py. TK-27 note: when it hardens the trigger path it inherits call sites already speaking RatingParams — no migration debt.",
      links: ["Q-42","TK-23","TK-26","TK-22","TK-27","TK-41","TK-13"] }
  - { id: Q-44, type: open_question, status: resolved, scope: EP-8, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-25 build briefing: what backs the production pending set given the TK-24 seam-miss (cog-worx Journal cannot host PendingSet ops)? Plus MAX_PENDING home, CapacityEviction mechanism, pending_set-vs-aggregator split, and how the kill ACs run in CI",
      description: "TK-25 is engineering_level=production with a budget saying Postgres-backed, but: (1) TK-24 proved cog-worx Journal is a positional step/run WAL with no PendingSetAdd/Remove concept, wombat has no generic pg store of its own yet (TK-2, which establishes wombat's pg conventions, is unbuilt), and the v1 default is zero-infra cold boot — so what is the persistence seam, does it join SubstrateBundle, and does TK-25 build the pg adapter now? (2) How do AC2's mid-clear kill and AC4's 10 TK-24 kill scenarios run in CI without live Postgres? (3) Where does MAX_PENDING live? (4) What is the CapacityEviction emission mechanism, and what splits pending_set.py from the new aggregator.py? Also code-confirmed: tests/gate/test_pending_set_spike.py imports the spike classes from the file TK-25 hardens in place — the Q-43 coupling again.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — HOW/seam rulings + one new sibling ticket; no locked decision, constitution item, or v1 scope touched; graph stays acyclic — TK-29 is a dependency SINK with edges only to TK-25/TK-2). (1) SEAM: a wombat-owned PendingJournal Protocol homed in gate/pending_set.py (append(record); replay() -> ordered records; frozen record dataclasses PendingSetAdd carrying the FULL ScoredItem fields so rebuild restores cumulative_load exactly, PendingSetRemove(item_id), and ONE atomic PendingSetClear). It does NOT join SubstrateBundle — that is the cog-worx Engine's four seams (TK-14/Q-29); the pending set is wombat-DOMAIN gate state, constructor-injected into PendingSet (mirrors TK-2's wombat-owned-Postgres stance and Q-36: wombat domain state is wombat's own concern, cold-boot is a cog-worx-substrate property). Reusing pg_episodes/graph-store claims REJECTED as seam abuse (pending items are not knowledge claims; TK-24 already documented the Journal seam-miss). TK-25 builds the Protocol + InMemoryPendingJournal double + ALL semantics NOW; the REAL Postgres adapter is SPLIT to NEW ticket TK-29 (EP-8, P1, S, production; depends_on TK-25 + TK-2) — building psycopg SQL inside TK-25 would invent wombat pg conventions AHEAD of TK-2 (coordination hazard) and ship production code with no CI-runnable check (violating the done-bar); TK-29 inherits TK-2's conventions and verifies the wire via a WOMBAT_TEST_PG_DSN-gated round-trip (skip in CI), with an explicit MUST-land-before-first-live-laptop-session obligation (an in-memory journal does not survive a real kill — RISK-5 honesty). The ACs are all substrate-independent semantics, so TK-25 remains fully production-verifiable against the double. (2) KILL TESTS: exactly the TK-24 mechanism — the journal OBJECT survives, the PendingSet instance is discarded; a wrapper journal that raises after N appends injects mid-operation kills; clear() appends the single PendingSetClear write-ahead THEN wipes memory, so a kill lands strictly before-append (nothing cleared) or after-append (fully cleared) — the atomicity IS the exactly-once proof; the 10 TK-24 scenarios are PORTED into tests/gate/test_pending_set.py against the production impl (AC4's own text) and tests/gate/test_pending_set_spike.py is DELETED as subsumed by the strictly-stronger production port (Q-43 freeze principle: mechanical supersession forced by in-place hardening; the spike finding stays recorded on TK-24). (3) MAX_PENDING: ALREADY exists as OperatingParams.max_pending (as-built TK-13, params.py) — NO TK-13 change; PendingSet takes max_pending as a required constructor arg (no default, no module literal; tests pass ints; TK-27's composition reads OperatingParams.max_pending); no TK-13 AC4 guard conflict (pending_set.py is not on the declared scan list and defines no owned literal). (4) EVENTS + SPLIT: CapacityEviction is a frozen dataclass defined in pending_set.py and RETURNED from add() (CapacityEviction-or-None), mirroring the as-built emission pattern Gate.decay() -> list[DecayEvent]; TK-21's canonical models.py is NOT touched (no files_in_scope creep into the canonical vocabulary). Split: aggregator.py = PURE stateless math over ScoredItems (cumulative_load exact sum; lowest-urgency selection reused by eviction); pending_set.py = the durable stateful set (add/remove/clear/list/rebuild_from_journal + write-ahead journaling), with PendingSet.cumulative_load() delegating to the aggregator over its snapshot (AC1 names the method on the set; the math stays pure and separately testable). TK-25 budget + files_in_scope amended (+test_pending_set.py, +test_pending_set_spike.py-for-deletion); +TK-29 (80 tickets).",
      links: ["TK-25","TK-24","TK-29","TK-2","TK-21","TK-13","TK-27","TK-14","Q-36","Q-43","Q-29"] }
  - { id: Q-45, type: open_question, status: resolved, scope: EP-8, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-25 verifier-found eviction-atomicity bug: capacity eviction journals Add(new) then Remove(evicted) as two independent appends — a kill between them rebuilds to max_pending+1, violating AC3 across a crash and the RISK-5 exactly-once claim; Remove-before-Add ordering vs a single atomic compound record?",
      description: "LIVE-REPRODUCED by the independent verifier (3-item set at max_pending=3, kill right after the 4th append -> rebuilt set had 4 items). The as-built add() eviction path appends PendingSetAdd(new) write-ahead FIRST, then PendingSetRemove(evicted) — two commit points for ONE compound op, so the kill window between them leaks a set-size violation into the durable log. The green 129-test suite was SILENT on it: AC3's test was non-kill and AC4's kill scenarios only exercised remove()-based drains. Candidate fixes: (1) reorder — journal Remove(evicted) BEFORE Add(new): worst-case kill-in-window loses the incoming (uncommitted) item and rebuilds to max_pending-1, never over; no new record type. (2) a single atomic PendingSetEvictAdd(evicted_id, new_item) record: both effects or neither; costs a new record type + replay branch + a TK-29 wire-schema impact.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — durability-semantics HOW ruling on TK-25; no locked decision/constitution/v1-scope/graph change). RULED option (1) REMOVE-BEFORE-ADD ordering — the simplest fix that is ACTUALLY correct, on four grounds. (a) INVARIANT: the size bound holds across a kill at every point by ordering alone — the only intermediate durable state is Remove-committed/Add-absent = max_pending-1, never max_pending+1. (b) EXACTLY-ONCE HONESTY: RISK-5's contract (TK-24) is 'a crash can never lose a COMMITTED mutation' — the interrupted add() never returned, so the incoming item was never committed; aborting an uncommitted op is clean write-ahead semantics, not loss. (c) WHOLE-SYSTEM CONVERGENCE (the deciding argument): the pending set's producer is the TK-2 at-least-once queue (lease/ack) — a process killed inside add() never acked the queue item, so on restart the item is REDELIVERED and the re-run add() lands in the max_pending-1 set as a plain insert; the system CONVERGES to exactly option (2)'s end state (new in, evicted out) with zero new record types, and idempotent set-replay makes the redelivery duplication-safe. The narrow residual (a spurious eviction of the lowest-urgency item if the producer is not the queue) fails toward SILENCE — the product-safe direction (quiet-by-default; same posture as DEF-3's fails-safe reasoning). (d) TK-29 SIMPLICITY: ordering is carried by the journal's existing append order — the pg adapter inherits the contract with NO schema change; option (2) would add a compound record_type + extra columns to a wire contract two tickets share. REJECTED option (2) as correctness-equivalent at system level but strictly more surface (scope discipline: simplest thing that satisfies the ACs). REQUIRED: TK-25 AC3 sharpened with the crash clause + the two regression scenarios (kill BETWEEN the two appends -> rebuild <= max_pending, uncommitted item absent, load consistent with replay; kill AFTER both -> new present, evicted absent, size == max_pending); the module docstring's exactly-once claim must state the Remove-before-Add ordering and the uncommitted-op abort semantics. Recorded (not left as a silent build-fix) because the ordering is a WIRE-LEVEL durability contract TK-29 must preserve and AC3 as written was proven under-specified.",
      links: ["TK-25","TK-24","TK-29","TK-2","Q-44","DEF-3"] }
  - { id: Q-46, type: open_question, status: resolved, scope: EP-2, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-2 build briefing: the canonical wombat Postgres conventions — done-bar vs zero-infra CI for DB-state ACs, psycopg package choice + dep files, migration-application mechanism, cold-boot coherence for the pg-requiring queue, and the connection/DSN injection shape",
      description: "TK-2 establishes wombat's own Postgres surface (TK-29 explicitly inherits its conventions; TK-152 and future DB tickets follow). Five gaps before build: (1) ALL FOUR TK-2 ACs assert real DB state — if every test skips without a DSN, TK-2 has no runnable check (done-bar violation); rule the canonical pg-test convention (gate+skip vs testcontainers vs psycopg-fake). (2) psycopg is NOT in pyproject.toml and pyproject/uv.lock are outside TK-2's files_in_scope. (3) How does 001_wombat_queue.sql reach the test DB — migration runner or direct application? (4) TASK-15 points at a 'cold-boot coherence note' that is not findable as a governance id, while the v1 default is zero-infra cold-boot and the queue requires pg. (5) TASK-13 says 'injected psycopg connection/DSN' — which, and who owns the connection? Also unowned: AC2's 'configured capacity' has no OperatingParams field.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — HOW/convention rulings + files_in_scope normalization; no locked decision/constitution/v1-scope/graph change). (1) CONVENTION (canonical, inherited by TK-29/TK-152+): DB-state tests are REAL-Postgres tests gated on WOMBAT_TEST_PG_DSN — pytest.skip with a LOUD reason when absent (fresh clone/CI never fails, never fakes); a DB ticket flips to done ONLY after the independent verifier RUNS the gated suite against a real/throwaway Postgres (docker one-liner documented in the test module; Docker 29.x confirmed available on the dev machine, no native pg needed). The done-bar demands a RUNNABLE check, not a CI-resident one — exactly the TK-23 precedent where the real-fixture 100%-agreement run happened locally. REJECTED: testcontainers (new dev dependency + plugin surface for infra v1 does not need — the one-liner suffices); a psycopg fake or Python SQL-double (re-implements ON CONFLICT/lease semantics in Python, proves nothing about the real wire, and creates a driftable parallel implementation — worse than an honest skip); note this does NOT contradict the TK-25 Protocol+double pattern, because there the double carried real write-ahead SEMANTICS proven by TK-24 while the pg wire was deferred to TK-29 — the queue's semantics ARE the SQL, so a double would be the dishonest kind. (2) DEPENDENCY: psycopg v3 (psycopg[binary]) — modern, typed, maintained; psycopg2 rejected as legacy; TK-2 files_in_scope += pyproject.toml + uv.lock. (3) MIGRATIONS: NO framework (NG-3) — numbered IDEMPOTENT .sql files under src/wombat/migrations/; the owning module ships ensure_schema(conn) executing its own packaged .sql via importlib.resources; tests and the composition root call it; revisit only if cross-file ordering ever becomes real. (4) COLD-BOOT: the note EXISTS — it is Q-36 (resolved v0.17/v0.18): cold-boot is a cog-worx-SUBSTRATE unit-test property; wombat's own queue/ledgers REQUIRE Postgres; NO in-memory queue variant, NO no-op mode (a silent no-op queue would fake the drain pathway); a whole-system v1 run needs local same-host pg (TK-150). TASK-15's dangling pointer fixed to cite Q-36. (5) INJECTION: DSN string injected (Q-41/TK-29 pattern, no module DSN literal); WombatQueue OWNS one lazy psycopg connection (no pooling, single-host DEC-6); max_size is a required injected int — the OperatingParams queue_max_size field is a PRE-AUTHORIZED one-field TK-13 addition when the drain pathway wires the queue. PLUS the AC3 mechanism ruled concretely: EPOCH-BASED lease reclaim (per-instance uuid; drain leases with leased_by=epoch, never re-returns own-epoch rows, reclaims different-epoch rows — sound under single-host single-process DEC-6; restart = new epoch = redelivery; ack deletes exactly once; no lease timeouts/clocks). TK-2 budget + files_in_scope + TASK-15 amended.",
      links: ["TK-2","TK-29","TK-152","TK-13","TK-1","Q-36","Q-41","Q-44","Q-45","TK-23"] }
  - { id: Q-47, type: open_question, status: resolved, scope: EP-4, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-5 build briefing (first cog-worx Stage integration): drain(batch_size) missing from the as-built queue, the spine-wide inter-stage Artifact convention, Wait-heartbeat shape, partial-pathway registration, and the StageContext test double",
      description: "TK-5 sets the Stage conventions TK-6/7/8/10 inherit. Verified cog-worx shapes: Stage{name, transitions, async run(ctx)->StageResult}; StageResult union Transition/Done/AwaitHuman/Degraded/Wait{to, wake_at:absolute-from-ctx.clock, output}; data flows between stages ONLY via the journaled output Artifact{kind, produced_by, data:dict} pulled with ctx.last_output(stage_name); StageContext is a large Protocol; cogworx.testing.doubles ships NO StageContext double (verified). Gaps: (1) BLOCKER — as-built WombatQueue.drain() takes no limit (leases+returns ALL ready rows) while AC1 needs batch_size=2 of 3 with the 3rd REMAINING; in-memory slicing orphans leased rows; queue.py is outside TK-5 files_in_scope. (2) No agreed Artifact kind/produced_by/data schema for the drained batch or how TK-6 deserializes. (3) Wait heartbeat: to-target, interval source, idle artifact. (4) drain_pathway.py must be coherent without the unbuilt GateStage. (5) What StageContext double do tests use, and which ctx members may the stage touch?",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — HOW/seam + convention rulings + files_in_scope normalization; no locked decision/constitution/v1-scope/graph change). (1) DRAIN LIMIT: fix at the QUEUE — drain(limit: int | None = None), FIFO-ordered SQL LIMIT that leases ONLY those N rows; None preserves drain-all so every existing TK-2 gated test stays green untouched; a NEW gated test asserts limit=2 of 3 leases exactly 2 and the 3rd stays UNLEASED and same-epoch-drainable. In-memory slicing REJECTED (drain-all leases all rows, so passing 2 downstream orphans the 3rd as leased-but-unhanded until a restart-reclaim — a correctness hazard, not a style choice). TK-5 files_in_scope += queue.py + test_queue.py. (2) ARTIFACT CONVENTION (canonical, spine-wide): kind = 'wombat.<snake_case_noun>' ('wombat.drained_batch', 'wombat.drain_heartbeat'; future stages follow — e.g. 'wombat.gate_decision', 'wombat.composed_output'); produced_by = the stage's canonical snake_case name verbatim ('drain_queue', 'gate', 'review_or_speak', 'compose_dispatch', 'compose') so ctx.last_output(name) keys are stable; batch data = {'items': [QueueItem-fields-as-dict...]}; the kind constants + to/from helpers (queue_items_to_artifact_data / queue_items_from_artifact_data) are homed ONCE in src/wombat/stages/artifacts.py and TK-6 MUST deserialize through them — the Q-41 shared-wire-helper principle applied to the stage seam. (3) WAIT: to = 'drain_queue' itself (re-park to re-drain on wake — DEC-8 idles-on-empty realized); wake_at = ctx.clock() + timedelta(seconds=poll_interval_seconds), NEVER wall-clock; idle output = Artifact(kind='wombat.drain_heartbeat', data={}) (honest journaled 'nothing drained', distinct kind so it is never mistaken for a batch); poll_interval_seconds and batch_size are INJECTED constructor args, with OperatingParams fields drain_poll_interval_seconds/drain_batch_size PRE-AUTHORIZED as TK-13 one-field additions at composition wiring (established pattern). (4) PARTIAL PATHWAY: build_drain_pathway(*stages) BUILDER in pathways/drain_pathway.py assembling injected stages; NO placeholder sink ships in src (throwaway production code rejected) — TK-5's pathway test supplies a test-local terminal sink; TK-7 owns the full real assembly per its e2e AC. (5) CTX DISCIPLINE + DOUBLE: DrainQueueStage touches ONLY ctx.clock(); the WombatQueue is an injected constructor dep (ASMP-2: the composition root passes THE single instance); the stage NEVER acks (TK-7 acks on hold/completion — at-least-once preserved) and NEVER writes the journal (the engine journals StageResults). cog-worx ships no StageContext double, so wombat builds tests/support/stage_context_fake.py implementing the FULL Protocol with NotImplementedError everywhere except clock (+ configurable last_output for TK-6/7/8/10 reuse) — strict-mypy-satisfying AND loud on any accidental ctx-surface creep. AC3 is proven at the queue layer (fresh instance/new epoch redelivers, the TK-2-proven mechanism) — no engine re-simulation. TK-5 budget + files_in_scope amended.",
      links: ["TK-5","TK-2","TK-6","TK-7","TK-8","TK-10","TK-13","TK-21","ASMP-2","Q-41","Q-46"] }
  - { id: Q-48, type: open_question, status: resolved, scope: EP-4, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-6 build briefing: gate/decision.py collides with TK-21's canonical vocabulary; stub-vs-real scoring now that TK-23/25/42 are built; which PresenceSnapshot the stage consumes before TK-11; and the GateStage artifact-in/artifact-out convention",
      description: "Four pre-build gaps. (1) TK-6 files_in_scope lists gate/decision.py, but GateDecision/GateAction/ScoredItem already exist canonically in gate/models.py (TK-21, ISS-4 forbids competing definitions) and gate/ is already populated. (2) TK-6's ACs predate the real scoring build — they specify stub fixed values, while TK-23 (scoring), TK-25 (pending set) and TK-42 (UserModel) are all done and TK-27 is the designed real-gate convergence; stub or real here? (3) The ACs condition on PresenceSnapshot (unknown/stale -> hold) but the production presence_hold is TK-11 (later on the demo path); what does TK-6 consume now? (4) GateStage must consume TK-5's drained-batch artifact and emit a decision artifact TK-7 reads — kind/produced_by/data schema and batch-vs-per-item undefined.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — HOW/seam rulings + files_in_scope normalization; no locked decision, constitution item, or v1 scope touched; no graph change). (1) decision.py DROPPED from scope — the canonical vocabulary in gate/models.py is imported, never redefined (ISS-4 upheld); gate/gate.py holds gate_item_from_queue_item + stub_evaluate. (2) STUB STANDS: TK-6 proves the STRUCTURAL silence-default in the pathway wiring, which is its stated intent; wiring TK-23's real scoring now would drag the Q-41 async RatingParams composition (UserModel/EntityKG) into an mvp waypoint, duplicate TK-27's designed convergence work, and be rebuilt within days — the demo milestone (v0.39) is AT TK-27. The deliverable is the REPLACEMENT SEAM: GateStage takes an injected evaluate callable (GateItem, PresenceSnapshot|None) -> GateDecision; TK-6 ships stub_evaluate (payload['stub_urgency'] high->0.9/low->0.1, DEFAULT LOW = quiet default; >= injected urgency_threshold -> SURFACE_IMMEDIATE else HOLD; threshold injected, composition passes OperatingParams.urgency_threshold, no inline literal); TK-27 swaps the evaluator without touching GateStage. Per-item decisions reuse the canonical GateDecision(action, items=(ScoredItem,)) — no new type. (3) PRESENCE INTERIM: consume the TK-4 spike PresenceSnapshot + its PROVEN conservative presence_hold from presence/probe.py as-is (consuming a frozen spike is not extending it — Q-43 freeze principle; the predicate is the tested safety property, DEF-3); evaluate applies the hold BEFORE scoring (Q-12 — presence is a gate hold, never a scoring input); unknown/stale/low-confidence -> HOLD asserted by test. TK-11 hardens the predicate into gate/presence_hold.py + sources/presence.py and flips this import — already TK-11's AC4 obligation, so no new debt is created. (4) STAGE SEAM: input via ctx.last_output('drain_queue') + queue_items_from_artifact_data (Q-47 helper, never hand-parsed); output = ONE batch artifact Transition(to='review_or_speak', kind='wombat.gate_decisions' (plural — batch-symmetric with the drained batch), produced_by='gate', data={'decisions': [{'action', 'scored_item', 'queue_item'}...]}) where each entry carries the ORIGINAL Q-47 queue-item dict so TK-7 can ack holds; the to/from helpers are ADDED to stages/artifacts.py and TK-7 MUST deserialize through them (the Q-41/Q-47 shared-wire-helper principle). GateStage ctx surface = last_output only; heartbeats never reach it (drain Waits on empty). TK-6 budget + files_in_scope amended (decision.py dropped; artifacts.py added).",
      links: ["TK-6","TK-21","TK-23","TK-27","TK-11","TK-4","TK-5","TK-7","TK-13","Q-47","Q-41","Q-12","Q-17","Q-43"] }

