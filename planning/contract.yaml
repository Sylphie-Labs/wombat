  - id: TK-164
    kind: ticket
    parent: EP-30
    title: 'SpeakSink: terse TTS output Stage gated on speak-event only'
    intent: As a user, I hear a terse spoken output ONLY when the deterministic gate decides to speak (a rare speak-event) — I am never surprised by unsolicited audio; the system is silent otherwise (CON-3).
    status: todo
    priority: P2
    estimate: M
    engineering_level: mvp
    complexity_budget: One Stage (SpeakSink) receiving a surfaced decision artifact (canonical GateAction/item_kind from TK-21/ISS-4 — there is NO 'speak-event'/'text-only' gate action; speak-vs-text is THIS sink's concern). SpeakSink fires TTS only when (a) the artifact is a surface_* action AND (b) voice_enabled is true for this delivery; on a hold action, or when voice_enabled is false, it is a silent no-op. Uses a local TTS library behind a thin swappable adapter. One-shot terse render; no chatty speech (CON-3, TECH-11).
    acceptance_criteria:
      - given: a surfaced artifact (action=surface_immediate or surface_flush, canonical enum) delivered to SpeakSink with voice_enabled=true
        when: SpeakSink.run() is called with that artifact
