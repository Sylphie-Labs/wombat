schema_version: "1.0"
kind: contract

meta:
  project_id: "wombat"
  title: "wombat — The Steward (quiet personal-assistant agent on cog-worx)"
  status: planning
  stage: analyze
  created_at: "2026-06-19"
  updated_at: "2026-06-21"

# Durable rules, including what NOT to build. Kept short (compliance cliff).
constitution:
  - { id: CON-1, kind: must,  rule: "The deterministic core owns all detection and decision; the LLM is only a mouth that renders pre-decided output." }
  - { id: CON-2, kind: never, rule: "Let the model decide whether or when to interrupt, act, or surface." }
  - { id: CON-3, kind: must,  rule: "Silence is the default; nothing surfaces until it clears the deterministic gate." }
  - { id: CON-4, kind: must,  rule: "Write every side-effectful action to a reviewable, human-readable trail before it happens." }
  - { id: CON-5, kind: never, rule: "Perform unattended sensitive auth or irreversible/high-consequence actions; hand off to the human (review-before-send)." }
  - { id: CON-6, kind: must,  rule: "Model only what the user does and what works; never infer, store, or act on motive/'why'." }
  - { id: CON-7, kind: must,  rule: "Keep user data on the user's host by default; build on cog-worx and do the simplest thing that meets the acceptance criteria." }
  - { id: CON-8, kind: prefer, rule: "Prefer cheap models for the mouth and deep native integrations over shallow breadth." }

vision:
  problem: >-
    Every personal-assistant agent on the market fails the same way: it talks too much. It
    delegates the "is this worth interrupting you?" judgment to an LLM, so it becomes a
    notification firehose with a nicer voice — untrustworthy, noisy, quickly muted. Self-hosted
    assistants additionally carry a poor security/privacy reputation. There is no quiet,
    trustworthy assistant that owns detection and decision in deterministic code and keeps the
    user's data on the user's own host.
  outcome: >-
    A personal assistant ("the Steward") that runs the user's digital estate quietly in the
    background and only speaks when it has cleared a deterministic bar — so when it speaks it is
    trusted on sight. The user stops thinking about inbox/calendar maintenance; overnight work is
    done by morning; the one nudge that lands is load-bearing, not noise. Understanding of the user
    compounds week over week instead of resetting each session. Data stays local; nothing
    side-effectful happens off a reviewable trail.
  measurable_goals:
    - "Quiet by default: a hard, per-event-class ceiling on unsolicited surfacings per day."
    - "Trusted on sight: 0 LLM-decided interruptions — every surfaced item cleared the deterministic gate (Urgency + Cognitive Load)."
    - "Morning brief: exactly one consolidated brief per morning (overnight triage + conflicts-with-alternatives + prep notes), not a stream."
    - "Auditable: 100% of side-effectful actions recorded in a human-readable trail; 0 unattended sensitive-auth actions."
    - "Compounding: the empirical user model measurably sharpens week-over-week via the nightly consolidation pass (no per-session reset)."
  target_users:
    - "Individuals running an always-on local host (Jetson / small ARM box / VPS) who want a private, self-hosted PA."
    - "Knowledge workers whose calendar + inbox are the daily wedge and who are repelled by chatty assistants."
    - "Privacy-conscious users requiring local data residency and an auditable action trail."

# Project-level negative space — the over-engineering guard.
non_goals:
  - { id: NG-1, statement: "No theory of motive / no 'why'.", rationale: "Inferred causes, psychological profiles, and motive are unverifiable, add a failure mode for zero payoff, and are never surfaced, stored, or used by the gate. Model what the user does and what works." }
  - { id: NG-2, statement: "No clinical or therapy function.", rationale: "Decision-support scaffolding only; no diagnosis, no therapy framing." }
  - { id: NG-3, statement: "No dashboards and no nagging.", rationale: "One load-bearing observation over many; no analytics UI." }
  - { id: NG-4, statement: "No LLM in the loop for runtime decisions.", rationale: "The model is a mouth; it never decides whether or when to act (cog-worx S9)." }
  - { id: NG-5, statement: "No unattended sensitive auth (passkeys, hardware keys, payments, irreversible actions).", rationale: "Handed to the human; no unattended credential entry." }
  - { id: NG-6, statement: "No shallow, breadth-first (Zapier-style) integrations in v1.", rationale: "Depth on the proven wedge first; count is marketing, depth is the product." }
  - { id: NG-7, statement: "No cloud-first data storage.", rationale: "Local-first data residency by default; privacy as character, not a toggle." }
  - { id: NG-8, statement: "No Outlook / non-Gmail email providers in v1.", rationale: "Depth-first: one provider done deeply. Converted from Q-8." }

constraints:
  - { id: CST-1, statement: "Runs on an always-on local host and must survive laptop sleep (watch overnight)." }
  - { id: CST-2, statement: "Local-first data residency by default." }
  - { id: CST-3, statement: "Cheap-model budget for the mouth; the deterministic core spends no tokens to decide." }
  - { id: CST-4, statement: "Built on cog-worx (Python 3.13; polyglot substrate Neo4j + Postgres[pgvector+TimescaleDB] + OpenTelemetry); model-agnostic via cog-worx's S4 Model seam." }
  - { id: CST-5, statement: "Browser automation favors accessibility-tree (Playwright) over screenshot computer-use for reliability and token efficiency." }

tech_stack:
  - { id: TECH-1,  name: "cog-worx", rationale: "Cognitive framework: loop, journal/durability, memory, capabilities, model seam. wombat is an adopter (CST-4, CON-7, S2/S6).", decision_ref: DEC-12 }
  - { id: TECH-2,  name: "Python", version: "3.13", rationale: "Matches cog-worx (CST-4).", decision_ref: DEC-12 }
  - { id: TECH-3,  name: "Neo4j", rationale: "Graph KGs + user model (cog-worx S3); local residency (CON-7).", decision_ref: DEC-12 }
  - { id: TECH-4,  name: "Postgres (pgvector + TimescaleDB)", rationale: "Latent space + durable journal in one cluster (cog-worx S3).", decision_ref: DEC-12 }
  - { id: TECH-5,  name: "OpenTelemetry", rationale: "Spans/observability (cog-worx S3).", decision_ref: DEC-12 }
  - { id: TECH-6,  name: "DeepSeek via OpenAICompatModel", rationale: "The mouth: cheap, swappable behind S4 (DEC-4, CON-8, CST-3).", decision_ref: DEC-18 }
  - { id: TECH-7,  name: "wombat.gate (deterministic Python)", rationale: "Two-axis pressure gate, no model calls (DEC-1, S9).", decision_ref: DEC-13 }
  - { id: TECH-8,  name: "Google Calendar API (read-only)", rationale: "Read-only observer; scope-enforced (DEC-3/DEC-5, FEAT-5).", decision_ref: DEC-14 }
  - { id: TECH-9,  name: "Gmail API", rationale: "Drafts created, never auto-sent (DEC-9, NG-8, CON-5).", decision_ref: DEC-19 }
  - { id: TECH-10, name: "Playwright (Python)", rationale: "Accessibility-tree browser automation; external-tier capability (CST-5, DEC-10).", decision_ref: DEC-19 }
  - { id: TECH-11, name: "Local ASR + TTS", rationale: "Voice as a registered input source + terse output (DEC-7, FEAT-12, CST-2).", decision_ref: DEC-14 }
  - { id: TECH-12, name: "cog-worx Wait + Sweeper (durable timers)", rationale: "Morning-brief & nightly-dream scheduling; survives crash/sleep (DEC-8, S6).", decision_ref: DEC-16 }
  - { id: TECH-13, name: "Static psychology KB (YAML/JSON)", rationale: "Curated behavioral levers; never model-authored (FEAT-9, CON-6).", decision_ref: DEC-13 }

# Flat list of self-similar work nodes. Tree comes from `parent`. kind sets the level.
# Vision stage = top-level feature nodes only. Epics/tickets come in /plan-design + /plan-tickets.
nodes:
  - { id: FEAT-1,  kind: feature, parent: null, title: "Core engine — queue-driven deterministic loop + LLM-as-mouth", intent: "The deterministic loop drains a queue of registered inputs; the gate decides what surfaces; the model only phrases pre-decided output, with a reviewable action trail. Empty queue => the loop idles. This is the spine the whole product hangs on.", status: todo, priority: P1 }
  - { id: FEAT-2,  kind: feature, parent: null, title: "Interruption gate — two-axis pressure engine (Urgency x Cognitive Load)", intent: "A custom deterministic decision engine (modeled on sylphie's drive engine): every event is rated on Urgency and Cognitive Load; ratings are personalized/adaptive; crossing the bar earns the interruption. The single most important component.", status: todo, priority: P1 }
  - { id: FEAT-3,  kind: feature, parent: null, title: "Memory & empirical user model (cog-worx + thin PA layer)", intent: "cog-worx's memory/recall/world+user model as the store, plus a thin PA-specific empirical user model (behavior + outcomes, never motive) that supplies and updates the gate's per-event Urgency/Cognitive-Load ratings.", status: todo, priority: P1 }
  - { id: FEAT-4,  kind: feature, parent: null, title: "Offline consolidation ('dreaming')", intent: "Overnight batch pass that reviews logs/transcripts, extracts patterns, merges/dedupes memory, surfaces insights, and re-tunes the gate's event ratings from observed outcomes — cheap because batch, off the hot path (cog-worx S1).", status: todo, priority: P1 }
  - { id: FEAT-5,  kind: feature, parent: null, title: "Calendar integration (Google, read-only observer)", intent: "Deep read-only Google Calendar: observe the real schedule to feed conflict detection, realism/adherence signals, and brief prep. wombat's own plan lives in cog-worx; it does NOT write back to Google Calendar in v1.", status: todo, priority: P1 }
  - { id: FEAT-6,  kind: feature, parent: null, title: "Email integration (Gmail only, native deep)", intent: "Deep Gmail integration: overnight triage, voice-matched draft replies held for review, task extraction, priority inference, context batching. Gmail only in v1.", status: todo, priority: P1 }
  - { id: FEAT-7,  kind: feature, parent: null, title: "Morning brief (flagship ritual)", intent: "One consolidated daily brief from the combined calendar + Gmail slice — overnight recap, conflicts-with-alternatives, prep notes — delivered once. The v1 north star.", status: todo, priority: P1 }
  - { id: FEAT-8,  kind: feature, parent: null, title: "Behavior & efficiency analysis (motivational layer)", intent: "Event logging + pattern detection (via the nightly pass) + productivity-window modeling + a single honest pattern reflection when it matters — never a dashboard, never a diagnosis.", status: todo, priority: P2 }
  - { id: FEAT-9,  kind: feature, parent: null, title: "Psychology KB — behavioral levers (internal)", intent: "A small curated, evidence-based KB the gate conditions on (which pattern warrants a nudge) and the mouth phrases with — never recited at the user, never clinical, autonomy-preserving.", status: todo, priority: P2 }
  - { id: FEAT-10, kind: feature, parent: null, title: "Browser / computer use (in v1)", intent: "Accessibility-tree browser automation (Playwright) as the workhorse, niche screenshot computer-use, web lookups/research, form-filling, with explicit login handoff to the human.", status: todo, priority: P3 }
  - { id: FEAT-11, kind: feature, parent: null, title: "Privacy, safety & action trail", intent: "Local data residency, no action without a reviewable trail, review-before-send for high-consequence outbound, no unattended sensitive auth — privacy as character.", status: todo, priority: P1 }
  - { id: FEAT-12, kind: feature, parent: null, title: "Voice & interaction (in v1, as a registered input source)", intent: "Voice is in v1 'out the box' — but built as one registered input source on the loop's input queue (not a special path), plus terse load-bearing spoken/text output on rare speak-events. Full capability without speech.", status: todo, priority: P2 }
  - { id: EP-1, kind: epic, parent: FEAT-1, title: "Engine assembly & wombat bootstrap", intent: "Construct the cog-worx Engine with wombat's ModelRegistry/BudgetPolicy/Registry/RecallStack/personality/rules; one composition root.", status: todo, priority: P1 }
  - { id: EP-2, kind: epic, parent: FEAT-1, title: "Durable work queue (WombatQueue)", intent: "Bounded, persisted enqueue/drain with idempotent items; queue is wombat domain state, journal stays run authority.", status: todo, priority: P1 }
  - { id: EP-3, kind: epic, parent: FEAT-1, title: "Source registry & registration contract", intent: "Pluggable input-source contract (id/poll/push/map) + lifecycle; adding a source is registration, not a rewrite (DEC-5).", status: todo, priority: P1 }
