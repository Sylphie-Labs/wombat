    estimate: S
    engineering_level: production
    complexity_budget: "One psycopg adapter class implementing the TK-25 PendingJournal Protocol (append(record); replay() -> ordered records) over ONE append-only table (bigserial seq primary key preserves replay order; columns for record_type add/remove/clear + the ScoredItem fields), plus its migration. Follows the wombat-owned-Postgres conventions TK-2 establishes (migrations home, connection handling); dsn is an INJECTED constructor arg — sourcing it is the composition root's concern (same pattern as the Q-41 user_id ruling), no module-level DSN literal. The write-ahead/replay/atomic-clear SEMANTICS are already proven substrate-independently through the Protocol by TK-25's CI tests; this ticket verifies the WIRE via a round-trip integration test gated on a WOMBAT_TEST_PG_DSN env var (pytest.skip when absent, so CI stays zero-infra — mirrors the TK-23 AC4 local-real-fixture pattern). MUST land before the first live laptop session (the DEF-3 revisit-trigger session): an in-memory journal does not survive a real kill, so a live run without this adapter would dishonestly claim RISK-5 durability (Q-44). Q-70 BUILD RULINGS (2026-07-03): (1) MIGRATION = 005_pending_journal.sql — strictly monotonic numbering, a released slot (002, Q-68) is NEVER reused (history stays unambiguous about what 002 ever was); per-module ensure_schema(conn) in pending_journal_pg.py via importlib.resources (the three as-built precedents). (2) THE REAL SEAM (as-built gate/pending_set.py): runtime_checkable Protocol PendingJournal { append(record: JournalRecord) -> None; replay() -> Sequence[JournalRecord] } over the frozen records PendingSetAdd{item_id: str, item_kind: ItemKind, urgency: float, load: float, added_at: float = 0.0 — the Q-55 rider, legacy default 0.0}, PendingSetRemove{item_id}, PendingSetClear{} — implement THIS, invent nothing. (3) Q-45/ASMP-2 FOR PG: the Remove-before-Add eviction ordering is EMITTED BY PendingSet (the caller) — the adapter's whole obligation is FIDELITY: persist records in exactly append order and replay in exactly seq order (bigserial ASC), ONE INSERT per append() in its own implicit transaction, NEVER batch/buffer/reorder/coalesce — so a kill between the two eviction appends durably leaves exactly the prefix (the Q-45 crash semantics ride append order, nothing else); ASMP-2 single-process means no locking/contention machinery (NG-3), one lazy injected-DSN connection (Q-46). (4) SCHEMA: pending_journal(seq BIGSERIAL PRIMARY KEY, record_type TEXT NOT NULL, item_id TEXT NULL, item_kind TEXT NULL, urgency DOUBLE PRECISION NULL, load DOUBLE PRECISION NULL, added_at DOUBLE PRECISION NULL, created_at TIMESTAMPTZ NOT NULL DEFAULT now()) — nullable payload columns because Clear carries none; NO pg enum (record_type vocabulary lives writer-side, the Q-63 pattern); item_kind serialized as .value, reconstructed ItemKind(value) (Q-49). (5) IDENTITY: item_id is stored VERBATIM — it already IS the canonical identity (TK-12-derived upstream at the producers); the adapter re-derives nothing. (6) DISTINCT TABLE from wombat_queue — the pending set is post-ack GATE custody (the TK-27 custody switchover: hold = durable PendingSet custody BEFORE queue ack), not a queue view/projection."
    acceptance_criteria:
