      - tests/presence/test_probe.py
  - id: TK-11
    kind: ticket
    parent: EP-3
    title: Harden the presence hold — production conservative-on-stale guarantee the gate ceiling depends on
    intent: As the production gate (TK-27/TK-28), I depend on the presence hold being a STRUCTURAL guarantee — when the PresenceSnapshot is missing, stale, or low-confidence the gate holds (do-not-interrupt) — so I need the presence path hardened to production beyond TK-4's prototype spike, because the quiet-by-default/silence guarantee leans on it being load-bearing, not on prototype-grade code (RISK-3, CON-3, Q-17/C).
    status: todo
    priority: P1
    estimate: S
    engineering_level: production
    complexity_budget: "Harden TK-4's prototype: promote the single-signal PresenceSource to production quality (typed PresenceSnapshot with explicit staleness + confidence; deterministic state machine active|idle|away|unknown). The LOAD-BEARING part is the gate-side contract: a single canonical presence_hold(snapshot) -> bool used by TK-6/TK-27 that returns conservative (hold) for unknown/stale/low-confidence, with property-based tests over the staleness/confidence boundary. No multi-signal fusion (still single OS idle signal, per DEC-6); the hardening is in the staleness/confidence contract and its test rigor, not new sensors. No sleep/wake DETECTION (that is the ledger boundary, TK-28) — but a snapshot whose timestamp predates a sleep gap reads as STALE and therefore holds."
