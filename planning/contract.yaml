  - id: TK-12
    kind: ticket
    parent: EP-2
    title: Canonical item identity — derive the queue idempotency_key from a per-source natural id, so outcome labels bind cleanly
    intent: As the queue, the gate, and the outcome loop, I share ONE rule for deriving a QueueItem's idempotency_key from each source's natural id (calendar event_id, Gmail message_id, extracted-task id, presence/asr ephemeral id) so that dedup (TK-2/TK-72/TK-75), gate pending-set identity (TK-21), and outcome-label binding (TK-45/TK-50) all key on the SAME stable identity — and an OUTCOME_* claim can always be traced back to the exact source item it rates (Q-18/D).
    status: done
    priority: P1
    estimate: S
    engineering_level: production
    complexity_budget: "One small identity module: a canonical idempotency_key = f(source_id, source_natural_id) function plus a typed ItemRef(source_id, source_natural_id) carried on every QueueItem and propagated onto the gate's pending-set entries and the outcome claim's subject. No new store — this is a convention + a derivation function the existing dedup/labeling code calls. Sources keep their own natural ids (event_id, message_id); this ticket only fixes the ONE mapping so they no longer key three different ways. Ephemeral sources (presence/asr) get a generated uuid natural id so the function is total."
    acceptance_criteria:
      - given: a CalendarEventItem (natural id event_id) and a GmailMessageItem (natural id message_id)
        when: each is mapped to a QueueItem
        then: both carry an ItemRef(source_id, source_natural_id) and an idempotency_key derived by the canonical function; a test asserts the same source item always derives the same key (stable) and two different source items never collide.
      - given: a TaskItem extracted from a Gmail message (TK-77)
        when: its ItemRef is constructed
        then: it references the originating message via source_natural_id in a way that lets an outcome claim be traced to that message (the extracted-task identity is distinct from but linkable to its parent message_id) — a test asserts the link is recoverable.
      - given: an OUTCOME_* claim written by TK-45 for a surfaced item
        when: the claim's subject is inspected
        then: it carries the item's canonical idempotency_key / ItemRef, so the RatingTuner (TK-49) and the inference rules (TK-50) bind the outcome to the exact gate item and its source — closing the cross-source id-reconciliation gap (Q-18); a test asserts a Gmail-derived outcome and a calendar-derived outcome are distinguishable and correctly attributed.
      - given: the dedup paths in TK-2 (idempotency_key), TK-72 (event_id) and TK-75 (message_id)
        when: a reviewer checks how each computes identity
        then: all three resolve through the canonical derivation (no three independent ad-hoc keying schemes); a test asserts a calendar event and a Gmail message that happen to share a raw natural-id string do NOT collide because source_id is part of the key.
    non_goals:
      - Does not entity-resolve across sources (a calendar event and an email about it stay distinct items) — only canonicalizes per-item identity so labels bind cleanly.
      - No new persistence layer — derivation + ItemRef convention over existing QueueItem/claim shapes.
      - Does not change FIFO/ordering or capacity semantics (TK-2 owns those).
      - No motive/why field on ItemRef (CON-6/NG-1).
    depends_on:
