      - Does not re-litigate the planning authorization — it is GRANTED (DEC-22); this ticket only binds the policy and performs the build-time flag enablement, and stays inert/fails-closed until that flag is set.
      - No unattended external action — every admitted external call still passes AwaitHuman + taint (DEC-19).
    depends_on:
