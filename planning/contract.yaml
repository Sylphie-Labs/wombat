    complexity_budget: "Pass (a) of the Q-13 split: two trigger arms + per-class daily ceiling ledger (Postgres) wired into gate.pipeline(); emit GateDecision artifacts only, using the canonical GateAction + item_kind enums from TK-21 (ISS-4 — no private vocabulary). The ceiling ledger uses the shared DailyLedger primitive (TK-152, Q-15) for its day boundary. flush_min_age_seconds and the arm thresholds are read from the TK-13 OperatingParams store (audit gap — no inline literals). EXPOSES (Q-30, brief-selection seam) a threshold-free, pending-set-PRESERVING per-item selection callable gate.select_items(items) used by the brief forced-flush (TK-99): it runs the SAME per-item selection predicate the flush arm uses but (a) skips the load/min-age guard and (b) does NOT mutate or clear the pending set — distinct from the live consolidated-flush arm which DOES clear. The live flush-arm's pending-set clear is a DURABLE, JOURNALED bulk remove provisioned by TK-25 (audit gap — TK-25 widened to own a journaled clear/drain-all so the clear stays exactly-once across a kill). No decay, no midnight reset, no kill-test (TK-28). No mouth/compose wiring. Q-55 CONVERGENCE COMPOSITION (v0.55): (1) HOME — gate/pipeline.py's Gate is REBUILT IN PLACE (Q-39 pattern) as the thin ASYNC orchestrator; trigger.py = the two arms + the ONE shared per-item worth predicate is_surfacing_worthy(scored, urgency_threshold); ceiling.py = CeilingLedger over the TK-152 DailyLedger. Gate(*, user_model, pending_set, ceiling, urgency_threshold, load_flush_threshold, flush_min_age_seconds, clock, on_event) — all values keyword-INJECTED (composition passes OperatingParams fields; no inline literals); TK-21's skeleton internal pending dict is REPLACED by the injected TK-25 PendingSet; skeleton tests port to the new construction; decay stays OUT (TK-28). (2) ASYNC — async def pipeline(items, *, surfacing_permitted=True) -> GateDecision; per item: rp = await user_model.ratings_for(gate_item); u = urgency(item, rp); l = cognitive_load(item, rp) (Q-41/42: awaited params bound into the pure sync ScoreFns). surfacing_permitted=False (presence holds, computed by the CALLER per Q-12/Q-54 — the Gate never imports presence types) -> skip BOTH arms, items still score + accumulate (presence suppresses surfacing, never accumulation). (3) ARMS, ONE GateDecision per call: item present -> immediate arm (surfacing_permitted AND u > urgency_threshold AND ceiling.allow(event_class)) -> ceiling.record + surface_immediate; else pending_set.add(scored, added_at=clock()); then EVERY call (including pipeline([]) heartbeat) evaluates the flush arm (surfacing_permitted AND cumulative_load() > load_flush_threshold AND oldest added_at age >= flush_min_age_seconds) -> surface_flush(ALL pending sorted by urgency desc) + the TK-25 durable journaled clear(); else HOLD. CeilingHit + CapacityEviction events route through the injected on_event callback (default logs loudly; tests inject a recorder). (4) CEILING — per EVENT CLASS (the DEC-13 personalization key; resolved via the injected user_model.resolve_event_class), ledger_name = ceiling:<EventClass.value>; trigger.py depends on a small CeilingProtocol (allow/record) so arm unit tests use a fake; CeilingLedger's own tests are WOMBAT_TEST_PG_DSN-gated (Q-46). (5) MIN-AGE RIDER (sanctioned) — the PendingSet wire gains added_at: float on the PendingSetAdd RECORD (not on the canonical ScoredItem); PendingSet.add(item, *, added_at) + an oldest-age accessor; replay of legacy records defaults added_at=0.0 (no persisted prod data exists; TK-29 unbuilt so the pg wire inherits the new shape free); gate/pending_set.py + tests in scope for this. (6) select_items (Q-30) — the shared predicate IS is_surfacing_worthy (u > urgency_threshold), i.e. ceiling-free/presence-free/load-free/min-age-free; async select_items(items) scores via awaited ratings_for, filters by the ONE shared function, sorts by urgency desc, and touches NOTHING (no pending mutation, no ceiling read/record, no events) — AC4 asserts pending contents + cumulative_load identical; CLARIFICATION recorded: the flush arm's INCLUSION criterion is membership-in-pending (AC3 all-pending), so what select_items shares with the arms is the WORTH predicate, not the membership rule. (7) GUARD ENFORCING — pipeline.py/trigger.py/ceiling.py added to _PRODUCTION_CONSUMER_PATHS in tests/unit/test_wombat_params.py (in scope). (8) CUSTODY SWITCHOVER (Q-51/52 revisit) — hold now means DURABLE PendingSet custody (write-ahead add during GateStage.run) BEFORE review_or_speak acks the queue row; the Q-52 crash window collapses to a harmless idempotent re-add (crash between add and ack -> new-epoch redelivery -> re-score -> set-semantics dedupe); review_or_speak behavior is structurally unchanged (ack every decision's live queue row; flush decisions carry pending items with no live rows — nothing to ack). DEMO SHAPES ruled now, implemented in the post-TK-27 HARNESS step (NOT in TK-27 — no-Stage-wiring non_goal): GateStage's injected seam generalizes to an ASYNC BATCH evaluator (async evaluate(items, presence) -> GateDecision; the production adapter computes surfacing_permitted = not presence_hold(provider snapshot) once per batch then awaits gate.pipeline) — sanctioned harness rider on stages/gate_stage.py + tests + e2e; surface_flush flows to compose as ONE synthesized digest entry (harness-level terse digest; the REAL brief composition is TK-99/TK-100's); batch_size=1 STANDS for the demo; in-spine flush evaluation runs on item-carrying cycles (drain Waits on empty so no heartbeat reaches the gate — a dedicated tick pathway is TK-28/TK-97 territory, recorded not dropped)."
