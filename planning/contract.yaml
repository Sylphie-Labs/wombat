    title: Two-layer mouth budget — per-drive BudgetGuard + wombat-owned durable daily-spend ledger
    intent: As wombat, I bound mouth spend on TWO layers — cog-worx's per-drive-segment BudgetGuard (free, structural, S11) AND a wombat-owned durable daily-spend ledger (Postgres, load-on-start) that enforces a per-day cumulative token/cost ceiling across drives and restarts — so daily spend is capped and exhaustion degrades to the terse template rather than erroring (DEC-18, CST-3).
    status: todo
    priority: P1
    estimate: M
    engineering_level: mvp
    complexity_budget: "Two layers. (1) Wire a cog-worx BudgetPolicy into TK-1's root so each ComposeStage drive gets a per-segment BudgetGuard (cog-worx owns this; per-DRIVE-SEGMENT, in-memory, resets per segment — cumulative-per-run is CF-3.0-B/deferred, so it CANNOT enforce a daily cap). (2) Add a small wombat-owned DailySpendLedger: one Postgres table (one row per date, columns date/tokens_spent/cost_usd), loaded on start; ComposeStage reads today's running total before calling the model and records spend after. This is NEW wombat persistence (the daily cap is wombat's, not cog-worx's). No changes to cog-worx BudgetPolicy internals."
    acceptance_criteria:
      - given: the daily token ceiling is 100 tokens and the DailySpendLedger shows 100 already consumed today
        when: the next ComposeStage call runs
        then: it returns the terse template fallback without calling the model (mock HTTP not invoked).
      - given: a ComposeStage call succeeds
        when: the call completes
        then: the response token count is added to today's DailySpendLedger row AND recorded in the cog-worx journal entry for that run.
      - given: the process restarts mid-day after spend has accrued
        when: ComposeStage runs after restart
        then: the DailySpendLedger is reloaded from Postgres and the daily ceiling is enforced against the persisted running total (it does NOT reset to 0 on restart — this is exactly what cog-worx's per-drive BudgetGuard cannot do, CF-3.0-B).
      - given: a per-ComposeStage-drive call would exceed the per-segment BudgetGuard ceiling
        when: ComposeStage runs
        then: cog-worx's BudgetGuard refuses the call structurally and ComposeStage degrades to the terse template (the per-drive layer is the inner backstop; the ledger is the daily outer cap).
      - given: the wall clock crosses the canonical wombat-day boundary (DEC-21, resolved via the shared DailyLedger TK-152)
        when: ComposeStage reads the ledger
        then: it reads (or creates) today's date row at 0 spent — the daily cap is per-wombat-day using the SAME boundary as the surfacing ceiling (TK-27) and the brief ledger (TK-97), not an independently-defined UTC-or-local midnight (Q-15).
    non_goals:
      - Does not implement per-feature budget segmentation — one global daily ceiling.
      - Does not implement spend alerts or dashboards (NG-3).
      - Does not modify cog-worx BudgetPolicy/BudgetGuard internals — wombat layers its own ledger on top.
      - Does not attempt cumulative-per-run accounting inside cog-worx (CF-3.0-B is cog-worx's deferred concern, not wombat's).
