      links: ["TK-27","TK-25","TK-99","TK-98","TK-101","TK-74"] }
  - { id: Q-31, type: open_question, status: resolved, scope: EP-24, date_raised: "2026-06-21", date_updated: "2026-06-21", title: "CRITICAL/seam-miss cluster (b): no channel carries pattern_id into the cog-worx ContextContributor; per-Stage scoping and a keyed kb_phrasing_hints context dict do not exist (TK-118/114/117)",
