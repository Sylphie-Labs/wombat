  - { id: Q-73, type: open_question, status: resolved, scope: EP-9, date_raised: "2026-07-03", date_updated: "2026-07-03", title: "TK-28 build briefing (Q-13 split pass b) - decay basis and journaling ruled, the midnight reset found to be STRUCTURAL as-built (the ticket builds the exactly-once observation, not a mutation), AC3 kill-consistency concretized, wake-burst test shape fixed to the as-built one-decision-per-call pipeline, heartbeat disposition recorded",
