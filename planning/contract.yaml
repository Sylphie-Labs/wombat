  - { id: Q-38, type: open_question, status: resolved, scope: FEAT-2, date_raised: "2026-06-21", date_updated: "2026-06-21", title: "Real-data vs hand-authored fixture + how to obtain the human-rater label for TK-22/26/73 minimizing Jim's involvement (product/privacy call)",
