  - { id: Q-20, type: open_question, status: resolved, scope: FEAT-3, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "MEDIUM (H): TK-50's feedback affordance has no input channel — the interactive half of the outcome producer has nowhere to receive input",
      description: "TK-50 surfaces a one-key 'was this useful?' acknowledgement with the action trail, but the action trail (TK-147) is append-only OUTPUT and no input source is defined for the response. Voice (FEAT-12) is the only input source and isn't wired to feedback. The interactive half of TK-50 has nowhere to land.",
      resolution: "RESOLVED by architect (within authority — realizes the pluggable-source decisions 'every input is a registered source'; no DEC changed). Added TK-51 (Feedback affordance + input channel, P1, EP-12): a FeedbackInputSource conforming to the InputSource contract (TK-161) that captures the 'useful/not_useful' response over the SAME push channel every source uses (one-key CLI/file in v1, and the same channel ASR uses so a spoken yes/no works) and enqueues a FeedbackSignal keyed on canonical identity (TK-12) — registration, not a special path. The affordance is rendered output-side by TK-147's trail. TK-50 consumes the queued signals. Also the atomicity split of TK-50 (Q-21). depends_on TK-44/TK-12/TK-147/TK-161.",
