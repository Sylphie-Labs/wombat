  - { id: Q-68, type: open_question, status: resolved, scope: EP-5, date_raised: "2026-07-03", date_updated: "2026-07-03", title: "TK-9 build briefing: the cog-worx budget seams verified against the installed framework, the migration-002 reservation vs riding the as-built TK-152 shared DailyLedger, the compose-side interaction with TK-8 as-built degrade, and the token source of truth",
