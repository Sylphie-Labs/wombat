  - { id: Q-21, type: open_question, status: resolved, scope: EP-12, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "ATOMICITY (TK-50): one module bundles two independent mechanisms in different runtime contexts (interactive feedback affordance + off-path nightly inference engine)",
      description: "TK-50's 'one module with two deterministic sources' is two independent mechanisms: (1) an interactive human-feedback affordance needing an input channel (Q-20), and (2) an off-path nightly deterministic inference engine over local snapshots. Different dependencies, execution paths, separate testability. Strongest split candidate.",
      resolution: "SPLIT by architect (within delegated authority — ticket split). TK-50 narrowed to the OFF-PATH nightly deterministic INFERENCE engine (runs in the dream pathway EP-13; folds in TK-51's captured feedback; emits the per-item OutcomeSignal). TK-51 is the INTERACTIVE feedback affordance + its input channel (the FeedbackInputSource, Q-20). Dependency wired: TK-50 depends_on TK-51 and EP-13. Both stay P1; TK-49 still reaches the producer transitively via TK-50.",
      links: ["TK-50","TK-51","Q-20"] }
  - { id: Q-22, type: open_question, status: resolved, scope: EP-12, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "MEDIUM (I): TK-45 vs TK-50 timing mismatch — outcome label written 'at resolution time' (hot path) vs 'off-path nightly'",
      description: "TK-45 writes the outcome label 'at resolution time'; TK-50's inference source runs 'off-path, nightly'. Whether a label is written on the hot path at resolution or in the nightly pass is contradictory between producer and writer.",
      resolution: "RESOLVED by architect (within authority — coherence fix; no DEC changed). Split the timing: TK-45 stamps only PENDING at resolution time on the hot path (keeps the hot path token-free per CST-3); the TERMINAL label (LOAD_BEARING/REGRETTED/IGNORED) is written OFF-PATH NIGHTLY from TK-50's folded OutcomeSignal, superseding PENDING. Updated TK-45's intent + complexity_budget + ACs to encode 'PENDING on hot path, terminal nightly', binding via canonical identity (TK-12). Producer (TK-50) and writer (TK-45) now agree.",
      links: ["TK-45","TK-50","TK-12"] }
  - { id: Q-23, type: open_question, status: resolved, scope: EP-9, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "MEDIUM (B): TK-26 contradicts itself on the flush target (poc <=1/day vs AC1 <=2) and conflates load-flush with the morning-brief forced flush",
      description: "TK-26 poc.question targets <=1 flush/day; AC1 asserts the consolidated-flush arm fires <=2 times. Same ticket, two numbers. Compounded by the measurable goal ('exactly one consolidated brief per morning') — unclear whether a load-triggered surface_flush (TK-27) is the same surfacing class as the morning brief's forced flush (DEC-16). A user could get brief + up to 2 flushes and still be 'compliant'.",
      resolution: "RESOLVED by architect (within authority — corrects an internal contradiction against the measurable goal; no DEC changed). Fixed TK-26 AC1 to <=1 LOAD-triggered flush/day (matching poc.question + the 'exactly one consolidated brief per morning' goal). Made the class distinction explicit: the LOAD-triggered surface_flush (TK-27) and the morning-brief FORCED flush (DEC-16/TK-99, once-daily timer-fired) are SEPARATE surfacing classes counted independently — the daily picture is at most one brief plus at most one load-triggered flush, never 'brief + up to 2 flushes'.",
      links: ["TK-26","TK-27","TK-99"] }
  - { id: Q-24, type: open_question, status: resolved, scope: EP-9, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "MEDIUM/LOW (G): sleep-resume poll burst vs. the daily ceiling and decay is unspecified",
      description: "TK-28 handles the midnight ledger reset, but on wake every source re-polls at once. The interaction of that wake burst with the daily ceiling and decay across the sleep boundary is unspecified.",
      resolution: "RESOLVED by architect (within authority — added an AC to the ticket that already owns the sleep boundary; no DEC changed). Added a wake-burst AC to TK-28: when every source re-polls at once on wake and enqueues a sleep-spanning backlog, the per-class daily ceiling (TK-27) still bounds surfacings for the new wombat-day (the burst cannot exceed the ceiling) AND items whose age now exceeds decay_ttl_seconds across the sleep gap are decayed, not surfaced. A wake-burst test asserts a backlog larger than the ceiling yields at most ceiling surfacings and pre-sleep-stale items decay.",
      links: ["TK-28","TK-27"] }
  - { id: Q-25, type: open_question, status: resolved, scope: EP-28, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "MEDIUM (E): TK-150's residency guard asserts 'resolves to localhost' but same-host peers (Docker bridge, unix socket, LAN-to-self) are not literally localhost",
      description: "TK-150 asserts every write 'resolves to localhost'. On a real host, Postgres/Neo4j may be reached over a Docker bridge, a unix socket, or a LAN/0.0.0.0 interface — all same-host but not literally localhost. The guard's definition will false-positive or false-negative as written.",
      resolution: "RESOLVED by architect (within authority — sharpens an AC to match NG-7/CON-7/ASMP-1 intent; no DEC changed). Re-scoped TK-150 to assert SAME-HOST residency, not the literal string 'localhost': an explicit allowlist (loopback 127.0.0.0/8 + ::1, literal localhost, unix socket, same-host container/bridge address, this host's own interface addresses) with the rule 'the resolved peer is on this host'. A LAN address on a different host fails. Added a table-driven test (loopback/unix/Docker-bridge-to-self PASS; remote-host LAN FAIL). Updated complexity_budget + AC1 + AC3.",
