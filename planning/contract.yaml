  - { id: Q-18, type: open_question, status: resolved, scope: EP-2, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "MEDIUM (D): cross-source item identity is undefined — outcome labels cannot cleanly bind to Gmail/calendar/task items",
      description: "TK-2 keys on idempotency_key, TK-72 dedups by event_id, TK-75 by message_id, outcome claims (TK-44/45/50) key on event_id. No unified identity, so outcome labels can't cleanly bind to Gmail items (message_id) or task items. The adaptive loop's signal binding is ambiguous.",
