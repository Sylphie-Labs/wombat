    title: 'SpeakSink: terse TTS output Stage gated on speak-event only'
    intent: As a user, I hear a terse spoken output ONLY when the deterministic gate decides to speak (a rare speak-event) — I am never surprised by unsolicited audio; the system is silent otherwise (CON-3).
    status: todo
