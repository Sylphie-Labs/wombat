  - { id: Q-26, type: open_question, status: resolved, scope: EP-28, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "ATOMICITY (TK-148): a P3 web ingest call-site rides inside the P1 email-safety taint ticket",
      description: "TK-148 (M, P1) bundles two ingest call-sites — ingest_email_body.py (EP-17, P1) and ingest_web_page.py (EP-25, P3) — plus taint wiring, with adversarial tests for both. A P3 concern rides inside a P1 ticket; the web call-site could be a separate P3 ticket.",
