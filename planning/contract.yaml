  - { id: Q-27, type: open_question, status: resolved, scope: project, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "ATOMICITY (borderline): TK-149 (3 dispatch wirings), TK-9 (2 budget layers), TK-132 (4 a11y actions) — split or leave",
