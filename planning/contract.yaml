  - id: TK-5
    kind: ticket
    parent: EP-4
    title: DrainQueue Stage — pull items from WombatQueue and hand to gate
    intent: As the drain pathway, I dequeue a bounded batch from WombatQueue each cycle so the gate can evaluate items without the pathway knowing scoring logic (DEC-14, DEC-8).
    status: done
    priority: P1
    estimate: S
    engineering_level: mvp
    complexity_budget: "One DrainQueueStage + Wait-driven heartbeat re-parking on empty. FIRST cog-worx Stage integration — the Q-47 conventions set here propagate to TK-6/7/8/10. (1) QUEUE LIMIT: WombatQueue.drain gains an OPTIONAL limit param (drain(limit: int | None = None) — FIFO ORDER BY + SQL LIMIT, leasing ONLY those N rows; None = all, existing TK-2 gated tests stay green untouched); in-memory slicing after drain-all is FORBIDDEN (orphans leased-but-unhanded rows until restart); a new gated test asserts limit=2 of 3 leases exactly 2 and the 3rd remains UNLEASED (drainable by the SAME epoch). (2) ARTIFACT CONVENTION (spine-wide): stages hand data downstream ONLY via the journaled StageResult.output Artifact; kind = namespaced dotted string 'wombat.<noun>' (this stage: 'wombat.drained_batch'; idle: 'wombat.drain_heartbeat'); produced_by = the stage's canonical snake_case name verbatim ('drain_queue' here; downstream pulls ctx.last_output('drain_queue')); data schema for a batch = {'items': [<QueueItem fields as a dict>...]}; the KIND constants + queue_items_to_artifact_data/queue_items_from_artifact_data live ONCE in src/wombat/stages/artifacts.py so TK-6 deserializes through the same helpers read/write cannot drift (Q-41 wire-helper principle). (3) WAIT HEARTBEAT: empty queue -> Wait(to='drain_queue' (itself — re-park to re-drain, DEC-8 idles-on-empty), wake_at=ctx.clock()+timedelta(seconds=poll_interval_seconds), output=Artifact(kind='wombat.drain_heartbeat', data={})); wake_at MUST derive from ctx.clock(), NEVER datetime.now() (engine clock = deterministic tests); poll_interval_seconds + batch_size are INJECTED constructor args (tests pass literals; OperatingParams fields drain_poll_interval_seconds/drain_batch_size are PRE-AUTHORIZED one-field TK-13 additions at composition time — the established Q-41/Q-44/Q-46 pattern). (4) PARTIAL PATHWAY: pathways/drain_pathway.py ships a build_drain_pathway(*stages) BUILDER that assembles injected stages with their declared transitions; NO placeholder/sink stage in src — TK-5's pathway test supplies a TEST-LOCAL terminal sink; TK-7 performs the full real assembly (its e2e AC). (5) MINIMUM CTX SURFACE + TEST DOUBLE: cog-worx ships NO StageContext double (verified 2026-07-02) — wombat builds tests/support/stage_context_fake.py implementing the FULL StageContext Protocol with NotImplementedError on every member except clock (and a configurable last_output for downstream tickets); DrainQueueStage touches ONLY ctx.clock() — the queue is an injected constructor dep, the stage NEVER acks (ack is TK-7's job on hold/completion) and NEVER writes the journal (the engine journals stage results itself). AC3 kill/restart is proven at the QUEUE layer (stage leaves rows leased; fresh WombatQueue instance = new epoch redelivers — the TK-2-proven mechanism), not by re-simulating the engine."
