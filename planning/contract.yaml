    title: Harden urgency() & cognitive_load() with user-model seam
    intent: As a wombat dev, I need the production urgency()/cognitive_load() pure functions wired to read per-event params from UserModel.ratings_for(item) so the gate's scoring is personalized/adaptive and the spike's heuristics become production (DEC-13, DEC-15, RISK-1).
