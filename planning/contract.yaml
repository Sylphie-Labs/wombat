    complexity_budget: "One Capability class implementing the REAL cog-worx Capability seam (Q-32, seam-miss fix): the sole dispatch method is `async def invoke(self, args)` — the API MUST be ASYNC (a sync open/close/navigate/snapshot API cannot conform; the prior 'sync' budget was wrong). navigate+snapshot over the a11y tree only. TEARDOWN (Q-32) — cog-worx propagates NO Engine->Capability teardown hook (the Capability Protocol has no close/__aexit__ and Engine.aclose() does not iterate the capability Registry), so wombat OWNS session teardown explicitly: a wombat-side session-holder with its own async close, invoked by the wombat runtime shutdown (TK-53), NOT relied on from a cog-worx teardown seam that doesn't exist. No form interaction, no screenshot, no auth in this slice."
    poc:
      question: RESOLVED by audit — the cog-worx Capability seam is async-invoke-only with no teardown hook, so a wombat session-holder wrapper with explicit async close is required (confirmed against cogworx.capability.base).
      hypothesis: The external-tier Capability shape is stateless-async-dispatch with no lifecycle hook; a wombat session-holder wrapper owning open + explicit async close is needed.
      status: resolved
      result: "Capability.invoke is async-only; Engine.aclose drains in-flight tasks but invokes no capability close. wombat owns teardown via the runtime (TK-53)."
    acceptance_criteria:
      - given: wombat's Engine is constructed with PlaywrightCapability registered
        when: the capability is invoked with a navigate action and a public URL
        then: Playwright opens a headless Chromium session, loads the URL, and returns a structured a11y-tree snapshot (role/name/state); no screenshot is taken.
      - given: PlaywrightCapability is registered in the cog-worx capability Registry
        when: any Stage resolves it by capability id
        then: the capability instance is returned and dispatched via `async def invoke(args)` (the real seam); the session is opened on first use by the wombat session-holder (the caller does not manage it).
      - given: the browser session is open
        when: the wombat runtime shutdown (TK-53) calls the session-holder's explicit async close
        then: "the Playwright session closes cleanly and no zombie Chromium processes remain — teardown is wombat-owned (cog-worx exposes no Engine->Capability close hook, Q-32), wired through the runtime, not assumed from the Capability Protocol."
    non_goals:
