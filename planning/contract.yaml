    title: Deterministic gate stub — Hold vs Surface with presence conditioning
    intent: As the drain pathway, I pass each dequeued item through a deterministic gate returning Hold or Surface — zero model calls — so the silence-is-default guarantee is structural from day one, before real scoring exists (DEC-13).
    status: done
    priority: P1
    estimate: M
    engineering_level: mvp
    complexity_budget: "One GateStage + a stub evaluator; canonical vocabulary REUSED, never redefined (Q-48). (1) NO decision.py: GateDecision/GateAction/ScoredItem already live in gate/models.py (TK-21, ISS-4 — no competing definitions); gate/decision.py is DROPPED from scope; everything imports from models.py. gate/gate.py holds: gate_item_from_queue_item(queue_item) (the QueueItem->GateItem mapping — id, kind, created_at, payload passthrough) and stub_evaluate(gate_item, presence, *, urgency_threshold) -> GateDecision (as-built simplification, Q-49 — the injected urgency_fn/cognitive_load_fn params were dropped as unneeded indirection for a stub; the TK-27 replacement seam is the injected evaluate callable on GateStage, not ScoreFn params on the stub). (2) STUB scoring STANDS (ruled over wiring TK-23 now): TK-6 proves the STRUCTURAL silence-default in the pathway wiring; TK-27 is the designed convergence that binds the REAL scoring (already-awaited RatingParams per Q-41/Q-42) + arms + ceiling + select_items — wiring real scoring here would duplicate TK-27's composition and be rebuilt within days (the demo milestone is AT TK-27, not here). The REPLACEMENT SEAM is the deliverable: GateStage takes an INJECTED evaluate callable (Callable[[GateItem, PresenceSnapshot | None], GateDecision]); TK-6 ships stub_evaluate (stub ScoreFns read payload['stub_urgency'] 'high'->0.9 / 'low'->0.1, DEFAULT low = quiet default; score >= urgency_threshold -> SURFACE_IMMEDIATE else HOLD); TK-27 swaps in the production evaluator — GateStage itself never changes. urgency_threshold is an INJECTED arg (composition passes OperatingParams.urgency_threshold; tests pass literals; NO inline threshold literal in gate code — TK-13 guard spirit). Per-item decision = GateDecision(action, items=(ScoredItem(...),)) — the canonical type, one ScoredItem per item. (3) PRESENCE (interim, Q-48): consume the TK-4 spike AS-IS — PresenceSnapshot type + the PROVEN conservative presence_hold from presence/probe.py (unknown/stale/low-confidence/idle/away -> HOLD; only fresh+confident+active permits surfacing); evaluate applies presence_hold BEFORE scoring (presence is a gate-level hold, never a scoring input — Q-12). TK-11 (next on the demo path) hardens the predicate into gate/presence_hold.py + sources/presence.py and FLIPS this import — that flip is TK-11's existing AC4 obligation (the trace must resolve to the hardened predicate), so no new debt. (4) STAGE SEAM (Q-47 conventions): input = ctx.last_output('drain_queue') deserialized via queue_items_from_artifact_data (the shared helper — never hand-parsed); output = Transition(to='review_or_speak', output=Artifact(kind='wombat.gate_decisions', produced_by='gate', data per the NEW helpers gate_decisions_to_artifact_data/gate_decisions_from_artifact_data ADDED to stages/artifacts.py: {'decisions': [{'action': <GateAction value>, 'scored_item': {...}, 'queue_item': <Q-47 item dict>}...]})) — each entry carries the ORIGINAL queue-item dict so TK-7 can ack holds; TK-7 MUST deserialize through the helpers (no drift). JSON-NATIVE WIRE RULE (Q-49): Artifact.data payloads MUST be plain-JSON-native (str/int/float/bool/None/list/dict) — enums serialize as .value at the wire (item_kind stored as ItemKind.value, reconstructed via ItemKind(value), mirroring 'action'); a wire regression test asserts json.dumps(data) round-trips — so the wire never depends on which journal adapter (TimescaleJournal pydantic-coerces, InMemoryJournal may not) or debug path serializes it. GateStage touches ONLY ctx.last_output (+ nothing else; stage_context_fake reused). The drain stage Waits on empty, so GateStage never sees a heartbeat artifact. No model call anywhere (NG-4); no ack here (TK-7). Real scoring/arms replaced at TK-27 (FEAT-2)."
