  - { id: Q-33, type: open_question, status: resolved, scope: EP-13, date_raised: "2026-06-21", date_updated: "2026-06-21", title: "CRITICAL cluster (d): the dream pathway secretly does LLM inference + provisions no CoherenceStore/ConsistencyOracle/model/source_registry; TK-46 bundles three concerns (TK-47/46)",
