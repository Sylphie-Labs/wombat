  - { id: Q-15, type: open_question, status: resolved, scope: FEAT-1, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "HIGH: the canonical 'wombat day' boundary + timezone is undefined across three independent daily ledgers",
      description: "TK-9 (DailySpendLedger), TK-27 (per-class surfacing ceiling) and TK-97 (brief once-per-day run ledger) each independently define a Postgres 'daily counter, reset at midnight, survive restart' mechanism, and none specifies a timezone. TK-101 writes a UTC timestamp header while the brief timer (TK-97) fires at a local 'morning time', so 'today' is defined at least two ways. On a laptop that sleeps across midnight (CST-1/DEC-6) a UTC-vs-local mismatch double-counts or skips a day in all three ledgers. Resolve: a decision fixing the canonical wombat-day boundary + timezone and a SHARED DailyLedger primitive that TK-9/TK-27/TK-97 reference.",
      resolution: "RESOLVED by architect 2026-06-20 (within authority — no locked DEC fixed a timezone). Recorded DEC-21: the canonical wombat-day is the CIVIL-LOCAL date in a configured IANA timezone (default host zone), computed at ACCESS time (wombat_today()), not by a fired timer — so a sleep across midnight resolves correctly on wake. Added TK-152 (shared DailyLedger primitive, P1, EP-2) that owns the boundary + row lifecycle; rewired TK-9 (spend), TK-27/TK-28 (ceiling) and TK-97 (brief run) to consume it, and fixed TK-101's header to the wombat timezone (was bare UTC). The three independent ad-hoc date mechanisms now share ONE tested primitive — the split-definition double-count/skip bug is structurally closed.",
      links: ["TK-9","TK-27","TK-97","TK-152","DEC-21"] }

