  - id: TK-48
    kind: ticket
    parent: EP-14
    title: SPIKE — Simulate N nights of outcomes; prove RatingTuner bounded stability (RISK-4)
    intent: As a developer, run a prototype simulation of N consecutive nightly tuning passes over a synthetic outcome corpus and prove that bounded deltas + floor/ceiling constraints keep surfacings/day inside the hard ceiling and prevent oscillation/drift, before any production tuner is written (RISK-4).
    status: done
    priority: P1
    estimate: L
    engineering_level: prototype
    complexity_budget: Standalone simulation script (no cog-worx I/O); synthetic outcome generator; naive proportional tuner stub; assertion harness for stability proofs. Produces a numeric report. Pure de-risk.
    poc:
      question: Are RatingTuner parameter updates provably bounded, and do floor/ceiling clamps prevent loud/mute drift over N nights of synthetic outcomes (including all-IGNORED and all-LOAD_BEARING pathological runs)?
      hypothesis: A proportional tuner with per-night delta bound + floor/ceiling clamps keeps surfacings/day inside the ceiling and converges (parameter variance < threshold after N/2 nights); removing the clamps breaks at least one stability assertion.
      status: resolved
      result: "PROVEN 2026-06-21 (20 tests green, ruff+mypy --strict clean; run python -m wombat.rating.tuner_sim). Over N=30 synthetic nights incl. all-IGNORED and all-LOAD_BEARING pathological runs, a proportional tuner (delta=gain*net_outcome) with per-night delta-bound 0.05 + floor/ceiling clamps holds all four stability assertions - bounded delta/night, no clamp breach, surfacings/day never above the hard ceiling 12.0, and back-half (post N/2) parameter variance < 1e-3 (converged). Ablation - removing both clamps on the all-LOAD_BEARING run breaks ALL FOUR assertions, so the clamps are load-bearing. KEY FINDING for TK-13/TK-49 - floor/ceiling clamps alone do NOT bound the surfacing RATE; the band must be chosen jointly with surfacing sensitivity. Recommended operating constants - urgency/load band [0.35,0.65], delta_bound 0.05, gain 0.20 (worst-case clamped rate lands exactly at the 12.0/day ceiling). RISK-4 retired."
    acceptance_criteria:
      - given: the spike simulation runs with N=30 nights of synthetic outcomes (incl. all-IGNORED and all-LOAD_BEARING runs)
        when: all stability assertions execute
        then: max delta per night <= the configured bound; no param crosses floor/ceiling; surfacings/day never exceeds the hard ceiling; parameter variance < threshold after N/2 nights; a numeric stability report is printed.
      - given: the floor/ceiling clamps are removed from the simulation
        when: the same N=30 run executes
        then: at least one stability assertion fails — proving the clamps are load-bearing (ablation test).
    non_goals:
      - No Neo4j or Postgres I/O in the spike.
      - No production tuner logic — prototype only.
      - No integration with DreamPathway yet.
    depends_on:
      - TK-41
    files_in_scope:
      - src/wombat/rating/tuner_sim.py
      - tests/rating/test_tuner_sim.py
  - id: TK-49
    kind: ticket
    parent: EP-14
    title: Implement RatingTuner — bounded, floored/ceilinged rating-parameter updates
    intent: As the dream pathway, invoke RatingTuner.tune() after the reconciler/extractor to read outcome claims and emit bounded, provenance-typed rating-parameter updates into the user scope, so the gate uses sharpened per-event-class params next drive with no runtime LLM decision.
    status: todo
    priority: P1
    estimate: M
    engineering_level: mvp
    complexity_budget: "One RatingTuner class. READ (Q-34/audit): owns the per-event-class OUTCOME_* corpus query over a recall window — a deterministic point/range read through the injected ScopedKG/EntityKG user-scope view (the same seam as TK-42, NOT RecallStack fusion); this is the read AC6 was wrongly placed on TK-45. WRITE: writes updated RatingParams via ObservationWriter's provenance path (TK-44 — declared dep). CLAMP BOUNDS (Q-34/audit): the floor/ceiling the tuner clamps against are STATIC operating constants seeded from the TK-48 spike's recommendation and PERSISTED in the TK-13 param store (TK-48 is a spike that recommends; TK-13 owns the persisted value) — not a runtime artifact TK-48 builds. The tuner reads the WHOLE TK-48 joint block from TK-13: clamp band [0.35, 0.65], per-night delta_bound 0.05, gain 0.20 (delta = gain * net_outcome, clamped to +/- delta_bound, result clamped into the band). CRITICAL (TK-48/RISK-4 finding): the tuner MUST NOT hard-code these or treat the band as independent of the gain — clamps alone do not bound the surfacing rate; the band+gain+ceiling are a coherent set chosen so the worst-case clamped rate equals the 12.0/day ceiling, so all are read from TK-13, never inlined. Computes bounded delta per event class; no LLM call; no gate code change."
    acceptance_criteria:
      - given: the user scope has 7 nights of OUTCOME_LOAD_BEARING/OUTCOME_IGNORED claims for CALENDAR_CONFLICT
        when: RatingTuner.tune() queries the outcome corpus for that class over the recall window
        then: the tuner reads all those labeled claims via the injected user-scope view, and an updated urgency_base for CALENDAR_CONFLICT is written with provenance (source=RatingTuner, night=<date>).
      - given: the computed delta would push a parameter above its ceiling
        when: RatingTuner.tune() is called
        then: the written value equals the ceiling, not the unclamped result.
      - given: the computed delta would push a parameter below its floor
        when: RatingTuner.tune() is called
        then: the written value equals the floor, not the unclamped result.
      - given: the tuner's clamp band, delta_bound, and gain
        when: RatingTuner.tune() resolves its bounded-update constants
        then: "they are read from the TK-13 OperatingParams store (band [0.35,0.65], delta_bound 0.05, gain 0.20) — a test asserts NO inline literal band/delta_bound/gain exists in the tuner module (the TK-48 joint-set finding — these move together and are owned by TK-13), and a single night's delta for any class is clamped to within +/- delta_bound before the band clamp."
      - given: no outcome claims exist for an event class in the recall window
        when: RatingTuner.tune() is called
        then: the existing parameter is unchanged — the tuner emits nothing for that class.
    non_goals:
      - No LLM call — the tuner is pure deterministic arithmetic.
      - No runtime gate parameter injection — gate re-reads from user scope on next drive.
      - No UI or report; provenance in Neo4j is the audit trail.
    depends_on:
      - TK-48
      - TK-45
      - TK-50
      - TK-42
      - TK-44
      - TK-13
      - TK-47
    files_in_scope:
