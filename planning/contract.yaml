sume there; NOT calendar/); transient errors (network/401/403/5xx/malformed) CAUGHT in poll() -> log naming gmail -> [] (Q-59 posture; raising reserved for bugs); fetch = Gmail REST v1 users/me/messages list with q='in:inbox after:<epoch>' from injected clock + lookback_hours ctor arg (default 24.0 AC-fixed, TK-8/TK-72 precedent; stateless window — canonical-key dedup absorbs overlap) then per-id get; single page maxResults=100 default, LOUD log if nextPageToken present (wake-burst ceiling is TK-28's). NO DSN-gated part (fake Enqueuer suffices; registry wire proven at TK-3/72). tests/integrations/gmail/ gets __init__.py (TK-15)."
