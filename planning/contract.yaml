  - { id: Q-44, type: open_question, status: resolved, scope: EP-8, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-25 build briefing: what backs the production pending set given the TK-24 seam-miss (cog-worx Journal cannot host PendingSet ops)? Plus MAX_PENDING home, CapacityEviction mechanism, pending_set-vs-aggregator split, and how the kill ACs run in CI",
      description: "TK-25 is engineering_level=production with a budget saying Postgres-backed, but: (1) TK-24 proved cog-worx Journal is a positional step/run WAL with no PendingSetAdd/Remove concept, wombat has no generic pg store of its own yet (TK-2, which establishes wombat's pg conventions, is unbuilt), and the v1 default is zero-infra cold boot — so what is the persistence seam, does it join SubstrateBundle, and does TK-25 build the pg adapter now? (2) How do AC2's mid-clear kill and AC4's 10 TK-24 kill scenarios run in CI without live Postgres? (3) Where does MAX_PENDING live? (4) What is the CapacityEviction emission mechanism, and what splits pending_set.py from the new aggregator.py? Also code-confirmed: tests/gate/test_pending_set_spike.py imports the spike classes from the file TK-25 hardens in place — the Q-43 coupling again.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — HOW/seam rulings + one new sibling ticket; no locked decision, constitution item, or v1 scope touched; graph stays acyclic — TK-29 is a dependency SINK with edges only to TK-25/TK-2). (1) SEAM: a wombat-owned PendingJournal Protocol homed in gate/pending_set.py (append(record); replay() -> ordered records; frozen record dataclasses PendingSetAdd carrying the FULL ScoredItem fields so rebuild restores cumulative_load exactly, PendingSetRemove(item_id), and ONE atomic PendingSetClear). It does NOT join SubstrateBundle — that is the cog-worx Engine's four seams (TK-14/Q-29); the pending set is wombat-DOMAIN gate state, constructor-injected into PendingSet (mirrors TK-2's wombat-owned-Postgres stance and Q-36: wombat domain state is wombat's own concern, cold-boot is a cog-worx-substrate property). Reusing pg_episodes/graph-store claims REJECTED as seam abuse (pending items are not knowledge claims; TK-24 already documented the Journal seam-miss). TK-25 builds the Protocol + InMemoryPendingJournal double + ALL semantics NOW; the REAL Postgres adapter is SPLIT to NEW ticket TK-29 (EP-8, P1, S, production; depends_on TK-25 + TK-2) — building psycopg SQL inside TK-25 would invent wombat pg conventions AHEAD of TK-2 (coordination hazard) and ship production code with no CI-runnable check (violating the done-bar); TK-29 inherits TK-2's conventions and verifies the wire via a WOMBAT_TEST_PG_DSN-gated round-trip (skip in CI), with an explicit MUST-land-before-first-live-laptop-session obligation (an in-memory journal does not survive a real kill — RISK-5 honesty). The ACs are all substrate-independent semantics, so TK-25 remains fully production-verifiable against the double. (2) KILL TESTS: exactly the TK-24 mechanism — the journal OBJECT survives, the PendingSet instance is discarded; a wrapper journal that raises after N appends injects mid-operation kills; clear() appends the single PendingSetClear write-ahead THEN wipes memory, so a kill lands strictly before-append (nothing cleared) or after-append (fully cleared) — the atomicity IS the exactly-once proof; the 10 TK-24 scenarios are PORTED into tests/gate/test_pending_set.py against the production impl (AC4's own text) and tests/gate/test_pending_set_spike.py is DELETED as subsumed by the strictly-stronger production port (Q-43 freeze principle: mechanical supersession forced by in-place hardening; the spike finding stays recorded on TK-24). (3) MAX_PENDING: ALREADY exists as OperatingParams.max_pending (as-built TK-13, params.py) — NO TK-13 change; PendingSet takes max_pending as a required constructor arg (no default, no module literal; tests pass ints; TK-27's composition reads OperatingParams.max_pending); no TK-13 AC4 guard conflict (pending_set.py is not on the declared scan list and defines no owned literal). (4) EVENTS + SPLIT: CapacityEviction is a frozen dataclass defined in pending_set.py and RETURNED from add() (CapacityEviction-or-None), mirroring the as-built emission pattern Gate.decay() -> list[DecayEvent]; TK-21's canonical models.py is NOT touched (no files_in_scope creep into the canonical vocabulary). Split: aggregator.py = PURE stateless math over ScoredItems (cumulative_load exact sum; lowest-urgency selection reused by eviction); pending_set.py = the durable stateful set (add/remove/clear/list/rebuild_from_journal + write-ahead journaling), with PendingSet.cumulative_load() delegating to the aggregator over its snapshot (AC1 names the method on the set; the math stays pure and separately testable). TK-25 budget + files_in_scope amended (+test_pending_set.py, +test_pending_set_spike.py-for-deletion); +TK-29 (80 tickets).",
      links: ["TK-25","TK-24","TK-29","TK-2","TK-21","TK-13","TK-27","TK-14","Q-36","Q-43","Q-29"] }
  - { id: Q-45, type: open_question, status: resolved, scope: EP-8, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-25 verifier-found eviction-atomicity bug: capacity eviction journals Add(new) then Remove(evicted) as two independent appends — a kill between them rebuilds to max_pending+1, violating AC3 across a crash and the RISK-5 exactly-once claim; Remove-before-Add ordering vs a single atomic compound record?",
      description: "LIVE-REPRODUCED by the independent verifier (3-item set at max_pending=3, kill right after the 4th append -> rebuilt set had 4 items). The as-built add() eviction path appends PendingSetAdd(new) write-ahead FIRST, then PendingSetRemove(evicted) — two commit points for ONE compound op, so the kill window between them leaks a set-size violation into the durable log. The green 129-test suite was SILENT on it: AC3's test was non-kill and AC4's kill scenarios only exercised remove()-based drains. Candidate fixes: (1) reorder — journal Remove(evicted) BEFORE Add(new): worst-case kill-in-window loses the incoming (uncommitted) item and rebuilds to max_pending-1, never over; no new record type. (2) a single atomic PendingSetEvictAdd(evicted_id, new_item) record: both effects or neither; costs a new record type + replay branch + a TK-29 wire-schema impact.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — durability-semantics HOW ruling on TK-25; no locked decision/constitution/v1-scope/graph change). RULED option (1) REMOVE-BEFORE-ADD ordering — the simplest fix that is ACTUALLY correct, on four grounds. (a) INVARIANT: the size bound holds across a kill at every point by ordering alone — the only intermediate durable state is Remove-committed/Add-absent = max_pending-1, never max_pending+1. (b) EXACTLY-ONCE HONESTY: RISK-5's contract (TK-24) is 'a crash can never lose a COMMITTED mutation' — the interrupted add() never returned, so the incoming item was never committed; aborting an uncommitted op is clean write-ahead semantics, not loss. (c) WHOLE-SYSTEM CONVERGENCE (the deciding argument): the pending set's producer is the TK-2 at-least-once queue (lease/ack) — a process killed inside add() never acked the queue item, so on restart the item is REDELIVERED and the re-run add() lands in the max_pending-1 set as a plain insert; the system CONVERGES to exactly option (2)'s end state (new in, evicted out) with zero new record types, and idempotent set-replay makes the redelivery duplication-safe. The narrow residual (a spurious eviction of the lowest-urgency item if the producer is not the queue) fails toward SILENCE — the product-safe direction (quiet-by-default; same posture as DEF-3's fails-safe reasoning). (d) TK-29 SIMPLICITY: ordering is carried by the journal's existing append order — the pg adapter inherits the contract with NO schema change; option (2) would add a compound record_type + extra columns to a wire contract two tickets share. REJECTED option (2) as correctness-equivalent at system level but strictly more surface (scope discipline: simplest thing that satisfies the ACs). REQUIRED: TK-25 AC3 sharpened with the crash clause + the two regression scenarios (kill BETWEEN the two appends -> rebuild <= max_pending, uncommitted item absent, load consistent with replay; kill AFTER both -> new present, evicted absent, size == max_pending); the module docstring's exactly-once claim must state the Remove-before-Add ordering and the uncommitted-op abort semantics. Recorded (not left as a silent build-fix) because the ordering is a WIRE-LEVEL durability contract TK-29 must preserve and AC3 as written was proven under-specified.",
      links: ["TK-25","TK-24","TK-29","TK-2","Q-44","DEF-3"] }
  - { id: Q-46, type: open_question, status: resolved, scope: EP-2, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-2 build briefing: the canonical wombat Postgres conventions — done-bar vs zero-infra CI for DB-state ACs, psycopg package choice + dep files, migration-application mechanism, cold-boot coherence for the pg-requiring queue, and the connection/DSN injection shape",
      description: "TK-2 establishes wombat's own Postgres surface (TK-29 explicitly inherits its conventions; TK-152 and future DB tickets follow). Five gaps before build: (1) ALL FOUR TK-2 ACs assert real DB state — if every test skips without a DSN, TK-2 has no runnable check (done-bar violation); rule the canonical pg-test convention (gate+skip vs testcontainers vs psycopg-fake). (2) psycopg is NOT in pyproject.toml and pyproject/uv.lock are outside TK-2's files_in_scope. (3) How does 001_wombat_queue.sql reach the test DB — migration runner or direct application? (4) TASK-15 points at a 'cold-boot coherence note' that is not findable as a governance id, while the v1 default is zero-infra cold-boot and the queue requires pg. (5) TASK-13 says 'injected psycopg connection/DSN' — which, and who owns the connection? Also unowned: AC2's 'configured capacity' has no OperatingParams field.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — HOW/convention rulings + files_in_scope normalization; no locked decision/constitution/v1-scope/graph change). (1) CONVENTION (canonical, inherited by TK-29/TK-152+): DB-state tests are REAL-Postgres tests gated on WOMBAT_TEST_PG_DSN — pytest.skip with a LOUD reason when absent (fresh clone/CI never fails, never fakes); a DB ticket flips to done ONLY after the independent verifier RUNS the gated suite against a real/throwaway Postgres (docker one-liner documented in the test module; Docker 29.x confirmed available on the dev machine, no native pg needed). The done-bar demands a RUNNABLE check, not a CI-resident one — exactly the TK-23 precedent where the real-fixture 100%-agreement run happened locally. REJECTED: testcontainers (new dev dependency + plugin surface for infra v1 does not need — the one-liner suffices); a psycopg fake or Python SQL-double (re-implements ON CONFLICT/lease semantics in Python, proves nothing about the real wire, and creates a driftable parallel implementation — worse than an honest skip); note this does NOT contradict the TK-25 Protocol+double pattern, because there the double carried real write-ahead SEMANTICS proven by TK-24 while the pg wire was deferred to TK-29 — the queue's semantics ARE the SQL, so a double would be the dishonest kind. (2) DEPENDENCY: psycopg v3 (psycopg[binary]) — modern, typed, maintained; psycopg2 rejected as legacy; TK-2 files_in_scope += pyproject.toml + uv.lock. (3) MIGRATIONS: NO framework (NG-3) — numbered IDEMPOTENT .sql files under src/wombat/migrations/; the owning module ships ensure_schema(conn) executing its own packaged .sql via importlib.resources; tests and the composition root call it; revisit only if cross-file ordering ever becomes real. (4) COLD-BOOT: the note EXISTS — it is Q-36 (resolved v0.17/v0.18): cold-boot is a cog-worx-SUBSTRATE unit-test property; wombat's own queue/ledgers REQUIRE Postgres; NO in-memory queue variant, NO no-op mode (a silent no-op queue would fake the drain pathway); a whole-system v1 run needs local same-host pg (TK-150). TASK-15's dangling pointer fixed to cite Q-36. (5) INJECTION: DSN string injected (Q-41/TK-29 pattern, no module DSN literal); WombatQueue OWNS one lazy psycopg connection (no pooling, single-host DEC-6); max_size is a required injected int — the OperatingParams queue_max_size field is a PRE-AUTHORIZED one-field TK-13 addition when the drain pathway wires the queue. PLUS the AC3 mechanism ruled concretely: EPOCH-BASED lease reclaim (per-instance uuid; drain leases with leased_by=epoch, never re-returns own-epoch rows, reclaims different-epoch rows — sound under single-host single-process DEC-6; restart = new epoch = redelivery; ack deletes exactly once; no lease timeouts/clocks). TK-2 budget + files_in_scope + TASK-15 amended.",
      links: ["TK-2","TK-29","TK-152","TK-13","TK-1","Q-36","Q-41","Q-44","Q-45","TK-23"] }
  - { id: Q-47, type: open_question, status: resolved, scope: EP-4, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-5 build briefing (first cog-worx Stage integration): drain(batch_size) missing from the as-built queue, the spine-wide inter-stage Artifact convention, Wait-heartbeat shape, partial-pathway registration, and the StageContext test double",
      description: "TK-5 sets the Stage conventions TK-6/7/8/10 inherit. Verified cog-worx shapes: Stage{name, transitions, async run(ctx)->StageResult}; StageResult union Transition/Done/AwaitHuman/Degraded/Wait{to, wake_at:absolute-from-ctx.clock, output}; data flows between stages ONLY via the journaled output Artifact{kind, produced_by, data:dict} pulled with ctx.last_output(stage_name); StageContext is a large Protocol; cogworx.testing.doubles ships NO StageContext double (verified). Gaps: (1) BLOCKER — as-built WombatQueue.drain() takes no limit (leases+returns ALL ready rows) while AC1 needs batch_size=2 of 3 with the 3rd REMAINING; in-memory slicing orphans leased rows; queue.py is outside TK-5 files_in_scope. (2) No agreed Artifact kind/produced_by/data schema for the drained batch or how TK-6 deserializes. (3) Wait heartbeat: to-target, interval source, idle artifact. (4) drain_pathway.py must be coherent without the unbuilt GateStage. (5) What StageContext double do tests use, and which ctx members may the stage touch?",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — HOW/seam + convention rulings + files_in_scope normalization; no locked decision/constitution/v1-scope/graph change). (1) DRAIN LIMIT: fix at the QUEUE — drain(limit: int | None = None), FIFO-ordered SQL LIMIT that leases ONLY those N rows; None preserves drain-all so every existing TK-2 gated test stays green untouched; a NEW gated test asserts limit=2 of 3 leases exactly 2 and the 3rd stays UNLEASED and same-epoch-drainable. In-memory slicing REJECTED (drain-all leases all rows, so passing 2 downstream orphans the 3rd as leased-but-unhanded until a restart-reclaim — a correctness hazard, not a style choice). TK-5 files_in_scope += queue.py + test_queue.py. (2) ARTIFACT CONVENTION (canonical, spine-wide): kind = 'wombat.<snake_case_noun>' ('wombat.drained_batch', 'wombat.drain_heartbeat'; future stages follow — e.g. 'wombat.gate_decision', 'wombat.composed_output'); produced_by = the stage's canonical snake_case name verbatim ('drain_queue', 'gate', 'review_or_speak', 'compose_dispatch', 'compose') so ctx.last_output(name) keys are stable; batch data = {'items': [QueueItem-fields-as-dict...]}; the kind constants + to/from helpers (queue_items_to_artifact_data / queue_items_from_artifact_data) are homed ONCE in src/wombat/stages/artifacts.py and TK-6 MUST deserialize through them — the Q-41 shared-wire-helper principle applied to the stage seam. (3) WAIT: to = 'drain_queue' itself (re-park to re-drain on wake — DEC-8 idles-on-empty realized); wake_at = ctx.clock() + timedelta(seconds=poll_interval_seconds), NEVER wall-clock; idle output = Artifact(kind='wombat.drain_heartbeat', data={}) (honest journaled 'nothing drained', distinct kind so it is never mistaken for a batch); poll_interval_seconds and batch_size are INJECTED constructor args, with OperatingParams fields drain_poll_interval_seconds/drain_batch_size PRE-AUTHORIZED as TK-13 one-field additions at composition wiring (established pattern). (4) PARTIAL PATHWAY: build_drain_pathway(*stages) BUILDER in pathways/drain_pathway.py assembling injected stages; NO placeholder sink ships in src (throwaway production code rejected) — TK-5's pathway test supplies a test-local terminal sink; TK-7 owns the full real assembly per its e2e AC. (5) CTX DISCIPLINE + DOUBLE: DrainQueueStage touches ONLY ctx.clock(); the WombatQueue is an injected constructor dep (ASMP-2: the composition root passes THE single instance); the stage NEVER acks (TK-7 acks on hold/completion — at-least-once preserved) and NEVER writes the journal (the engine journals StageResults). cog-worx ships no StageContext double, so wombat builds tests/support/stage_context_fake.py implementing the FULL Protocol with NotImplementedError everywhere except clock (+ configurable last_output for TK-6/7/8/10 reuse) — strict-mypy-satisfying AND loud on any accidental ctx-surface creep. AC3 is proven at the queue layer (fresh instance/new epoch redelivers, the TK-2-proven mechanism) — no engine re-simulation. TK-5 budget + files_in_scope amended.",
      links: ["TK-5","TK-2","TK-6","TK-7","TK-8","TK-10","TK-13","TK-21","ASMP-2","Q-41","Q-46"] }
  - { id: Q-48, type: open_question, status: resolved, scope: EP-4, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-6 build briefing: gate/decision.py collides with TK-21's canonical vocabulary; stub-vs-real scoring now that TK-23/25/42 are built; which PresenceSnapshot the stage consumes before TK-11; and the GateStage artifact-in/artifact-out convention",
      description: "Four pre-build gaps. (1) TK-6 files_in_scope lists gate/decision.py, but GateDecision/GateAction/ScoredItem already exist canonically in gate/models.py (TK-21, ISS-4 forbids competing definitions) and gate/ is already populated. (2) TK-6's ACs predate the real scoring build — they specify stub fixed values, while TK-23 (scoring), TK-25 (pending set) and TK-42 (UserModel) are all done and TK-27 is the designed real-gate convergence; stub or real here? (3) The ACs condition on PresenceSnapshot (unknown/stale -> hold) but the production presence_hold is TK-11 (later on the demo path); what does TK-6 consume now? (4) GateStage must consume TK-5's drained-batch artifact and emit a decision artifact TK-7 reads — kind/produced_by/data schema and batch-vs-per-item undefined.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — HOW/seam rulings + files_in_scope normalization; no locked decision, constitution item, or v1 scope touched; no graph change). (1) decision.py DROPPED from scope — the canonical vocabulary in gate/models.py is imported, never redefined (ISS-4 upheld); gate/gate.py holds gate_item_from_queue_item + stub_evaluate. (2) STUB STANDS: TK-6 proves the STRUCTURAL silence-default in the pathway wiring, which is its stated intent; wiring TK-23's real scoring now would drag the Q-41 async RatingParams composition (UserModel/EntityKG) into an mvp waypoint, duplicate TK-27's designed convergence work, and be rebuilt within days — the demo milestone (v0.39) is AT TK-27. The deliverable is the REPLACEMENT SEAM: GateStage takes an injected evaluate callable (GateItem, PresenceSnapshot|None) -> GateDecision; TK-6 ships stub_evaluate (payload['stub_urgency'] high->0.9/low->0.1, DEFAULT LOW = quiet default; >= injected urgency_threshold -> SURFACE_IMMEDIATE else HOLD; threshold injected, composition passes OperatingParams.urgency_threshold, no inline literal); TK-27 swaps the evaluator without touching GateStage. Per-item decisions reuse the canonical GateDecision(action, items=(ScoredItem,)) — no new type. (3) PRESENCE INTERIM: consume the TK-4 spike PresenceSnapshot + its PROVEN conservative presence_hold from presence/probe.py as-is (consuming a frozen spike is not extending it — Q-43 freeze principle; the predicate is the tested safety property, DEF-3); evaluate applies the hold BEFORE scoring (Q-12 — presence is a gate hold, never a scoring input); unknown/stale/low-confidence -> HOLD asserted by test. TK-11 hardens the predicate into gate/presence_hold.py + sources/presence.py and flips this import — already TK-11's AC4 obligation, so no new debt is created. (4) STAGE SEAM: input via ctx.last_output('drain_queue') + queue_items_from_artifact_data (Q-47 helper, never hand-parsed); output = ONE batch artifact Transition(to='review_or_speak', kind='wombat.gate_decisions' (plural — batch-symmetric with the drained batch), produced_by='gate', data={'decisions': [{'action', 'scored_item', 'queue_item'}...]}) where each entry carries the ORIGINAL Q-47 queue-item dict so TK-7 can ack holds; the to/from helpers are ADDED to stages/artifacts.py and TK-7 MUST deserialize through them (the Q-41/Q-47 shared-wire-helper principle). GateStage ctx surface = last_output only; heartbeats never reach it (drain Waits on empty). TK-6 budget + files_in_scope amended (decision.py dropped; artifacts.py added).",
      links: ["TK-6","TK-21","TK-23","TK-27","TK-11","TK-4","TK-5","TK-7","TK-13","Q-47","Q-41","Q-12","Q-17","Q-43"] }
  - { id: Q-49, type: open_question, status: resolved, scope: EP-4, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-6 verifier follow-ups: gate-decisions wire is not JSON-native (ItemKind enum member leaks into Artifact.data), and the inherited evaluate signature has no channel for real staleness detection (presence_hold's stale branch structurally inert at the call site)",
      description: "(1) gate_decisions_to_artifact_data serialized ScoredItem.item_kind as the ENUM MEMBER (dataclasses.asdict), inconsistent with the sibling 'action' field (.value) and the drained_batch artifact (all JSON-native); raw json.dumps RAISES. Production TimescaleJournal survives only because pydantic TypeAdapter(mode=json) coerces enums — but the DEMO runs InMemoryJournal (serialization path not cleared) and any plain-json path (debug logging, future adapter) breaks. It is the shared spine wire TK-7 inherits. (2) stub_evaluate calls presence_hold(snapshot, snapshot.taken_at) so age is always 0 — the stale->HOLD branch is structurally INERT through this call site (fine for TK-6: the provider returns a fresh snapshot per batch and AC3 only needs unknown->hold), but the inherited evaluate signature (GateItem, PresenceSnapshot|None) -> GateDecision has no 'now' channel, so TK-11/TK-27 cannot thread real staleness detection without a ruling. Also: TK-6's budget text still showed the pre-as-built stub_evaluate signature (injected ScoreFn params).",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — wire-convention + seam-shape HOW rulings; no locked decision/constitution/v1-scope/graph change). (1) FIX NOW, in TK-6, before it records done: store item_kind as ItemKind.value, reconstruct via ItemKind(value) in the inverse; and GENERALIZE the rule — Artifact.data payloads MUST be plain-JSON-native (str/int/float/bool/None/list/dict; enums as .value at the wire) with a wire regression asserting json.dumps(data) round-trips. Rationale: the single shared wire-helper module existing to prevent drift cannot itself be internally inconsistent (action as .value, item_kind as enum member); correctness must not depend on WHICH journal adapter serializes the artifact (TimescaleJournal pydantic-coerces; the demo's InMemoryJournal path is uncleared); the fix is two symmetric lines while the wire has exactly one consumer-to-be (TK-7) — deferring buys nothing and taxes every future stage. TK-7/8/10 inherit the JSON-native rule. (2) STALENESS SEAM RULED — freshness is resolved at the PROVIDER, not inside evaluate: the stage-side presence_provider (impure allowed — it may read the clock) stamps taken_at and applies the staleness ceiling at provision time, DEGRADING to state=unknown/confidence=0.0 when the underlying signal is stale; the pure evaluate keeps the inherited time-free signature UNCHANGED (the gate stays clock-free, consistent with Q-12 presence-as-gate-hold and the Q-42 purity discipline — a stale snapshot simply arrives as unknown, and unknown->hold already structurally holds). TK-11 homes the canonical staleness logic in its hardened provider + presence_hold(snapshot, now) INTERNALLY (its property test exercises the stale branch directly with explicit now); TK-27 inherits the same provider seam. The add-now-param-to-evaluate alternative REJECTED: it leaks clock-handling into the pure decision function and forces a signature migration across GateStage/TK-27 for a concern the presence domain owns. The evaluate-call-site inertness of the stale branch is therefore BY DESIGN (staleness resolved upstream), recorded here so TK-11/TK-27 briefings do not silently assume otherwise. (3) TK-6 budget text aligned to the as-built stub_evaluate(gate_item, presence, *, urgency_threshold) — the injected ScoreFn params were unneeded indirection; the TK-27 replacement seam is the injected evaluate callable on GateStage (unchanged).",
      links: ["TK-6","TK-7","TK-8","TK-10","TK-11","TK-27","TK-5","Q-47","Q-48","Q-12","Q-42"] }
  - { id: Q-50, type: open_question, status: resolved, scope: EP-5, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-8 build briefing: model acquisition vs AC3's construction-time key check, the compose input wire with TK-10 unbuilt, prompt boundary, degrade mechanics, and the terminal StageResult",
      description: "Verified cog-worx facts: Model.complete(*, messages: Sequence[ChatMessage], ...) -> ModelResponse{text, usage, model_id, finish_reason}; the ENGINE assembles the per-drive model from the ModelRegistry (models.assemble(model_profile, guard)) and exposes it as ctx.model — i.e. per-drive build from the registered spec with no client at import, exactly the S4 posture. Gaps: (1) AC3 wants ConfigurationError at ComposeStage CONSTRUCTION but ctx.model resolves at drive time — where does the key check live, and which profile does ctx.model resolve? (2) compose consumes the router's output but TK-10 is unbuilt — the input wire must be defined once so TK-10 produces it later without rework. (3) AC1 prompt boundary (payload only, never gate internals). (4) Which failures degrade to the template and within what bound. (5) Done vs Transition at the mvp spine's end, and where the new wire helpers live.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — HOW/seam rulings + files_in_scope normalization; no locked decision/constitution/v1-scope/graph change). (1) run() uses ctx.model.complete — the engine-assembled per-drive model from TK-1's DeepSeek spec (engine model_profile='deepseek'; no separate mouth profile in v1 — one model, and the engine seam means TK-9's BudgetGuard later attaches via guard= with zero compose change); ComposeStage never calls build_model. AC3 is satisfied at construction: __init__(*, config: WombatConfig, template_composer, timeout_seconds=2.0) validates deepseek_api_key non-empty -> ConfigurationError (explicit mouth dependency at construction; also guards a blank-string env that pydantic-settings would accept). ctx surface = model + last_output('compose_dispatch') + clock; StageContextFake gains a configurable fake model. (2) INPUT WIRE DEFINED NOW: 'wombat.compose_request' (produced_by 'compose_dispatch') data={'item_id','item_kind' (value),'payload'} — one surfaced item per invocation; NO scores/GateAction/queue internals may cross this wire (structural realization of the never-expose-the-model non_goal: the boundary is enforced at the WIRE, not by prompt discipline alone); helpers compose_request_to/from_artifact_data in stages/artifacts.py; TK-10 produces it later, TK-8 tests fabricate via the helper — zero rework. (3) PROMPT: system ChatMessage = fixed terse steward instruction; user ChatMessage rendered from payload fields + item_kind ONLY; AC1 test asserts payload present AND no score/action/internal keys in the captured prompt; TemplateComposer renders the deterministic fallback from the SAME fields (pure, no I/O). (4) DEGRADE: asyncio.wait_for(..., timeout_seconds=2.0 — AC-FIXED, not a TK-13 tunable); TimeoutError + provider/connection/5xx + BudgetExceeded (degrade NOT raise — policy is TK-9's, the mouth must never break the drain loop) + empty/None text ALL -> template with degraded=True; run() never raises (CancelledError passes through). (5) TERMINAL Done(output='wombat.composed_output', data={'text','item_id','item_kind','degraded'}) — compose ends the mvp drive; EP-30 deliver later flips Done->Transition one-line; composed_output helpers in stages/artifacts.py; both new wires JSON-native + json.dumps regressions (Q-49). TK-8 budget rewritten; files_in_scope += stages/artifacts.py + tests/support/stage_context_fake.py.",
      links: ["TK-8","TK-1","TK-9","TK-10","TK-7","TK-6","Q-47","Q-48","Q-49","ASMP-1"] }
  - { id: Q-51, type: open_question, status: resolved, scope: EP-4, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-10 modeling: engine-Transition dispatch vs router-invokes-composer, and how a mixed hold/surface gate BATCH becomes one route — including the stranded-lease trap for surplus surfaced items",
      description: "(1) TK-10's ACs read as call-semantics ('the composer is invoked exactly once, verified by stubs') but cog-worx stages TRANSITION and the engine drives the next stage; TK-8's ComposeStage is itself a terminal Stage reading ctx.last_output('compose_dispatch'). (2) GateStage emits ONE wombat.gate_decisions artifact carrying a BATCH (mixed hold/surface), a Stage returns exactly ONE StageResult, and TK-10's ACs are singular — how does a batch of N surfaced mixed-kind items become one Transition? HIDDEN CONSTRAINT: an unacked surfaced item cannot simply be left for the next cycle — same-epoch leased rows are never re-returned by drain() (Q-46 epoch reclaim), so a deferred surfaced item would be STRANDED until restart; and in the TK-6 stub spine holds are acked (disposed), with the durable PendingSet custody only arriving at TK-27.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — HOW/seam modeling ruling; no locked decision/constitution/v1-scope/graph change). (1) OPTION (a) CONFIRMED: ComposeDispatchRouter is a Stage with transitions=(composer stage names) returning Transition(to=<composer name by item_kind>, output=compose_request); the ENGINE drives the composer; 'invoked exactly once' is tested as Transition.to == the expected stub composer stage name; the router never calls a composer inside run() (option (b) rejected — departs from the engine model and breaks TK-8's as-built ctx.last_output('compose_dispatch') input). (2) BATCH RESOLUTION: the router does NOT read the raw gate batch. TK-7 (review_or_speak) owns single-ization: it reads wombat.gate_decisions, ACKS + journals every HOLD (stub-spine custody: hold = dispose quietly; the durable PendingSet custody arrives at TK-27), ACKS the one item it forwards (safe because Q-50 compose NEVER fails — forward = disposed), and emits the NEW single-item wire wombat.surfaced_item (data = ONE {action, scored_item, queue_item} entry) which the router consumes. The one-surfaced guarantee is an MVP COMPOSITION RULE: the composition root sets drain batch_size=1 for the mvp/demo spine (the Q-47 injected arg — the stage supports any batch size; the COMPOSITION bounds it), so each cycle carries at most one item end-to-end; items process one per drive cycle with the pathway looping via the drain Wait. DEFENSIVE (never silent, never stranded): if >1 surfaced entries nonetheless reach TK-7, it forwards the FIRST and logs a LOUD warning naming the unrouted item_ids (which remain acked-and-journaled as surfaced-but-not-composed — visible in the journal, not silently dropped and not lease-stranded); this is a bounded mvp defect mode explicitly superseded at TK-27, where the REAL multi-item semantics land (holds accumulate in the durable PendingSet instead of disposing, the flush arm consolidates surfaced backlog into ONE artifact, and the immediate arm is ceiling-bounded) — the TK-27 briefing MUST revisit the batch_size=1 composition rule. Wire helpers surfaced_item_to/from_artifact_data are added to stages/artifacts.py in TK-10's build (JSON-native + dumps regression, Q-49); TK-7 later produces the wire through them — zero rework, same pre-definition pattern as compose_request. TK-10 budget amended.",
      links: ["TK-10","TK-7","TK-8","TK-6","TK-5","TK-27","TK-25","Q-46","Q-47","Q-48","Q-49","Q-50"] }
  - { id: Q-52, type: open_question, status: resolved, scope: EP-4, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-7 build briefing: AC2's journal-write vs the stages-never-journal discipline, two-exit result shape + ack timing (the ack-before-engine-journal crash window), batch iteration, queue injection, and the e2e harness shape (the demo skeleton)",
      description: "Verified drive semantics: the Engine journals EVERY StageResult BEFORE advancing (S6, journal authoritative); Done = terminal COMPLETED; Wait(to=self) parks and the Sweeper re-drives from entry; in ONE drive the entry either Waits or Transitions (mutually exclusive). Gaps: (1) AC2 says the hold reason is 'written to the cog-worx journal' but Q-47 rules stages never write the journal. (2) The stage has two exits (all-holds vs surfaced) but one StageResult carries ONE artifact — and ack timing has a crash window either way (ack-then-die-before-journal loses the record; journal-then-ack is impossible from inside a stage, which cannot observe the engine commit). (3) How the batch iterates + the Q-51 defensive rule. (4) ASMP-2 queue injection. (5) Real-Engine e2e vs a manual harness, gating, and what the compose stage runs against.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — HOW/seam rulings + files_in_scope normalization; no locked decision/constitution/v1-scope/graph change). (1) AC2 SATISFIED BY THE ENGINE JOURNAL: hold -> terminal Done(Artifact kind='wombat.hold_report', data={'holds':[{item_id,item_kind,reason,urgency,load}...]}); the engine journals the StageResult before terminating, so the reason is durable with NO direct journal write (Q-47 upheld); scores may ride the hold_report — the journal is the internal audit record, not the mouth wire (CON-1 enforced at TK-10's compose_request boundary); helpers in stages/artifacts.py (JSON-native + regression). (2) TWO EXITS: 1-item batch (Q-51 batch_size=1) is EITHER hold -> Done(hold_report) OR surface -> ack + Transition(to='compose_dispatch', output=surfaced_item via TK-10's helper). The mixed case is STRUCTURALLY UNREACHABLE at batch_size=1 — newly load-bearing since one result carries one artifact; defensive >1 batch: ack all, forward FIRST surfaced, LOUD logger warnings name every non-forwarded item_id (never silent, never lease-stranded); superseded at TK-27. (3) ACK TIMING RULED — ack inside run() on BOTH branches, decide->ack->return, and the ack-before-engine-journal crash window is ACCEPTED at stub custody: both failure modes degrade toward SILENCE (crash-straddled hold loses only its reason record; crash-straddled surface is a missed surface — a double-surface is impossible post-ack, and ack idempotency makes pre-ack redelivery safe); the alternative (ack after commit) is structurally unavailable — a stage cannot observe the engine's journal commit; custody is replaced wholesale at TK-27 (durable PendingSet). (4) ReviewOrSpeakStage(*, queue: WombatQueue) — the SAME instance as DrainQueueStage from the composition root (ASMP-2); ctx = last_output('gate') + clock. (5) E2E = the HONEST full stack, WOMBAT_TEST_PG_DSN-gated (Q-46): real Engine + cold_boot_bundle (InMemoryJournal is the journal the assertions read) + build_drain_pathway over all five stages + ONE real pg WombatQueue; REAL ComposeStage with a deterministic FakeModel registered via the ModelRegistry factory, PLUS a degrade variant (fake model raises -> degraded template — the keyless demo path); asserts queue-empty, journal contains composed_output (or hold_report), router transitioned once, and a second drive parks Wait on the empty queue. This e2e IS the demo skeleton the v0.39 harness extends. TK-7 budget rewritten; files_in_scope += artifacts.py + tests/unit/test_review_or_speak.py.",
      links: ["TK-7","TK-10","TK-8","TK-6","TK-5","TK-27","TK-2","ASMP-2","Q-46","Q-47","Q-49","Q-50","Q-51"] }
  - { id: Q-53, type: open_question, status: resolved, scope: EP-4, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-7's real-Engine e2e caught a shipped defect in done TK-5: DrainQueueStage omits the Wait-to-self edge from transitions, so the runtime declared-route guard raises StageGraphError on the idle path — fix, scope mechanism, and the reusable convention",
      description: "Builder-confirmed standalone repro: DrainQueueStage.transitions=('gate',) but the empty-queue branch returns Wait(to='drain_queue') (itself); cog-worx's runtime guard checks StageResult destinations against graph.edges_from(stage), and 'drain_queue' is not in edges_from('drain_queue')={'gate'} -> StageGraphError on a REAL Engine. Never caught before because TK-5's tests drove the stage only via StageContextFake — the Wait branch's route was never guard-checked. Breaks the demo idle loop (empty -> Wait -> Sweeper re-drives). The TK-7 builder correctly did NOT silently patch outside its files_in_scope; it marked the idle e2e xfail(strict=True) with the diagnosis.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — cross-ticket corrective HOW ruling; no locked decision/constitution/v1-scope/graph change). (1) FIX CONFIRMED: transitions=('gate','drain_queue') — Wait(to=self) IS the intended cog-worx idle idiom (a committed Wait replays as a plain advance and the Sweeper re-drives from entry, per the verified drive semantics), so the stage genuinely has two destinations and BOTH must be declared edges; the defect is a missing declaration, not a wrong idiom. (2) SCOPE: folded into TK-7 as a SANCTIONED CROSS-TICKET RIDER (the established v0.47 rider pattern) — the e2e that found it is TK-7's own deliverable, the fix is two lines + a pinned-assertion update + the xfail flip, and a separate corrective ticket would be ceremony; TK-5 STAYS done (defect corrected under TK-7's rider, recorded honestly here — the v0.43 completion record is not rewritten, per append-only). drain_queue.py + test_drain_queue_stage.py added to TK-7 files_in_scope for the fix only; the TK-7 verifier must see the idle e2e variant pass for REAL (xfail marker gone). (3) REUSABLE CONVENTION (spine-wide, inherited by TK-11/TK-27 and every future stage): a stage's transitions tuple MUST declare EVERY StageResult destination it can return — including Wait-to-self re-park edges (TK-10's derive-transitions-from-the-routing-map idiom, v0.49, is the model); and any stage with a Wait/self-park branch requires at least one REAL-Engine/StageGraph route check, because stage-level fakes never exercise the runtime graph guard. META: this is the honest-full-stack e2e ruling (Q-52) doing exactly its job — a real defect in a done, committed ticket that 191 green stage-level tests missed; the builder's refusal to silently patch outside scope + loud strict-xfail is the correct discipline and is hereby endorsed as the pattern for cross-ticket defects found mid-build.",
      links: ["TK-5","TK-7","TK-10","TK-11","TK-27","Q-47","Q-52"] }
  - { id: Q-54, type: open_question, status: resolved, scope: EP-3, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-11 build briefing: canonical homes for the presence types vs the predicate, the AC4 import-flip rider surface, the TK-4 spike's fate, the config home for the staleness/confidence constants, and the states + now-seam reconciliation with Q-49",
      description: "TK-11 hardens the load-bearing conservative-on-stale predicate TK-27's silence guarantee depends on (Q-17). As-built coupling: the TK-4 spike presence/probe.py exports the types + predicate, imported by gate/gate.py, stages/gate_stage.py, tests/unit/test_gate.py, and the e2e — all outside TK-11's declared files_in_scope. Open: (1) where do PresenceState/PresenceSnapshot live vs presence_hold; (2) authorize the flip surface; (3) keep probe.py frozen (dead second predicate + duplicate types) or supersede; (4) staleness_ceiling/confidence_floor home — TK-13 or module constants (DEF-3 already says they live in TK-13, but as-built OperatingParams has no presence fields); (5) does AWAY exist on one OS signal, and how does the predicate get now for its staleness branch when Q-49 ruled the PROVIDER resolves freshness.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — HOW/seam rulings + sanctioned riders + files_in_scope normalization; no locked decision/constitution/v1-scope/graph change; DEC-6 single-signal upheld). (1) HOMES: types + hardened classify/read_idle_ms + the Q-49 PROVIDER -> sources/presence.py (the presence DOMAIN home; the source produces, the gate consumes); the pure canonical predicate presence_hold(snapshot, now, *, staleness_ceiling_s, confidence_floor) -> gate/presence_hold.py (keyword-required bounds, no baked defaults — the spike's baked defaults were the drift risk; defaults live in the versioned YAML). (2) FLIP RIDER SANCTIONED (import-line-only, no logic change): gate/gate.py, stages/gate_stage.py, tests/unit/test_gate.py, tests/integration/test_drain_pathway_e2e.py — listed in files_in_scope so the verifier expects exactly those diffs. (3) SPIKE SUPERSEDED (Q-43 freeze principle, TK-25 deletion precedent): probe.py + tests/presence/test_probe.py DELETED — the logic hardens INTO the production files and keeping the old copy would leave a dead second predicate + duplicate types (competing-definition drift); TK-4's record lives in poc.result + DEF-3 untouched; meaningful spike tests port to the production test files. (4) CONFIG: three OperatingParams fields ADDED NOW under the DEF-3-pre-committed TK-13 home (presence_staleness_ceiling_seconds=300.0, presence_confidence_floor=0.5, presence_idle_threshold_seconds=60.0; wombat_params.yaml version bump — the designed TK-13 change path; params.py/YAML/test riders sanctioned); predicate + provider receive them INJECTED (composition passes OperatingParams; tests pass literals; no inline literals — TK-13 guard spirit; DEF-3's revisit_trigger tune-the-YAML promise is now literally true). (5) STATES: active|idle|away|unknown; AWAY = idle_ms >= AWAY_THRESHOLD_S (1800.0, documented module constant, DESCRIPTIVE ONLY — a property test asserts IDLE and AWAY hold identically, so it is deliberately NOT a TK-13 param: TK-13 owns behavior-bearing constants). NOW-SEAM (Q-49 reconciled as TWO LAYERS): the provider degrade at provision is the PRIMARY runtime guard (gate call sites pass now=taken_at, age 0, inert BY DESIGN); the predicate keeps its OWN staleness check with explicit now as DEFENSE IN DEPTH (the silence guarantee must survive a provider bug), and the AC1/AC2 property tests drive the predicate stale branch directly with explicit now incl. the multi-hour sleep-gap case. TK-11 budget rewritten; files_in_scope expanded to the full flip/rider/deletion surface.",
      links: ["TK-11","TK-4","TK-6","TK-27","TK-13","TK-28","DEF-3","Q-17","Q-43","Q-49","Q-53","DEC-6"] }
  - { id: Q-55, type: open_question, status: resolved, scope: EP-9, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-27 convergence briefing: pipeline home + async composition, the two arms + one-decision-per-call, ceiling keying + DailyLedger wiring, the Q-30 shared predicate defined precisely, PendingSet custody switchover, the min-age timestamp gap, guard enforcement, and the demo GateStage swap shape",
      description: "The highest-seam ticket — everything built this run converges here. Gaps: (1) the ACs test gate.pipeline() but pipeline.py is outside files_in_scope, and TK-21's skeleton Gate has its OWN in-memory pending, not the TK-25 PendingSet; (2) scoring needs awaited RatingParams (async) inside a pipeline the ACs call directly; (3) arm decision logic + how CeilingHit is emitted; (4) ceiling ledger keying (EventClass vs ItemKind) + pg-gated tests; (5) Q-30's 'the SAME per-item selection predicate the flush arm uses' is incoherent as written — the flush arm includes ALL pending (AC3), so it has no per-item filter to share; (6) hold custody: the stub spine ack-DISPOSED holds (Q-52) but the real gate accumulates them durably — who acks what, and does the Q-52 crash window survive; (7) the TK-13 AC4 guard must go enforcing; (8) GateStage's injected evaluate is sync/per-item but the real gate is async/stateful. PLUS a discovered gap: PendingSet stores ScoredItems with NO timestamp, so AC3's flush_min_age guard is unimplementable without a wire change.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — the composition realizes DEC-13/CON-3 exactly as locked; no decision/constitution/v1-scope/graph change). (1) Gate REBUILT IN PLACE in gate/pipeline.py as the thin ASYNC orchestrator (skeleton pending dict REPLACED by the injected TK-25 PendingSet; TK-21 tests ported; decay stays TK-28); trigger.py = arms + the ONE shared worth predicate; ceiling.py = CeilingLedger over DailyLedger; all thresholds keyword-injected from OperatingParams at composition. (2) async def pipeline(items, *, surfacing_permitted=True); per item await ratings_for -> bind into the pure sync urgency/cognitive_load (Q-41/42); surfacing_permitted computed by the CALLER from presence (Q-12/Q-54 — the Gate never imports presence types); False suppresses BOTH arms but items still score+accumulate (presence suppresses surfacing, never accumulation). (3) ONE GateDecision per call: immediate arm (permitted AND u > urgency_threshold AND ceiling.allow(event_class)) -> record + surface_immediate; else durable add(scored, added_at=clock()); flush arm evaluated EVERY call incl. pipeline([]) (permitted AND cumulative_load > load_flush_threshold AND oldest age >= flush_min_age_seconds) -> surface_flush(all pending, urgency desc) + the TK-25 durable journaled clear; else HOLD. Events (CeilingHit/CapacityEviction) via an injected on_event callback (default loud log; tests inject a recorder). (4) Ceiling keyed per EVENT CLASS (DEC-13 personalization key; user_model.resolve_event_class), ledger_name ceiling:<EventClass.value>; trigger depends on a CeilingProtocol so arm unit tests run un-gated; CeilingLedger tests DSN-gated (Q-46). (5) Q-30 PREDICATE DEFINED: is_surfacing_worthy(scored, urgency_threshold) = u > urgency_threshold — ONE function in trigger.py shared by the immediate arm and select_items; select_items is async (awaits ratings_for), filters by it, sorts urgency desc, mutates NOTHING (AC4); the incoherence in Q-30 phrasing is resolved on the record: the flush arm inclusion criterion is MEMBERSHIP-in-pending (AC3 all-pending), so select_items shares the WORTH predicate, not the membership rule — threshold-free in Q-30 means free of the load/min-age GUARD, and TK-99 may pass its own bar later if calibration demands. (6) MIN-AGE GAP closed by a sanctioned TK-25 rider: added_at: float on the PendingSetAdd RECORD (not the canonical ScoredItem), PendingSet.add(item, *, added_at) + oldest-age accessor, legacy replay defaults 0.0 (no persisted prod data; TK-29 unbuilt inherits the wire free). (7) GUARD ENFORCING: pipeline.py/trigger.py/ceiling.py added to _PRODUCTION_CONSUMER_PATHS. (8) CUSTODY SWITCHOVER: hold = durable PendingSet custody BEFORE the queue ack, so the Q-52 crash window collapses to a harmless idempotent re-add (redelivery -> re-score -> set dedupe); review_or_speak structurally unchanged (acks live queue rows; flush items have none). DEMO SHAPES (implemented in the post-TK-27 harness step per the no-Stage-wiring non_goal, sanctioned riders recorded now): GateStage seam generalizes to an ASYNC BATCH evaluator wrapping presence-once-per-batch + await pipeline; surface_flush composes as ONE synthesized terse digest entry (real brief = TK-99/TK-100); batch_size=1 stands; flush evaluates on item cycles (no heartbeat reaches the gate while drain Waits on empty — dedicated tick = TK-28/TK-97, recorded not dropped). TK-27 budget + files_in_scope amended (+pipeline.py, +pending_set.py rider, +test_pipeline/test_pending_set/test_wombat_params).",
      links: ["TK-27","TK-21","TK-23","TK-25","TK-26","TK-42","TK-152","TK-13","TK-11","TK-28","TK-29","TK-99","TK-100","Q-30","Q-41","Q-44","Q-46","Q-48","Q-51","Q-52","Q-54","DEC-13"] }

  - { id: Q-56, type: open_question, status: resolved, scope: EP-19, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "Ingestion-arc sequencing: four suspected epic-level depends_on over-pulls on the brief cluster (Q-14 convention side effect) — normalize to ticket-ids just-in-time at each /plan-ticket",
      description: "Jim routed the post-demo build to the ingestion arc -> live morning brief. Sequencing the arc under the Q-14 convention (epic dep = ALL child tickets) surfaces four suspected over-pulls that would drag the dream cluster and the voice sinks in front of the first live text brief. (1) TK-98 (BriefGather) depends_on EP-17, whose children include TK-77 (task extractor, itself dep EP-13 = the whole dream cluster) and TK-80 (ReplyIntentBuilder) — but gather budget names only the poller + triage slice (TK-75/TK-76). (2) TK-76 and TK-77 each depend_on EP-13 for the runs-off-path (S1) requirement — whether that needs the full dream scaffold or only an off-path invocation convention is unruled. (3) TK-96 (walking skeleton) depends_on EP-17 + EP-30 while its own non_goals exclude voice and its budget says stubs acceptable for conflict/mouth. (4) TK-101 (deliver) depends_on EP-30 (TK-164/165 SpeakSink) while its own AC3 defines the voice-absent text-only degrade — voice stays v1 IN scope, the question is only whether the TEXT brief may ship first. Each is a dep-graph fix within architect authority (Q-14/Q-35 precedent) but deserves per-ticket scrutiny at its /plan-ticket briefing, not a blanket edit today. ALSO recorded as arc sequencing constraints (already ruled elsewhere, restated so the arc cannot silently skip them): TK-29 MUST land before the first LIVE laptop session (Q-44); TK-53 (Sweeper boot) must precede TK-97 (armed durable timers fire only under a running Sweeper); TK-9 precedes TK-100 via the EP-5 dep; TK-28 precedes TK-96/97 via the EP-9 dep and owns the dedicated heartbeat tick the flush arm needs (Q-55). NONE of this gates TK-3, the confirmed first ticket of the arc.",
      resolution: "PARKED-to-frontier by architect (within authority — the Q-35 deferral-to-frontier pattern; several of these over-pulls are literally Q-35-catalogued findings, e.g. the TK-96 inversion and the TK-72/77 identity edges). Each of the four suspected over-pulls is ruled at its OWNING ticket's /plan-ticket briefing with full seam context — TK-98's EP-17 narrowing when TK-98 is planned, TK-76/77's EP-13 question when TK-76 is planned, TK-96's EP-17/EP-30 and TK-101's EP-30 when those are planned — NOT batch-edited today with the dream/voice seams unexamined. The four arc sequencing constraints restated in the description (TK-29 before first LIVE session; TK-53 before TK-97; TK-9 before TK-100; TK-28 before TK-96/97) are ALREADY-RULED facts carried from Q-44/Q-55 and the declared graph, binding on the build loop now. This Q is the standing pointer; a brief-cluster ticket is not built until its over-pull is explicitly ruled in its briefing.",
      links: ["TK-98","TK-96","TK-76","TK-77","TK-80","TK-101","TK-29","TK-53","TK-9","TK-28","Q-14","Q-35","Q-44","Q-55"] }

  - { id: Q-57, type: open_question, status: resolved, scope: EP-15, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-71 build briefing: encryption-key home for the OAuth token store, secrets config sourcing, mocked-vs-live test convention, and the sanctioned dependency set (clears the one parked TK-71 audit finding — key provenance)",
      description: "First external-API + secrets ticket of the ingestion arc. Open before build: (a) AC3 requires tokens encrypted at rest but names no key source (the audit finding — OS keyring vs derived local key file vs param-store secret); (b) where client_id/client_secret/token-path are sourced; (c) how the OAuth flow is tested with no network in CI while the live wire still gets a runnable check; (d) which Google libs land and whether they follow the providers optional-extra precedent.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — HOW rulings + sanctioned riders; no locked decision/constitution/v1-scope/graph change; read-only Google API access is IN-FRAME per the locked v1 wedge, not an egress-exception question). (a) OS KEYRING AS THE SOLE TOKEN STORE — the full serialized Google authorized-user token JSON is stored directly in the OS credential vault via the keyring library (Windows Credential Manager/DPAPI on the v1 laptop; service/account = module constants WOMBAT_KEYRING_SERVICE=wombat / gcal-oauth-token in token_store.py, descriptive not tunables). NO token bytes are ever written to a wombat-managed file, satisfying AC3 in the STRONG form (no plaintext file exists at all; at-rest encryption is the platform vault); keyring backend unavailable or vault write fails -> loud ConfigurationError, NEVER a silent plaintext-file fallback; token blob exceeding the vault size limit -> fail loud, never chunk silently. Seam = a small runtime-checkable TokenStore Protocol (load/save/clear) + KeyringTokenStore adapter; tests inject an in-memory fake (unit tests never touch the real vault). REJECTED - Fernet key file (a key file beside the ciphertext is self-defeating without a vault, and it is two mechanisms where one suffices, NG-3) and TK-13 param store as key source (secrets never live in the tunables YAML). This CLEARS the parked audit finding on TK-71 (key provenance now declared, self-contained, no TK-13 linkage). (b) SECRETS = WombatConfig/env (the TK-1 DEEPSEEK pattern) — two new OPTIONAL fields google_oauth_client_id / google_oauth_client_secret (env GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET), explicitly NOT added to REQUIRED_ENV (the drain spine and demo must keep booting Google-less); validation happens AT CONSTRUCTION of the gcal auth component (TK-8 AC3-at-construction precedent) — building it with either var missing/blank raises ConfigurationError naming the first missing var. No token-path key exists (keyring has no path); OperatingParams/wombat_params.yaml untouched. config.py rider sanctioned (files_in_scope updated). (c) TEST CONVENTION — CI tests are mocked, zero network: AC1 asserts the flow is constructed with EXACTLY the hard-coded module constant GCAL_SCOPES=(calendar.readonly,) AND a granted-scope inspection helper rejects any token carrying a write/manage scope (the test feeds a write-scoped fake and MUST fail); AC2 mocks the token endpoint - expired access + valid refresh -> fresh token with the interactive flow provably never invoked; AC3 asserts no token file under tmp_path and no sentinel secret substrings in captured logs. LIVE SMOKE (Q-46 pattern applied to creds): ONE test gated on WOMBAT_TEST_GCAL_LIVE=1 (loud pytest.skip when absent) — loads the vault credential, refreshes against the REAL Google token endpoint, asserts granted scopes are exactly readonly; makes ZERO Calendar data-API calls (that is TK-72). The one-time interactive consent is a tiny CLI entry (python -m wombat.integrations.gcal.auth) Jim runs once — the bring-up step, not a test. (d) DEPS — google-auth-oauthlib (pulls google-auth) + keyring land as CORE [project] dependencies in pyproject + uv.lock; google-api-python-client is NOT sanctioned here (the data client is TK-72 concern; TK-71 makes zero Calendar API calls). The providers-extra precedent DOES NOT extend: that extra exists because model providers ride behind the swappable S4 seam and are never a hard dep, whereas read-only Google ingestion IS the locked v1 wedge, and Q-46 fresh-clone-never-fails wants the mocked suite runnable on bare uv sync. SEAM FOR TK-72: TK-71 exposes ONE consumption seam — a CalendarAuth component returning refreshed, scope-guarded google Credentials — which TK-72 receives INJECTED (constructor arg); TK-71 is obtain + store + refresh + scope-guard ONLY.",
      links: ["TK-71","TK-72","TK-1","TK-8","TK-13","Q-35","Q-46","Q-56","NG-3","NG-7"] }

  - { id: Q-58, type: open_question, status: resolved, scope: project, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "tests/calendar/ shadows the stdlib calendar module — with google-auth in the tree (TK-71) pytest collection of the ENTIRE suite aborts; rule the structural fix before TK-72",
      description: "Real, reproducible latent packaging bug found by the TK-71 verifier. ROOT CAUSE: pytest package-root insertion binds tests/calendar/ (TK-73 spike tests) under the bare top-level name calendar, shadowing the stdlib module requests imports (from calendar import timegm; requests is transitive via google-auth); compounded by the pythonpath tests entry in pyproject. SYMPTOM: importing google-auth anywhere under collection aborts the WHOLE suite. TK-71 shipped a sound self-contained stopgap (force-load-stdlib guard inside test_auth.py) that does NOT scale — TK-72 and every later google-importing test would need a copy-pasted guard. Verifier DISPROVED the one-liners: tests/__init__.py alone still crashes; pythonpath removal alone still crashes; BOTH fix the shadow but break the bare support.* imports in tests/unit/test_gate.py + test_review_or_speak.py.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — repo/test packaging HOW; no locked decision/constitution/v1-scope change; +1 ticket, graph trivially acyclic). RULED: PROPER PACKAGING, option (b) — the exact combo the verifier proved working, codified as NEW TICKET TK-15 (EP-1, P1, S, mvp; dep TK-71; TK-72 depends_on += TK-15 so the fix lands BEFORE the poller): tests/ becomes a real package (tests/__init__.py + per-dir __init__.py), the pythonpath tests entry is removed, the two bare support.* imports become package-qualified tests.support.*, the TK-71 stopgap guard is REMOVED in the same pass (explicitly in TK-15 AC3 so it cannot be orphaned), and ONE regression test pins stdlib-calendar-wins forever. STANDALONE TICKET, not folded into TK-72: a repo-wide test-packaging change inside the poller ticket is scope creep and muddies both verifications; TK-72 scope stays the poller. REJECTED: renaming tests/calendar/ — treats one symptom, the hazard recurs on any future stdlib-named test dir (email, json, ...), and it churns TK-73 frozen-record paths; conftest sys.path hack — perpetuates the exact hazard. PRINCIPLE recorded for all future test dirs: no test directory may ever be importable as a bare top-level name; package-qualified imports are the convention from TK-15 on.",
      links: ["TK-15","TK-71","TK-72","TK-73","Q-35","Q-57"] }

  - { id: Q-59, type: open_question, status: resolved, scope: EP-15, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-72 build briefing: as-built TK-3 Protocol conformance vs the stale event_to_queue_item naming, the canonical-identity registry rider (the parked Q-35 dedup finding), HTTP client choice, transient-error posture vs registry degrade semantics, lookahead home, and event_class stamping for raw calendar events",
      description: "First real InputSource. Gaps found at briefing: (1) TK-72 budget names event_to_queue_item but the AS-BUILT TK-3 contract moved the mapping into the REGISTRY (poll() returns SourceEvent(event_key, payload); the registry forms the QueueItem) — the Q-35-catalogued naming-drift finding; (2) the as-built registry derives idempotency_key via an interim f-string colon-join, NOT TK-12 canonical derivation — the Q-35 dedup finding (AC3 as written says dedup by event_id, which a literal build would key bare, contradicting TK-12 AC4); (3) which Google HTTP client; (4) AC2 says the poller logs failure + emits no items + does not crash, but the as-built TK-3 registry treats a RAISING poll() as source-degraded and stops polling that source — a transient network blip must not permanently kill the calendar source; (5) where lookahead lives; (6) what event_class raw calendar events carry given EventClass has no CALENDAR_EVENT member.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — HOW rulings + one sanctioned rider + AC sharpening; no locked decision/constitution/v1-scope/graph change; TK-72 deps unchanged, all done). (1) AS-BUILT PROTOCOL WINS: CalendarPoller conforms to sources/base.py exactly — id=gcal, poll_interval_seconds, async start/stop/poll -> list[SourceEvent(event_key=google event id, payload=JSON-native serialized CalendarEventItem)]; the budget event_to_queue_item naming is superseded on the record. (2) SANCTIONED RIDER on sources/registry.py + tests/unit/test_source_registry.py: replace the interim colon-join with item_identity.idempotency_key(source.id, event.event_key) — TK-12 AC4 (ONE canonical derivation at every dedup path) becomes enforceable at the first real source; AC3 reworded to assert cross-poll key equality through the canonical derivation + single admission via the fake Enqueuer (TK-2 proven ON CONFLICT carries the DB half). (3) HTTP = AuthorizedSession (google.auth.transport.requests) over the Calendar v3 REST events list (timeMin/timeMax, singleEvents=true), credentials INJECTED from TK-71 CalendarAuth seam; google-api-python-client REJECTED (zero new deps per NG-3; session mock makes the no-write assertion structural — no non-GET method ever invoked). (4) TRANSIENT-ERROR POSTURE: expected failures (network/connection, 401/403/5xx) are CAUGHT inside poll(), logged with source id, return [] — never raise; the registry degrade path is reserved for programming errors, because as-built degrade STOPS polling the source and a blip must not silently kill calendar ingestion until restart (quiet-thesis: fail toward silence, but not toward permanent deafness). (5) lookahead_hours = constructor arg, default 48.0 AC-FIXED (TK-8 timeout precedent); TK-13 field pre-authorized if composition later wants it configurable; clock injected, RFC3339 UTC. (6) NO event_class on raw calendar events — payload omits the key and the Q-41 total fallback resolves via ItemKind.GENERIC; adding a CALENDAR_EVENT EventClass is a deliberate rating-vocabulary version bump (TK-41 governance) revisitable at DEF-1 calibration, NOT a poller-side free-form string; CALENDAR_CONFLICT stamping stays with TK-74 conflict items. (7) models.py promotion must keep TK-73 frozen spike tests green (Q-43 mechanical-port principle). TK-72 budget annotated, AC3 reworded, files_in_scope += registry rider files.",
      links: ["TK-72","TK-3","TK-12","TK-71","TK-2","TK-73","TK-74","TK-41","TK-13","Q-35","Q-41","Q-43","Q-57","NG-3"] }

  - { id: Q-60, type: open_question, status: resolved, scope: EP-15, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "TK-72 model tension: the TK-73 spike CalendarEventItem is DAY-SCOPED int-minutes (0..1440 since local midnight) but real Google events are RFC3339 instants spanning arbitrary days — Q-59 rulings #1 (payload = serialized CalendarEventItem) and #7 (spike tests stay green) are jointly unsatisfiable under a naive promotion",
      description: "Builder-found before code. calendar/models.py CalendarEventItem(event_id, title, start: int, end: int minutes-since-local-midnight, half-open, post_init 0<=start<end<=1440) is the domain slots.py + test_slots.py (TK-73 frozen spike) do ALL their conflict/free-interval math in. Changing start/end to datetimes breaks slots.py NON-mechanically (whole minutes domain) and fails the frozen tests. Also open: all-day events (Google returns a date, not a datetime) in or out of TK-72 scope; and whether the real type lives in calendar/models.py or integrations/gcal/.",
      resolution: "RESOLVED by architect 2026-07-02 (within authority — model/seam HOW; no locked decision/constitution/v1-scope/graph change; supersedes the TK-72 budget promote-the-stub sentence on the record). RULED OPTION (a) — NEW SIBLING TYPE, SPIKE UNTOUCHED. The two types model DIFFERENT DOMAINS, not two fidelities of one type: CalendarEventItem is a DAY-PROJECTION (the coordinate system the proven slot math lives in), CalendarEvent is the ABSOLUTE-TIME wire fact. (1) TK-72 adds frozen dataclass CalendarEvent{event_id: str, title: str, start: datetime aware-UTC, end: datetime aware-UTC, all_day: bool} + post_init (aware, start<end) + JSON-native to_payload/from_payload beside the type (ISO-8601 datetimes, Q-49; TK-98 gather deserializes through them). Poller payload = CalendarEvent.to_payload(). ALL-DAY IN SCOPE minimally: date-only start/end resolve to midnight in the INJECTED configured wombat tz (the DEC-21 civil-local identity) then normalize to UTC, all_day=True; exclusive-end date preserved as-is; the poller must neither crash on nor silently DROP all-day events (the brief needs them); all-day conflict SEMANTICS deferred to TK-74. (2) TK-73 spike stays FROZEN: CalendarEventItem/slots.py/test_slots.py untouched, zero test churn — Q-59 #7 now satisfied trivially; the real-events -> day-minutes projection BRIDGE is explicitly TK-74 territory (its budget already owns the free/busy projection; its /plan-ticket briefing rules project-into-minutes-and-reuse-slots.py vs lift-the-overlap-math — either way spike files stay frozen, and TK-74 ACs that say CalendarEventItem get read as CalendarEvent at that briefing). REJECTED option (b) (promote + port): non-mechanical rework of a frozen spike violates the Q-43 freeze principle and inflates TK-72 scope. (3) HOME CONFIRMED: calendar/models.py — CalendarEvent is a shared DOMAIN type (TK-74 conflict input, TK-98 gather input), NOT a gcal adapter detail; integrations/gcal/poller.py only maps Google JSON -> CalendarEvent; files_in_scope unchanged (models.py already in). TK-72 AC1 reworded onto the Q-60 type + wire helpers; the poller gains an injected tz (ZoneInfo) alongside the injected clock.",
      links: ["TK-72","TK-73","TK-74","TK-98","Q-59","Q-43","Q-49","DEC-21"] }

  - { id: Q-61, type: open_question, status: resolved, scope: EP-15, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "The real AuthorizedSession wire is UNOWNED — CalendarAuth -> AuthorizedSession -> CalendarPoller composition exists in no ticket; credential attachment, live query-param shape, and real 401 behavior are unconstructed and untested",
