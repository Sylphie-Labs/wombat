omposed_output artifact (engine journals it; no direct journal write). (5) CEILINGS = TK-13 TUNABLES: OperatingParams += mouth_daily_token_ceiling / mouth_max_usd_per_drive / mouth_max_calls_per_drive (YAML version bump; TK-13 AC4 guard covers the new consumers; no inline literals). AC2/AC4 reworded onto verified seams; files_in_scope amended (-002 migration, +params/YAML/artifacts/cost-init + tests).",
