the runnable path; tests not exercising decay pass ttl=inf plus a no-op rollover fake; bootstrap.assemble_runtime composes DayRollover over the SAME DailyLedger instance as CeilingLedger and passes OperatingParams.decay_ttl_seconds (field + YAML value already exist, verified - no params change). Estimate M CONFIRMED. TK-28 build UNBLOCKED.",
