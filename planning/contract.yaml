    title: PlaywrightCapability scaffold — external-tier cog-worx Capability, a11y-tree session
    intent: As the wombat engine, I need a registered external-tier cog-worx Capability that opens a Playwright browser session and exposes an accessibility-tree navigation API, so automation tasks can be dispatched via the capability registry — establishing the integration seam without which no browser task can be built.
