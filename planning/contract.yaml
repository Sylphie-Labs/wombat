  - { date: "2026-06-21", version: "0.19", change: "Pre-build EMPIRICAL readiness check of TK-14 (ran cog-worx in the wombat venv, not just read source) after a are-we-sure challenge. PROVEN for the cold-boot path (AC1/AC3 — the v1 default): all imports resolve; InMemory{Journal,GraphStore,LatentStore}() + PathwayRegistry() + ModelRegistry() construct; the three substrate Protocols are runtime_checkable and the doubles pass isinstance True; and Engine(...) constructs from the doubles with NO database running. Execution then surfaced two real refinements to the real-adapter path (AC2) that read-only planning missed, now folded into TASK-3/TASK-5 (no scope change): (1) cog-worx already ships cogworx.adapters.config.SubstrateSettings (BaseSettings, reads env) — wombat must NOT define its own nor reuse that env-reader (it would bypass TK-13 as the param owner); the factory passes dsn=/uri=/dim= kwargs DIRECTLY from TK-13 OperatingParams to the adapters; (2) PgLatentStore requires dim:int (keyword, no default, absent from SubstrateSettings) — the embedding dimension is a TK-13 OperatingParam. Also: adapters connect LAZILY (private _connection, no __init__ connection) so the AC2 residency-check-before-connect test is clean; and TK-14 AC1 wording is imprecise — Engine also requires models= so the AC1 test supplies a bare ModelRegistry() alongside the bundle. Verdict: TK-14 cold-boot path is build-ready and proven; real-adapter path ready with TASK-3/5 tightened. validate PASS; gate_check analyze PASS.", by: "claude" }
