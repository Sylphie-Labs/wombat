  # --- Decisions (append-only) ---
  - { id: DEC-1, type: decision, status: accepted, scope: FEAT-2, date_raised: "2026-06-19", converted_from: "Q-1", title: "The gate is a two-axis (Urgency x Cognitive Load) deterministic pressure engine",
      context: "The whole persona hangs on a concrete definition of 'necessary'. Jim chose a custom decision engine over a static threshold, modeled on sylphie's drive-engine opportunity pipeline (accumulate -> threshold -> prioritize -> bounded queue -> deterministic emit; no LLM in the decision).",
      decision: "Every event is scored on TWO INDEPENDENT axes: Urgency (per-event surface-priority) and Cognitive Load (per-event burden). Cognitive Load is CUMULATIVE across pending/un-surfaced items (the backlog's total burden can itself warrant action). Both per-event ratings are PERSONALIZED and ADAPTIVE — supplied/updated by the empirical user model (FEAT-3) and re-tuned by the nightly consolidation pass (FEAT-4). The voice/hold decision is fully deterministic (S9); the model never decides.",
      consequences: "Makes FEAT-3 and FEAT-4 load-bearing for the gate (they own the ratings). Concrete scoring functions, threshold/flush logic (immediate single-voice on high Urgency vs. consolidated flush/brief on accumulated Cognitive Load), and bounds are designed at /plan-design. Reuses sylphie drive-engine patterns as prior art (S-style synthesis)." }
  - { id: DEC-2, type: decision, status: superseded, superseded_by: "DEC-11", scope: FEAT-3, date_raised: "2026-06-19", converted_from: "Q-2", title: "Memory = cog-worx + thin PA empirical-user-model layer",
      context: "cog-worx already ships a full memory layer (recall stack, world/user model, pgvector hot/cold, coherence). The PA docs referenced Mem0/Letta and an existing wombat/memory RAG pipeline overlapped it.",
      decision: "Use cog-worx's memory/recall/world+user model as the store and engine, plus a THIN PA-specific empirical-user-model layer on top (behavior + outcomes, never motive). Do not adopt Mem0/Letta; retire/relegate the standalone wombat/memory RAG pipeline.",
      consequences: "One substrate (aligns with CST-4); no duplicate memory system. The thin layer owns PA semantics (event ratings, outcome tracking) and rides cog-worx recall + the off-path consolidation seam." }
  - { id: DEC-3, type: decision, status: accepted, scope: FEAT-7, date_raised: "2026-06-19", converted_from: "Q-3", title: "v1 wedge = calendar + Gmail into one combined morning brief",
      context: "The morning brief and the first concrete gate definition both need a first wedge.",
      decision: "v1 builds BOTH calendar (read-only) and Gmail, each just deep enough to produce ONE combined morning brief as the v1 target, then deepen.",
      consequences: "The morning brief (FEAT-7) is the v1 north star and the integration point for FEAT-5 + FEAT-6. Depth on each integration is iterated after the brief lands." }
  - { id: DEC-4, type: decision, status: accepted, scope: FEAT-1, date_raised: "2026-06-19", converted_from: "Q-4", title: "Mouth model = DeepSeek (cloud, OpenAI-compat) via the S4 seam",
      context: "Local-first + cheap-model principles; cog-worx S4 makes the provider swappable per agent.",
      decision: "The mouth model for v1 is DeepSeek (cloud, cheap, OpenAI-compatible) via cog-worx's OpenAICompatModel behind the S4 seam.",
      consequences: "Phrasing calls go to a cloud API — see ASMP-1 (user content in phrasing payloads leaves the host). Storage stays local. Provider remains swappable (S4) — a local model can replace it later without touching the core." }
  - { id: DEC-5, type: decision, status: accepted, scope: FEAT-2, date_raised: "2026-06-19", converted_from: "Q-5", title: "User-state = pluggable input sources registered to the loop server",
      context: "User-state/presence must not be hardcoded to one host's signals; it has to scale across devices/sources.",
      decision: "User-state/presence is a PLUGGABLE set of signal INPUTS that REGISTER with the server running the autonomous loop. The loop/gate reads user-state from a registry of currently-registered inputs; adding a new signal source is a registration, not a rewrite. Works with 1 input on a laptop today and N inputs later, unchanged gate.",
      consequences: "The input-source registry is foundational (part of FEAT-1). Lands cleanly on cog-worx's registry + coordination-contract machinery (concrete shape designed at /plan-design)." }
  - { id: DEC-6, type: decision, status: accepted, scope: project, date_raised: "2026-06-19", converted_from: "Q-6", title: "v1 runs on a laptop; always-on hardware deferred",
      context: "Always-on hardware (Jetson/ARM/VPS) vs. dev laptop; affects local-model feasibility and user-state signals.",
      decision: "v1 runs on a laptop / dev machine. True always-on + 'survives sleep' (CST-1) is treated as a later port, not a v1 gate.",
      consequences: "Faster iteration; CST-1 is a follow-up. Local-model feasibility is moot for v1 since the mouth is DeepSeek (DEC-4)." }
  - { id: DEC-7, type: decision, status: accepted, scope: FEAT-12, date_raised: "2026-06-19", converted_from: "Q-7", title: "Voice is in v1, built as a registered input source",
      context: "Voice scope for v1.",
      decision: "Voice is IN v1 ('out the box'), but built as ONE registered input source on the loop's input queue (not a special-cased path), plus terse output on rare speak-events.",
      consequences: "Voice rides the same input-queue + registry machinery as every other source (DEC-5, DEC-8). No bespoke voice pipeline in the core." }
  - { id: DEC-8, type: decision, status: accepted, scope: FEAT-1, date_raised: "2026-06-19", converted_from: "Q-7", title: "The autonomous loop is queue-driven; idles on empty",
      context: "The shape of the autonomous loop itself.",
      decision: "The autonomous loop is QUEUE-DRIVEN: registered input sources feed a queue; the loop drains it and the gate decides what surfaces. With NO inputs, the loop runs but does nothing — it never invents work.",
      consequences: "Deterministic, quiet-by-default spine made concrete. All integrations (calendar, Gmail, voice, presence signals) are input sources on this queue. Maps onto cog-worx's loop/coordination primitives (designed at /plan-design)." }
  - { id: DEC-9, type: decision, status: accepted, scope: FEAT-6, date_raised: "2026-06-19", converted_from: "Q-8", title: "v1 email = Gmail only",
      context: "Email provider breadth vs. depth in v1.",
      decision: "v1 supports Gmail ONLY (no Outlook / other providers — see NG-8).",
      consequences: "Depth-first on one provider; multi-provider is a post-v1 consideration." }
  - { id: DEC-10, type: decision, status: accepted, scope: FEAT-10, date_raised: "2026-06-19", converted_from: "Q-9", title: "Browser / computer use is in v1",
      context: "Browser/computer-use scope for v1.",
      decision: "Browser / computer use is IN v1, accessibility-tree (Playwright) as the workhorse with screenshot computer-use as a niche fallback and explicit human login handoff (CST-5, NG-5).",
      consequences: "FEAT-10 stays in scope (lower relative priority, P3). Integration shape (in-process vs MCP) designed at /plan-design." }

  - { id: DEC-11, type: decision, status: accepted, scope: FEAT-3, date_raised: "2026-06-19", supersedes: "DEC-2", title: "Product memory = cog-worx + thin PA layer; the dev agent-memory pipeline is a separate, out-of-scope layer",
      context: "DEC-2 conflated two unrelated things: (a) the PRODUCT's user-model memory (FEAT-3) and (b) the wombat/memory RAG pipeline, which is DEV TOOLING — agent-build memory for the Claude Code session (per its own README), separately verified as capture/chunk/embed-working but recall-unverified. Jim confirmed the dev pipeline is completely separate and has nothing to do with the product.",
      decision: "Product memory (FEAT-3) = cog-worx's memory/recall/world+user model plus a thin PA-specific empirical-user-model layer. This says NOTHING about the wombat/memory dev pipeline, which is a separate layer Jim owns and is OUT of product scope. DEC-2's 'retire/relegate the wombat/memory RAG pipeline' clause is rescinded.",
      consequences: "The contract no longer implies touching the dev-memory pipeline. Product-memory direction is unchanged from DEC-2's intent (cog-worx + thin PA)." }

  # --- Assumptions ---
  - { id: ASMP-1, type: assumption, status: accepted, scope: FEAT-1, date_raised: "2026-06-19", date_updated: "2026-06-20", title: "DeepSeek-cloud phrasing payloads leaving the host is an accepted privacy tradeoff",
      description: "DEC-4 sends phrasing payloads (which may contain user content, e.g. an email draft) to DeepSeek's cloud API. This is in tension with 'privacy as character / data stays local' (NG-7, CON-7), which we scope to STORAGE, not the phrasing call.",
      validation_method: "Confirm with Jim that cloud phrasing of user content is acceptable for v1; if not, swap the mouth to a local model via the S4 seam (DEC-4 keeps this open). Revisit at /plan-design.", rationale: "Surfaced as an explicit assumption rather than a silent gap.",
      resolution: "ACCEPTED by Jim 2026-06-20: cloud phrasing of user content is OK for v1. 'Data stays local' is scoped to STORAGE; the phrasing call is the one accepted exception. The local-model swap (S4 seam, DEC-18) remains the deferred escape hatch if this is revisited post-v1." }
  - { id: ASMP-2, type: assumption, status: accepted, scope: EP-2, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "At most ONE live draining WombatQueue instance exists process-wide — the epoch-based lease reclaim (Q-46) is sound ONLY under single-host/single-process v1",
      description: "The as-built TK-2 lease mechanism reclaims any row whose leased_by differs from the instance's own epoch, on the premise that a foreign lease can only belong to a DEAD process (single-host single-process, the DEC-6/DEC-8 frame). The independent verifier confirmed AND reproduced the failure mode outside that premise: two SIMULTANEOUSLY-live WombatQueue instances steal leases back and forth, producing genuine double-surfacing — the exact too-loud failure the gate exists to prevent. The constraint is documented in TK-2's budget, queue.py docstrings, and the no-cross-process-locking non_goal, but until now was doc-convention only, with nothing making downstream assembly tickets inherit it explicitly.",
      validation_method: "Structural, at the owning call sites: the drain-pathway assembly (TK-5/TK-6) constructs EXACTLY ONE WombatQueue for the process lifetime (composition-root singleton, same posture as TK-1's engine guard); any supervisor/restart wrapper (bring-up, TK-149/TK-151 territory) MUST fully terminate the prior process before constructing a successor — never overlap-restart; the runtime Sweeper boot (TK-53) and every other pathway ENQUEUE through the shared instance and never construct their own draining queue. TK-29 inherits the same premise for the pending-journal adapter host process.",
      rationale: "Recorded as an explicit assumption rather than left as module documentation because the invariant is LOAD-BEARING for the quiet-thesis (lease stealing = double-surfacing) and is invisible at the call sites that could violate it: a future supervisor ticket adding an overlap-restart, or a second drain loop, would pass every existing test (the gated suite runs one instance) while silently breaking at-least-once-without-double-surfacing in production. If a post-v1 direction ever runs multiple processes, the epoch reclaim MUST be replaced (lease timeout or pg advisory lock) — that is a deliberate revisit, not a patch.",
      resolution: "ACCEPTED by architect 2026-07-02 (within authority — records the operating premise the locked DEC-6/DEC-8 frame already implies; no new capability, no scope change). Constraint inherited explicitly by TK-5/TK-6 (single queue instance at composition), TK-53 (enqueue-only), TK-29 (same single-process premise), and any future supervisor/bring-up wrapper (terminate-before-restart)." }

  # --- ADRs (architecture decisions, /plan-design) ---
  - { id: DEC-12, type: decision, status: accepted, scope: FEAT-1, date_raised: "2026-06-19", title: "wombat maps onto cog-worx as Stages + pathways; never forks the Engine",
      context: "wombat needs an autonomous loop, durability, memory, tools, a model seam — all shipped by cog-worx through frozen seams (Engine/Stage/StageGraph/pathway, Journal, RecallStack, Registry, ModelRegistry). CON-7/CST-4.",
      decision: "Build wombat as dev-authored pathways of Stages registered with a cog-worx Engine that wombat constructs (its own ModelRegistry/BudgetPolicy/Registry/RecallStack/personality/rules). wombat writes NO loop code; cog-worx is a dependency, never edited.",
      consequences: "(+) Free durability, exactly-once resume, taint/approval, budget guards, recall; survives sleep-resume (CST-1). (-) Bound to cog-worx seam shapes/cadence; needed seam changes go via cog-worx C3. (-) cog-worx Phase-4 (verification) not done — v1 must not depend on the oracle/antithesis layer.",
      alternatives: ["Fork cog-worx (violates CON-7; doubles maintenance)", "Bespoke loop (violates S2/CST-4; loses journaled exactly-once resume)"] }
  - { id: DEC-13, type: decision, status: accepted, scope: FEAT-2, date_raised: "2026-06-19", title: "The two-axis pressure gate is deterministic code between the queue and the loop; no LLM in the decision",
      context: "DEC-1/CON-1/CON-2/CON-3/NG-4/S9: gate decides on Urgency x cumulative Cognitive Load with zero tokens. sylphie drive-engine is the prior art (accumulate->classify->priority->bounded queue->decay->publish, no model).",
      decision: "Implement wombat.gate as a pure deterministic module: per-item urgency() and cognitive_load() pure functions parameterized by the user model; Cognitive Load cumulative over a durable bounded pending set; two trigger arms (immediate-voice on high Urgency, consolidated-flush on high cumulative Load / brief window); decay of stale items; emits a surface|hold|flush decision artifact that is the only thing handed to the mouth.",
      consequences: "(+) '0 LLM-decided interruptions' is structural; fully unit-testable; lesionable (S8) and re-tunable (FEAT-4) without touching pathways. (-) The scoring functions are the biggest unknown (spike, RISK-1). (-) Cumulative load needs durable journaled pending-set state (RISK-5).",
      alternatives: ["Static per-event threshold (rejected at DEC-1)", "LLM-judged interruption (violates CON-2/NG-4/S9)", "Gate inside a model call (entangles decision with phrasing)"] }
  - { id: DEC-14, type: decision, status: accepted, scope: FEAT-1, date_raised: "2026-06-19", title: "One queue-driven drain pathway; input sources register with a source registry; empty queue idles",
      context: "DEC-8 (queue-driven, idles on empty), DEC-5 (pluggable sources that register; scales), DEC-7 (voice is just a source). cog-worx ships a capability Registry + S7 contracts but no always-on driver (S7 contracts-now).",
      decision: "Define a durable bounded WombatQueue (wombat domain table; journal stays run authority); a SourceRegistry where input sources (calendar/Gmail/voice/presence) register an id/poll-or-push/event->QueueItem mapping; and a drain pathway (DrainQueue->Gate->[Hold|Compose->ReviewOrSpeak]) run on a Wait-driven heartbeat that re-parks on an empty queue.",
      consequences: "(+) Quiet-by-default + 'never invents work' are structural; sources are uniform (DEC-7); survives sleep via durable timers (CST-1). (-) wombat owns queue durability + source lifecycle. (-) Cross-process single-driver is cog-worx's deferred gap — acceptable for single-host v1 (DEC-6).",
      alternatives: ["Hardcoded per-integration loops (violates DEC-5/DEC-8)", "Busy-poll that works on empty (violates DEC-8/CON-3)", "cog-worx coordination platform (does not exist, S7)"] }
  - { id: DEC-15, type: decision, status: accepted, scope: FEAT-3, date_raised: "2026-06-19", title: "The thin PA layer rides cog-worx's user-model scope; stores behavior + outcomes, never motive",
      context: "DEC-2/DEC-11: product memory = cog-worx memory + thin PA empirical-user-model layer supplying/updating the gate's ratings. cog-worx ships a scoped user_model (Neo4j, provenance/epistemic-typed, S5), episodes, latent, recall, off-path projectors. CON-6/NG-1.",
      decision: "Implement the PA model as a thin domain layer over cog-worx's user_model scope: a pure read seam (UserModel.ratings_for(item)) resolving personalized Urgency/Load params; a cheap synchronous write seam emitting provenance-typed observation/outcome claims (extraction off-path, S1); and a structural hard wall — the claim vocabulary admits only behavior+outcome predicates, so motive cannot be stored.",
      consequences: "(+) One substrate (CST-4); provenance/epistemic typing free (S5). (-) Coupled to cog-worx scope/recall seams. (-) Needs a versioned rating-parameter vocabulary up front.",
      alternatives: ["Mem0/Letta or the wombat/memory pipeline (rejected DEC-2/DEC-11)", "Storing inferred motive (violates CON-6/NG-1)"] }
  - { id: DEC-16, type: decision, status: accepted, scope: FEAT-7, date_raised: "2026-06-19", title: "The morning brief is a scheduled pathway whose body is one forced flush through the gate",
      context: "DEC-3/FEAT-7: exactly one consolidated brief per morning from the calendar+Gmail slice, delivered once; the v1 north star.",
      decision: "Implement the brief as a timer-fired brief pathway (Gather calendar + Gmail -> deterministic DetectConflicts -> forced GateFlush -> Compose (mouth phrases chosen contents) -> Deliver text/terse-voice). Conflict detection and item selection are deterministic; the mouth only renders. 'Exactly one per morning' = one daily timer-fired run.",
      consequences: "(+) Reuses the same gate+mouth+sources (the brief is a scheduled forced flush, not a parallel system); 'one brief not a stream' is structural. (-) Conflict-with-alternatives is new deterministic calendar code. (-) Read-only calendar (FEAT-5): alternatives are suggested, never written back.",
      alternatives: ["Continuous notification stream (violates NG-3)", "LLM deciding brief contents (violates CON-1/CON-2)", "Write alternatives back to Google Calendar (out of v1 scope)"] }
  - { id: DEC-17, type: decision, status: accepted, scope: FEAT-4, date_raised: "2026-06-19", title: "Nightly dreaming is an off-path batch pathway that re-tunes the gate's ratings",
      context: "FEAT-4/DEC-1: overnight batch reviews logs, merges/dedupes memory, surfaces insights, re-tunes gate ratings from outcomes, off the hot path (S1). cog-worx already runs off-path reconciler/extractor/sweepers.",
      decision: "Implement dreaming as a nightly timer-fired dream pathway running model-heavy work off the hot path (S1, S11 batch routing): lean on cog-worx reconciler/extractor where applicable, plus a wombat RatingTuner Stage that reads outcome claims and writes bounded, provenance-typed rating-parameter updates into the user scope. The gate reads new parameters next drive — no gate code change.",
      consequences: "(+) 'Compounds week-over-week' becomes a concrete testable loop; hot path stays cheap (CST-3/S1). (-) The tuner is an adaptive control loop needing guardrails (bounded deltas, floor/ceiling) so a bad night can't make wombat loud/mute (RISK-4). (-) Needs an outcome-labeling convention (EP-12).",
      alternatives: ["On-write extraction/tuning (violates S1)", "Model sets thresholds at runtime (violates NG-4/S9 — tuner emits params the deterministic gate consumes)"] }
  - { id: DEC-18, type: decision, status: accepted, scope: FEAT-1, date_raised: "2026-06-19", title: "The mouth is wired through S4 (DeepSeek); it only renders pre-decided output, behind the budget guard",
      context: "DEC-4/CON-1/CON-2/CON-8/CST-3/ASMP-1: DeepSeek via OpenAICompatModel, cheap, swappable; the model phrases, never decides; payloads may leave the host (accepted v1 tradeoff).",
      decision: "Register a DeepSeek profile in wombat's ModelRegistry (OpenAICompatModel + base_url), assembled per drive with a BudgetGuard (S11). Only Compose Stages call the model, only with already-decided contents (the gate's decision artifact + chosen items + KB phrasing hints). Provider is config; swap to local is a registry change (S4), satisfying ASMP-1's escape hatch.",
      consequences: "(+) Cost structurally bounded (S11); ASMP-1 cheaply reversible. (-) Phrasing payloads with user content leave the host (ASMP-1 — confirm at sign-off; tension with NG-7 scoped to storage). (-) DeepSeek availability is a degrade path — Lesion must cover 'mouth unavailable' (terse template, S8).",
      alternatives: ["Local model for v1 (DEC-4 chose DeepSeek for cost/speed; local stays the deferred swap)", "Model sees raw undecided inputs (violates CON-1/CON-2)"] }
  - { id: DEC-19, type: decision, status: accepted, scope: FEAT-11, date_raised: "2026-06-19", title: "Side-effectful actions get the journal trail + review-before-send via AwaitHuman and the cog-worx approval gate",
      context: "CON-4/CON-5/NG-5/FEAT-11/S10: every side effect on a reviewable trail before it happens; high-consequence/sensitive-auth hands off to the human. cog-worx ships the journal, durable AwaitHuman, the ToolGate approval gate, and the lethal-trifecta taint latch.",
      decision: "Route every outbound side effect (send Gmail draft, submit browser form, speak) through a two-step pattern: (1) a Stage journals the proposed action (the trail) and returns AwaitHuman; (2) after provide_human_input approval, a dispatch_approved Stage performs it at the external tier. Read phases that ingest untrusted content drop external tools (taint latch). Login/credential steps always AwaitHuman (NG-5/CON-5).",
      consequences: "(+) CON-4/CON-5/NG-5 satisfied by red-team-hardened cog-worx machinery; the 'auditable / 0 unattended sensitive-auth' goals are structural. (-) wombat must add a human-readable projection of the journal (EP-27). (-) Review-before-send adds latency — acceptable given quiet-by-default.",
      alternatives: ["Auto-send with after-the-fact logging (violates CON-4/CON-5)", "Content-filter injection defense (violates S10)", "Bespoke approval queue (cog-worx AwaitHuman already does it durably)"] }
  - { id: DEC-20, type: decision, status: accepted, scope: FEAT-11, date_raised: "2026-06-20", converted_from: "Q-10", title: "Admit the cog-worx external capability tier ONLY for the approved AwaitHuman dispatch stages; sign-off is Jim's",
      context: "cog-worx default allowed_tiers={read,write}; the external tier is opt-in pending a Jim sign-off in cog-worx (Q-10). The flagship Gmail-draft (TK-78), browser navigate/read (TK-131/133) and form-submit (TK-135) all need a Stage policy admitting 'external' or they are refused with TierViolation at dispatch. No ticket bound that policy. This realizes DEC-19 (external side effects already pass AwaitHuman + the taint boundary) rather than widening v1 scope — the SET of external capabilities is unchanged (Gmail draft, Playwright); only the tier admission is wired.",
      decision: "Bind a Stage-scoped allowed_tiers={read,write,external} policy to EXACTLY the approved, already-reviewed dispatch stages (TK-78 draft-create, TK-131/133 browser, TK-135 form-submit) in the composition root; the engine default stays {read,write} so external is never global. Every admitted external call still passes AwaitHuman (DEC-19) and the taint latch (ISS-3/TK-148). The actual enablement of the external tier in cog-worx config is JIM'S SIGN-OFF (escalated, pending) — the wombat-side binding (TK-151) is inert and refused until Jim enables it; wombat never self-grants the tier.",
      consequences: "(+) Closes Q-10: the dispatch stages have a defined admission path; the negative case (any non-dispatch Stage calling external -> TierViolation) is asserted. (+) Bounded blast radius — admission is per-stage and behind AwaitHuman+taint, so widening the tier does not widen unattended reach. (-) v1 outbound dispatch (Gmail draft + browser actions) is BLOCKED on Jim's cog-worx external-tier sign-off; until then those stages fail closed (correct safety). Escalated to Jim as the one live human dependency.",
      alternatives: ["Global allowed_tiers={read,write,external} (rejected — external must stay opt-in and per-stage, CON-5/NG-5)", "Leave the tier unwired (rejected — the flagship Gmail-draft and browser features cannot dispatch)", "wombat self-enables the tier (rejected — the sign-off is Jim's by cog-worx design)"] }
  - { id: DEC-21, type: decision, status: accepted, scope: FEAT-1, date_raised: "2026-06-20", converted_from: "Q-15", title: "The canonical 'wombat day' is the civil-local day in a configured timezone; one shared DailyLedger primitive owns the boundary",
      context: "Three independent daily counters — mouth spend (TK-9), per-class surfacing ceiling (TK-27/28), brief once-per-day run (TK-97) — each defined its own 'reset at midnight, survive restart' Postgres mechanism with no timezone, and TK-101 wrote a UTC header while the brief fires at a LOCAL morning time (DEC-16). On a laptop that sleeps across midnight (CST-1/DEC-6) a UTC-vs-local mismatch double-counts or skips a day in all three (Q-15). No locked DEC fixed a timezone, so fixing it is within the frame.",
      decision: "The canonical wombat-day is the CIVIL DATE in a configured IANA timezone (default the host's configured local zone) — chosen because the brief already fires at a local morning (DEC-16) and the user experiences days locally. The boundary is computed at access time (a wombat_today() function), NOT by a fired timer, so a sleep across midnight resolves correctly on wake. A single shared DailyLedger primitive (TK-152) owns the boundary + row lifecycle; TK-9/TK-27/TK-28/TK-97 all consume it instead of defining their own date logic.",
      consequences: "(+) Closes Q-15: one definition of 'today' across all three ledgers; sleep-across-midnight fires/counts exactly once. (+) Removes three parallel ad-hoc date mechanisms in favor of one tested primitive. (-) Adds one shared primitive ticket (TK-152) the three ledgers depend on. (-) DST edge cases handled by standard zoneinfo civil-date resolution, not bespoke logic (explicit non_goal on TK-152).",
      alternatives: ["UTC wombat-day (rejected — disagrees with the local-morning brief fire time, surprises the user)", "Per-ledger independent midnight (rejected — this IS the Q-15 bug)", "Fire-a-timer-at-midnight reset (rejected — a sleeping laptop misses the fire; access-time computation is robust to sleep)"] }
  - { id: DEC-22, type: decision, status: accepted, scope: FEAT-11, date_raised: "2026-06-20", supersedes: "DEC-20", title: "External-tier admission AUTHORIZATION is GRANTED (delegated to architect); enablement is a build-time op, not a planning blocker",
      context: "DEC-20 admitted the cog-worx external tier ONLY for the approved AwaitHuman dispatch stages (TK-78 Gmail draft, TK-131/133 browser, TK-135 form-submit) but left the standing as 'the sign-off is Jim's, escalated, pending', which kept Q-10 tracked as the one live human blocker and TK-151 inert pending Jim. Jim has now EXPLICITLY delegated this decision to the architect ('route the decisions to the architect ... unless you need me specifically for something'), so the planning-level sign-off authority is the architect's. The decision rides entirely on DEC-19 (review-before-send + AwaitHuman) and ISS-3 (taint boundary), and does not widen the v1 capability SET (Gmail draft + Playwright were already in scope) — there is no residual frame-level concern that requires a human act.",
      decision: "GRANT the external-tier authorization now. The planning decision (wombat MAY admit allowed_tiers={read,write,external} on exactly the named, AwaitHuman-gated dispatch stages; engine default stays {read,write}) is ACCEPTED and settled — Q-10 is fully resolved, no longer an escalation. This SUPERSEDES only DEC-20's 'sign-off is Jim's / pending' STANDING; DEC-20's substance (per-stage-only admission, never global, behind AwaitHuman + taint) is unchanged and remains in force. The distinction is made explicit: (a) the AUTHORIZATION is a planning decision, now granted; (b) the ENABLEMENT — actually flipping the cog-worx external-tier flag in runtime/deploy config — is a BUILD-TIME OPERATIONAL step performed when TK-151 is implemented/deployed, NOT a planning gate. TK-151 keeps failing closed until that deploy-time flag is set, so wombat still never self-grants the tier at runtime.",
      consequences: "(+) Removes the last /plan-analyze human blocker; the plan is now fully unblocked for per-ticket build with no phantom governance gate. (+) The safety invariant is unchanged — admission is still per-stage, behind AwaitHuman + the taint latch, and structurally inert until the build-time flag is enabled (TK-151 AC asserts this). (-) The real-world enablement (config flag) still must be done at build/deploy time; it is captured as a TK-151 build-time acceptance criterion, not lost. No frame, scope, or capability-set change.",
      alternatives: ["Keep Q-10 escalated to Jim (rejected — Jim explicitly delegated; nothing here genuinely needs a human act beyond a build-time config flip, which is not a planning decision)", "Treat the config-flag flip as a planning blocker (rejected — conflates the planning authorization with operational enablement; it belongs on the build ticket)", "Global external admission (rejected — DEC-20 stands: per-stage only, never global, CON-5/NG-5)"] }

  # --- Risks / spike-before-harden (S12) ---
  - { id: RISK-1, type: risk, status: mitigated, scope: EP-7, date_raised: "2026-06-19", date_updated: "2026-06-21", title: "Urgency & Cognitive-Load scoring functions may not match human judgment", probability: high, impact: high, mitigation: "Spike: build urgency()/cognitive_load() as pure functions over a labeled fixture of real calendar/Gmail events; verify surface/hold decisions against human labels on a held-out set before hardening. The product thesis rides on this.", resolution: "MITIGATED (architecture de-risked) by architect 2026-06-21 via TK-22 (DEF-1). The pure model-free urgency()/cognitive_load() functions over four features run on a real-data fixture and agree highly with the vision-derived PROXY rubric with NO systematic error pattern — the ARCHITECTURE (deterministic scoring, the >=80%-agreement mechanism) is proven sufficient to build the production gate (TK-23/25/27). RESIDUAL: calibration against Jim's own surface/hold judgment is DEFERRED (DEF-1) — not retired — because the real inbox window held zero VIP/known-human mail, so a confirmatory pass cannot be meaningfully run yet; the operating constants are already PROVISIONAL in TK-13 (Q-40) and a relabel revises a YAML value, not code, so the production build is unblocked." }
  - { id: RISK-2, type: risk, status: mitigated, scope: EP-9, date_raised: "2026-06-19", date_updated: "2026-06-21", title: "Flush-vs-immediate trigger + cumulative-load aggregator mis-tuned (too loud or mute)", probability: high, impact: high, mitigation: "Spike: replay a day of events; measure surfacings/day against the hard ceiling; tune thresholds + aggregator with sensitivity analysis (sylphie d-constant lesson).", resolution: "MITIGATED (architecture de-risked) by architect 2026-06-21 via TK-26 (DEF-1). The replay harness proved that at urgency_threshold=0.75 / load_flush_threshold=1.0 / per_class_ceiling=3 the day-fixture yields 0 immediate-voice + exactly 1 load-flush/day, meeting the <=3 voice / <=1 flush targets, and the ceiling acts as the hard backstop. The two-arm + ceiling MECHANISM is proven. RESIDUAL: the threshold VALUES inherit TK-22's fixture caveat and are PROVISIONAL in TK-13 (Q-40); final calibration is DEFERRED with RISK-1 to Jim's confirmatory label pass (DEF-1). Production build (TK-27) reads the values from TK-13, so a relabel does not block the build." }
  - { id: RISK-3, type: risk, status: mitigated, scope: EP-3, date_raised: "2026-06-19", date_updated: "2026-06-21", title: "User-state sensing on a laptop may be too weak to gate timing", probability: medium, impact: medium, mitigation: "Spike one real presence probe end-to-end into the gate; confirm the gate degrades gracefully on a missing/stale snapshot (S8).", resolution: "MITIGATED (safety property proven) by architect 2026-06-21 via TK-4 (DEF-3). The 60s active/idle classifier + the SAFETY-CRITICAL conservative-on-stale HOLD (unknown/low-confidence/stale>5min/idle/away => hold; only fresh+confident+active permits a surface) are proven by tests and a live Windows smoke-check; the degrade path raises no exception. The load-bearing property the gate's silence guarantee leans on (and TK-11 hardens) is proven. RESIDUAL: the >90%-of-real-transitions accuracy clause is inherently un-runnable without a live laptop session and is DEFERRED (DEF-3) to the first real laptop run — it is an accuracy measurement, not a safety blocker, since a weak classifier still fails safe to HOLD." }
  - { id: RISK-4, type: risk, status: retired, scope: EP-14, date_raised: "2026-06-19", date_updated: "2026-06-21", title: "Adaptive RatingTuner may oscillate or drift wombat loud/mute", probability: medium, impact: high, mitigation: "Spike: simulate N nights of outcomes; prove bounded deltas + floor/ceiling keep surfacings/day inside the ceiling and the model sharpens without instability.", resolution: "RETIRED 2026-06-21 via TK-48 (running code). Over 30 synthetic nights incl. all-IGNORED/all-LOAD_BEARING pathological runs a proportional tuner (delta=gain*net_outcome, delta_bound 0.05 + floor/ceiling clamps) holds all four stability assertions; clamp ablation breaks all four (load-bearing). KEY FINDING persisted in TK-13 (Q-40): clamps alone do not bound the surfacing RATE — band+gain+delta_bound+ceiling are a JOINT set. Fully closed; no residual." }
  - { id: RISK-5, type: risk, status: retired, scope: EP-8, date_raised: "2026-06-19", date_updated: "2026-06-21", title: "Durable pending-set + queue may double-count or lose state across restart", probability: medium, impact: high, mitigation: "Spike: kill mid-drain, resume, assert pending set + surfacings-ledger are exactly-once consistent with the cog-worx journal (S6).", resolution: "RETIRED 2026-06-21 via TK-24 (running code). Write-ahead (durable record BEFORE the in-memory mutation) + idempotent set-replay gives exactly-once across a mid-drain kill with NO locking, proven over 10 seeded random-kill runs. Carry-forward to TK-25: preserve write-ahead ordering and journal the bulk clear() the flush arm relies on. Fully closed; no residual." }
  - { id: RISK-6, type: risk, status: mitigated, scope: EP-16, date_raised: "2026-06-19", date_updated: "2026-06-21", title: "Deterministic conflict-with-alternatives may produce unhelpful slots", probability: medium, impact: medium, mitigation: "Spike: fixture of conflicting schedules -> proposed alternatives a human rates as reasonable.", resolution: "MITIGATED (algorithm proven) by architect 2026-06-21 via TK-73 (DEF-2). The earliest-gap algorithm proves >=3 DISTINCT VALID non-overlapping in-hours slots per conflict for every fixture scenario — the deterministic mechanism works and does not crash. The >=80%-rated-reasonable bar is a UX-QUALITY judgment, not a constructibility bar, so TK-74 is unblocked. RESIDUAL: Jim's qualitative ratings are DEFERRED (DEF-2) to the first real brief session; the spike already names the likely refinement (pure earliest-first can feel too early -> preference weighting) which TK-74 absorbs if the ratings call for it." }

  # --- plan-reviewer (red-team) findings from /plan-tickets, 2026-06-20. CRITICALs are blockers for /plan-analyze + build. ---
  - { id: ISS-1, type: issue, status: resolved, scope: project, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "CRITICAL: ~40 tickets target bare wombat/... but the repo is src-layout (src/wombat)",
      description: "pyproject is confirmed src-layout (uv_build; ruff src=[src,tests]; mypy files=[src,tests]); only src/wombat/__init__.py exists. ~40 tickets (TK-1..9, 21..27, 71..78, 96..101, 111..118, 131..134, and several tests) write to bare wombat/... or tests/..., which fall OUTSIDE the installed package and outside mypy/ruff/pytest discovery; two clusters also collide on the same logical module at different paths. Mechanical to fix now, a cascade of broken imports if not.",
      resolution: "RESOLVED by architect 2026-06-20 (within authority — mechanical, no DEC/constitution touched). Normalized all 72 bare 'wombat/...' files_in_scope entries to 'src/wombat/...' across every ticket, plus TK-1's complexity_budget prose. 'tests/...' paths LEFT AS-IS — they are correct for this layout (pyproject testpaths=[tests], mypy/ruff files include tests). The path normalization also resolves the module-path split the finding noted (parallel gate modules now all live under src/wombat/gate/). Intentional same-file/different-ticket pairs (spike->harden, e.g. pending_set.py in TK-24/25, compose.py in TK-8/9) are by design and retained.",
      links: ["TK-1","TK-22","TK-42"] }
  - { id: ISS-2, type: issue, status: resolved, scope: TK-9, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "CRITICAL: TK-9 daily spend ledger is unsatisfiable with cog-worx BudgetPolicy (per-drive, no persistence)",
      description: "cog-worx BudgetGuard/BudgetPolicy is per-drive-segment and in-memory; cumulative per-run ceilings are explicitly deferred (CF-3.0-B). TK-9 AC3 (cumulative daily ceiling that survives restart) + complexity_budget 'no new persistence code' are contradictory. wombat must own a durable daily-spend ledger (Postgres + load-on-start), currently budgeted at zero. Re-scope TK-9 (S->M) or decide whether CST-3 only needs per-drive bounding (free from cog-worx).",
      resolution: "RESOLVED by architect 2026-06-20 by RE-SCOPING TK-9 (CST-3 NOT changed — it stays as written and keeps its meaning: the mouth is budgeted, the deterministic core spends no tokens; it never mandated a *daily-cumulative* ceiling, which was a TK-9 design choice). CST-3 confirmed satisfiable both ways, so this is within authority — no escalation. TK-9 is now a two-layer design: (1) cog-worx's per-drive-segment BudgetGuard as the free structural inner backstop, and (2) a NEW wombat-owned DailySpendLedger (Postgres, one row/date, load-on-start) that enforces the daily cumulative cap across drives and restarts — exactly the thing CF-3.0-B leaves to the integrator. Estimate S->M; the false 'no new persistence code' budget removed; AC3 rewritten against the wombat ledger; added src/wombat/cost/daily_spend_ledger.py + migration 002 to scope." }
  - { id: ISS-3, type: issue, status: resolved, scope: FEAT-6, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "CRITICAL: taint latch is irreversible within a drive; outbound drive boundary for Gmail draft is unspecified",
      description: "cog-worx taint is never cleared within a drive and drops external-tier Capabilities (taint_drops_external default). TK-75 reads the untrusted email body (taint ACTIVE); TK-78 then needs gmail.drafts.create (external Capability) in the same flow. No ticket names the drive boundary that separates tainted-ingest from untainted-outbound. As written the flagship Gmail-reply either cannot dispatch (correct safety, broken feature) or someone defeats the latch (broken safety). Note: S4 model/DeepSeek phrasing goes through BudgetGuardedModel not ToolGate, so phrasing itself is not tier-dropped — only the Gmail Capability. Fix: outbound runs in a fresh untainted drive consuming a sanitized ReplyIntent artifact; assert with a drive-boundary test.",
      resolution: "RESOLVED by architect 2026-06-20 by NAMING the drive boundary in the affected tickets (a 'how' that realizes DEC-19's existing 'read phases that ingest untrusted content drop external tools' — no DEC changed, within authority). The ingest drive (TK-75: read untrusted email body) is irreversibly tainted and never carries gmail.drafts.create; the outbound chain (TK-78: DraftComposer -> dispatch_approved) runs in a FRESH UNTAINTED drive whose sole input is a sanitized ReplyIntent/GmailMessageItem artifact, so it never re-reads the raw body and the external Gmail Capability stays dispatchable. Added a positive drive-boundary AC to both TK-75 (external Capability NOT reachable from the tainted ingest drive) and TK-78 (outbound drive untainted; draft created), plus a negative test on TK-78 (if the raw body leaks into the ReplyIntent the outbound drive taints and dispatch is refused — proving the feature rides the drive split, not a defeated latch). External-tier ADMISSION for the outbound dispatch stage remains tracked separately as Q-10 (Jim sign-off pending in cog-worx).",
      links: ["TK-75","TK-78","TK-148"] }
  - { id: Q-10, type: open_question, status: resolved, scope: FEAT-11, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "HIGH: external capability tier is opt-in (Jim sign-off pending in cog-worx) and no ticket widens it for outbound stages",
      description: "cog-worx default allowed_tiers={read,write}; external is opt-in pending a Jim sign-off. PlaywrightCapability (TK-131), Gmail draft (TK-78), FormSubmit (TK-135/136) all need a Stage policy admitting 'external' or they are refused with TierViolation at dispatch. No ticket binds an external-admitting policy to the approved dispatch stages. Resolve: add that wiring (under EP-28) + record the tier sign-off as a decision.",
      resolution: "FULLY RESOLVED — authorization GRANTED by architect 2026-06-20 under Jim's explicit delegation ('route the decisions to the architect ... unless you need me specifically for something'). Two prior steps stand: DEC-20 (admit external tier ONLY for the approved AwaitHuman dispatch stages; engine default stays {read,write}) and TK-151 (per-stage admission policy, P1, EP-28, fails-closed) with positive + negative tests. The previously-ESCALATED item — the planning-level external-tier sign-off — is now GRANTED here: see DEC-22 (supersedes DEC-20's 'sign-off is Jim's, pending' standing; the planning authorization is settled). The ONLY remaining act is a BUILD-TIME OPERATIONAL ENABLEMENT — flipping the cog-worx external-tier flag in runtime/deploy config when TK-151 is implemented — which is NOT a planning blocker and is tracked as an acceptance criterion / build-time step on TK-151, NOT in governance. No phantom blocker remains; /plan-analyze is no longer gated on a human sign-off. wombat still never self-grants at runtime: the binding fails closed until the deploy-time flag is set, and every admitted external call still passes AwaitHuman + the taint latch (DEC-19/ISS-3).",
      links: ["DEC-20","DEC-22","TK-151","TK-78","TK-131","TK-135"] }
  - { id: Q-11, type: open_question, status: resolved, scope: EP-28, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "HIGH: trusted/untrusted source-tagging convention (both directions) is unspecified",
      description: "cog-worx taint fires on external-tier OR an 'untrusted-source' tag, suppressed by 'trusted-output' (CF-3.2-B). Local sources (calendar, journal, user-model, KB) must be tagged trusted or reads spuriously taint and disable the brief's Capabilities; untrusted sources (Gmail body, web page) must be tagged. TK-148 only tags the untrusted side. Add an AC asserting the tag convention for BOTH directions.",
      resolution: "RESOLVED by architect 2026-06-20 (within authority — realizes DEC-19's taint posture; no DEC changed). Added a both-directions AC and a regression AC to TK-148: (a) the UNTRUSTED side — Gmail body / web page / browser DOM reads are tagged untrusted and the latch fires (already covered); (b) the TRUSTED side — reads from local journal / Postgres user-model / local YAML KB are tagged trusted-output so the latch does NOT spuriously fire and the brief's external Capabilities stay available (the regression that would otherwise self-disable the brief). TK-148's existing AC3 already asserted the trusted-read regression; the resolution makes the BOTH-DIRECTIONS tagging convention explicit and binding.",
      links: ["TK-148"] }
  - { id: Q-12, type: open_question, status: resolved, scope: EP-7, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "HIGH: RISK-1 scoring spike (TK-22) validates urgency()/cognitive_load() without the presence axis the runtime gate uses",
      description: "TK-4 produces PresenceSnapshot and TK-6 makes the gate hold on stale presence, but the TK-22/TK-26 fixtures never feed presence into scoring. The >=80% human-agreement thesis is validated without presence; agreement may not hold once presence conditioning is added. Resolve: either add presence to the TK-22 inputs, or record a non_goal that presence is a separate gate-level hold (not a scoring input) so the spike is valid as scoped.",
      resolution: "RESOLVED by architect 2026-06-20 (within authority — consistent with DEC-13, which makes urgency()/cognitive_load() pure functions parameterized by the user model, NOT by presence). Recorded the non_goal on TK-22: presence is OUT of scoring by design — it is a SEPARATE gate-level hold applied AFTER scoring (TK-6 holds on stale/unknown presence), not a scoring input. So the spike's >=80% agreement is validated on scoring alone and presence cannot invalidate it, because presence never enters the score; it only suppresses surfacing downstream. This matches the architecture as already drawn (TK-6 conditions surfacing on presence; TK-22/23 keep scoring pure). No fixture change needed.",
      links: ["RISK-1","TK-22","TK-26","DEC-13"] }
  - { id: Q-13, type: open_question, status: resolved, scope: FEAT-7, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "HIGH: split the three L-sized tickets (TK-78, TK-27) into atomic passes",
      description: "TK-78 (L) bundles DraftComposer+mouth+KB hints+trail+gmail.drafts.create+AwaitHuman+dispatch_approved+degrade across 3 foundations (EP-5/27/28) — too big for one pass; split into (a) compose->draft-create->AwaitHuman and (b) dispatch_approved+trail+degrade. TK-27 (L) bundles two trigger arms + ceiling ledger + decay + midnight reset + kill-test — split decay/midnight-reset from the arms. (TK-48 L is an acceptable throwaway sim.) Run story-splitter before building these.",
      resolution: "RESOLVED by architect 2026-06-20 (within delegated authority — ticket splits). TK-78 split: TK-78 (M) = DraftComposer compose -> draft-create -> AwaitHuman in the fresh untainted drive; TK-79 (S) = dispatch_approved + trail finalization + degrade. TK-27 split: TK-27 (M) = two trigger arms + per-class ceiling ledger; TK-28 (M) = stale-item decay + midnight ledger reset (on the DEC-21 wombat-day boundary) + kill-consistency proof. Dependencies wired: TK-79 depends_on TK-78; TK-28 depends_on TK-27. TK-48 (L) left as an acceptable throwaway simulation per the finding.",
      links: ["TK-78","TK-79","TK-27","TK-28"] }
  - { id: RISK-7, type: risk, status: mitigated, scope: FEAT-3, date_raised: "2026-06-20", date_updated: "2026-06-20", probability: high, impact: high, title: "Adaptive loop is under-fed: wombat has almost no ground-truth 'did the user act?' outcome signal",
      mitigation: "MITIGATED by architect 2026-06-20 (via ISS-6): TK-50 (Outcome-signal producer, P1, under EP-12) now defines the outcome-capture mechanism — a lightweight human feedback affordance AND deterministic inference over already-observable local state (e.g. a flagged calendar conflict that later disappears -> LOAD_BEARING; a draft deleted unsent -> REGRETTED) — so all three outcomes (LOAD_BEARING/REGRETTED/IGNORED) are actually producible and REGRETTED is no longer unreachable. TK-45 now depends_on TK-50 and TK-49 (RatingTuner) depends_on TK-50, so EP-14 cannot be built without a real outcome producer. Original concern: wombat is read-only on calendar and never sends Gmail, so without TK-50 every item degraded to IGNORED-on-timeout and FEAT-3/4's compounding goal was untestable.",
      links: ["TK-45","TK-49","TK-50","RISK-4","ISS-6"] }

  # --- /plan-analyze (red-team, cross-artifact) findings, 2026-06-20. Confirmed ISS-1/2/3 resolutions hold and re-affirmed open Q-10..13 + RISK-7. NEW CRITICAL/HIGH below; CRITICALs (ISS-4..6) are hard blockers for build. ---
  - { id: ISS-4, type: issue, status: resolved, scope: FEAT-1, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "CRITICAL: gate decision-artifact vocabulary is inconsistent across the drain/brief/voice chain — the hardened gate's output does not match its consumers",
      description: "Four incompatible vocabularies for the gate decision artifact: TK-6/TK-7 branch on action=surface|hold; the PRODUCTION gate TK-27 emits surface_immediate|surface_flush|hold (never a bare 'surface'); SpeakSink TK-164/TK-165 key on speak-event|hold|flush|text-only; TK-99/TK-100 carry artifact kind='surface'. TK-7 ReviewOrSpeak (the only Compose router) consumes only action=surface|hold, so once TK-27 replaces the stub gate, NOTHING downstream is wired correctly — and no single ticket catches it because each tests its own private enum. Fix: add a ticket (or AC on TK-21) defining ONE closed GateDecision.action / artifact.kind enum and make TK-7/TK-27/TK-99/TK-100/TK-164 all reference it.",
      resolution: "RESOLVED by architect 2026-06-20 (within authority — a 'how' that realizes DEC-13's single deterministic decision artifact; no DEC changed). Defined ONE canonical closed vocabulary as a new AC on TK-21: GateAction = {hold, surface_immediate, surface_flush} (the bare 'surface' is gone), plus a closed item_kind = {brief, reflection, draft, generic} carried on the surfaced artifact so consumers route by kind. Rewired every consumer to import it: TK-6 stub gate emits surface_immediate (not bare 'surface'); TK-7 branches on GateAction; TK-27 stamps item_kind on its surface_immediate/surface_flush; TK-99/TK-100 carry item_kind=brief (not kind='surface'); TK-164/TK-165 SpeakSink no longer has a 'speak-event'/'text-only' gate action — speak-vs-text is a SINK concern keyed off a surface_* action + a voice_enabled flag. A TK-21 AC asserts no module defines a competing surface/hold/flush/speak-event string set.",
      links: ["TK-6","TK-7","TK-27","TK-99","TK-100","TK-164","TK-165","TK-21"] }
  - { id: ISS-5, type: issue, status: resolved, scope: EP-4, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "CRITICAL: surfaced items have no dispatch-by-kind router — the reflection (and draft/brief) compose paths are orphaned",
      description: "TK-7 ReviewOrSpeak hard-codes surface -> ComposeStage (the brief/mouth ComposeStage TK-8) and its non_goals exclude item-type routing. But EP-22's gate-cleared pattern_reflection (TK-114 ReflectionCompose, depends_on EP-9), the Gmail draft path (TK-78 DraftComposer), and the brief composer (TK-100) are three DIFFERENT composers with no specified route from a GateDecision to the right one. FEAT-8's flagship single-reflection cannot reach the user as drawn. Fix: add an explicit dispatch-by-item-kind ticket under EP-4 (surface -> {brief|reflection|draft} composer) and make TK-7/TK-114/TK-100/TK-78 depend on it.",
      resolution: "RESOLVED by architect 2026-06-20 (within authority — a missing 'how' ticket; no DEC changed). Added TK-10 (ComposeDispatchRouter, P1, EP-4): branches on the canonical item_kind enum (ISS-4) and dispatches surfaced drain-pathway items to the right composer — generic -> ComposeStage (TK-8), reflection -> ReflectionCompose (TK-114), draft -> DraftComposer (TK-78); unknown kind -> generic with a warning, never dropped. Rewired TK-7 to delegate ALL kind-routing to TK-10 (TK-7 no longer hard-codes surface->ComposeStage and contains no item_kind branch). TK-114 and TK-78 now depend_on TK-10, closing the reflection/draft orphans. TK-100 (morning brief) is EXEMPTED by design: the brief is invoked by the dedicated brief pathway (TK-96/97) as a scheduled forced flush (DEC-16), not by the drain-pathway router — but item_kind=brief is in the closed enum so the vocabulary stays exhaustive.",
      links: ["TK-7","TK-10","TK-114","TK-100","TK-78"] }
  - { id: ISS-6, type: issue, status: resolved, scope: FEAT-3, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "CRITICAL: RISK-7's mitigation was never turned into a ticket — EP-14 is buildable with no outcome-signal producer, so the tuner trains on a near-constant stream",
      description: "Escalation of RISK-7 to a present defect. wombat is read-only on calendar and never auto-sends Gmail, and NO ticket produces an 'acted-on' event or REGRETTED label — TK-45 only defines LOAD_BEARING (acted) + IGNORED (timeout). So in practice every item degrades to IGNORED-on-timeout, the RatingTuner (TK-49) has no real gradient, and TK-48's stability spike 'passes' on synthetic data while production has no signal — making FEAT-3/FEAT-4's 'sharpens week-over-week' measurable goal structurally untestable. Yet EP-14 has no depends_on blocking it on an outcome producer. Fix: promote RISK-7's mitigation to a P1 ticket under FEAT-3 (outcome-capture affordance + REGRETTED producer) and make TK-49/EP-14 depend on it.",
      resolution: "RESOLVED by architect 2026-06-20 (within authority — realizes FEAT-3/DEC-15's existing 'behavior + outcomes' mandate; no scope/DEC changed, no new egress, read-only posture preserved). Added TK-50 (Outcome-signal producer, P1, EP-12): a deterministic producer with TWO sources — (1) a lightweight human feedback affordance ('was this useful?') mapping to LOAD_BEARING/REGRETTED, and (2) deterministic inference over already-observable local state (flagged conflict later gone -> LOAD_BEARING; draft deleted unsent -> REGRETTED; neither before TTL -> IGNORED). REGRETTED is now actually producible. Wired the dependency chain so EP-14 cannot be built without it: TK-45 depends_on TK-50; TK-49 (RatingTuner) depends_on TK-50. RISK-7 flipped to mitigated. A non-degeneracy AC requires the producer to emit a real gradient (>=1 LOAD_BEARING and >=1 REGRETTED on the fixture).",
      links: ["RISK-7","TK-45","TK-49","TK-50"] }
  - { id: Q-14, type: open_question, status: resolved, scope: project, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "HIGH: depends_on mixes epic-ids and ticket-ids, so the plan is not a runnable topological build order",
      description: "Several tickets depend on EPICS not tickets: TK-23 depends_on [TK-22, EP-10]; TK-42 depends_on [TK-41, EP-6]; TK-96 depends on six EPs; TK-75/77/78/135/136/146/149 depend on EPs. An epic is 'done' only when all its child tickets are, but those child tickets have their own forward deps (e.g. TK-42 -> EP-6 whose tickets are TK-42's siblings), making 'EP-X done' ambiguous and some orderings circular at epic granularity. The graph cannot be topologically sorted without hand-resolving every epic dep. Resolve: normalize all depends_on to ticket-ids (resolve each EP-x to the specific TK it needs), or define 'epic dep = all child tickets' and PROVE the resulting graph is acyclic.",
      resolution: "RESOLVED by architect 2026-06-20 (within authority — dependency-graph normalization). CONVENTION FIXED: an epic-id in depends_on means 'all child tickets of that epic (transitively) must be done' — and the resulting expanded TICKET graph is now PROVEN acyclic (Kahn topological sort over all 69 tickets succeeds; proven INLINE — see Q-28 for the citation correction, no proof script was committed). The expansion initially exposed THREE real epic-granularity cycles, all from safety/integration inversion where a safety-wiring ticket depended on the whole integration epic it instruments while that epic's tickets depended back on the safety primitive. Broke them by normalizing the offending epic-deps to the specific ticket actually needed: TK-148 taint latch depends only on TK-146 (drops EP-17/EP-25 — it owns its own ingest call-sites); TK-75/TK-77 depend on TK-148 (not EP-28); TK-78 depends on TK-149+TK-151 (not EP-28); TK-146/TK-149 (trail + approval PRIMITIVES) drop their EP-18/EP-26 deps (they are consumed-by, not dependent-on, the dispatch stages); SpeakSink TK-164 drops its spurious EP-20 dep (the brief deliver stage consumes SpeakSink, not vice-versa). All other epic-deps are genuine forward foundations and remain as epic-ids under the now-acyclic convention. validate.js cycle check (literal edges) and the expanded-graph proof both pass.",
      links: ["TK-23","TK-42","TK-96","TK-148","TK-78"] }
  # --- Architect red-team triage of the v0.9 floating MEDIUM/LOW findings (A-I) + atomicity (2026-06-20). Each given a home: open_question -> resolved within the locked frame. ---
  - { id: Q-16, type: open_question, status: resolved, scope: FEAT-6, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "MEDIUM (A): the sanitized ReplyIntent artifact TK-78 consumes is built by no ticket — the ISS-3 drive-boundary safety story rests on an artifact nothing creates",
