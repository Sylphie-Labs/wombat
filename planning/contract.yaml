      links: ["TK-75","TK-71","TK-72","TK-78","TK-148","TK-12","TK-28","TK-76","TK-77","TK-80","Q-57","Q-59","Q-64","CON-5","NG-3"] }

  - { id: Q-66, type: open_question, status: resolved, scope: EP-17, date_raised: "2026-07-03", date_updated: "2026-07-03", title: "TK-76 build briefing: the Q-56 EP-13 over-pull ruled (buildable-now verdict), the metadata-vs-body triage boundary, the rules-file home, the TriageResult wire, and the hot-path AC mechanics",
