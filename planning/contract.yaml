    title: PostgresPendingJournal — real durable adapter behind TK-25's PendingJournal seam
    intent: As wombat's production runtime, I need the real Postgres-backed append-only adapter implementing TK-25's PendingJournal Protocol so the pending set's exactly-once guarantee (RISK-5) holds across a REAL process kill on the laptop, not only against the in-memory double.
    status: done
