  - { id: Q-80, type: open_question, status: resolved, scope: EP-19, date_raised: "2026-07-03", date_updated: "2026-07-03", title: "TK-97 build briefing (the durable once-daily brief timer - THE LAST TICKET OF THE INGESTION ARC) - the timer mechanism ruled as a Wait-self-parking scheduler stage (cog-worx has no standalone cron timer), the exactly-once fence reconciled with mark-after-Deliver via a day-keyed run_id, AC4 reworded to the honest v1 exactly-once-DELIVERY guarantee, morning_brief_time confirmed already homed in OperatingParams, files_in_scope + deps normalized",
      description: "The last FEAT-7 ticket - makes the committed wombat.brief pathway (TK-96) fire exactly once each morning across crash and sleep. Open at briefing: whether the timer is a standalone durable timer record the Sweeper claims (mechanism a) or a Wait-self-parking scheduling stage (mechanism b), and whether brief_timer_stage.py survives the ruling; how AC4's mark-after-Deliver reconciles with the TK-28 claim-before-run DailyLedger precedent and whether AC4's resume-from-last-journaled-stage clause is honestly achievable under the v1 cold-boot in-memory substrate (TK-53 recorded restart = clean slate); whether the no-configurable-brief-time non_goal contradicts TK-13 owning morning_brief_time; the None-case when wombat.brief is unregistered; the AC test tiers.",
      resolution: "RESOLVED by architect 2026-07-03 (within authority - HOW rulings + record-honesty AC/non_goal amendments inside the locked DEC-8/DEC-12/DEC-16/DEC-21/CON-2/CON-3 frame and v1 scope; no locked item changed; the exactly-once-per-morning intent stands at full strength). ALL SEAMS VERIFIED AS-BUILT (cogworx substrate/journal.py Timer + set_timer/claim_due_timers/cancel_timer, runtime/sweeper.py tick/run_forever, loop/result.py Wait{to, wake_at ABSOLUTE, output}, RunState.status/RunStatus.COMPLETED, wombat runtime.py serve/_drive_and_serve, bootstrap.py assemble_runtime incl. engine-built-AFTER-registration order, stages/drain_queue.py Wait-self-edge idiom, domain/daily_ledger.py current_row/increment/today, params.py morning_brief_time, pathways/brief_pathway.py brief_trigger_artifact). (1) MECHANISM = (b), STRUCTURALLY FORCED - cog-worx has NO standalone cron-timer primitive: a Timer is RUN-BOUND (timer_id = run_id colon step_index, armed ONLY by the engine committing a stage's Wait; fire_timer(run_id) re-drives an existing WAITING run - it cannot start a new one). So the brief timer is a Wait-SELF-PARKING scheduler stage in its OWN registered single-stage pathway - the exact TK-5 drain-idle idiom (Q-53 self-edge precedent). brief_timer_stage.py STAYS in scope. No dream-timer precedent exists (TK-52 unbuilt) - TK-97 SETS the scheduling-pathway precedent EP-13 will reuse. Shape: pathway id wombat.brief_schedule + build_brief_schedule_pathway + a contentless system seed (brief-schedule-tick), assembled in pathways/brief_pathway.py alongside the existing brief assembly (no new pathway file); stage name brief_timer, transitions=('brief_timer',); every run() entry ends in Wait(to='brief_timer', wake_at=next_fire_at(ctx.clock(), tz, brief_time), output=Artifact kind wombat.brief_timer_tick with JSON-native {fired, skipped_already_ran, next_wake_at} - the Q-47/Q-49 wire rules). Stage ctor = NARROW INJECTED SEAMS (the TK-99 select_items precedent): fire_brief async callable returning the final RunState, ran_today/mark_ran (bound off a thin BriefRunLedger - see 2), tz ZoneInfo, brief_time time (OperatingParams.morning_brief_time). run() logic: now=ctx.clock(); if is_due(now, tz, brief_time) and ran_today() -> logger.debug skip (AC3; Python has no TRACE level - 'trace-level' = DEBUG, record honesty) and fire_brief is NOT called; elif is_due -> fire_brief(now) inside try/except - broad except -> LOUD error log, NO mark, never raises (the scheduler run must survive; a failed brief fails toward MORE silence, CON-3 - recorded residual: a hard fire-failure loses that day's brief, next fire tomorrow); on final.status is RunStatus.COMPLETED -> mark_ran() (COMPLETED of the linear brief pathway iff Deliver's terminal Done committed); non-COMPLETED -> loud log, no mark. NO model call, NO ctx.journal touch, NO StageToolPolicy (CON-2 - the timer decides, the mouth never does; DEC-26). FIRE SHAPE: fire_brief is a closure built in bootstrap AFTER engine = build_engine(...) (verified safe - registration order vs engine construction is irrelevant, same PathwayRegistry resolved at run time; the scheduler pathway is therefore registered AFTER the engine is built, unlike drain/brief - a deliberate, commented ordering): engine.run(run_id=f'wombat-brief-{wombat_today(now, tz).isoformat()}', session_id=same, pathway_id=BRIEF_PATHWAY_ID, initial=brief_trigger_artifact(now)). THE DAY-KEYED run_id IS LOAD-BEARING (see 2). NONE-CASE RULED: the scheduler is composed/registered INSIDE the same wombat_brief_path conditional as wombat.brief - a blank WOMBAT_BRIEF_PATH loud-skips BOTH (warning extended to name the timer); RuntimeBundle gains ADDITIVE brief_schedule_pathway_id str|None; serve()/_drive_and_serve fires a SECOND initial drive on wombat.brief_schedule ONLY when non-None (fresh uuid run_id, brief-schedule seed) BEFORE run_forever - serve() can never crash on an unregistered brief. BOOT ARMING = MISS-CATCH: the stage's first entry AT BOOT is the crash-miss catch (the cold-boot journal lost any armed timer; the ledger fence decides whether today already ran); the existing VERIFIED Sweeper claim of an overdue Wait timer is the sleep-miss catch (AC2) - no new sweeper machinery. (2) EXACTLY-ONCE FENCE vs AC4 - RECONCILED, AC4 REWORDED FOR v1 HONESTY. The TK-28 increment==1 idiom is claim-BEFORE-run; AC4 requires mark-AFTER-Deliver. Ruling: fence-READ gates (BriefRunLedger.ran_today() = DailyLedger.current_row('brief:run').value >= 1 -> skip, AC3), MARK = increment('brief:run') only after the fired run returns COMPLETED. BriefRunLedger = a thin domain wrapper in domain/brief_schedule.py over the SAME composed DailyLedger instance (the TK-9 DailySpendLedger thin-wrapper precedent; ledger_name brief:run; DEC-21 boundary shared with spend + ceiling - the Q-15 fix holds). AC4's ORIGINAL letter ('resumes from the last journaled stage') is UNACHIEVABLE ACROSS RESTART under the v1 cold-boot in-memory substrate - TK-53 already recorded restart = clean slate as a non_goal; pretending otherwise would over-claim. THE HONEST v1 GUARANTEE (now the AC text) = exactly-once DELIVERY across crash+restart, by construction: crash BEFORE Deliver-append -> no file marker, no ledger mark -> the next scheduler entry (boot or wake) re-fires from Gather and delivers the day's ONE brief (upstream stages re-execute - a bounded re-spend on the shared spend:tokens row, never a second delivered brief); crash AFTER Deliver-append but BEFORE mark (the one true double window) -> the re-fire reuses the SAME day-keyed run_id -> TK-101's run_id-keyed file-marker returns replay=true (no re-append, no re-speak - PROVEN at TK-101 verification) -> the run COMPLETES -> the mark lands. The double window is STRUCTURALLY CLOSED by day-keyed run_id + the TK-101 marker; within-process committed-step replay stays exactly-once (S6). Cross-restart journaled mid-run resume rides the TK-53 real-substrate deferral (revisit when a durable journal adapter is first wired). Defense in depth: a same-process duplicate engine.run on an existing run_id hits the engine's own double-drive guard and lands in the stage's catch. (3) morning_brief_time ALREADY HOMED - OperatingParams.morning_brief_time exists (TK-13; wombat_params.yaml 07:00:00 with the reconciliation note already inline). NO params change. The non_goal's letter amended for record honesty: the value is a versioned YAML constant (human edit + version bump), not runtime/user-facing configurability - the TK-53 sweeper-cadence precedent. (4) DOMAIN = domain/brief_schedule.py: pure is_due(now, tz, brief_time) and next_fire_at(now, tz, brief_time) (today's civil-local instant if strictly future else tomorrow's; localized via ZoneInfo, fold=0 on ambiguous/nonexistent DST times - probed in tests) + BriefRunLedger. All 'today' resolution through wombat_today/DailyLedger (Q-15 - never an independent date computation). (5) TESTS - never run_forever; drive stage entries and Sweeper.tick(now, lease_ttl=...) directly with injected clocks (the TK-53 precedent). PURE-UNIT (no DSN): is_due/next_fire_at before/after-boundary + midnight-straddle + DST spring-forward and fall-back probes; stage tests on the Q-47 stage_context_fake with spy ran_today/mark_ran/fire_brief - fires when due and unmarked (mark called only on COMPLETED), parks-without-fence-read when not yet due (wake_at == today's morning instant), AC3 skip (pre-marked -> fire_brief NOT called + DEBUG skip in caplog), fire_brief raising -> loud log + no mark + run() still returns Wait, non-COMPLETED final -> no mark. DSN-GATED (docker pg, the TK-28/Q-46 done-bar): real Engine + real DailyLedger + fake-model brief on a tmp sink - AC1 boot-drive parks pre-morning, ONE tick past morning fires -> exactly ONE run-header in the sink + brief:run row value 1, a second same-day tick -> sink byte-identical; AC2 sleep-sim - park at morning wake_at, jump the injected clock hours past with NO intermediate ticks, single tick -> fires once + marks (plus the boot-at-late-morning cold-journal variant proving the crash-miss catch); AC3 pre-marked ledger -> tick -> no fire + skip logged; AC4 both windows - (i) raising model/deliver mid-run -> no mark -> fresh assemble same day (restart sim) -> re-fires -> sink holds exactly ONE delivered brief; (ii) pre-planted day-keyed run-marker + unmarked ledger -> re-fire same run_id -> replay=true, sink unchanged, ledger then marked. NODE AMENDMENTS: AC4 given/when/then reworded (the Q-39/DEF-4 record-honesty precedent - the not-zero-not-two intent stands at the DELIVERY level, which is the user-facing guarantee); non_goal[0] clarified; complexity_budget Q-80 rider; depends_on EP-9 -> TK-28 (all four EP-9 children done; TK-28 is the meaningful support, TK-27 rides its dep chain); files_in_scope 3 -> 5 (+bootstrap.py +runtime.py - the scheduler registration + fire_brief closure + second boot drive); estimate M stands. Binding constraints carried: taint invariant (DEC-26, no StageToolPolicy), stages never touch ctx.journal, builders do not write contract.yaml. TK-97 is BUILD-READY - the LAST ticket of the ingestion arc; when it lands, FEAT-7 is code-complete pending Jim's OAuth bring-up + the two live smokes. AMENDED 2026-07-03 same day (builder seam flag, runnable-proven - the flag-do-not-guess loop working as designed): STAGE-COUNT CORRECTION to ruling 1 - StageGraph.__init__ UNCONDITIONALLY requires a reachable terminal stage (graph.py line 74, 'no terminal stage reachable ... the graph can never end'; no opt-out exists), so the pure self-edge SINGLE-stage graph ruled above cannot be constructed (StageGraphError at every construction). Amended to the in-repo TK-53 precedent (tests/unit/test_runtime.py _WaitForeverStage/_TerminalStage - the exact same eternal-self-park problem, solved identically): BriefTimerStage.transitions = ('brief_timer', 'brief_timer_terminal') - the self-edge PLUS a declared-but-NEVER-TAKEN stub edge (run() always returns Wait(to='brief_timer'), never routes to the stub); NEW BriefTimerTerminalStage stub (name 'brief_timer_terminal', transitions=(), run() raises RuntimeError if ever entered - self-enforcing never-reached, pragma no cover) lives in pathways/brief_pathway.py (a graph-CONSTRUCTION artifact satisfying the terminal invariant, not scheduling behavior - brief_timer_stage.py stays purely behavioral); build_brief_schedule_pathway(timer_stage) constructs StageGraph([timer_stage, BriefTimerTerminalStage()], entry=timer_stage.name) - the pathway is internally TWO stages, one never reached. Runtime behavior UNCHANGED (eternal self-park re-driven by the Sweeper); every other Q-80 ruling stands verbatim; ACs, files_in_scope, deps, estimate unchanged. Recorded at v1.02.",
      links: ["TK-97","TK-96","TK-101","TK-53","TK-28","TK-152","TK-13","TK-9","TK-5","EP-19","EP-13","Q-15","Q-53","Q-69","Q-71","Q-73","Q-78","Q-79","Q-47","DEC-21","DEC-26","CON-2","CON-3","ASMP-2","FEAT-7"] }

  # --- Architect spike-disposition pass (2026-06-21): each de-risk spike gets an owned disposition; residual human/live validation homed as a deferral with a concrete revisit_trigger so nothing parks on Jim's desk and the build is unblocked. RISK-4/5 already retired (running code); RISK-1/2/3/6 mitigated (architecture/safety proven) + residual deferred below. ---
  - { id: DEF-1, type: deferral, status: deferred, scope: EP-7, date_raised: "2026-06-21", date_updated: "2026-06-21", title: "Defer scoring-thesis calibration (TK-22 RISK-1 + TK-26 RISK-2) against Jim's own surface/hold judgment to a real session with non-degenerate inbox content",
      description: "TK-22's urgency()/cognitive_load() and TK-26's trigger thresholds agree with the vision-derived PROXY rubric on a real-data fixture with no systematic error — the ARCHITECTURE is de-risked. The remaining exit clause (agreement with Jim's own confirmatory labels) CANNOT be meaningfully run now: the real inbox window held zero VIP/known-human mail, so a label pass would calibrate against a degenerate sample. The operating constants (urgency_threshold 0.75, load_flush_threshold 1.0, per_class_ceiling 3) are already recorded PROVISIONAL in TK-13 (Q-40), so a future relabel revises a versioned YAML value, NOT code.",
      rationale: "ACCEPT-the-proxy-proof-and-DEFER-the-calibration (disposition b) is correct vs the whole-project view: the production gate (TK-23/25/27) reads its constants from the TK-13 OperatingParams store, so building it does not bake in unvalidated numbers — it consumes provisional defaults that the calibration pass later revises in place. Blocking the spine on a label pass that cannot even sample the target population (VIP/known-human mail) would be parking a no-op chore on Jim and stalling the build for no signal. Grounded in vision.md: 'trusted on sight' is the bar, but calibration is a continuous-tuning concern (FEAT-4 dreaming re-tunes ratings nightly), not a one-time pre-build gate.",
      revisit_trigger: "The FIRST real morning-brief session over Jim's live calendar+inbox that contains VIP/known-human mail (i.e. a non-degenerate sample). At that point Jim does the small confirmatory pass over rubric-pre-labeled events (DEC-24); if disagreement is systematic, revise the PROVISIONAL TK-13 constants (a YAML edit, no code change) and re-run the TK-22/26 agreement check. Until then the provisional defaults stand and the build proceeds.",
      links: ["RISK-1","RISK-2","TK-22","TK-26","TK-13","TK-23","TK-25","TK-27","Q-40","DEC-24"] }
  - { id: DEF-2, type: deferral, status: deferred, scope: EP-16, date_raised: "2026-06-21", date_updated: "2026-06-21", title: "Defer TK-73 RISK-6 slot-quality qualitative ratings (>=80% rated reasonable) to the first real brief session",
      description: "TK-73's earliest-gap algorithm proves >=3 distinct VALID non-overlapping in-hours alternative slots per conflict for every fixture scenario — the deterministic mechanism is proven and does not crash. The >=80%-rated-reasonable exit clause needs Jim's qualitative ratings (sheet at tests/calendar/fixtures/FINDING_TK73.md). The spike's own finding pre-identifies the likely refinement: pure earliest-first ranking can feel too early; consider preference weighting.",
      rationale: "ACCEPT-the-algorithm-proof-and-DEFER-the-rating (disposition b). The >=80%-reasonable bar is a UX-QUALITY judgment, not a constructibility bar — TK-74 (ConflictDetector + AlternativeSlots) builds the same proven earliest-gap algorithm and can absorb preference-weighting later if ratings call for it, without re-architecting. Blocking TK-74 on a qualitative rating session (which is most naturally done by reading real proposed slots in a real brief) would stall the calendar path for a tuning signal best gathered in situ. Read-only calendar / never-write-back (DEC-16) is unchanged.",
      revisit_trigger: "The first real morning brief that surfaces a real calendar conflict with proposed alternatives — Jim rates the slots in situ. If <80% feel reasonable, apply the preference-weighting refinement TK-73 already flagged, scoped into TK-74's ranking (no new ticket needed; the algorithm seam is the same).",
      links: ["RISK-6","TK-73","TK-74","DEC-16"] }
  - { id: DEF-3, type: deferral, status: deferred, scope: EP-3, date_raised: "2026-06-21", date_updated: "2026-06-21", title: "Defer TK-4 RISK-3 presence-accuracy (>90% of real transitions) to the first live laptop session; the safety property is already proven",
      description: "TK-4's 60s active/idle classifier + conservative-on-stale HOLD are proven by tests and a live Windows smoke-check (idle_ms->active; off-Windows/syscall-failure degrades to unknown/confidence 0.0 with no exception). The SAFETY-CRITICAL property — degrade-to-HOLD on unknown/stale/low-confidence — is proven and is exactly what TK-11 hardens to production. The residual >90%-of-real-transitions ACCURACY clause is inherently un-runnable without a live laptop session over real active/idle/away transitions.",
      rationale: "ACCEPT-the-safety-proof-and-DEFER-the-accuracy-measurement (disposition b). A weak classifier still FAILS SAFE — an under-confident or stale read holds (does not interrupt), so accuracy below the bar degrades wombat toward MORE silence, never toward a spurious interruption; this preserves the quiet-by-default / 'trusted on sight' guarantee (vision.md) even if accuracy is imperfect. The accuracy clause is a tuning measurement, not a silence-safety gate, so the production presence path (TK-11) and the gate that leans on it (TK-27) are unblocked. Single OS idle signal retained (DEC-6).",
      revisit_trigger: "The first live laptop session running wombat with TK-4/TK-11 registered — observe real active/idle/away transitions and measure classifier accuracy. If <90%, tune the idle threshold (currently 60s) and staleness ceiling (currently 5min), which live in TK-13 OperatingParams; the conservative-on-stale invariant does not change.",
      links: ["RISK-3","TK-4","TK-11","TK-27","TK-13","DEC-6"] }
  - { id: DEF-4, type: deferral, status: deferred, scope: EP-16, date_raised: "2026-07-02", date_updated: "2026-07-02", title: "Defer business-day-aware alternative slots (weekend skipping) — TK-74 falls back to the next CALENDAR day; no frozen type carries weekday, so working-day logic is unbuildable with current types",
      description: "TK-74 AC2 prose originally said alternatives fall to the next WORKING day when the conflict day has no free slot. The as-built (and as-verified) behavior is next CALENDAR day (conflict.day + 1): neither the frozen spike CalendarEventItem/WorkingHours nor the Q-60 CalendarEvent carries a weekday concept, and Q-62 specified the projection in civil-local days without business-day semantics. AC2 reworded to calendar-day for record honesty (Q-28 prose-matches-what-was-done principle); the aspiration is preserved HERE instead of silently implied by prose the code cannot satisfy. Real business-day logic needs a weekday-aware WorkingHours (per-weekday hours or a workweek mask) plumbed through suggest_alternatives — a small deliberate ticket, not a patch inside the frozen kernel.",
      revisit_trigger: "The DEF-2 rating pass (first real conflict in a live brief) flags a weekend/holiday alternative as unhelpful — then open a ticket adding weekday-aware WorkingHours (owned alongside the TK-13 working-hours field pre-authorized in Q-62) and extend suggest_alternatives fallback; until then next-calendar-day is the accepted v1 behavior.",
      links: ["TK-74","TK-73","TK-13","Q-62","DEF-2","Q-28"] }
  - { id: Q-15, type: open_question, status: resolved, scope: FEAT-1, date_raised: "2026-06-20", date_updated: "2026-06-20", title: "HIGH: the canonical 'wombat day' boundary + timezone is undefined across three independent daily ledgers",
      description: "TK-9 (DailySpendLedger), TK-27 (per-class surfacing ceiling) and TK-97 (brief once-per-day run ledger) each independently define a Postgres 'daily counter, reset at midnight, survive restart' mechanism, and none specifies a timezone. TK-101 writes a UTC timestamp header while the brief timer (TK-97) fires at a local 'morning time', so 'today' is defined at least two ways. On a laptop that sleeps across midnight (CST-1/DEC-6) a UTC-vs-local mismatch double-counts or skips a day in all three ledgers. Resolve: a decision fixing the canonical wombat-day boundary + timezone and a SHARED DailyLedger primitive that TK-9/TK-27/TK-97 reference.",
      resolution: "RESOLVED by architect 2026-06-20 (within authority — no locked DEC fixed a timezone). Recorded DEC-21: the canonical wombat-day is the CIVIL-LOCAL date in a configured IANA timezone (default host zone), computed at ACCESS time (wombat_today()), not by a fired timer — so a sleep across midnight resolves correctly on wake. Added TK-152 (shared DailyLedger primitive, P1, EP-2) that owns the boundary + row lifecycle; rewired TK-9 (spend), TK-27/TK-28 (ceiling) and TK-97 (brief run) to consume it, and fixed TK-101's header to the wombat timezone (was bare UTC). The three independent ad-hoc date mechanisms now share ONE tested primitive — the split-definition double-count/skip bug is structurally closed.",
      links: ["TK-9","TK-27","TK-97","TK-152","DEC-21"] }

