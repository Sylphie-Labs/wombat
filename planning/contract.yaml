  # --- Architect triage of an incidental record-integrity finding from the v0.12 pass (2026-06-21). ---
  - { id: Q-28, type: open_question, status: resolved, scope: project, date_raised: "2026-06-21", date_updated: "2026-06-21", title: "LOW (record-integrity): Q-14 resolution cites a proof script 'planning/.q14_acyclicity_check.js' that is NOT present in the repo — acyclicity was proven inline",
      description: "The Q-14 resolution (depends_on epic/ticket normalization, v0.10) states the expanded ticket graph was proven acyclic via 'proof script planning/.q14_acyclicity_check.js'. That file does not exist in the repo and was never committed; the Kahn topological sort was performed INLINE during the analyze pass and only the result was recorded. The contract — as the single source of truth — must not cite an artifact that does not exist. Resolve either (a) commit the script so the citation is honest, or (b) soften/remove the citation to match the inline-proof reality.",
      resolution: "RESOLVED by architect 2026-06-21 (within authority — record-integrity correction, no frame/scope/decision/graph change). Chose (b) SOFTEN THE CITATION. Rationale tied to the whole-project view: (1) the contract-as-honest-record thesis demands the prose reflect what was actually done — the inline Kahn proof IS the load-bearing artifact; back-filling a script after the fact to justify a false citation is exactly backwards. (2) A committed proof script is an unrequested maintenance surface that must be kept in sync as the 75-ticket graph evolves — no ticket asked for it, and validate.js already runs a literal-edge cycle check on every contract edit, so the standing acyclicity guarantee is already mechanically enforced. (3) The 'epic dep = all child tickets' convention plus the recorded inline result is sufficient and self-contained. EDIT MADE: Q-14's resolution text changed 'proof script planning/.q14_acyclicity_check.js' -> 'proven INLINE ... no proof script was committed' (with a back-reference to this Q-28). No ticket, decision, epic, or dependency edge changed; the graph remains acyclic. NON_GOAL recorded implicitly: wombat does not maintain a standalone acyclicity proof script as a contract artifact — the validate.js cycle check is the durable guard.",
      links: ["Q-14"] }
  # --- Architect ruling on a TK-1 scope gap surfaced during /plan-ticket TK-1 (2026-06-21). ---
  - { id: Q-29, type: open_question, status: resolved, scope: EP-1, date_raised: "2026-06-21", date_updated: "2026-06-21", title: "CRITICAL (constructibility): TK-1 cannot return an Engine — cog-worx Engine.__init__ requires journal/graph_store/latent/pathways, which TK-1 names nowhere and no ticket provisions",
      description: "cog-worx Engine.__init__ (runtime/engine.py:96) has FOUR required keyword args with no defaults beyond ModelRegistry: journal (Journal Protocol), graph_store (GraphStore Protocol), latent (LatentStore Protocol), and pathways (PathwayRegistry, may be empty). TK-1's intent + acceptance_criteria enumerate only the OPTIONAL seams (ModelRegistry, BudgetPolicy, Registry, RecallStack, personality, rules) and assert each non-None; they say NOTHING about the four required substrate seams, and non_goals[2] says 'does not touch the journal'. AC1 ('launched cold, an Engine is returned') is therefore not constructible as written. Worse: NO ticket anywhere owns construction of the three substrate stores — TK-2 is wombat's OWN queue table, TK-42+ write the user model into Neo4j, TK-150 is the residency guard, TK-13 is the param store, but none constructs the cog-worx Journal/GraphStore/LatentStore the Engine demands. cog-worx offers (a) real adapters (timescale_journal/neo4j_graph/pg_latent over live Postgres/Neo4j/Timescale, reading SubstrateSettings DSN/URI), (b) in-memory doubles (cogworx/testing/doubles.py: InMemoryJournal/GraphStore/LatentStore, zero infra), or (c) inject the stores into the composition root. Resolve TK-1's boundary for the four required seams, amend its ACs to assert they are wired, and home the store-provisioning gap.",
      resolution: "RESOLVED by architect 2026-06-21 (within authority — ticket re-scope + one new sibling ticket; no DEC/constitution/v1-scope changed). Chose BLEND (c)+(b): TK-1 = PURE WIRING over an INJECTED substrate bundle; a NEW leaf ticket TK-14 owns store construction. Reasoning vs the whole-project view: (1) TK-1's own intent is mvp/one-module/no-DB-touch/no-loop-logic — pulling live Postgres/Neo4j/Timescale connections (option a) into the keystone violates its complexity_budget + non_goals[2] and would force TK-150 (residency) and TK-13 (DSN config) to resolve BEFORE the composition root, inverting the spine (everything depends_on TK-1). (2) Pure injection keeps TK-1 the honest assembly point: it takes a SubstrateBundle(journal, graph_store, latent, pathways=PathwayRegistry()) and wires it into Engine; AC1 now asserts the TRUE invariant — given the bundle, an Engine is returned correctly wired — without TK-1 choosing the stores. (3) In-memory doubles are the right v1 COLD-BOOT default (TK-14 default factory): cog-worx ships conforming InMemoryJournal/GraphStore/LatentStore, so 'launched cold, no infra' is deterministic and TK-1's unit test stays infra-free — serving the gate-deterministic thesis and the pure-cog-worx-adopter stance (we consume documented seams: the Engine kwargs + the shipped doubles). Real adapters are a swap behind the SAME injected seam, owned by TK-14's real-adapter factory and GATED by TK-150 (same-host residency, Q-25) + TK-13 (DSN/URI from the param store) — same local-storage/one-egress posture; both doubles and adapters stay on-host. EDITS: (i) TK-1 intent/AC1/complexity_budget amended to name the SubstrateBundle injection and assert journal/graph_store/latent/pathways are wired non-None into the Engine; non_goals clarified ('does not CONSTRUCT the stores — TK-14 does; does not open a DB connection'); files_in_scope adds the SubstrateBundle type; depends_on gains TK-14. (ii) NEW TK-14 (EP-1, P1, mvp, depends_on []): SubstrateBundle factory — a cold-boot in-memory factory (cog-worx doubles) for v1 + a real-adapter factory (timescale/neo4j/pg) selected by config, the real path passing TK-13's DSN/URI and asserted on-host by TK-150. Graph stays acyclic: TK-14 is a fresh leaf (depends_on []), TK-1 -> TK-14 is the only new edge, nothing else points at TK-14.",
      links: ["TK-1","TK-14","TK-13","TK-150","EP-1"] }

  # --- Architect resolution of the 2026-06-21 frontier constructibility audit: PRIORITY TRANCHE (6 CRITICAL, 17 seam-misses, 3 splits) clustered + resolved; HIGH/MEDIUM parked. See planning/audit-2026-06-21.md. ---
  - { id: DEC-23, type: decision, status: accepted, scope: FEAT-4, date_raised: "2026-06-21", title: "Off-path (S1) consolidation-time LLM inference in the dream pathway is admitted; the gate stays model-free (NG-4 intact)",
      context: "The 2026-06-21 audit found (CRITICAL) that the dream pathway TK-47 SECRETLY performs LLM inference: cog-worx's CoherenceReconciler calls a model-backed ConsistencyOracle (oracle.py __init__(model, tier)) and ClaimExtractor makes a per-session model call, yet TK-47 marketed itself as deterministic 'reuse cog-worx stages' with no model provisioned, no budget, and no NG-4 ruling. NG-4 forbids an LLM DECIDING when/whether wombat acts (the interruption gate). The question: is off-path consolidation-time extraction/adjudication admissible, or does NG-4 forbid it everywhere?",
      decision: "ADMIT off-path model inference in the dream/consolidation pathway ONLY. NG-4 governs the GATE (the surface/hold/flush decision), which stays pure deterministic code with zero tokens (DEC-13 unchanged). The dream pathway is explicitly off the hot path (S1) and DEC-17 already scopes dreaming as 'model-heavy work off the hot path' running the cog-worx reconciler/extractor — so the oracle/extractor inference is consolidation-time memory work, NOT an act-or-not decision, and is admissible. It is bounded: the consolidation Model is registered behind a BudgetGuard (the same S4/mouth-budget posture, DEC-18) and is provisioned, never silently imported. The gate NEVER consumes this model. This realizes DEC-17 against the real cog-worx seams; it does not widen v1 scope (dreaming was always in scope) or change a locked DEC.",
      consequences: "(+) TK-47 is constructible and honest about its model use; the NG-4 boundary is drawn crisply (gate model-free; off-path consolidation model-allowed-and-budgeted). (+) The off-path model is local-residency + budget compliant (TK-54/TK-150/BudgetGuard). (-) Adds a consolidation-model provisioning surface (TK-54). (-) A cost line on the nightly pass, bounded by the BudgetGuard. NOTE: this is the one finding in the tranche that touched an NG/DEC boundary — recorded as a clarifying decision under DEC-17's existing frame, NOT a scope change; flagged to Jim in the report as the near-escalation, decided in-frame because DEC-17 already authorized off-path model-heavy work.",
      alternatives: ["Forbid all LLM inference in dreaming (rejected — contradicts DEC-17's model-heavy-off-path and would gut the cog-worx reconciler/extractor wombat is adopting)", "Leave TK-47 silent about the model (rejected — dishonest record; un-constructible; no budget/residency)", "Admit model in the gate (rejected — violates NG-4/DEC-13, the product thesis)"] }
  - { id: DEC-24, type: decision, status: accepted, scope: FEAT-2, date_raised: "2026-06-21", title: "Risk-validation spike sequence + real-data/human-label policy: de-risk the 6 RISK-* spikes BEFORE the production build",
      context: "Jim asked to de-risk the riskiest assumptions via the 6 throwaway prototype spikes (TK-22/RISK-1, TK-26/RISK-2, TK-24/RISK-5, TK-48/RISK-4, TK-73/RISK-6, TK-4/RISK-3) BEFORE committing to the production build, and explicitly delegated the call. TENSION: as throwaway prototypes their value is running early/cheap (RISK-1's mitigation literally says 'build the pure functions over a labeled fixture BEFORE hardening'), yet each sits behind its subsystem scaffold in the depends_on graph (TK-22->TK-21, etc.). Two product/privacy questions ride along: where the TK-22/26/73 fixtures come from (REAL Gmail/Calendar via the connected MCP tools, or HAND-AUTHORED events) and how the human rater label is obtained minimizing Jim's involvement — grounded in vision.md's local-first posture (NG-7).",
      decision: "(1) RUN-ORDER. Each spike's depends_on resolves to a TYPE/VOCABULARY module, not a built subsystem, and those modules are themselves leaves — so the dep ordering is REAL but CHEAP and is HONORED, not relaxed (a spike that invents throwaway types the production hardening can't reuse defeats 'spike informs production'). The two PURE-CODE spikes run NOW with zero human input and zero infra: TK-21 (leaf, in-memory gate data model) then TK-24 (in-process journal-stub kill/restart proof — RISK-5); TK-41 (leaf, RatingParams vocabulary) then TK-48 (standalone tuner-stability sim — RISK-4). Both confirmed runnable immediately (cog-worx InMemoryJournal double already smoke-verified in the venv, v0.19). The HUMAN/REAL-DATA spikes run next in the order TK-21->TK-22 (RISK-1, the thesis-bearing one), then TK-22->TK-26 (RISK-2, needs TK-22's scoring functions). TK-73 (RISK-6) needs ONLY TK-72's CalendarEventItem type (its fixture is hand-authored YAML; non_goal: no queue/poller wiring), so it may run AHEAD of the rest of the poller's auth/API path once that type exists — the edge stays for the type contract, flagged non-blocking for spike execution. TK-4 (RISK-3) genuinely needs TK-3's InputSource/registration contract AND live laptop observation, so it runs last among the spikes, after TK-3. (2) REAL-DATA / HUMAN-LABEL. NG-7 scopes residency to STORAGE; reading real Gmail/Calendar into a LOCAL throwaway fixture is a local read + local store with NO remote egress, so it does NOT violate NG-7 (distinct from the ASMP-1 DeepSeek egress exception). A purely hand-authored fixture authored by the same person writing the heuristics is CIRCULAR and would not honestly test RISK-1 ('the product thesis rides on this'). RULING: HYBRID — seed the TK-22/26/73 fixtures from REAL Gmail/Calendar via the connected MCP tools as a one-time LOCAL pull into a throwaway, GITIGNORED, de-identified YAML; obtain the human label via a DOCUMENTED PROXY RUBRIC derived from vision.md's gate definition (relevance AND importance AND user-state AND confidence; quiet-by-default => default-hold) so Jim does a SMALL one-time confirmatory pass over rubric-pre-labeled events, never a from-scratch labeling of all ~40+60 events. The rubric is the spike deliverable's auditable basis. (3) CONTRACT CHANGES: add a .gitignore entry for the throwaway real-data fixtures (privacy-posture enforcement, no egress) and a coherence note on TK-22 fixture provenance; no depends_on relaxation, no DEC/constitution/v1-scope change.",
      consequences: "(+) The two pure-code spikes (TK-24/TK-48) start immediately with zero dependency on Jim or infra — fastest de-risk of two med/high RISKs. (+) RISK-1/2/6 get an HONEST test (real events) without making Jim hand-label everything (proxy rubric + confirmatory pass). (+) Real-data fixtures stay local + gitignored — the NG-7 storage boundary is enforced, not eroded, and the ASMP-1 egress exception is untouched. (-) The hybrid real-data pull is a one-time manual MCP step at spike time. (-) The proxy rubric must be written before TK-22's label pass (it becomes part of the TK-22 deliverable). NOTE: this is a HOW decision within delegated authority — it neither changes a locked DEC nor v1 scope (read-only Calendar + Gmail-only is exactly what the fixtures sample) nor any constitution item; the real-data ruling is the IN-FRAME application of NG-7's storage-scoped residency to throwaway local test fixtures.",
      alternatives: ["Run every spike strictly after its full subsystem scaffold (rejected — defeats 'spike before hardening'; the pure-code ones need only leaf type modules)", "Relax the spikes' depends_on to nothing so they invent throwaway types (rejected — production hardening then can't reuse the types; breaks spike->production continuity)", "Hand-author all fixtures (rejected — circular; does not honestly test RISK-1)", "Have Jim label all ~100 events from scratch (rejected — violates the minimize-Jim's-involvement directive; the proxy rubric + confirmatory pass gets the same signal cheaper)"],
      links: ["RISK-1","RISK-2","RISK-3","RISK-4","RISK-5","RISK-6","TK-22","TK-24","TK-26","TK-48","TK-73","TK-4","TK-21","TK-41","TK-72","TK-3","NG-7","ASMP-1","Q-37","Q-38"] }
  - { id: DEC-25, type: decision, status: accepted, scope: EP-9, date_raised: "2026-06-21", title: "TK-13 AC4 guard scans a declared list of PRODUCTION consumer paths and EXCLUDES the frozen _sim spike files",
      context: "Building TK-13 (OperatingParams), AC4 says a test asserts no competing hard-coded threshold/ceiling/min-age/floor/ceiling constant exists in the gate/ledger/tuner modules (owned by TK-13). TENSION: the named production consumers (gate TK-27/28, spend ledger TK-9, tuner TK-49) are NOT built yet. What exists today is spike code: rating/tuner_sim.py (TK-48) LEGITIMATELY hard-codes the very constants TK-13 centralizes (delta_bound 0.05, gain 0.20, band [0.35,0.65], surfacing ceiling 12.0) because it is the RISK-4 spike those values were empirically derived in (v0.22/0.23, RISK-4 retired); gate/trigger_sim.py (TK-26) takes thresholds as function ARGS so it owns no module-level constant. A naive whole-tree literal scan would either falsely flag tuner_sim.py or force a retrofit of a frozen artifact.",
      decision: "(a) EXCLUDE the _sim spike files from the guard. tuner_sim.py is the frozen provenance ARTIFACT the LOCKED constants were lifted FROM — it is the SOURCE, not a competing definition; trigger_sim.py owns no module-level constant. Neither is retrofitted to import from OperatingParams: spikes are frozen (DEC-24, v0.23/v0.24 disposition); re-touching the archive inverts provenance and adds scope to an estimate=S production ticket for zero safety gain. The guard's job is to prevent FUTURE production drift, not police the archive. (b) The guard scans a DECLARED LIST of production consumer module paths (the non-_sim gate/ledger/tuner files) and is the test's source of truth. It asserts clean — vacuously, by construction — while those production files are absent, and becomes enforcing the moment TK-27/28/9/49 land and import from OperatingParams. RECIPROCAL: TK-27/28/9/49 carry the import-from-OperatingParams obligation on their own ACs (TK-49 already does per Q-40), so the guard cannot silently stay vacuous — the path list and those tickets close together. TK-13 AC4 wording updated to specify this enforcement shape + the frozen-spike exclusion.",
      consequences: "(+) Frozen-spike provenance is preserved coherently with DEC-24/Q-39/Q-40 (spikes adopted as-built, constants LOCKED from TK-48); no archive re-touch. (+) The guard is real, not theater — declared-path + reciprocal consumer ACs make it enforcing on land, not vacuous forever. (+) Stays within the estimate=S production budget. (-) Until TK-27/28/9/49 land the guard passes trivially (acceptable — its purpose is drift-prevention going forward; the reciprocal ACs are the live obligation). NOTE: HOW decision within delegated authority — realizes the F/Q-19 param-ownership intent and the Q-40 joint-block ownership; no locked DEC, constitution item, or v1 scope touched.",
      alternatives: ["Whole-tree literal scan including _sim files (rejected — falsely flags tuner_sim.py, the legitimate provenance source)", "Retrofit tuner_sim.py to import from OperatingParams now (rejected — re-touches a frozen spike, inverts provenance: the spike would depend on the thing it justified; out of scope for estimate=S)", "Drop AC4 until the consumers exist (rejected — loses the drift-prevention guard and its becomes-enforcing-on-land property; declared-path scan gives the guard for free now)"],
      links: ["TK-13","TK-48","TK-26","TK-27","TK-28","TK-9","TK-49","DEC-24","Q-39","Q-40"] }
  - { id: Q-30, type: open_question, status: resolved, scope: EP-9, date_raised: "2026-06-21", date_updated: "2026-06-21", title: "CRITICAL cluster (a): the gate exposes no threshold-free, pending-set-preserving per-item SELECTION seam, and brief items have no path into selection without polluting the live pending set (TK-99/98/100)",
