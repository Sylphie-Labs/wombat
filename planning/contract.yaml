      resolution: "RESOLVED by architect 2026-07-03 (within authority — light HOW rulings on an already-well-specified ticket; no locked item/graph change; deps TK-25/TK-2 both done). (1) MIGRATION 005_pending_journal.sql — strictly monotonic; a released slot is NEVER reused (002 stays a documented historical gap per Q-68; reuse would make repo history ambiguous); per-module ensure_schema in the adapter module (three as-built precedents). (2) PROTOCOL NAMED FROM THE AS-BUILT SOURCE (gate/pending_set.py): runtime_checkable PendingJournal{append(record)->None; replay()->Sequence[JournalRecord]} over frozen PendingSetAdd{item_id, item_kind: ItemKind, urgency, load, added_at=0.0 (Q-55 rider, legacy default)}, PendingSetRemove{item_id}, PendingSetClear{} — the builder implements this, invents nothing. (3) Q-45/ASMP-2 TRANSLATED: the eviction ordering is EMITTED by PendingSet — the adapter obligation is pure FIDELITY (one INSERT per append in its own implicit transaction; replay = SELECT ordered by seq ASC; never batch/buffer/reorder/coalesce), so a kill between the two eviction appends durably persists exactly the prefix — the Q-45 crash semantics ride append order and nothing else; ASMP-2 single-process = no locking machinery (NG-3), one lazy injected-DSN connection (Q-46). This is the standing-obligation binding for the first LIVE session: RISK-5 durability becomes honest only when this adapter is the journal wired at boot. (4) SCHEMA ruled (seq BIGSERIAL PK; record_type TEXT writer-side vocabulary, no pg enum per Q-63; nullable payload columns since Clear carries none; item_kind as .value per Q-49; added_at DOUBLE PRECISION). IDENTITY: item_id stored VERBATIM — it already is the canonical TK-12-derived identity from the producers; no re-derivation. QUEUE RELATION: a DISTINCT table, not a view — pending custody is post-ack GATE state per the TK-27 custody switchover. files_in_scope += the 005 migration. ACs stand VERBATIM (written against the real seam; nothing to reword).",
      links: ["TK-29","TK-25","TK-2","TK-27","TK-12","Q-44","Q-45","Q-46","Q-49","Q-55","Q-63","Q-68","ASMP-2","RISK-5"] }

