  - { id: Q-78, type: open_question, status: resolved, scope: EP-20, date_raised: "2026-07-03", date_updated: "2026-07-03", title: "TK-101 build briefing (brief-cluster stage 4, the terminal deliver stage) - the EP-30 voice over-pull narrowed to an injected speak-sink seam (the LAST Q-56 parked item on the built path), the AC4 crash-replay idempotency mechanism ruled as run_id-keyed file-marker (the engine does not protect uncommitted side effects), sink/config ownership fixed, and the terminal Done shape frozen",
