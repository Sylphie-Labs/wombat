zen dataclass (message_id, urgency_score 0..1, priority_band closed enum HIGH|NORMAL, matched_rules = rule NAMES only, never message content) + JSON-native to/from_payload co-located in triage.py; TK-98 consumes through them. (6) Pure-unit over GmailMessageItem fixtures from integrations/gmail/models.py; no DSN/framework gating. TK-76 budget/ACs/non_goals/deps amended.",
