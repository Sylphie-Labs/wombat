ef_compose_stage, never hand-rolled; the factory is TK-100's deliverable and a factory test asserts non-None spend_ledger + ceiling == op.mouth_daily_token_ceiling (the TK-53 budget-live-at-boot precedent; DailyLedger is lazy so no pg needed). Ctor also takes config (blank DEEPSEEK key -> ConfigurationError at construction, the TK-8 AC3 precedent - no silent template-forever), tz ZoneInfo (the TK-99 ctor-injected-zone precedent, used for local time rendering), and timeout_seconds default 10.0 (a whole brief is a longer single completion than the drain's AC-fixed 2.0s one-liner; a composition constant, not a TK-13 tunable). (3) TEMPLATE - src/wombat/compose/brief_template.py (files_in_scope NORMALIZED: no src/wombat/templates/ package exists; wombat.compose is the as-built rendering home - the Q-39-precedent layout correction, recorded not silently deviated). Contract: BRIEF_SYSTEM_INSTRUCTION constant (fixed terse steward instruction - phrase the given brief lines in terse calm natural language, include every line's content, add nothing, remove nothing, no preamble) + ONE pure function render_brief_lines(artifact, *, tz) -> str (no I/O, no model, no clock read - fully deterministic). Fixed section order: honest degrade lines first when calendar_unavailable/gmail_unavailable ('Calendar was unreachable this morning.' / gmail analog), then Conflicts (ruling 5), then Prep (one line per sealed CalendarEvent - title + local start-end via start/end astimezone(tz), 'all day' for all_day events), then Recap (one line per GmailBriefItem - sender + subject + local received time); all buckets empty + no flags -> one fixed quiet line ('Nothing needs your attention this morning.'). USER-FACING FIELDS ONLY (the Q-50 boundary applied): urgency_score/priority_band/matched_rules/event_class and raw ids are NEVER rendered - ids are cross-reference keys only; content is otherwise verbatim from the sealed wire fields, no paraphrase in the deterministic layer. SINGLE SOURCE OF TRUTH: the