    title: ConflictDetector + AlternativeSlots — pure deterministic functions
    intent: As the morning-brief pathway, detect overlapping calendar events and compute a ranked list of alternative time slots deterministically — so the brief can surface a conflict plus alternatives without any model call and without writing to Google Calendar.
    status: done
    priority: P1
    estimate: M
    engineering_level: mvp
    complexity_budget: "Two pure functions: detect_conflicts(events) and suggest_alternatives(conflict, free_busy); free/busy projection over calendar events; ranked earliest-gap (algorithm confirmed by TK-73). No I/O, no model calls, no Google API calls. Q-62 BUILD RULINGS (2026-07-02): (1) BRIDGE = PROJECT-AND-REUSE (option a) — TK-74 is a PROJECTION ADAPTER over the frozen TK-73 spike math: project real CalendarEvents (Q-60 type) into the spike's day-scoped minutes domain and REUSE slots.py's proven detect_conflicts/project_busy/free_intervals/propose_alternatives via import (aliased as needed); NO datetime re-implementation of the overlap math (a second overlap implementation = the competing-definition drift ISS-4 kills; the spike stays the single proven kernel and stays FROZEN, Q-43). (2) PROJECTION SPEC: convert aware-UTC datetimes to the INJECTED DEC-21 civil-local tz (pure — tz is an argument, never read from config inside), chunk PER CIVIL-LOCAL DAY over whatever window the caller passes (TK-74 is total over any window; TK-98/99 choose today/tomorrow); an event crossing midnight becomes per-day segments clamped to [start,1440) and [0,end); a multi-day event contributes full-day segments for intermediate days; zero-length segments (end exactly at midnight) are DROPPED (the spike type requires start<end); Conflict outputs reference the ORIGINAL CalendarEvent.event_ids + the civil-local day, never the projected segments. (3) ALL-DAY SEMANTICS: all_day events are EXCLUDED from conflict candidacy AND from the free/busy projection — they neither conflict nor block slots (a holiday is not a meeting; treating it as busy 0-1440 would flood the brief with junk conflicts, the exact RISK-6 trust erosion) — they remain brief RECAP content via TK-98; revisit only if the DEF-2 real-conflict rating pass demands transparency-aware handling. (4) STAMPING: EventClass.CALENDAR_CONFLICT already EXISTS in the as-built vocabulary (no TK-41 change); TK-74 ships a pure conflict_to_payload(conflict) wire helper (JSON-native, stamps event_class=calendar_conflict per Q-41) co-located with the conflict code so TK-98/99 stamp through ONE helper instead of re-inventing it; TK-74 itself enqueues NOTHING. (5) WORKING HOURS: injected argument (reuse the spike WorkingHours type); tests pass the spike's 09:00-18:00 explicitly; a TK-13 OperatingParams field is pre-authorized when the brief wires it — no hidden module default. (6) HOME NORMALIZED (Q-39 domain-home precedent): pure conflict logic lives in src/wombat/calendar/ (it is domain math over domain types, not a Google adapter) — files_in_scope updated; spike types Conflict/AlternativeSlot may be REUSED by import if their shape fits, never modified. Touches NEITHER the registry NOR the gate."
    acceptance_criteria:
      - given: "A list of CalendarEvents (the Q-60 real type; timed events on the same civil-local day in the injected tz) with two overlapping events"
        when: detect_conflicts() is called
        then: "it returns a Conflict record identifying both events by their ORIGINAL event_ids (+ the civil-local day); no Google API call is issued (assert absence of any HTTP call — the functions are pure, no session object exists to call)."
      - given: A Conflict and a free/busy projection
        when: suggest_alternatives() is called
        then: "it returns >=1 AlternativeSlot ranked by earliest gap; each within the same day (or the next CALENDAR day if none — reworded from 'working day' for record honesty per Q-62/DEF-4: no frozen type carries weekday, so business-day skipping is unbuildable with current types and is DEFERRED, not silently implied); NO write call is made to Google Calendar — the test MUST assert zero write calls."
      - given: "A list of CalendarEvents with no overlaps — including a mix containing all_day events and events on different civil-local days (a midnight-crossing pair that only appears to overlap in naive UTC minutes must not false-positive)"
        when: detect_conflicts() is called
        then: "it returns an empty list; a companion case asserts all_day events NEVER appear in any Conflict and never block free intervals (Q-62 ruling 3)."
    non_goals:
      - Writing alternatives back to Google Calendar — never in v1 (DEC-16).
      - LLM-assisted slot ranking — deterministic only (CON-1).
      - Multi-attendee availability (free/busy from local event list only).
    depends_on:
      - TK-73
      - TK-72
    files_in_scope:
      - src/wombat/calendar/conflict.py
      - src/wombat/calendar/alternatives.py
      - tests/calendar/test_conflict.py
