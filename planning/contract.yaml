OVISIONAL — fixture-confirmed only, pending Jim's confirmatory label pass on the TK-22 real-data fixture (RISK-1/2 not retired); the store seeds them as documented defaults but marks them provisional in the versioned YAML comment so a later relabel can revise them without implying they were ever locked. The gate (TK-27/28), the spend ledger (TK-9), the brief timer (TK-97) and the tuner (TK-49) read from this store. No tuning logic, no UI, no per-class adaptation."
