        then: Playwright click/fill/submit is not called before an approval token is present (mock Playwright, assert zero invocations before approval).
      - given: a ComposeGmailDraft Stage executes its pre-dispatch step (the integration assertion relocated from TK-146 — TK-149 owns the Stages)
        when: the Stage runs
        then: "a trail row {action_id, action_type, human_summary, target, proposed_at, status='pending'} is written via TK-146's writer BEFORE the AwaitHuman yield, and a kill-after-insert-before-approval test asserts the row is durable (survives restart) — this is the Stage->writer integration that the audit moved off TK-146 (which now tests the writer directly) onto TK-149."
      - given: a pathway attempts to bypass AwaitHuman and call a side-effectful external Capability directly
        when: the Capability is invoked
        then: "cog-worx ToolGate refuses the direct call (Q-32 — on a fresh UNTAINTED dispatch drive the refusal is TierViolation from check_dispatch when the stage is NOT tier-admitted; ApprovalRequired only fires on a tainted+consequential+irreversible call, so AC5's guarantee is enforced by the TIER gate, not check_approval); the action is blocked; a trail entry is written. This catches a developer accidentally wiring a direct call that skips the two-step pattern."
    non_goals:
      - No UI for the approval step — AwaitHuman is the cog-worx mechanism; the UI surface is out of scope.
      - No retry logic on rejection — pathway halts; retry is a future UX concern.
      - No unattended sensitive auth (passkeys, hardware keys, payments) — NG-5; always AwaitHuman by contract.
