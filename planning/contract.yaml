  - id: TK-4
    kind: ticket
    parent: EP-3
    title: Presence probe spike — laptop user-state as a registered InputSource
    intent: As the gate, I receive a PresenceSnapshot (active|idle|away, confidence, staleness) from a laptop-presence InputSource so I can condition timing on user state and degrade gracefully when the snapshot is missing/stale (RISK-3).
    status: done
    priority: P1
    estimate: S
    engineering_level: prototype
    complexity_budget: One concrete InputSource using one OS idle signal (GetLastInputInfo/xprintidle); one PresenceSnapshot type; gate degrade treats unknown as conservative. No multi-signal fusion.
    poc:
      question: Can a single OS idle-time API signal reliably distinguish active/idle/away within a confidence acceptable for conservative gate conditioning on a dev laptop (DEC-6)?
      hypothesis: A 60s idle threshold classifies active vs idle in >90% of observed transitions on one machine; stale snapshots (>5 min) flag and the gate defaults to hold.
      status: resolved
      result: "SAFETY PROVEN, ACCURACY DEFERRED 2026-06-21 (DEF-3; 17 tests green, ruff+mypy --strict clean). Built a standalone throwaway presence probe (src/wombat/presence/probe.py) - Windows GetLastInputInfo via ctypes; smoke-confirmed live (idle_ms=2891 -> active, confidence 1.0); off-Windows or syscall failure degrades to None -> unknown/confidence 0.0 with no exception. Pure classify() pins the 60s active/idle boundary; pure presence_hold() is the conservative default - HOLD for unknown/low-confidence/stale(>5min)/idle/away, only fresh+confident+active permits a surface (the load-bearing guarantee TK-11 hardens). DISPOSITION (architect 2026-06-21): ACCEPT the safety property (conservative-on-stale HOLD) as proven - it is the silence-critical guarantee the gate leans on; DEFER the >90%-of-real-transitions ACCURACY clause to DEF-3 (revisit_trigger: first live laptop session). A weak classifier still FAILS SAFE (degrades toward more silence, never a spurious interrupt), so accuracy is a tuning measurement not a safety blocker. Idle-threshold (60s) + staleness ceiling (5min) live in TK-13 for tuning. RISK-3 -> mitigated. TK-11/TK-27 are UNBLOCKED."
    acceptance_criteria:
      - given: the PresenceSource is registered and the user moved the mouse/typed within 30s
        when: poll() runs
        then: a PresenceSnapshot with state=active and staleness<5s is enqueued as a QueueItem (verified on actual QueueItem fields with the idle-time mock).
      - given: the OS idle API is unavailable (import fails or syscall errors)
        when: poll() runs
        then: a PresenceSnapshot with state=unknown and confidence=0.0 is returned; no exception propagates to the registry.
      - given: the most recent PresenceSnapshot is more than 5 minutes old
        when: the gate checks presence
        then: the gate's presence check returns conservative (do-not-interrupt) regardless of state.
    non_goals:
      - Does not fuse multiple signals — single idle-time signal only.
      - Does not implement sleep/wake detection (DEC-6 / CST-1 deferred).
      - Does not harden to production quality — prototype level.
    depends_on:
      - TK-3
    files_in_scope:
      - src/wombat/presence/probe.py
      - tests/presence/test_probe.py
  - id: TK-11
    kind: ticket
    parent: EP-3
    title: Harden the presence hold — production conservative-on-stale guarantee the gate ceiling depends on
    intent: As the production gate (TK-27/TK-28), I depend on the presence hold being a STRUCTURAL guarantee — when the PresenceSnapshot is missing, stale, or low-confidence the gate holds (do-not-interrupt) — so I need the presence path hardened to production beyond TK-4's prototype spike, because the quiet-by-default/silence guarantee leans on it being load-bearing, not on prototype-grade code (RISK-3, CON-3, Q-17/C).
    status: done
    priority: P1
    estimate: S
    engineering_level: production
    complexity_budget: "Harden TK-4's prototype per the Q-54 rulings. (1) HOMES: PresenceState + PresenceSnapshot (the TYPES) move to their production home src/wombat/sources/presence.py, alongside the hardened read_idle_ms/classify and the PROVIDER (Q-49: make_presence_provider stamps taken_at from the injected clock and applies the staleness ceiling AT PROVISION, degrading stale -> state=unknown/confidence=0.0); src/wombat/gate/presence_hold.py holds ONLY the pure canonical predicate presence_hold(snapshot, now, *, staleness_ceiling_s, confidence_floor) -> bool (keyword-REQUIRED bounds, NO baked defaults — defaults live in the versioned YAML) importing the types from sources/presence.py. (2) TWO-LAYER STALENESS (Q-49 reconciled): the provider degrade is the PRIMARY runtime guard (the gate call site passes now=taken_at, age 0, inert BY DESIGN per Q-49); the predicate KEEPS its own staleness check with explicit now as DEFENSE IN DEPTH — the load-bearing silence guarantee must hold even if a provider bug passes a stale snapshot through — and the AC1/AC2 property tests drive the predicate stale branch directly with explicit now (incl. the sleep-gap case now = taken_at + multi-hour gap). (3) STATES: active|idle|away|unknown; with ONE OS idle signal AWAY = idle_ms >= AWAY_THRESHOLD_S (documented module constant 1800.0 in sources/presence.py, DESCRIPTIVE ONLY — journal/UX value; a property test asserts IDLE and AWAY produce IDENTICAL hold outcomes, so it is deliberately NOT a TK-13 param). (4) CONFIG HOME (sanctioned rider, DEF-3 already names TK-13 as the home): THREE fields added to OperatingParams + wombat_params.yaml (version bump, the designed TK-13 change path) — presence_staleness_ceiling_seconds=300.0, presence_confidence_floor=0.5, presence_idle_threshold_seconds=60.0; the predicate/provider receive them as INJECTED args (composition passes OperatingParams values; tests pass explicit literals; no inline literal in gate/source code). (5) FLIP RIDER (AC4, import-line-only, sanctioned): repoint src/wombat/gate/gate.py, src/wombat/stages/gate_stage.py, tests/integration/test_drain_pathway_e2e.py, tests/unit/test_gate.py off wombat.presence.probe onto the production homes — NO logic change in those files. (6) SPIKE FATE (Q-43/TK-25 precedent): presence/probe.py + tests/presence/test_probe.py are DELETED as superseded — the spike logic is hardened INTO the production files, its runnable proof is subsumed by the strictly-stronger production property tests, and keeping it would leave a dead second predicate + duplicate types (the competing-definition drift ISS-4 kills); TK-4's record lives in its poc.result + DEF-3, untouched; still-meaningful spike tests port into tests/gate/test_presence_hold.py + tests/sources/test_presence_source.py. No multi-signal fusion (DEC-6); no sleep/wake DETECTION (staleness subsumes it — a pre-sleep snapshot is simply stale; ledger boundary is TK-28)."
    acceptance_criteria:
      - given: the canonical presence_hold(snapshot) predicate used by both TK-6 and the production gate TK-27
        when: it is called with snapshot states unknown, stale (older than the staleness ceiling), or confidence below the floor
        then: it returns hold (conservative) in every such case — a property test sweeps the staleness/confidence space and asserts no fresh-enough, confident, active snapshot is the ONLY path that permits surfacing; the test MUST fail if any stale/unknown/low-confidence input permits a surface.
      - given: a PresenceSnapshot whose timestamp predates a multi-hour gap (host slept) and is now older than the staleness ceiling
        when: presence_hold is evaluated on wake
        then: it returns hold until a fresh snapshot arrives — the production gate never surfaces against a pre-sleep stale snapshot (the conservative-on-stale guarantee survives the sleep boundary that TK-28 resets the ledger across).
      - given: the production PresenceSource (hardened from TK-4)
        when: the OS idle API is unavailable or errors
        then: it yields state=unknown, confidence=0.0 without raising, and presence_hold(that) returns hold — the degrade path is production-tested, not prototype-only.
      - given: the gate's silence guarantee
        when: a reviewer traces which code TK-27's hold-on-stale-presence relies on
        then: it resolves to this hardened presence_hold predicate (engineering_level production), NOT TK-4's prototype spike — closing the prototype-under-a-production-gate gap (Q-17).
    non_goals:
      - No multi-signal fusion — single OS idle signal remains the source (DEC-6 / TK-4 non_goal upheld).
      - No sleep/wake event DETECTION — staleness subsumes it (a pre-sleep snapshot is simply stale); ledger sleep-boundary handling is TK-28.
      - Does not change the scoring functions — presence is a gate-level hold, not a scoring input (Q-12/DEC-13).
      - No new presence sensors or OS integrations beyond TK-4's idle signal.
    depends_on:
      - TK-4
      - TK-6
    files_in_scope:
