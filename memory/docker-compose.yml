services:
  wombat-memory-db:
    image: pgvector/pgvector:pg17
    container_name: wombat-memory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wombat
      # Secret sourced from env/.env — never hardcoded. Fails loud if unset. Run compose from the
      # repo root (or `docker compose --env-file ../.env ...`) so the repo-root .env is read.
      POSTGRES_PASSWORD: ${WOMBAT_MEMORY_PG_PASSWORD:?set WOMBAT_MEMORY_PG_PASSWORD (see .env.example)}
      POSTGRES_DB: wombat_memory
    ports:
      - "5544:5432"                            # non-default host port to avoid collisions
    volumes:
      - wombat_memory_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro   # auto-applied on first init
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wombat -d wombat_memory"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wombat_memory_data:
